# Nextest configuration for the intentd workspace.
#
# retries = 2: nextest runs tests from all binaries in parallel (unlike
# `cargo test`, which runs one test binary at a time). Several supervisor/PTY
# tests use wall-clock timeouts (~5s) that can be exceeded under that extra
# cross-binary load, especially with llvm-cov instrumentation overhead. With
# 75+ test binaries (including heavy WSS e2es that spawn daemons + Node ACP
# providers), two retries let load-induced timing flakes pass (reported as
# FLAKY in the run summary) while genuine failures still fail deterministically.
[profile.default]
retries = 2
