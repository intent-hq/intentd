# Nextest configuration for the intentd workspace.
#
# retries = 1: nextest runs tests from all binaries in parallel (unlike
# `cargo test`, which runs one test binary at a time). Several supervisor/PTY
# tests use wall-clock timeouts (~5s) that can be exceeded under that extra
# cross-binary load, especially with llvm-cov instrumentation overhead. A
# single retry lets load-induced timing flakes pass (reported as FLAKY in the
# run summary) while genuine failures still fail deterministically.
#
# slow-timeout hang guard (period=90s, terminate-after=2): Heavy e2e tests
# (daemon-spawning, multi-agent delegation flows) legitimately exceed 60s under
# llvm-cov but should complete within 90s. One extra period is generous enough
# to absorb CI load variance without false positives. A hung test (e.g. waiting
# on a never-arriving event with heartbeat Ping frames resetting a per-frame
# timeout) will be terminated at 180s (2 × 90s) rather than consuming the full
# 30-minute coverage job. Codified after STAB-TBD (PR #221's
# completion_report_cleared test hung indefinitely in CI, timing out the
# coverage jobs at 30 min on every run).
#
# Corollary for test authors (monorepo#1562): an in-test deadline must expire
# BEFORE that 180s kill, otherwise the run reports a bare "test timed out"
# instead of the assertion naming the step that stalled. Budgets built from
# `common::test_timeout` scale with INTENTD_TEST_TIMEOUT_MULTIPLIER (3 under
# coverage), so a 60s base already reaches the kill window on its own — long
# multi-step e2e tests should clamp every wait to a whole-test budget below 180s
# (see `TEST_BUDGET` in `tests/e2e_wss_agent_watch.rs`) and split into
# independent arms when the steps cannot fit.
#
# Test groups: Heavy daemon-spawning e2e binaries (delegation group persist,
# interrupted agents resume, serve --resume-all) serialize among themselves
# (max-threads = 1) to avoid load-induced mock agent death in CI. The rest of
# the suite runs in parallel. Evidence: INT-41 CI investigation showed
# load-correlated silent mock death (empty stderr, ~4s TRY 1 fail, ~11s TRY 2
# pass under NEXTEST_TEST_THREADS=8 + llvm-cov), delay-invariant, not locally
# reproducible. Mechanism not pinned; serialization removes the load condition.
#
# The WSS MCP e2e binaries (e2e_wss_mcp_servers, e2e_wss_mcp_oauth_refresh)
# also run isolated: each test spawns a real daemon plus node mock-MCP
# fixtures, and the daemon-side HTTP probe runs against hardcoded production
# handshake/probe timeouts (10s/15s, mcp_servers.rs) with no test seam. Under
# full-suite parallel load the localhost fixture/daemon starve past those
# bounds and the probe reports error/timeout instead of connected/running
# (monorepo#4231); isolation removes the load condition, same as the
# daemon-spawning binaries above.
#
# e2e_wss_pool_contention_stress also runs isolated: its tests assert
# read-latency bounds (workspace.list / note.list mid-write-storm), which
# measure pool behavior, not machine load. Under llvm-cov with 32+ parallel
# tests on the tinybox runner the read took ~3-4s on both tries purely from
# scheduler contention (PR #750). Isolation keeps in-process noise out of the
# measurement; co-tenant runner slots sharing the box (monorepo#1239) are
# outside nextest's control, so the tests additionally scale their budgets
# from an in-test unloaded baseline of the same RPC.
#
# timing-serial test-group (max-threads = 1): A class of timing-sensitive unit
# tests — filesystem-watcher tests (specialists/skills/root/registry/config
# watchers, which use fixed startup sleeps and drain deadlines), provider
# child-spawn tests (auggie/opencode/grok, which shell out to fake binaries with
# wall-clock budgets), and the event-bus idle-flush latency assertion
# (idle_publish_resolves_without_batch_window_delay, which bounds 20 SQLite
# commits under 350ms — a measurement of bus behavior, not machine load) —
# flakes under nextest's parallel cross-binary load. Unlike
# the in-process mutexes those tests carry (which only serialize within a single
# test binary, and are kept as a harmless aid to plain `cargo test`), a nextest
# test-group serializes them GLOBALLY across binaries under nextest's
# per-process model — running one at a time while the rest of the suite stays
# parallel. This mirrors the intentd CI flake class and keeps `make test` green
# under load.
[profile.default]
retries = 1
slow-timeout = { period = "90s", terminate-after = 2 }

[test-groups]
timing-serial = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary_id(=intentd::e2e_wss_delegation_group_persist) | binary_id(=intentd::e2e_wss_interrupted_agents) | binary_id(=intentd::e2e_wss_resolve_interrupted) | binary_id(=intentd::e2e_wss_serve_resume_all) | binary_id(=intentd::e2e_wss_pool_contention_stress) | binary_id(=intentd::e2e_wss_mcp_servers) | binary_id(=intentd::e2e_wss_mcp_oauth_refresh)'
threads-required = 'num-test-threads'

[[profile.default.overrides]]
filter = 'test(/specialists_watcher::/) | test(/skills_watcher::/) | test(/root_watch::/) | test(/events::registry::/) | test(/config_watcher::/) | test(/run_auggie/) | test(/availability_available_via_fake_binary/) | test(/opencode_cli_timeout/) | test(/opencode_timeout/) | test(/opencode_models_cli_child_path/) | test(/grok_cli_timeout/) | test(/grok_models_cli/) | test(idle_publish_resolves_without_batch_window_delay)'
test-group = 'timing-serial'
