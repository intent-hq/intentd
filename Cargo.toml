[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.79"
repository = "https://github.com/Cloudlands-AI/intentd"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tokio-tungstenite = "0.23"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
agent-client-protocol = "0.14"
agent-client-protocol-tokio = "0.11"
octocrab = "0.53"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
git2 = { version = "0.21", features = ["https", "ssh"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate", "chrono"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive", "env"] }
mdns-sd = "0.11"
notify = "6"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
thiserror = "1"
anyhow = "1"
toml = "0.8"
directories = "5"
nix = { version = "0.29", features = ["signal", "process"] }
portable-pty = "0.8"
grep = "0.3"
ignore = "0.4"
globset = "0.4"
