# Steps injected into v-release.yml's build-local-artifacts job via the
# `github-build-setup` dist setting (dist-workspace.toml). NOT a standalone
# workflow. Needed because no runner image guarantees the toolchain state
# the build needs: no runner (GitHub-hosted or self-hosted) necessarily has
# the pinned rust-toolchain.toml channel or the cross targets
# (x86_64-apple-darwin on the arm64 Mac, musl on Linux) installed, and
# self-hosted runners may lack rustup entirely.
#
# On a self-hosted Windows runner C:\WINDOWS\system32\bash.EXE (the WSL
# stub) shadows Git Bash in PATH, and WSL bash can't execute the runner's
# Windows-path step scripts. Prepend Git's bin dir so every later
# `shell: bash` step resolves Git Bash instead (same workaround as ci.yml's
# build job). No-op on the GitHub-hosted windows-2022 image.
- name: Put Git Bash first on PATH (Windows)
  if: runner.os == 'Windows'
  shell: cmd
  run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
# dist's generated "Install dependencies" step runs `sudo apt-get install`
# without -y. GitHub-hosted Ubuntu images make that non-interactive via
# /etc/apt/apt.conf.d/90assumeyes; a self-hosted runner may not, so apt
# prompts, reads EOF, and aborts. Assert the hosted-image config
# (idempotent where it already exists) and export
# DEBIAN_FRONTEND=noninteractive for the later steps.
# Also set DPkg::Lock::Timeout system-wide so every later `apt-get install`
# — including the one in the generated "Install dependencies" step, which
# can't be edited — waits up to 300s for the dpkg/frontend/archives locks
# instead of failing instantly when a concurrent process holds them
# (monorepo#1515; on hosted images that's the background apt maintenance
# jobs). Note this option does NOT cover /var/lib/apt/lists/lock, which
# `apt-get update` takes (Debian bug #1069167, unimplemented as of apt 2.4)
# — the shim step below handles that.
- name: Make apt-get non-interactive and lock-tolerant (Linux)
  if: runner.os == 'Linux'
  shell: bash
  run: |
    echo 'APT::Get::Assume-Yes "true";' | sudo tee /etc/apt/apt.conf.d/90assumeyes >/dev/null
    echo 'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/90lock-timeout >/dev/null
    echo "DEBIAN_FRONTEND=noninteractive" >> "$GITHUB_ENV"
# The generated "Install dependencies" step starts with `sudo apt-get
# update`, whose lists lock has no wait option (Debian bug #1069167) — the
# race that failed the v0.5.0 aarch64-musl leg when both musl legs shared
# one self-hosted runner (monorepo#1515), and that background apt
# maintenance can still trigger on hosted images. The step's content is
# plan-time matrix output (`matrix.packages_install`), so it can't be
# wrapped in a retry here. Instead, shim apt-get via /usr/local/bin —
# ahead of /usr/bin on sudo's secure_path — to retry with backoff when apt
# fails on lock contention. Idempotent rewrite on every run; Linux-only.
- name: Install retrying apt-get shim (Linux)
  if: runner.os == 'Linux'
  shell: bash
  run: |
    sudo tee /usr/local/bin/apt-get >/dev/null <<'EOF'
    #!/bin/sh
    # Installed by intent-hq/intentd CI (dist-build-setup.yml, monorepo#1515).
    # Retries /usr/bin/apt-get on apt/dpkg lock contention: DPkg::Lock::Timeout
    # does not cover the lists lock taken by `apt-get update` (Debian #1069167).
    attempt=1
    while :; do
      err=$(mktemp)
      /usr/bin/apt-get "$@" 2>"$err"
      rc=$?
      cat "$err" >&2
      if [ "$rc" -eq 0 ] || [ "$attempt" -ge 3 ] || ! grep -qE 'Could not get lock|Unable to lock|Unable to acquire' "$err"; then
        rm -f "$err"
        exit "$rc"
      fi
      rm -f "$err"
      echo "apt-get lock contention (attempt $attempt/3); retrying in $((attempt * 15))s..." >&2
      sleep $((attempt * 15))
      attempt=$((attempt + 1))
    done
    EOF
    sudo chmod 0755 /usr/local/bin/apt-get
# Runs on every runner (not gated on self-hosted): hosted images preinstall
# a Rust toolchain, but not necessarily the pinned rust-toolchain.toml
# channel or the cross targets the matrix leg needs.
- name: Provision Rust toolchain and matrix targets
  shell: bash
  run: |
    if ! command -v rustup >/dev/null 2>&1; then
      if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --default-toolchain none -y
      fi
      echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      export PATH="$HOME/.cargo/bin:$PATH"
    fi
    channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
    rustup toolchain install "$channel" --profile minimal --no-self-update
    rustup target add --toolchain "$channel" ${{ join(matrix.targets, ' ') }}
    # Pin the rustup proxies to the toolchain provisioned above for all
    # later steps. Without this, the first `cargo` invocation inside
    # `dist build` re-enters rustup's rust-toolchain.toml sync to add the
    # declared rustfmt/clippy components, which on the GitHub-hosted
    # gh-linux-16x images collides with the preinstalled Rust ("failed to
    # install component: 'rustfmt-preview-...', detected conflict:
    # 'bin/cargo-fmt'"), rolls back, and leaves the shim reporting cargo
    # as missing (v0.2.16 Release run 30706345522, aarch64-musl leg).
    # The components aren't needed for release builds.
    echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
    # dist's musl packages_install does a user-site `pip3 install
    # cargo-zigbuild` on the Linux runner, which lands in ~/.local/bin —
    # not on the runner service's PATH.
    mkdir -p "$HOME/.local/bin"
    echo "$HOME/.local/bin" >> "$GITHUB_PATH"
# Stage the pinned tailcat sidecar binary (tunnel support, server.tunnel.*)
# into packaging/libexec/ so dist's `include` packs it into this target's
# archive next to tailcat.LICENSE (committed; BSD-3-Clause compliance for
# the non-crate binary cargo-deny can't cover). Linux/Windows use the
# checksum-verified prebuilt release assets; macOS has no prebuilt assets,
# so it's a source build of the same pinned tag with the upstream release
# build tags (build-tags.txt) and flags (goreleaser: CGO_ENABLED=0,
# -s -w, -X main.version). Bump TAILCAT_VERSION and the pinned sha256s
# together (sha256s from the release's checksums.txt).
- name: Stage tailcat sidecar binary
  shell: bash
  run: |
    set -euo pipefail
    TAILCAT_VERSION=0.4.0
    TAILCAT_SHA256_LINUX_AMD64=8b819c43dfdf806b5663e23535aba557bb106075b0b5839df289af9bba70bec2
    TAILCAT_SHA256_LINUX_ARM64=3b77322350f64d229d5b2119b159b863b4bcffa0a62a0294682423a19956dc76
    TAILCAT_SHA256_WINDOWS_AMD64=c238a4e8d3b460423a67e5ad400888b73ffa0b28e15173fd32c9acb699a3a89e
    base="https://github.com/tailscale/tailcat/releases/download/v${TAILCAT_VERSION}"
    dest=packaging/libexec
    tmp=$(mktemp -d)
    fetch_prebuilt() { # $1=asset $2=sha256 $3=binary-name-in-archive
      curl -fsSL --retry 3 -o "$tmp/$1" "$base/$1"
      echo "$2  $tmp/$1" | shasum -a 256 -c -
      case "$1" in
        *.zip) unzip -q "$tmp/$1" -d "$tmp/x" ;;
        *) mkdir -p "$tmp/x" && tar -xzf "$tmp/$1" -C "$tmp/x" ;;
      esac
      mv "$tmp/x/$3" "$dest/$3"
    }
    build_from_source() { # $1=GOARCH
      if ! command -v go >/dev/null 2>&1; then brew install go; fi
      git clone --depth 1 --branch "v${TAILCAT_VERSION}" \
        https://github.com/tailscale/tailcat "$tmp/src"
      tags=$(tr -d '[:space:]' < "$tmp/src/build-tags.txt")
      (cd "$tmp/src" && CGO_ENABLED=0 GOARCH="$1" go build \
        -tags="$tags" \
        -ldflags="-s -w -X main.version=v${TAILCAT_VERSION}" \
        -o tailcat ./cmd/tailcat)
      mv "$tmp/src/tailcat" "$dest/tailcat"
    }
    case "${{ join(matrix.targets, ' ') }}" in
      x86_64-unknown-linux-musl)
        fetch_prebuilt "tailcat_${TAILCAT_VERSION}_linux_amd64.tar.gz" \
          "$TAILCAT_SHA256_LINUX_AMD64" tailcat ;;
      aarch64-unknown-linux-musl)
        fetch_prebuilt "tailcat_${TAILCAT_VERSION}_linux_arm64.tar.gz" \
          "$TAILCAT_SHA256_LINUX_ARM64" tailcat ;;
      x86_64-pc-windows-msvc)
        fetch_prebuilt "tailcat_${TAILCAT_VERSION}_windows_amd64.zip" \
          "$TAILCAT_SHA256_WINDOWS_AMD64" tailcat.exe ;;
      aarch64-apple-darwin)  build_from_source arm64 ;;
      x86_64-apple-darwin)   build_from_source amd64 ;;
      *) echo "no tailcat mapping for target '${{ join(matrix.targets, ' ') }}'" >&2; exit 1 ;;
    esac
    ls -l "$dest"
