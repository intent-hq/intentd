version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    # v-release.yml is generated by cargo-dist (`dist generate`), which pins its
    # own action versions and self-checks the file in the `plan` job. Dependabot
    # bumps there break the release pipeline, so exclude it (see PR #390).
    #
    # release-plz.yml deliberately pins its two actions/checkout steps at
    # v5.1.0 (sha fbc6f399...): checkout v6+ scopes the checkout credential to
    # the workspace, so release-plz's temp-dir copy can't `git fetch` this
    # private repo. Dependabot bumping them (PR #1188) would break releases, so
    # exclude the file rather than ignoring actions/checkout repo-wide.
    exclude-paths:
      - ".github/workflows/v-release.yml"
      - ".github/workflows/release-plz.yml"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
