version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    # v-release.yml is generated by cargo-dist (`dist generate`), which pins its
    # own action versions and self-checks the file in the `plan` job. Dependabot
    # bumps there break the release pipeline, so exclude it (see PR #390).
    exclude-paths:
      - ".github/workflows/v-release.yml"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
