self-hosted-runner:
  labels:
    # Org larger runners (GitHub-hosted); standard GitHub labels are built in.
    - gh-linux-8x
    - gh-linux-16x
    - gh-windows-16x
    - m1mac

# Run by `make lint-workflows` (scripts/lint-workflows.sh; CI's pr-static job).
# Keep every ignore scoped to the narrowest path and message, with its reason;
# a one-off intentional pattern gets an inline `# shellcheck disable=` instead.
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # GitHub documents `concurrency.queue: max`, which the release writers
      # use to retain pending runs, but actionlint 1.7.12 does not know the
      # key yet (cloudlands-fe carries the same ignore). Drop it once the pin does:
      # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/v-release.yml:
    ignore:
      # Generated by `dist generate`, which rewrites hand fixes; the local
      # customizations re-applied by scripts/configure-*.py split $targets
      # and $PRERELEASE_FLAG into arguments on purpose.
      - 'SC2086:'
      - 'SC2129:'
