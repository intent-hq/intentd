            done
            sudo -n apt-get -o DPkg::Lock::Timeout=300 install -y -qq libssl-dev
          fi
      # Raise the per-user inotify instance ceiling. The instrumented full
      # suite starts many real notify watchers in parallel (file, .git
      # metadata, skills, specialists) and up to 8 co-tenant runner slots
      # share the same user on the tinybox, so the kernel default of 128
      # instances can exhaust mid-run — watcher starts in unrelated tests
      # then fail with EMFILE "Too many open files" (intentd PR #882).
      # Relies on the runner user's passwordless sudo, like the step above.
      - name: Raise inotify instance limit
        run: sudo -n sysctl -q -w fs.inotify.max_user_instances=4096
      # Per-job persistent target dir outside the work dir (see the `check`
      # job's comment for the rationale). cargo llvm-cov honors it, and the
      # scripts' `cargo llvm-cov clean --workspace` only cleans workspace
      # crates + profraw, so dependency artifacts stay warm across runs.
      # The $RUNNER_NAME key is a correctness requirement here, not just
      # lock avoidance: that same clean means two coverage jobs on different
      # slots sharing a dir would delete each other's artifacts mid-run.
      - name: Point CARGO_TARGET_DIR outside the work dir
        if: needs.route.outputs.linux_burst != 'true'
        run: echo "CARGO_TARGET_DIR=/raid/ci-target/intentd/$RUNNER_NAME/coverage-all" >> "$GITHUB_ENV"
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: llvm-tools-preview
      # Ephemeral GitHub-hosted runners have no persistent target dir, so
      # use the GH cache there (pure overhead on tinybox, hence burst-gated).
      - name: Rust cache (burst runner only)
        if: needs.route.outputs.linux_burst == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gh-burst-coverage-all
      # Node is required (not preinstalled on tinybox, unlike ubuntu-latest):
      # the ACP e2e tests spawn the mock-acp-agent.mjs fixture and silently
      # self-skip without it, which silently drops coverage below the floor.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Per-slot HOME for install-action — see the coverage-e2e job's comment
      # for the full rationale (shared ~/.install-action tmp/bin race across
      # the 8 tinybox slots; monorepo#1239).
      - name: Key install-action dirs per runner slot
        run: |
          if [[ "${{ needs.route.outputs.linux_burst }}" == "true" ]]; then
            echo "INSTALL_ACTION_HOME=$HOME" >> "$GITHUB_ENV"
          else
            echo "INSTALL_ACTION_HOME=$HOME/ci-install-action/$RUNNER_NAME" >> "$GITHUB_ENV"
          fi
      - uses: taiki-e/install-action@cargo-llvm-cov
        env:
          HOME: ${{ env.INSTALL_ACTION_HOME }}
      - uses: taiki-e/install-action@nextest
        env:
          HOME: ${{ env.INSTALL_ACTION_HOME }}
      - name: Run combined coverage
        run: |
          cd ${{ github.workspace }}
          GENERATE_LCOV=1 ./scripts/coverage-all.sh 80
      - name: Generate coverage summary
        if: always()
        run: |
          cd ${{ github.workspace }}
          echo "## Combined Coverage Report (all tests)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          (cargo llvm-cov report --summary-only 2>/dev/null || echo "Coverage data not available") >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
      # Non-fatal + short retention — same rationale as coverage-e2e's
      # upload step (monorepo#1163).
      - name: Upload coverage artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: combined-coverage-lcov
          path: lcov.info
          if-no-files-found: warn
          retention-days: 3

  pr-title:
    runs-on: ubuntu-latest
    # Same-repo PRs only (fork PRs get no CI — see the `pull_request`
    # trigger comment).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Intermittent TLS failures reaching api.github.com can kill this action
      # sub-second, before it validates anything — a spurious red that reads
      # like a bad title (intent-hq/monorepo#2098). Tolerate a first-attempt
      # failure and retry once; the retry is authoritative, so a genuinely
      # bad title still fails the job.
      - uses: amannn/action-semantic-pull-request@v6
        id: title_check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf
      - name: Wait before retrying title validation
        if: steps.title_check.outcome == 'failure'
        run: sleep 15
      - uses: amannn/action-semantic-pull-request@v6
        if: steps.title_check.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf

  # Conflict-marker guard: fails the PR if any changed file contains committed
  # git conflict markers (the #588 incident: release-plz pushed a branch with
  # '<' x7 / '>' x7 marker lines in CHANGELOG.md, Cargo.lock and Cargo.toml,
  # and no check caught it). Matches the exact line forms git emits — seven
  # '<' or '>' followed by a space and a label — and counts a bare
  # seven-'=' line only when the same file also has both of the other two,
  # so Markdown setext headings / code snippets don't false-positive.
  conflict-markers:
    runs-on: ubuntu-latest
    # Same-repo PRs only (fork PRs get no CI — see the `pull_request`
    # trigger comment).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fetch PR base commit
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
      - name: Scan changed files for conflict markers
        run: |
          set -euo pipefail
          # NUL-delimited via a temp file: robust to quoted/non-ASCII pathnames,
          # and a failing `git diff` fails the step instead of being swallowed
          # by process substitution.
          git diff -z --name-only --diff-filter=ACMR ${{ github.event.pull_request.base.sha }} HEAD > "$RUNNER_TEMP/changed-files.z"
          mapfile -d '' -t files < "$RUNNER_TEMP/changed-files.z"
          fail=0
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            hits=$(grep -nIE '^(<{7}|>{7}) ' "$f" || true)
            [ -n "$hits" ] || continue
            if grep -qIE '^<{7} ' "$f" && grep -qIE '^>{7} ' "$f"; then
              eq=$(grep -nE '^={7}$' "$f" || true)
              [ -n "$eq" ] && hits="$hits"$'\n'"$eq"
            fi
            while IFS= read -r hit; do
              echo "::error file=$f,line=${hit%%:*}::committed git conflict marker"
              printf '%s:%s\n' "$f" "$hit"
            done < <(printf '%s\n' "$hits" | sort -t: -k1,1n)
            fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "Conflict markers detected in changed files — resolve them before merging."
            exit 1
          fi
          echo "No conflict markers in ${#files[@]} changed file(s)."

  # Packaging assets guard: asserts the systemd user unit keeps the exact
  # semantics the daemon's `service install` used to generate (Type=simple,
  # serve/stop, Restart=on-failure, WantedBy=default.target), and that
  # scripts/build-deb.sh produces a well-formed .deb (stub binary here; the
  # real release tarballs are repacked by .github/workflows/release-sitter.yml).
  # Seconds-long like the other utility jobs, so it runs directly on
  # ubuntu-latest, which has the required dpkg-deb / tar+xz toolchain
  # preinstalled.
  deb-packaging:
    runs-on: ubuntu-latest
    # Runs on push and same-repo PRs; skipped on fork PRs (see the
    # `pull_request` trigger comment).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Assert systemd user unit content
        run: |
          unit=packaging/deb/intentd.service
          grep -qx 'Description=Intent backend daemon (intentd)' "$unit"
          grep -qx 'Type=simple' "$unit"
          grep -qx 'ExecStart=/usr/bin/intentd serve' "$unit"
          grep -qx 'ExecStop=/usr/bin/intentd stop' "$unit"
          grep -qx 'Restart=on-failure' "$unit"
          grep -qx 'WantedBy=default.target' "$unit"
      - name: Build and inspect a stub .deb
        run: |
          dir=intentd-x86_64-unknown-linux-musl
          mkdir -p "stub/$dir"
          printf '#!/bin/sh\necho stub\n' > "stub/$dir/intentd"
          chmod +x "stub/$dir/intentd"
          tar -C stub -cJf "$dir.tar.xz" "$dir"
          ./scripts/build-deb.sh "$dir.tar.xz" 0.0.0 amd64
          dpkg-deb --info intentd_0.0.0_amd64.deb
          dpkg-deb --contents intentd_0.0.0_amd64.deb
          test "$(dpkg-deb --field intentd_0.0.0_amd64.deb Package)" = intentd
          test "$(dpkg-deb --field intentd_0.0.0_amd64.deb Architecture)" = amd64
          dpkg-deb --contents intentd_0.0.0_amd64.deb | grep -q ' \./usr/bin/intentd$'
          dpkg-deb --contents intentd_0.0.0_amd64.deb | grep -q ' \./usr/lib/systemd/user/intentd\.service$'

  # Release-script regression tests: runs the stubbed-gh harness for
  # scripts/aggregate-channel-notes.sh (an idempotent re-promotion must
  # rebuild the aggregate from the notes-base marker, and a legacy body
  # without a marker is left untouched — never collapsed to one section).
  # Seconds-long like the other utility jobs, so it runs directly on
  # ubuntu-latest.
  release-scripts:
    runs-on: ubuntu-latest
    # Runs on push and same-repo PRs; skipped on fork PRs (see the
    # `pull_request` trigger comment).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Test aggregate-channel-notes.sh
        run: ./scripts/test-aggregate-channel-notes.sh

  # Single required status check for branch protection: fans in check, build,
  # coverage-e2e, coverage-all, pr-title, conflict-markers, deb-packaging,
  # and release-scripts (ported from cloudlands-fe's "CI Gate" pattern — see
  # packages/cloudlands-fe/.github/workflows/intent-pr.yml). build /
  # deb-packaging / release-scripts must succeed outright: none carries an
  # event-gated `if`, so a skip there is itself a failure signal. check must
  # succeed outright
  # on pull_request runs (a skip there — e.g. after a route failure — fails
  # the gate, exactly as before); only on push to main, where it is
  # job-skipped as redundant (see the `on: push` comment), does the gate
  # accept skipped — the event-aware branch below keeps the PR semantics
  # unweakened. coverage-e2e / coverage-all accept success OR skipped — they
  # are job-level skipped on release-fast-path PRs (fast_path == 'true'), on
  # a route failure (see release-fast-path above), and on push to main, all
  # legitimate. pr-title / conflict-markers accept success OR skipped since
  # both carry `if: github.event_name == 'pull_request'` and are legitimately
  # skipped on push and merge_group runs (PR-metadata checks, already
  # validated on the PR) — requiring strict success there would fail the
  # gate outside pull_request events. On merge_group everything else keeps
  # the pull_request semantics: check / coverage-e2e / coverage-all run
  # against the queue's merged tree and must pass.
  gate:
    name: CI Gate
    # Seconds-long job: pinned to ubuntu-latest (see pr-title).
    runs-on: ubuntu-latest
    permissions: {}
    # The same-repo clause skips the gate on fork PRs along with every other
    # job (see the `pull_request` trigger comment): without it, always()
    # would run the gate against all-skipped needs and report a spurious
    # failure on PRs that get no CI by policy.
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [check, build, coverage-e2e, coverage-all, pr-title, conflict-markers, deb-packaging, release-scripts]
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.deb-packaging.result }}" != "success" ] || \
             [ "${{ needs.release-scripts.result }}" != "success" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          # Event-aware on purpose: check must succeed outright on
          # pull_request; only push runs (where it is job-skipped as
          # redundant) accept skipped.
          if [ "${{ github.event_name }}" = "push" ]; then
            case "${{ needs.check.result }}" in
              success|skipped) ;;
              *)
                echo "check did not succeed or skip"
                exit 1
                ;;
            esac
          elif [ "${{ needs.check.result }}" != "success" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          case "${{ needs.coverage-e2e.result }}" in
            success|skipped) ;;
            *)
              echo "coverage-e2e did not succeed or skip"
              exit 1
              ;;
          esac
          case "${{ needs.coverage-all.result }}" in
            success|skipped) ;;
            *)
              echo "coverage-all did not succeed or skip"
              exit 1
              ;;
          esac
          case "${{ needs.pr-title.result }}" in
            success|skipped) ;;
            *)
              echo "pr-title did not succeed or skip"
              exit 1
              ;;
          esac
          case "${{ needs.conflict-markers.result }}" in
            success|skipped) ;;
            *)
              echo "conflict-markers did not succeed or skip"
              exit 1
              ;;
          esac
