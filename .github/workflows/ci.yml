name: CI
on:
  # Push-to-main runs only the release build matrix (+ route, which places
  # its Windows entry, + deb-packaging + gate). The main ruleset routes
  # every merge through the merge queue (see `merge_group` below) and
  # blocks direct pushes, so every main commit's tree is identical to one a
  # merge-queue (or, pre-queue, strict-up-to-date PR) run just tested — the
  # test jobs (check/coverage-e2e/coverage-all) are push-skipped via their
  # `if`s (CI audit, 2026-08).
  push:
    branches: [main]
  # Fork PRs get no CI: external PRs are not accepted (intent-hq/monorepo#417).
  # Every job reachable from pull_request carries a same-repo guard
  # (head.repo.full_name == github.repository) — directly or via the needs
  # chain — so fork PRs consume zero runner time and can never reach the
  # self-hosted runners; close-fork-prs.yml auto-closes them. Same-repo PRs
  # are completely unaffected.
  pull_request:
  # PRs run Linux metadata, formatting, routing-policy and static consumer
  # checks plus the Linux `check` job (clippy, source lints) and
  # `coverage-changed` (the PR's changed tests). The queue reruns both and
  # adds runtime/platform matrices and full instrumented coverage on the
  # merged tree; CI Gate enforces each tier.
  merge_group:

permissions:
  contents: read
  pull-requests: read

env:
  # Number of intent-cache Linux runner slots: the route job bursts Linux
  # jobs to Depot once this many intent-cache jobs are queued or running
  # ahead of this run. Raise it when slots are added. Jobs still blocked on
  # `needs` are invisible to the jobs API, so only jobs already released to
  # the slots count. Bursted jobs don't carry the intent-cache label and
  # stop counting, so routing returns to the slots as they free up.
  LINUX_BURST_THRESHOLD: 2
  # Same for the fast pool (intent-cache-small, one core per slot), which
  # serves the jobs that ask for a standard depot-ubuntu-* label.
  LINUX_SMALL_BURST_THRESHOLD: 6

# The heavy jobs share two self-hosted Linux slots, so cancel
# superseded PR runs instead of letting them back up the queue (push-to-main
# runs are never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # All workloads prefer compatible self-hosted capacity. Keep the probe
  # hosted so unavailable self-hosted runners cannot block Depot fallback.
  route:
    if: github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      actions: read
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    env:
      LINUX_SIZE: '16'
    outputs:
      runners: ${{ steps.decide.outputs.runners }}
      linux_labels: ${{ steps.heavy.outputs.linux_labels }}
      check_labels: ${{ steps.heavy.outputs.check_labels }}
      linux_burst: ${{ steps.heavy.outputs.linux_burst }}
      windows_labels: ${{ steps.decide.outputs.windows_labels }}
      windows_burst: ${{ steps.decide.outputs.windows_burst }}
      macos_labels: ${{ steps.decide.outputs.macos_labels }}
      macos_burst: ${{ steps.decide.outputs.macos_burst }}
    steps:
      - id: decide
        uses: actions/github-script@v9
        env:
          THRESHOLD: ${{ env.LINUX_BURST_THRESHOLD }}
          SMALL_THRESHOLD: ${{ env.LINUX_SMALL_BURST_THRESHOLD }}
          LINUX_RUNNER_DISABLED: ${{ vars.CI_LINUX_RUNNER_DISABLED }}
          WINDOWS_RUNNER_DISABLED: ${{ vars.CI_WINDOWS_RUNNER_DISABLED }}
          MACOS_RUNNER_DISABLED: ${{ vars.CI_MACOS_RUNNER_DISABLED }}
        with:
          github-token: ${{ secrets.CI_QUEUE_READ_TOKEN || github.token }}
          script: |
            // No checkout: routing never executes code from a pull request.
            // Org runners with these labels must be in groups shared with all three CI repos.
            const fleets = {
              // Heavy jobs (compile Rust or run over ~5 minutes): 8 cores / 48 GB per slot.
              linux: ['self-hosted', 'linux', 'x64', 'intent-cache'],
              // Fast jobs: 1 core / 3 GB per slot.
              small: ['self-hosted', 'linux', 'x64', 'intent-cache-small'],
              arm: ['self-hosted', 'Linux', 'ARM64'],
              windows: ['self-hosted', 'Windows', 'X64'],
              macos: ['self-hosted', 'macOS', 'ARM64'],
              intel: ['self-hosted', 'macOS', 'X64'],
            };
            const disabled = {
              linux: process.env.LINUX_RUNNER_DISABLED === 'true',
              small: process.env.LINUX_RUNNER_DISABLED === 'true',
              arm: process.env.LINUX_RUNNER_DISABLED === 'true',
              windows: process.env.WINDOWS_RUNNER_DISABLED === 'true',
              macos: process.env.MACOS_RUNNER_DISABLED === 'true',
              intel: process.env.MACOS_RUNNER_DISABLED === 'true',
            };
            const burst = Object.fromEntries(Object.keys(fleets).map(k => [k, true]));
            const reasons = Object.fromEntries(Object.keys(fleets).map(k => [k, 'availability not established']));
            const pr = context.payload?.pull_request;
            const fork = context.eventName === 'pull_request' && pr?.head?.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`;
            try {
              if (fork) throw new Error('fork pull request requires an isolated hosted runner');
              let runners;
              try {
                runners = await github.paginate(github.rest.actions.listSelfHostedRunnersForOrg, {org: context.repo.owner, per_page: 100});
              } catch (error) {
                core.info(`org runner list failed (${error.message}); trying repository-visible runners`);
                runners = await github.paginate(github.rest.actions.listSelfHostedRunnersForRepo, {...context.repo, per_page: 100});
              }
              const online = Object.fromEntries(Object.entries(fleets).map(([key, labels]) => [key,
                runners.filter(r => r.status === 'online' && labels.every(l => (r.labels || []).some(x => x.name?.toLowerCase() === l.toLowerCase()))),
              ]));
              const jobs = [];
              // A missing sibling view is unknown demand, not zero demand. Fail open to Depot.
              if (Object.values(online).some(rs => rs.length)) {
                for (const repo of new Set(['intent', 'intentd', 'cloudlands-fe', context.repo.repo])) {
                  const seen = new Set();
                  for (const status of ['queued', 'in_progress']) {
                    const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {owner: context.repo.owner, repo, status, per_page: 100});
                    for (const run of runs) {
                      if (run.id === context.runId || seen.has(run.id)) continue;
                      seen.add(run.id);
                      jobs.push(...await github.paginate(github.rest.actions.listJobsForWorkflowRun, {owner: context.repo.owner, repo, run_id: run.id, per_page: 100}));
                    }
                  }
                }
              }
              const thresholds = {linux: Number(process.env.THRESHOLD || '2'), small: Number(process.env.SMALL_THRESHOLD || '6')};
              if (Object.values(thresholds).some(n => !Number.isInteger(n) || n < 0)) throw new Error('invalid queue threshold');
              for (const [key, labels] of Object.entries(fleets)) {
                const demand = jobs.filter(j => ['queued', 'in_progress'].includes(j.status) && labels.every(l => (j.labels || []).some(x => x.toLowerCase() === l.toLowerCase())));
                const stale = demand.some(j => j.status === 'queued' && (!Number.isFinite(Date.parse(j.created_at)) || Date.parse(j.created_at) < Date.now() - 15 * 60 * 1000));
                const native = !(key in thresholds);
                const capacity = native ? online[key].filter(r => r.busy === false).length : online[key].length;
                const limit = native ? capacity - 1 : Math.min(thresholds[key], capacity);
                const depth = native ? demand.filter(j => j.status === 'queued').length : demand.length;
                burst[key] = disabled[key] || capacity === 0 || stale || (native ? depth > limit : depth >= limit);
                reasons[key] = disabled[key] ? 'disabled for maintenance' : capacity === 0 ? 'no available compatible runner' : stale ? 'stalled or unknown-age queue' : `queue depth=${depth} threshold=${limit} online=${online[key].length}`;
              }
            } catch (error) {
              for (const key of Object.keys(fleets)) reasons[key] = `probe failed (${error.message})`;
            }
            const mapping = {};
            for (const version of ['22.04', '24.04']) {
              for (const size of ['', '-4', '-8', '-16', '-32', '-64']) {
                for (const arch of ['', '-arm']) {
                  const label = `depot-ubuntu-${version}${arch}${size}`;
                  // Larger runners carry the heavy jobs; standard runners the fast ones.
                  const key = arch ? 'arm' : ['-8', '-16', '-32', '-64'].includes(size) ? 'linux' : 'small';
                  mapping[label] = burst[key] ? [label] : fleets[key];
                }
              }
            }
            for (const version of ['2022', '2025']) {
              for (const size of ['', '-4', '-8', '-16', '-32', '-64']) {
                const label = `depot-windows-${version}${size}`;
                mapping[label] = burst.windows ? [label] : fleets.windows;
              }
            }
            mapping['depot-macos-latest'] = burst.macos ? ['depot-macos-latest'] : fleets.macos;
            mapping['macos-latest-large'] = burst.intel ? ['macos-latest-large'] : fleets.intel;
            for (const key of Object.keys(fleets)) core.info(`${key} routing: burst=${burst[key]} (${reasons[key]})`);
            core.setOutput('runners', JSON.stringify(mapping));
            core.setOutput('linux_labels', JSON.stringify(mapping[`depot-ubuntu-24.04-${process.env.LINUX_SIZE || '8'}`]));
            core.setOutput('check_labels', JSON.stringify(mapping['depot-ubuntu-24.04-8']));
            core.setOutput('windows_labels', JSON.stringify(mapping['depot-windows-2022-16']));
            core.setOutput('macos_labels', JSON.stringify(mapping['depot-macos-latest']));
            for (const key of ['linux', 'windows', 'macos']) core.setOutput(`${key}_burst`, String(burst[key]));
      # The heavy Rust jobs (check, coverage-*, daemon-lifecycle) are the only
      # readers of linux_labels / check_labels / linux_burst. In the merge
      # queue they stay on Depot: one queue run starts ~4 of them at once,
      # sized for 16 CPUs, and the route decision is made before any of them
      # is queued, so all would land on the two 8-CPU intent-cache slots and
      # run one after another past the queue's time budget. PR and push
      # runs, and the light jobs routed through `runners`, keep the probe's
      # choice. This override stays out of the probe script above, which is
      # kept identical to runner-route.yml across intent, intentd and
      # cloudlands-fe.
      - id: heavy
        env:
          EVENT: ${{ github.event_name }}
          LINUX_LABELS: ${{ steps.decide.outputs.linux_labels }}
          CHECK_LABELS: ${{ steps.decide.outputs.check_labels }}
          LINUX_BURST: ${{ steps.decide.outputs.linux_burst }}
        run: |
          if [[ "$EVENT" == merge_group ]]; then
            LINUX_LABELS="[\"depot-ubuntu-24.04-$LINUX_SIZE\"]"
            CHECK_LABELS='["depot-ubuntu-24.04-8"]'
            LINUX_BURST=true
            echo "heavy linux routing: burst=true (merge queue keeps heavy Rust jobs on Depot)"
          fi
          {
            echo "linux_labels=$LINUX_LABELS"
            echo "check_labels=$CHECK_LABELS"
            echo "linux_burst=$LINUX_BURST"
          } >> "$GITHUB_OUTPUT"

  # Dependency-free PR policy checks; the PR's compiled Linux checks live in
  # `check` and `coverage-changed`, and native runners stay queue-only.
  pr-static:
    needs: route
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(needs.route.outputs.runners || '{}')['depot-ubuntu-24.04'] || fromJSON('["depot-ubuntu-24.04"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python3 -m pip install 'PyYAML==6.0.3'
      # The routing test executes the probe under node; install it explicitly
      # rather than relying on the runner image.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check CI routing and gate failures
        run: python3 -I -B scripts/test-ci-native-routing.py
      # Release PRs run this job too: a release that would split the intentd
      # version_group (intent-hq/intentd#2461) fails here before it merges.
      - name: Check release-plz version groups stay in lockstep
        run: python3 -S scripts/test-version-group.py
      - name: Resolve formatting toolchain
        id: rust
        run: echo "channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  cache-smoke:
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/depot-cache-smoke.yml
    secrets: inherit

  check:
    # Runs on same-repo PRs and in the merge queue; skipped on push to main —
    # a redundant re-test of a tree the queue already checked (see the
    # `on: push` comment). The expression carries no status function, so the
    # route result is checked explicitly: a route failure — or a route skip,
    # as on fork PRs — skips this job, and CI Gate rejects that skip.
    # A same-repo PR whose diff is pure release metadata (release-fast-path)
    # skips it too: the release PR differs from main's tip only in versions
    # and the changelog, and main's tip already passed this job in the merge
    # queue. Re-running it held each release-plz refresh ~14 min and starved
    # the v0.11.9 release PR behind 15-minute main merges (intentd#2493).
    # Every other PR still runs it, and the merge queue always does.
    if: ${{ !cancelled() && needs.route.result == 'success' && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && needs.release-fast-path.outputs.fast_path != 'true')) }}
    needs: [route, release-fast-path]
    runs-on: ${{ fromJSON(needs.route.outputs.check_labels) }}
    # The cold-cache check job exhausted its 20-minute budget after its tests
    # passed in run 37305697722. Allow completion/cache margin without changing
    # individual test timeouts.
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/checkout@v7
      - name: Configure Depot managed compiler cache
        shell: bash
        env:
          DEPOT_SCCACHE_TOKEN: ${{ secrets.DEPOT_TOKEN }}
          INTENT_SCCACHE_ENDPOINT: ${{ vars.INTENT_SCCACHE_ENDPOINT }}
          INTENT_SCCACHE_TOKEN: ${{ secrets.INTENT_SCCACHE_TOKEN }}
          INTENT_SCCACHE_MODE: ${{ vars.INTENT_SCCACHE_MODE }}
        run: python3 scripts/setup-depot-sccache.py
      # openssl-sys needs the OpenSSL headers. Depot and intent-cache images
      # ship libssl-dev, so this is normally a no-op; the install path needs
      # passwordless sudo, which intent-cache slots do not have. Concurrent
      # jobs can race for the apt locks (monorepo#1515):
      # DPkg::Lock::Timeout makes `install` wait for the dpkg locks, and the
      # retry loop covers `update`, whose lists lock has no wait option
      # (Debian bug #1069167).
      - name: Install libssl-dev if missing
        run: |
          if ! pkg-config --exists openssl; then
            for i in 1 2 3; do
              if sudo -n apt-get -o DPkg::Lock::Timeout=300 update -qq; then break; fi
              if [ "$i" -eq 3 ]; then exit 1; fi
              sleep $((i * 15))
            done
            sudo -n apt-get -o DPkg::Lock::Timeout=300 install -y -qq libssl-dev
          fi
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-11 (PR 185, --force-non-host)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --check
      - name: Acquire the shared transfer selection contract
        uses: ./.github/actions/transfer-selection-fixtures
      - name: Real import and public session contract
        env:
          INTENTD_ASSERT_BOUND_CALLER: "1"
        run: "cargo test -p intent-services --lib transfer_selection_contract::"
      # Wrapped in scripts/ci-lld-retry.sh (intent-hq/intent#5256): on a
      # shared self-hosted host rust-lld has failed to open objects rustc had just
      # written under this job's own target dir (merge-queue run
      # 35200715354 — red in 6 s, queue entry ejected). The wrapper retries
      # exactly once, only on the `rust-lld: error: cannot open ... No such
      # file or directory` signature, after printing host diagnostics
      # (listing of the vanished object's dir, live cargo/rustc processes);
      # every other failure — a genuine lint above all — propagates
      # unchanged, so it never hides a real red.
      - name: Clippy
        run: ./scripts/ci-lld-retry.sh cargo clippy --workspace --all-targets -- -D warnings
      # Source lints: every `crates/*/tests/*_lint.rs` integration test is a
      # source-scanning lint and is selected by the `--test` glob, so a new
      # lint needs no wiring here. Each lint's rationale lives in its module
      # doc; `source_lint_discovery_lint` fails when a `*_lint.rs` file exists
      # that cargo does not expose as a matching test target. The lints run
      # here, next to Clippy, so every PR gets the verdict from the lint job
      # rather than buried in the test matrix.
      - name: Source lints
        env:
          INTENTD_ASSERT_BOUND_CALLER: "1"
        run: cargo test --workspace --test '*_lint'
      # This target requires explicit cold mock authority. Ordinary/default
      # daemon builds never register these transports; keep the feature lane
      # mandatory in the merge queue so default target selection cannot hide
      # auth coverage. Defer this separate feature build during PR iteration;
      # CI Gate requires check to succeed against the queue's merged tree.
      - name: GitLab auth, invitations and checkout over real sockets with explicit test transports
        if: github.event_name == 'merge_group'
        env:
          INTENTD_ASSERT_BOUND_CALLER: "1"
        run: cargo test --locked -p intentd --features repository-test-fixtures --test e2e_wss_gitlab_auth --test e2e_wss_invite_join_gitlab --test e2e_repository_resource_read -- --test-threads=2

      - uses: taiki-e/install-action@cargo-shear
      # Blocking unused-dependency gate: fails when any crate declares a
      # dependency its code never uses. --deny-warnings promotes warnings
      # (e.g. unused optional dependencies) to errors so they cannot land
      # either. True false positives (e.g. link-time only deps like intentd's
      # vendored openssl-sys) are suppressed via
      # [package.metadata.cargo-shear] ignored = [...] next to the dependency,
      # each with a comment explaining why.
      - name: Unused dependencies (cargo-shear)
        run: cargo shear --deny-warnings
      # The full suite is not run here: coverage-all executes it (instrumented,
      # via cargo llvm-cov nextest) and is the test gate in the merge queue
      # (coverage-e2e / coverage-all are merge_group-only; PRs run only
      # coverage-changed — see the trigger comment).
      # Running it plainly here as well would double the critical path. The
      # exception is the tests the coverage scripts skip: they are flaky under
      # llvm-cov instrumentation / heavy parallel load, so they run here
      # instead — non-instrumented and serially, the conditions under which
      # they pass reliably — to keep them covered on every PR.
      #
      # slow_host_exec_does_not_block_fast_workspace_list (STAB-42) is NOT run:
      # it currently fails deterministically even in an isolated, serial,
      # non-instrumented run (times out at uds_concurrent_dispatch.rs:63), so
      # it stays skipped everywhere until STAB-42 is fixed.
      - name: Coverage-skipped tests (STAB-40/43)
        # Armed bound-caller seam, as on the coverage jobs' run steps (see
        # coverage-e2e) and on this job's other `cargo test` steps (Source
        # lints, Installer guard tests), so no test process runs unarmed.
        env:
          INTENTD_ASSERT_BOUND_CALLER: "1"
        run: |
          cargo test -p intent-core --lib capture_login_shell_path_with_fake_shell
          cargo test -p intentd --test wss_integration wss_note_save_asset_round_trip
      # The install.ps1 guard tests (intentd-sitter's install_ps1_owner.rs)
      # execute the shipped PowerShell and self-skip when `pwsh` is absent —
      # which let the suite "pass" in ~0.014s without running a single block
      # (intent-hq/monorepo#4054). Provision pwsh 7.x here so the tests
      # actually execute. GitHub-hosted Ubuntu runners (the burst labels)
      # preinstall pwsh, so this is a no-op there; elsewhere the pinned
      # tarball is unpacked into a per-runner dir (keyed on $RUNNER_NAME,
      # ~180 MiB, reused when the runner's home persists — per-runner so
      # concurrent first-time installs on a shared home cannot clobber each
      # other's downloads, the monorepo#1239 failure mode).
      # The cache probe runs the binary, so an executable-but-broken cache
      # self-heals by reinstalling, and the whole slot dir is wiped before a
      # (re)install so a version bump never strands old $version dirs.
      #
      # `pwsh --version` proves only that the binary runs; it never brings up
      # a runspace. On 2026-09-18 every check run on a shared self-hosted
      # Linux host went red with 14
      # opaque driver failures (intent-hq/intent#5367, run 35346259015)
      # because pwsh died with `Stack overflow.` during startup: the
      # multicore-JIT profile it replays on every start
      # (~/.cache/powershell/StartupProfileData-NonInteractive, rewritten
      # non-atomically at every exit) had been corrupted, and the host's
      # runner slots shared one $HOME, so every slot read the same file. Two
      # guards below: this step and the guard-test step point XDG_CACHE_HOME
      # at a job-private dir under $RUNNER_TEMP (harmless on burst runners),
      # so CI's own pwsh never reads or writes the shared home cache — the
      # test harness additionally gives each spawned pwsh its own cache dir;
      # and a runspace-initialising probe fails this step with host
      # diagnostics when pwsh cannot start, so a recurrence reads as an
      # environment failure here rather than as 14 test failures below.
      - name: Provision PowerShell (pwsh) if missing
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
        run: |
          set -euo pipefail
          mkdir -p "$XDG_CACHE_HOME"
          if command -v pwsh >/dev/null 2>&1; then
            pwsh_bin=$(command -v pwsh)
            echo "pwsh already on PATH: $pwsh_bin ($("$pwsh_bin" --version))"
          else
            version=7.4.6
            sha256=6f6015203c47806c5cc444c19d8ed019695e610fbd948154264bf9ca8e157561
            slotdir="$HOME/ci-pwsh/${RUNNER_NAME:-local}"
            dest="$slotdir/$version"
            if ! "$dest/pwsh" --version >/dev/null 2>&1; then
              rm -rf "$slotdir"
              tmp=$(mktemp -d)
              curl -fsSL --retry 3 -o "$tmp/pwsh.tar.gz" \
                "https://github.com/PowerShell/PowerShell/releases/download/v${version}/powershell-${version}-linux-x64.tar.gz"
              echo "$sha256  $tmp/pwsh.tar.gz" | sha256sum -c -
              mkdir -p "$dest"
              tar -xzf "$tmp/pwsh.tar.gz" -C "$dest"
              chmod +x "$dest/pwsh"
              rm -rf "$tmp"
            fi
            echo "$dest" >> "$GITHUB_PATH"
            pwsh_bin="$dest/pwsh"
            "$pwsh_bin" --version
          fi
          echo "XDG_CACHE_HOME=$XDG_CACHE_HOME"
          probe_rc=0
          probe_out=$("$pwsh_bin" -NoProfile -NonInteractive -Command 'Write-Output pwsh-ok' 2>&1) || probe_rc=$?
          if [[ $probe_rc -ne 0 || "$probe_out" != *pwsh-ok* ]]; then
            echo "pwsh startup probe failed (rc=$probe_rc):"
            echo "$probe_out"
            echo "--- host diagnostics ---"
            echo "ulimit -s: $(ulimit -s)"
            free -m | head -2
            for cache in "$XDG_CACHE_HOME/powershell" "$HOME/.cache/powershell"; do
              echo "$cache:"
              ls -l --time-style=full-iso "$cache" 2>&1 || true
            done
            echo "::error::pwsh cannot initialise a runspace on ${RUNNER_NAME:-this runner} (intent-hq/intent#5367). Likely a corrupt PowerShell startup profile — on 2026-09-18 it was the shared \$HOME/.cache/powershell/StartupProfileData-NonInteractive; see the diagnostics above and the issue for the fix."
            exit 1
          fi
          echo "pwsh startup probe: $probe_out"
      # INTENTD_CI_EXPECT_PWSH makes a missing pwsh FAIL these tests instead
      # of skipping (see install_ps1_owner.rs), so a broken provisioning step
      # above can never quietly turn this suite back into a no-op. The suite
      # runs here rather than relying on coverage-all, where a pwsh-less
      # runner would skip it silently. XDG_CACHE_HOME matches the provisioning
      # step's job-private cache (intent-hq/intent#5367, see above); the
      # harness narrows it further to a per-run dir for each pwsh it spawns.
      - name: Installer guard tests (install_ps1_owner)
        env:
          INTENTD_CI_EXPECT_PWSH: 1
          INTENTD_ASSERT_BOUND_CALLER: "1"
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
        run: |
          echo "pwsh: $(command -v pwsh) ($(pwsh --version)); XDG_CACHE_HOME=$XDG_CACHE_HOME; ulimit -s: $(ulimit -s)"
          cargo test -p intentd-sitter --test install_ps1_owner
  # Release metadata classification (intent-hq/monorepo#1374): retain the
  # audited diff-shape output and fail-safe script behavior. Native builds
  # and full coverage are now job-skipped on every PR, independent of this
  # output. On a PR, fast_path=true also skips `check` and `coverage-changed`
  # (intentd#2493), and CI Gate accepts that skip only when this job
  # succeeded. A non-release PR that forges the output still meets both
  # jobs in the merge queue; auto-cut's direct merge re-classifies the diff
  # with its own trusted script, which rejects workflow and script changes.
  # This PR-only job is skipped on merge_group / push, leaving its output
  # empty so the retained native step guards never bypass queue validation
  # or main release builds. CI Gate is the only required context; the old
  # per-matrix required-context constraint (intentd#868) no longer applies.
  release-fast-path:
    needs: [route]
    runs-on: ${{ fromJSON(needs.route.outputs.runners || '{}')['depot-ubuntu-24.04'] || fromJSON('["depot-ubuntu-24.04"]') }}
    # Same-repo release-plz PRs only (fork PRs get no CI — see the
    # `pull_request` trigger comment). Ordinary PRs skip it at once, so the
    # `check` / `coverage-changed` dependency costs them no queue time.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-plz-')
    timeout-minutes: 5
    outputs:
      fast_path: ${{ steps.decide.outputs.fast_path }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch PR base commit
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
      - name: Evaluate diff shape
        id: decide
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Script contract: prints fast_path=true|false; non-zero exit means
          # no-match. Never fail this step — a broken checker must degrade to
          # full CI, not block the PR.
          out=$(./scripts/release-pr-fast-path.sh "$BASE_SHA" HEAD) || {
            echo "release-pr-fast-path.sh exited non-zero — falling back to full CI"
            out="fast_path=false"
          }
          printf '%s\n' "$out"
          line=$(printf '%s\n' "$out" | grep -E '^fast_path=(true|false)$' | tail -n1 || true)
          echo "${line:-fast_path=false}" >> "$GITHUB_OUTPUT"

  build:
    # Native Rust validation runs once on the queue's merged tree; main
    # pushes retain release builds. The explicit event allowlist prevents
    # matrix expansion for all PRs, including forks and release-shaped PRs.
    # `!cancelled()` permits skipped release-fast-path and failed route
    # dependencies: release metadata is PR-only, and each native OS has a hosted
    # fallback when routing fails. CI Gate still rejects skipped Linux
    # validation on merge_group after a route failure.
    # `route` places the native entries (Windows: intent-hq/intent#5518; see the
    # matrix) and runs on every event this job runs on. route runs on
    # depot-ubuntu-24.04, so this dependency can never queue behind the
    # self-hosted runners it decides about.
    needs: [release-fast-path, route]
    if: ${{ !cancelled() && (github.event_name == 'merge_group' || github.event_name == 'push') }}
    strategy:
      # Don't let one platform's failure cancel the other's required check.
      fail-fast: false
      matrix:
        include:
          # temporarily disabled — re-enable when needed
          # - target: x86_64-unknown-linux-gnu
          #   os: depot-ubuntu-24.04
          # Prefer an idle self-hosted Apple Silicon runner (m1mac), else
          # use the latest hosted ARM64 image. Empty route output also falls back to
          # hosted. Keep the check name independent of the runner.
          - target: aarch64-apple-darwin
            os: ${{ fromJSON(needs.route.outputs.macos_labels || '["depot-macos-latest"]') }}
            name: build (aarch64-apple-darwin)
          # Routed by the route job (intent-hq/intent#5518): the self-hosted
          # 5090pc runner when the probe confirms it online, the org-hosted
          # depot-windows-2022-16 runner otherwise (fail-open to burst, like the
          # Linux jobs — an offline 5090pc used to leave this required check
          # QUEUED forever and block every merge: intent-hq/intent#1382,
          # #1583). The self-hosted labels are selected ONLY when route
          # positively emitted them: an empty output — route failed, timed
          # out, or was skipped (`!cancelled()` still runs this job) — falls
          # back to the burst label, never to a runner nothing confirmed
          # online. (The fallback also keeps `fromJSON('')` from failing the
          # matrix expansion.) Retain the name below for check history.
          - target: x86_64-pc-windows-msvc
            os: ${{ fromJSON(needs.route.outputs.windows_labels || '["depot-windows-2022-16"]') }}
            name: build (x86_64-pc-windows-msvc, self-hosted, Windows, X64)
    # Explicit per-entry names keep check history stable across runner changes.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Keeps native Clippy/tests free of debuginfo/incremental artifacts
    # (cheaper compile, smaller shared cache). Safe job-wide: the release
    # build is unaffected — these vars only touch the dev/test profiles, and
    # release builds are non-incremental by default.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/checkout@v7
      # On the self-hosted Windows runner C:\WINDOWS\system32\bash.EXE (the
      # WSL stub) shadows Git Bash in PATH, and WSL bash can't execute the
      # runner's Windows-path step scripts. Prepend Git's bin dir so every
      # later `shell: bash` step resolves Git Bash instead.
      - name: Put Git Bash first on PATH (Windows)
        if: needs.release-fast-path.outputs.fast_path != 'true' && runner.os == 'Windows'
        shell: cmd
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - name: Configure Depot managed compiler cache
        if: needs.release-fast-path.outputs.fast_path != 'true'
        shell: bash
        env:
          DEPOT_SCCACHE_TOKEN: ${{ secrets.DEPOT_TOKEN }}
          INTENT_SCCACHE_ENDPOINT: ${{ vars.INTENT_SCCACHE_ENDPOINT }}
          INTENT_SCCACHE_TOKEN: ${{ secrets.INTENT_SCCACHE_TOKEN }}
          INTENT_SCCACHE_MODE: ${{ vars.INTENT_SCCACHE_MODE }}
        run: python3 scripts/setup-depot-sccache.py
      # Per-job persistent target dir outside the work dir, self-hosted
      # runners only (see the `check` job's comment for the rationale). The
      # self-hosted macOS and Windows runners are single-slot, so no $RUNNER_NAME key. On the
      # Windows runner this runs under Git Bash, where $HOME is an MSYS-style
      # path cargo (spawned from the default pwsh shell) can't use —
      # $USERPROFILE carries the native C:\Users\... form, so prefer it when
      # set.
      - name: Point CARGO_TARGET_DIR outside the work dir (self-hosted)
        if: needs.release-fast-path.outputs.fast_path != 'true' && contains(matrix.os, 'self-hosted')
        shell: bash
        run: echo "CARGO_TARGET_DIR=${USERPROFILE:-$HOME}/ci-target/intentd/build-${{ matrix.target }}" >> "$GITHUB_ENV"
      # Run before toolchain/build steps. Only known CI profiles are eligible;
      # Cargo locks remain held and their inodes survive every deletion.
      - name: Ensure macOS CI disk headroom
        if: needs.release-fast-path.outputs.fast_path != 'true' && runner.os == 'macOS' && contains(matrix.os, 'self-hosted')
        run: python3 -I -B scripts/macos-ci-cleanup.py --apply
      - name: Resolve pinned Rust channel
        if: needs.release-fast-path.outputs.fast_path != 'true'
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-11 (PR 185, --force-non-host)
        if: needs.release-fast-path.outputs.fast_path != 'true'
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}
          # clippy is needed by the target-gated lint step below, which runs
          # on both the macOS and the Windows matrix entries.
          components: clippy
      # Ephemeral GitHub-hosted runners have no persistent target dir, so
      # use the GH cache there instead (mirrors the `check` job's
      # burst-runner caching; pure overhead on the self-hosted runners).
      # Keep the production configuration check separate from all-target
      # Clippy: intentd's dev-dependency enables repository-test-fixtures in
      # intent-services under --all-targets, excluding feature-off production
      # arms. Native --lib tests use cfg(test), so they cannot replace this
      # non-test check either. Release builds stay push-only; the final check
      # warms their persistent target dir for the next queue run.
      - name: Check (native production configuration)
        if: needs.release-fast-path.outputs.fast_path != 'true' && github.event_name == 'merge_group'
        run: cargo check --workspace --target ${{ matrix.target }}
      # Clippy over target-gated code (intent-hq/monorepo#3285 for macOS,
      # intent-hq/intentd#1813 for Windows): the `check` job lints on Linux,
      # where `#[cfg(target_os = "macos")]` / `#[cfg(windows)]` /
      # `#[cfg(not(unix))]` code is never compiled, so warnings in
      # target-only code (including outer `#[allow]`s that only expand there
      # and trip `clippy::allow_attributes`) land silently and break
      # `make check` on every macOS or Windows dev box. Linting here (same
      # invocation as the check job) closes the gap. It runs on
      # merge-queue runs, not on push: the queue tests the actual merged
      # tree, and a PR-only step let intent-hq/intentd#1825 (green on its
      # own PR run) land a Windows-only E0433 via the queue — main's push
      # run skipped the step, so ~8 open PRs failed the required gate until
      # intent-hq/intentd#1835 fixed it. Main's push run builds a tree the
      # queue already linted, so it stays skipped there. It runs on the
      # native runners rather than as Linux cross-target runs because
      # `cargo clippy --target <triple>` still executes the native build
      # scripts (libz-sys and friends try-compile C for the target even when
      # pkg-config resolves a system lib), which would require a full
      # darwin / MSVC cross C toolchain on Linux; the native runners need
      # nothing extra and share this job's warm target dir. release-fast-path
      # is pull_request-only, so its output is empty on merge_group and the
      # `!= 'true'` guard lets the step run there.
      - name: Clippy (target-gated code)
        if: needs.release-fast-path.outputs.fast_path != 'true' && github.event_name == 'merge_group' && (runner.os == 'macOS' || runner.os == 'Windows')
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      # Exercise the deterministic deadline oracle and real TLS controls on
      # macOS; listen backlog saturation cannot guarantee a pending connect.
      - name: Tunnel deadline and TLS controls (macOS runtime)
        if: needs.release-fast-path.outputs.fast_path != 'true' && github.event_name == 'merge_group' && runner.os == 'macOS'
        timeout-minutes: 20
        shell: bash
        env:
          INTENTD_ASSERT_BOUND_CALLER: "1"
          INTENTD_TUNNEL_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
          INTENTD_TUNNEL_TARGET: ${{ matrix.target }}
          CARGO_BUILD_JOBS: "2"
        run: |
          python3 -I -B -S - <<'PYTHON'
          import json, os, signal, subprocess
          from pathlib import Path

          cargo = ["rustup", "run", os.environ["INTENTD_TUNNEL_TOOLCHAIN"],
                   "cargo", "test", "--locked", "--target", os.environ["INTENTD_TUNNEL_TARGET"]]
          groups = [
              (["-p", "intent-transport", "--lib"], [
                  "tunnel::tests::connect_pending_deadline_emits_terminal_open_err",
                  "tunnel::tests::connect_reset_preserves_error_before_deadline",
                  "tunnel::tests::connect_success_before_deadline_relays",
              ]),
              (["-p", "intentd", "--test", "e2e_wss_tunnel"], [
                  "tunnel_open_echo_eof_close_lifecycle",
                  "tunnel_open_err_for_closed_port_keeps_connection_alive",
                  "tunnel_close_tears_down_and_frees_stream_id",
                  "tunnel_connections_counted_in_health_and_stopped",
                  "tunnel_unauthenticated_upgrade_rejected",
              ]),
          ]

          def bounded(command, package_dir, env):
              print("+ " + repr(command), flush=True)
              child = subprocess.Popen(command, stdout=subprocess.PIPE,
                                       stderr=subprocess.STDOUT, text=True, start_new_session=True,
                                       cwd=package_dir, env=env)
              try:
                  output, _ = child.communicate(timeout=30)
                  print(output, end="", flush=True)
                  assert child.returncode == 0, (command, child.returncode)
                  return output
              except subprocess.TimeoutExpired:
                  os.killpg(child.pid, signal.SIGKILL)
                  output, _ = child.communicate()
                  print(output, end="", flush=True)
                  raise

          rust_lib = subprocess.check_output(
              ["rustup", "run", os.environ["INTENTD_TUNNEL_TOOLCHAIN"], "rustc",
               "--print", "target-libdir", "--target", os.environ["INTENTD_TUNNEL_TARGET"]], text=True).strip()
          for package, tests in groups:
              # Compilation has the step's budget. A later Cargo invocation
              # can rebuild even after --no-run (e.g. missing watched Git
              # metadata); never charge that work to the 30s runtime proof.
              built = subprocess.run(cargo + package + ["--no-run", "--message-format=json-render-diagnostics"],
                                     check=True, stdout=subprocess.PIPE, text=True)
              messages = [json.loads(line) for line in built.stdout.splitlines() if line.startswith("{")]
              package_dir = Path("crates", package[1]).resolve()
              kind = "lib" if "--lib" in package else "test"
              name = package[1].replace("-", "_") if kind == "lib" else package[package.index("--test") + 1]
              artifacts = [m for m in messages if m.get("reason") == "compiler-artifact"
                           and m.get("profile", {}).get("test") is True and m.get("executable")
                           and m.get("target", {}).get("kind") == [kind] and m["target"].get("name") == name
                           and m.get("manifest_path") == str(package_dir / "Cargo.toml")]
              assert len(artifacts) == 1, ("expected one current native test executable", artifacts)
              binary = Path(artifacts[0]["executable"])
              assert binary.is_file() and os.access(binary, os.X_OK), binary
              print("Using native test executable: " + str(binary), flush=True)
              # Match Cargo's package cwd and native library search roots.
              env = dict(os.environ)
              libraries = []
              # Explicit --target puts the binary at target/triple/profile/deps.
              for message in messages:
                  if message.get("reason") == "build-script-executed":
                      for linked in message.get("linked_paths", []):
                          path = Path(linked.split("=", 1)[-1] if not linked.startswith("/") else linked).resolve()
                          if path.is_relative_to(binary.parents[3]):
                              libraries.append(str(path))
              libraries.extend([str(binary.parent), str(binary.parent.parent), rust_lib])
              env["DYLD_FALLBACK_LIBRARY_PATH"] = os.pathsep.join(libraries + [env.get(
                  "DYLD_FALLBACK_LIBRARY_PATH", str(Path.home() / "lib") + ":/usr/local/lib:/usr/lib")])
              for test in tests:
                  command = [str(binary), test, "--exact"]
                  listed = bounded(command + ["--list"], package_dir, env)
                  assert test + ": test" in listed.splitlines(), listed
                  assert "1 test, 0 benchmarks" in listed.splitlines(), listed
                  output = bounded(command + ["--nocapture", "--test-threads=1"], package_dir, env)
                  assert "running 1 test" in output.splitlines(), output
                  assert "test result: ok. 1 passed; 0 failed; 0 ignored;" in output, output
          PYTHON
      - uses: actions/setup-node@v7
        if: needs.release-fast-path.outputs.fast_path != 'true' && github.event_name == 'merge_group' && runner.os == 'Windows'
        with:
          node-version: 24
      - name: Headless workspace setup (Windows runtime)
        if: needs.release-fast-path.outputs.fast_path != 'true' && github.event_name == 'merge_group' && runner.os == 'Windows'
        timeout-minutes: 20
        shell: bash
        env:
          INTENTD_ASSERT_BOUND_CALLER: "1"
          INTENTD_SETUP_EVIDENCE_DIR: ${{ github.workspace }}/setup-headless-evidence
          INTENTD_SETUP_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
        run: |
          rustup run "$INTENTD_SETUP_TOOLCHAIN" cargo test --locked -p intent-pty --lib --target ${{ matrix.target }} conpty_startup::tests -- --nocapture
          rustup run "$INTENTD_SETUP_TOOLCHAIN" cargo test -p intentd --test e2e_wss_setup_headless --target ${{ matrix.target }} -- --nocapture
      - uses: actions/upload-artifact@v7
        if: always() && needs.release-fast-path.outputs.fast_path != 'true' && github.event_name == 'merge_group' && runner.os == 'Windows'
        with:
          name: setup-headless-windows
          path: setup-headless-evidence
          if-no-files-found: error
      # Execute the Windows Job Object fixtures on the native runner. They use
      # this test executable as the child, so no Node/npm/account setup is needed.
      - name: Codex diagnostic process ownership (Windows runtime)
        if: needs.release-fast-path.outputs.fast_path != 'true' && github.event_name == 'merge_group' && runner.os == 'Windows'
        shell: bash
        env:
          INTENTD_ASSERT_BOUND_CALLER: "1"
          INTENTD_DIAGNOSTIC_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
        run: |
          set -euo pipefail
          filter='codex_diagnostics::process::platform::tests::'
          listed=$(rustup run "$INTENTD_DIAGNOSTIC_TOOLCHAIN" cargo test -p intent-services --lib --target ${{ matrix.target }} "$filter" -- --list)
          printf '%s\n' "$listed"
          if ! grep -F "${filter}shared_guard_removes_home_only_after_descendants_stop: test" <<< "$listed" > /dev/null; then
            echo '::error::Windows diagnostic ownership regression was not selected.'
            exit 1
          fi
          rustup run "$INTENTD_DIAGNOSTIC_TOOLCHAIN" cargo test -p intent-services --lib --target ${{ matrix.target }} "$filter" -- --nocapture
      - name: Build (release)
        if: needs.release-fast-path.outputs.fast_path != 'true' && github.event_name == 'push'
        run: cargo build --workspace --release --target ${{ matrix.target }}
      - name: Warm merge queue check cache
        if: needs.release-fast-path.outputs.fast_path != 'true' && github.event_name == 'push'
        run: cargo check --workspace --target ${{ matrix.target }}

  # Services test code generation must not share the native check/Clippy
  # budget: a cold macOS queue run reached discovery compilation with only
  # 23 minutes left and hit the 60-minute job limit before any test ran.
  # Keep all diagnostics and CoW assertions mandatory, with their own bounded
  # job and independent target directory rather than extending timeouts.
  macos-services-runtime:
    name: macOS Services runtime
    needs: [release-fast-path, route]
    if: ${{ !cancelled() && github.event_name == 'merge_group' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: ${{ fromJSON(needs.route.outputs.macos_labels || '["depot-macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/checkout@v7
      - name: Configure Depot managed compiler cache
        shell: bash
        env:
          DEPOT_SCCACHE_TOKEN: ${{ secrets.DEPOT_TOKEN }}
          INTENT_SCCACHE_ENDPOINT: ${{ vars.INTENT_SCCACHE_ENDPOINT }}
          INTENT_SCCACHE_TOKEN: ${{ secrets.INTENT_SCCACHE_TOKEN }}
          INTENT_SCCACHE_MODE: ${{ vars.INTENT_SCCACHE_MODE }}
        run: python3 scripts/setup-depot-sccache.py
      - name: Point CARGO_TARGET_DIR outside the work dir (self-hosted)
        if: contains(matrix.os, 'self-hosted')
        shell: bash
        run: echo "CARGO_TARGET_DIR=$HOME/ci-target/intentd/macos-services-runtime-${{ matrix.target }}" >> "$GITHUB_ENV"
      - name: Ensure macOS CI disk headroom
        if: contains(matrix.os, 'self-hosted')
        run: python3 -I -B scripts/macos-ci-cleanup.py --apply
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-11 (PR 185, --force-non-host)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}
      # macOS supports read-only metadata and rejects process probes before
      # auth/npm setup. Require both a service rejection case and a real doctor
      # case in discovery so a cfg/filter change cannot silently run zero tests.
      - name: Codex focused diagnostics (macOS runtime)
        if: needs.release-fast-path.outputs.fast_path != 'true' && github.event_name == 'merge_group' && runner.os == 'macOS'
        shell: bash
        env:
          INTENTD_ASSERT_BOUND_CALLER: "1"
          INTENTD_DIAGNOSTIC_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
        run: |
          set -euo pipefail
          filter='codex_diagnostics::'
          listed=$(rustup run "$INTENTD_DIAGNOSTIC_TOOLCHAIN" cargo test -p intent-services --lib --target ${{ matrix.target }} "$filter" -- --list)
          printf '%s\n' "$listed"
          if ! grep -F 'macos_rejects_process_start_before_retaining_home_or_dependency: test' <<< "$listed" > /dev/null; then
            echo '::error::macOS diagnostic rejection regression was not selected.'
            exit 1
          fi
          rustup run "$INTENTD_DIAGNOSTIC_TOOLCHAIN" cargo test -p intent-services --lib --target ${{ matrix.target }} "$filter" -- --nocapture
          listed=$(rustup run "$INTENTD_DIAGNOSTIC_TOOLCHAIN" cargo test -p intentd --test e2e_doctor_codex --target ${{ matrix.target }} -- --list)
          printf '%s\n' "$listed"
          if ! grep -F 'macos_catalog_rejection_precedes_npm_authentication_and_probe_state: test' <<< "$listed" > /dev/null; then
            echo '::error::macOS doctor command regression was not selected.'
            exit 1
          fi
          rustup run "$INTENTD_DIAGNOSTIC_TOOLCHAIN" cargo test -p intentd --test e2e_doctor_codex --target ${{ matrix.target }} -- --nocapture
      # These retained workspace fixtures used to skip on Linux before reaching
      # their unbound caller. Require native CoW operations and original oracles.
      - name: Retained workspace CoW fixtures (macOS runtime)
        if: needs.release-fast-path.outputs.fast_path != 'true' && github.event_name == 'merge_group' && runner.os == 'macOS'
        timeout-minutes: 20
        shell: bash
        env:
          INTENTD_ASSERT_BOUND_CALLER: "1"
          INTENTD_COW_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
          INTENTD_TEST_REQUIRE_COW: "1"
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          # Keep fixtures armed; the capability probe removes the guard only
          # in its exact child. Retain scratch cleanup assertions for every case.
          unset INTENTD_TEST_KEEP_TMP
          tests=(
            tests::worktree_provisioning::create_provisions_cow_checkout_when_isolation_enabled
            tests::worktree_provisioning::duplicate_provisions_cow_checkout_when_isolation_enabled
            tests::worktree_provisioning::create_cleans_up_empty_ws_dir_when_cow_provisioning_fails
            tests::worktree_provisioning::duplicate_cleans_up_empty_ws_dir_when_cow_provisioning_fails
            tests::clone_orchestration::progress_id_cow_create_streams_cow_copy_milestone
            capability::tests::unbound_caller_is_forbidden_on_every_gate
          )
          cargo_test=(rustup run "$INTENTD_COW_TOOLCHAIN" cargo test --locked -p intent-services --lib --target ${{ matrix.target }})
          status=0
          for test in "${tests[@]}"; do
            listed=$("${cargo_test[@]}" "$test" -- --exact --list)
            printf '%s\n' "$listed"
            grep -Fx "$test: test" <<< "$listed" > /dev/null
            grep -Fx '1 test, 0 benchmarks' <<< "$listed" > /dev/null
            log="$RUNNER_TEMP/cow-${test##*::}.log"
            scratch=$(mktemp -d "$RUNNER_TEMP/cow-${test##*::}.XXXXXX")
            if ! TMPDIR="$scratch" "${cargo_test[@]}" "$test" -- --exact --nocapture --test-threads=1 2>&1 | tee "$log"; then
              status=1
            fi
            if rmdir "$scratch"; then
              echo "CoW fixture scratch cleaned: $test"
            else
              echo "::error::Fixture scratch remains at $scratch"
              status=1
            fi
            if [[ "$test" == tests::* ]]; then
              grep -Fx 'CoW fixture clone and independent contents verified' "$log" > /dev/null || status=1
              grep -Fx 'CoW fixture proof scratch cleaned' "$log" > /dev/null || status=1
              grep -Fx "CoW fixture assertions passed: ${test##*::}" "$log" > /dev/null || status=1
            fi
          done
          exit "$status"

  coverage-e2e:
    # merge_group-ONLY (see the `merge_group` trigger comment): the
    # instrumented suite runs once, against the queue's merged tree, and is
    # job-level skipped on every pull_request and push run — a skipped job
    # still reports its required context, and the gate is event-aware about
    # the skip (required outright on merge_group, accepted elsewhere). The
    # event check makes the intent visible; the route.result guard preserves
    # the pre-existing behavior that a route failure skips this job (and
    # would skip it on fork PRs anyway, where route itself is skipped).
    # Nothing here may reference github.event.pull_request — that
    # context does not exist on merge_group. release-fast-path is no longer a
    # dependency: it is pull_request-only, so its output is empty on
    # merge_group and must not be required; the fast-path skip it used to
    # provide is subsumed by the pull_request skip. Merge groups come from
    # the repo's own ruleset, so no same-repo fork guard applies.
    needs: route
    if: ${{ !cancelled() && github.event_name == 'merge_group' && needs.route.result == 'success' }}
    runs-on: ${{ fromJSON(needs.route.outputs.linux_labels) }}
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      # 16 matches the 16-core depot-ubuntu-24.04-16 runner this merge-queue
      # job runs on. Higher counts (32 and 64 on a 64-core host) made the
      # latency-bound stress tests — e.g. e2e_wss_pool_contention_stress's
      # <2s read assert — blow their wall-clock bounds under llvm-cov load on
      # both nextest tries.
      NEXTEST_TEST_THREADS: 16
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/checkout@v7
      - name: Configure Depot managed compiler cache
        shell: bash
        env:
          DEPOT_SCCACHE_TOKEN: ${{ secrets.DEPOT_TOKEN }}
          INTENT_SCCACHE_ENDPOINT: ${{ vars.INTENT_SCCACHE_ENDPOINT }}
          INTENT_SCCACHE_TOKEN: ${{ secrets.INTENT_SCCACHE_TOKEN }}
          INTENT_SCCACHE_MODE: ${{ vars.INTENT_SCCACHE_MODE }}
        run: python3 scripts/setup-depot-sccache.py
      # See the `check` job's comment on the OpenSSL headers.
      - name: Install libssl-dev if missing
        run: |
          if ! pkg-config --exists openssl; then
            for i in 1 2 3; do
              if sudo -n apt-get -o DPkg::Lock::Timeout=300 update -qq; then break; fi
              if [ "$i" -eq 3 ]; then exit 1; fi
              sleep $((i * 15))
            done
            sudo -n apt-get -o DPkg::Lock::Timeout=300 install -y -qq libssl-dev
          fi
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-11 (PR 185, --force-non-host)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: llvm-tools-preview
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - name: Prepare native startup evidence
        id: native-evidence
        shell: bash
        run: |
          # Never reuse slots from a previous job on a persistent runner.
          umask 077
          evidence_dir=$(mktemp -d "$RUNNER_TEMP/native-review-startup-failures.XXXXXX")
          evidence_dir=$(realpath "$evidence_dir")
          printf 'directory=%s\n' "$evidence_dir" >> "$GITHUB_OUTPUT"
      - name: Run e2e coverage
        # Arm the bound-caller seam for the test processes themselves, not
        # only the daemons they spawn: a direct-call test that evaluates a
        # capability gate without a bound `Caller` aborts (nextest runs each
        # test in its own process, so only that test goes red) instead of
        # degrading into the `Forbidden` fallback and passing on a stale
        # subject — #2009's auto-commit tests did exactly that under #1877's
        # gate (runs 106012504874 / 106012511900; fixed by 638cc64bb). See
        # `intent_services::capability::ASSERT_BOUND_CALLER_ENV`.
        env:
          INTENTD_ASSERT_BOUND_CALLER: "1"
          NATIVE_REVIEW_FAILURE_DIR: ${{ steps.native-evidence.outputs.directory }}
        run: |
          cd ${{ github.workspace }}
          GENERATE_LCOV=1 ./scripts/coverage-e2e.sh 40
      - name: Validate native startup evidence
        id: native-evidence-check
        if: ${{ failure() && steps.native-evidence.outputs.directory != '' }}
        env:
          NATIVE_REVIEW_FAILURE_DIR: ${{ steps.native-evidence.outputs.directory }}
        run: python3 -I -B scripts/native-review-artifact.py "$NATIVE_REVIEW_FAILURE_DIR" >> "$GITHUB_OUTPUT"
      # Only the sanitized owned-fixture exports: 16 fixed slots, 128 KiB each.
      # Run before coverage reporting and independently of lcov.info existence.
      - name: Upload native startup evidence
        if: ${{ failure() && steps.native-evidence-check.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: native-review-startup-failures
          path: |
            ${{ steps.native-evidence.outputs.directory }}/startup-failure-0[0-9].json
            ${{ steps.native-evidence.outputs.directory }}/startup-failure-1[0-5].json
          if-no-files-found: ignore
          retention-days: 3
      - name: Generate coverage summary
        if: always()
        run: |
          cd ${{ github.workspace }}
          echo "## E2E Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          # The script tees its summary to coverage-summary.txt; re-running
          # the report (~30s) is only a fallback for a run that died before
          # reporting (intent-hq/monorepo#4260).
          if [[ -s coverage-summary.txt ]]; then
            cat coverage-summary.txt >> $GITHUB_STEP_SUMMARY
          else
            (cargo llvm-cov report --summary-only 2>/dev/null || echo "Coverage data not available") >> $GITHUB_STEP_SUMMARY
          fi
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
      # Non-fatal + short retention: the lcov artifact is a debugging aid
      # only, and an org artifact-quota outage must not fail the required
      # check when all tests passed (monorepo#1163).
      - name: Upload coverage artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-coverage-lcov
          path: lcov.info
          if-no-files-found: warn
          retention-days: 3
  coverage-all:
    # merge_group-ONLY — same gating and rationale as coverage-e2e (see its
    # comment and the `merge_group` trigger comment): job-level skipped on
    # every pull_request and push run, required outright by the gate on
    # merge_group. No github.event.pull_request reference (absent on
    # merge_group) and no release-fast-path dependency (pull_request-only,
    # empty output on merge_group).
    needs: route
    if: ${{ !cancelled() && github.event_name == 'merge_group' && needs.route.result == 'success' }}
    runs-on: ${{ fromJSON(needs.route.outputs.linux_labels) }}
    # Include LLVM report generation after the full suite on shared runners.
    timeout-minutes: 45
    env:
      # Merge each binary's executions into eight locked raw profiles instead
      # of retaining a multi-megabyte profile for every nextest process.
      LLVM_PROFILE_FILE_NAME: "intent-%8m.profraw"
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      # 16 matches the 16-core depot-ubuntu-24.04-16 runner this merge-queue
      # job runs on. Higher counts (32 and 64 on a 64-core host) thrashed
      # SQLite/WAL and wall-clock-timeout tests hard enough that even the
      # nextest retry failed: concurrent_writes_no_sqlite_busy hit "database
      # is locked" on both tries, bridge/auto-commit timing tests timed out.
      NEXTEST_TEST_THREADS: 16
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/checkout@v7
      - name: Configure Depot managed compiler cache
        shell: bash
        env:
          DEPOT_SCCACHE_TOKEN: ${{ secrets.DEPOT_TOKEN }}
          INTENT_SCCACHE_ENDPOINT: ${{ vars.INTENT_SCCACHE_ENDPOINT }}
          INTENT_SCCACHE_TOKEN: ${{ secrets.INTENT_SCCACHE_TOKEN }}
          INTENT_SCCACHE_MODE: ${{ vars.INTENT_SCCACHE_MODE }}
        run: python3 scripts/setup-depot-sccache.py
      # See the `check` job's comment on the OpenSSL headers.
      - name: Install libssl-dev if missing
        run: |
          if ! pkg-config --exists openssl; then
            for i in 1 2 3; do
              if sudo -n apt-get -o DPkg::Lock::Timeout=300 update -qq; then break; fi
              if [ "$i" -eq 3 ]; then exit 1; fi
              sleep $((i * 15))
            done
            sudo -n apt-get -o DPkg::Lock::Timeout=300 install -y -qq libssl-dev
          fi
      # Raise the per-user inotify instance ceiling. The instrumented full
      # suite starts many real notify watchers in parallel (file, .git
      # metadata, skills, specialists), so the kernel default of 128
      # instances can exhaust mid-run — watcher starts in unrelated tests
      # then fail with EMFILE "Too many open files" (intentd PR #882).
      # Needs passwordless sudo: this merge-queue-only job always runs on
      # Depot (see the route job's `heavy` step), never on intent-cache.
      - name: Raise inotify instance limit
        run: sudo -n sysctl -q -w fs.inotify.max_user_instances=4096
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-11 (PR 185, --force-non-host)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: llvm-tools-preview
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Verify callback fixture provisioner offline
        run: python3 -I -B -S scripts/test-prepare-acp-callback-fixture.py
      - name: Build the pinned callback fixture from verified source
        run: |
          set -euo pipefail
          # The provisioner checks Node and uses only isolated npm 11.19.0.
          fixture=$(python3 -I -B -S scripts/prepare-acp-callback-fixture.py \
            --cache-dir "$RUNNER_TEMP/acp-callback-fixture" --build-from-source)
          echo "INTENT_ACP_CALLBACK_ADAPTER_FIXTURE=$fixture" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - name: Acquire the shared transfer selection contract
        uses: ./.github/actions/transfer-selection-fixtures
      - name: Verify bounded coverage profile pooling
        run: python3 -I -B scripts/test-coverage-profile-pool.py
      - name: Run combined coverage
        timeout-minutes: 43
        # Armed bound-caller seam — see coverage-e2e's run step.
        env:
          INTENTD_ASSERT_BOUND_CALLER: "1"
        run: |
          cd ${{ github.workspace }}
          GENERATE_LCOV=1 ./scripts/coverage-all.sh 80
      - name: Generate coverage summary
        if: always()
        run: |
          cd ${{ github.workspace }}
          echo "## Combined Coverage Report (all tests)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          # Same reuse-or-fallback as coverage-e2e's summary step.
          if [[ -s coverage-summary.txt ]]; then
            cat coverage-summary.txt >> $GITHUB_STEP_SUMMARY
          else
            (cargo llvm-cov report --summary-only 2>/dev/null || echo "Coverage data not available") >> $GITHUB_STEP_SUMMARY
          fi
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
      # Non-fatal + short retention — same rationale as coverage-e2e's
      # upload step (monorepo#1163).
      - name: Upload coverage artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: combined-coverage-lcov
          path: lcov.info
          if-no-files-found: warn
          retention-days: 3
  # Focused coverage of the diff's changed tests, required on same-repo PRs
  # and in the queue (against the merged tree), retaining the callback fixture
  # composition proof and its evidence alongside the full queue-only
  # instrumented suites. A selection can legitimately be empty (no Rust
  # changes), so a green run does not by itself mean tests executed.
  coverage-changed:
    # Skipped on release-metadata PRs for the same reason as `check`.
    needs: [route, release-fast-path]
    if: ${{ !cancelled() && needs.route.result == 'success' && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && needs.release-fast-path.outputs.fast_path != 'true')) }}
    runs-on: ${{ fromJSON(needs.route.outputs.linux_labels) }}
    # A multi-crate selection compiles and runs each scope sequentially.
    # Shared-runner coverage can exceed 30 minutes while still making progress.
    timeout-minutes: 60
    env:
      # Share the full-coverage pool: nextest launches one process per test.
      # Bound retained raw profiles per binary without dropping execution counts.
      LLVM_PROFILE_FILE_NAME: "intent-%8m.profraw"
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      # Same value and rationale as coverage-e2e (matches the 16-core
      # burst runner).
      NEXTEST_TEST_THREADS: 16
      CALLBACK_FIXTURE_TESTS: |
        callback_registration::tests::actual_adapter_sdk_and_rust_mcp_deliver_distinct_callback_preserving_old_result
        callback_registration::tests::actual_adapter_replacement_rejects_old_query_and_disabled_never_registers
        agent_manager::repository_origin::callback_delivery::tests::live_context::confirmed_context_actual_created_3_2_reaches_original_guidance_boundary
        agent_manager::repository_origin::callback_delivery::tests::live_context::confirmed_context_saved_legacy_and_disabled_outbound_messages_remain_ordinary
        agent_manager::repository_origin::callback_delivery::tests::live_context::confirmed_context_load_and_failed_load_new_keep_original_producers_and_capture
        agent_manager::repository_origin::callback_delivery::tests::live_context::confirmed_context_successful_zero_pending_absent_and_failed_never_conflate
      QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
      QUEUE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure Depot managed compiler cache
        shell: bash
        env:
          DEPOT_SCCACHE_TOKEN: ${{ secrets.DEPOT_TOKEN }}
          INTENT_SCCACHE_ENDPOINT: ${{ vars.INTENT_SCCACHE_ENDPOINT }}
          INTENT_SCCACHE_TOKEN: ${{ secrets.INTENT_SCCACHE_TOKEN }}
          INTENT_SCCACHE_MODE: ${{ vars.INTENT_SCCACHE_MODE }}
        run: python3 scripts/setup-depot-sccache.py
      # PRs check out GitHub's synthetic merge commit: its second parent is
      # the PR head and its first parent the base tip it merged against —
      # never pull_request.base.sha, which is not guaranteed to be that
      # parent (intent-hq/intent#5414). The checkout is identified by the PR
      # head SHA, not by "HEAD is a merge", because a branch tip can itself be
      # a merge commit. If the checkout is ever the PR head itself, fall back
      # to its merge-base with the base branch. Queue entries bind to the
      # event's base/head pair.
      - name: Resolve changed-test base from the event
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if ! [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error title=coverage-changed: PR head unknown::PR_HEAD_SHA '$PR_HEAD_SHA' is not a commit SHA"
              exit 1
            fi
            head=$(git rev-parse HEAD)
            if [ "$head" = "$PR_HEAD_SHA" ]; then
              if [ -z "$PR_BASE_REF" ]; then
                echo "::error title=coverage-changed: PR base unknown::PR_BASE_REF is empty; cannot resolve the merge-base for checkout $head"
                exit 1
              fi
              git fetch --no-tags origin "+refs/heads/$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF"
              base=$(git merge-base "refs/remotes/origin/$PR_BASE_REF" HEAD)
              echo "base: merge-base with origin/$PR_BASE_REF (checkout is the PR head) = $base"
            elif [ "$(git rev-parse -q --verify 'HEAD^2' || true)" = "$PR_HEAD_SHA" ]; then
              base=$(git rev-parse 'HEAD^1')
              echo "base: HEAD^1 (PR merge-commit base parent) = $base"
            else
              echo "::error title=coverage-changed: unexpected checkout::HEAD $head is neither PR head $PR_HEAD_SHA nor a merge of it"
              exit 1
            fi
            echo "BASE_SHA=$base" >> "$GITHUB_ENV"
            exit 0
          fi
          [[ "$QUEUE_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$QUEUE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$QUEUE_HEAD_SHA"
          git fetch --no-tags --depth=1 origin "$QUEUE_BASE_SHA"
          echo "BASE_SHA=$QUEUE_BASE_SHA" >> "$GITHUB_ENV"
      - name: Select changed tests (dry run)
        id: select
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/coverage-changed-plan.txt"
          status=0
          ./scripts/changed-tests.sh --instrumented --dry-run --base "$BASE_SHA" --plan-json "$RUNNER_TEMP/coverage-changed-plan.json" | tee "$plan" || status=$?
          if [ "$status" -eq 4 ]; then
            echo "::error title=coverage-changed: base unresolvable::changed-tests.sh could not connect BASE $BASE_SHA to HEAD $(git rev-parse HEAD) — a checkout/fetch problem in this job, not a test failure (intent-hq/intent#5414)"
          fi
          [ "$status" -eq 0 ] || exit "$status"
          fixture_changed=false
          fixture_status=0
          git diff --quiet "$BASE_SHA" HEAD -- \
            scripts/prepare-acp-callback-fixture.py \
            scripts/test-prepare-acp-callback-fixture.py \
            scripts/changed-tests.sh \
            scripts/callback-build-scope.py \
            scripts/test-callback-build-scope.py \
            crates/intent-acp/tests/fixtures/claude-callback-adapter.json \
            crates/intent-acp/tests/fixtures/claude-callback-canonical.patch \
            crates/intent-acp/tests/fixtures/claude-callback-files.json \
            .github/workflows/ci.yml || fixture_status=$?
          if [ "$fixture_status" -eq 1 ]; then
            fixture_changed=true
            filter=$(printf '%s\n' "$CALLBACK_FIXTURE_TESTS" | sed '/^$/d;s/^/test(=/;s/$/)/' | paste -sd '|' -)
            printf 'INTENTD_TEST_TIMEOUT_MULTIPLIER=3 cargo llvm-cov --no-report nextest -p intent-acp -p intent-services --lib -E "%s" --retries 0\n' "$filter" | tee -a "$plan"
          elif [ "$fixture_status" -ne 0 ]; then
            exit "$fixture_status"
          fi
          echo "callback_fixture_changed=$fixture_changed" >> "$GITHUB_OUTPUT"
          if grep -q 'cargo llvm-cov' "$plan"; then
            echo "has_selection=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_selection=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "## coverage-changed selection"
            echo ""
            echo "\`\`\`"
            cat "$plan"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
      # See the `check` job's comment on the OpenSSL headers.
      - name: Install libssl-dev if missing
        if: steps.select.outputs.has_selection == 'true'
        run: |
          if ! pkg-config --exists openssl; then
            for i in 1 2 3; do
              if sudo -n apt-get -o DPkg::Lock::Timeout=300 update -qq; then break; fi
              if [ "$i" -eq 3 ]; then exit 1; fi
              sleep $((i * 15))
            done
            sudo -n apt-get -o DPkg::Lock::Timeout=300 install -y -qq libssl-dev
          fi
      - name: Resolve pinned Rust channel
        id: toolchain
        if: steps.select.outputs.has_selection == 'true'
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-11 (PR 185, --force-non-host)
        if: steps.select.outputs.has_selection == 'true'
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: llvm-tools-preview
      - uses: actions/setup-node@v7
        if: steps.select.outputs.has_selection == 'true'
        with:
          node-version: 24.21.0
      - name: Verify callback fixture provisioner offline
        if: steps.select.outputs.has_selection == 'true'
        run: python3 -I -B -S scripts/test-prepare-acp-callback-fixture.py
      - name: Build the pinned callback fixture from verified source
        if: steps.select.outputs.has_selection == 'true'
        run: |
          set -euo pipefail
          # The provisioner checks Node and uses only isolated npm 11.19.0.
          fixture=$(python3 -I -B -S scripts/prepare-acp-callback-fixture.py \
            --cache-dir "$RUNNER_TEMP/acp-callback-fixture" --build-from-source)
          echo "INTENT_ACP_CALLBACK_ADAPTER_FIXTURE=$fixture" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@cargo-llvm-cov
        if: steps.select.outputs.has_selection == 'true'
      - uses: taiki-e/install-action@nextest
        if: steps.select.outputs.has_selection == 'true'
      - name: Acquire the shared transfer selection contract
        if: steps.select.outputs.has_selection == 'true'
        uses: ./.github/actions/transfer-selection-fixtures
      - name: Verify bounded coverage profile pooling
        if: steps.select.outputs.has_selection == 'true'
        run: python3 -I -B scripts/test-coverage-profile-pool.py
      - name: Initialize coverage storage evidence
        if: steps.select.outputs.has_selection == 'true'
        run: |
          python3 -I -B scripts/coverage-storage.py init --output "$RUNNER_TEMP/coverage-storage"
          echo "COVERAGE_STORAGE_DIR=$RUNNER_TEMP/coverage-storage" >> "$GITHUB_ENV"
      - name: Run changed tests under llvm-cov
        timeout-minutes: 50
        if: steps.select.outputs.has_selection == 'true'
        # Armed bound-caller seam — see coverage-e2e's run step. The
        # script also enforces the same policy at its test launch boundary.
        # test-ci-test-policy.py checks parity with this explicit CI setting.
        env:
          INTENTD_ASSERT_BOUND_CALLER: "1"
        run: ./scripts/changed-tests.sh --instrumented --base "$BASE_SHA"
      - name: Run callback fixture composition under llvm-cov
        timeout-minutes: 8
        if: steps.select.outputs.callback_fixture_changed == 'true'
        env:
          INTENTD_ASSERT_BOUND_CALLER: "1"
          INTENTD_TEST_TIMEOUT_MULTIPLIER: "3"
        run: |
          set -euo pipefail
          if [[ -n "${COVERAGE_STORAGE_DIR:-}" ]]; then
            python3 -I -B scripts/coverage-storage.py snapshot --output "$COVERAGE_STORAGE_DIR" --stage callback --event start
            trap 'result=$?; python3 -I -B scripts/coverage-storage.py snapshot --output "$COVERAGE_STORAGE_DIR" --stage callback --event exit --exit-code "$result"; exit "$result"' EXIT
          fi
          filter=$(printf '%s\n' "$CALLBACK_FIXTURE_TESTS" | sed '/^$/d;s/^/test(=/;s/$/)/' | paste -sd '|' -)
          # Reuse the compatible changed-plan scope instead of narrowing the
          # Cargo feature graph back to just the callback packages. Validate
          # structured argv before reading it; process substitution would hide
          # a failed producer. Both commands below use this exact array.
          python3 -I -B -S scripts/callback-build-scope.py \
            "$RUNNER_TEMP/coverage-changed-plan.json" "$(git rev-parse HEAD)" \
            > "$RUNNER_TEMP/callback-build-args.txt"
          mapfile -t callback_scope < "$RUNNER_TEMP/callback-build-args.txt"
          # show-env defaults to Cargo's target dir, but llvm-cov nextest adds
          # llvm-cov-target. Share the latter explicitly so discovery builds
          # exactly the instrumented binaries execution will reuse.
          if [ -z "${CARGO_LLVM_COV_TARGET_DIR:-}" ]; then
            target_dir=$(cargo metadata --no-deps --format-version 1 | python3 -I -B -S -c 'import json, sys; print(json.load(sys.stdin)["target_directory"])')
            export CARGO_LLVM_COV_TARGET_DIR="$target_dir/llvm-cov-target"
          fi
          (
            # Keep coverage flags/wrappers out of the later llvm-cov invocation.
            # show-env exports Cargo metadata's target dir even with a coverage override.
            coverage_env=$(CARGO_TARGET_DIR="$CARGO_LLVM_COV_TARGET_DIR" cargo llvm-cov show-env --sh)
            eval "$coverage_env"
            cargo nextest list "${callback_scope[@]}" \
              --target-dir "$CARGO_LLVM_COV_TARGET_DIR" \
              -E "$filter" --message-format json > "$RUNNER_TEMP/callback-fixture-tests.json"
          )
          python3 -I -B -S - "$RUNNER_TEMP/callback-fixture-tests.json" <<'PYTHON'
          import json, os, sys
          expected = os.environ["CALLBACK_FIXTURE_TESTS"].split()
          suites = json.load(open(sys.argv[1]))["rust-suites"]
          selected = [name for suite in suites.values() for name, case in suite["testcases"].items()
                      if case["filter-match"]["status"] == "matches"]
          assert len(expected) == len(selected) == 6 and set(selected) == set(expected), selected
          PYTHON
          cargo llvm-cov --no-report nextest "${callback_scope[@]}" \
            -E "$filter" --no-fail-fast --retries 0 --show-progress none \
            --status-level pass --final-status-level fail
      - name: Upload changed coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: changed-coverage-evidence
          path: |
            ${{ runner.temp }}/coverage-storage
            ${{ runner.temp }}/coverage-changed-plan.txt
            ${{ runner.temp }}/coverage-changed-plan.json
            ${{ runner.temp }}/callback-fixture-tests.json
          if-no-files-found: warn
          retention-days: 7
  pr-title:
    needs: [route]
    runs-on: ${{ fromJSON(needs.route.outputs.runners || '{}')['depot-ubuntu-24.04'] || fromJSON('["depot-ubuntu-24.04"]') }}
    # Same-repo PRs only (fork PRs get no CI — see the `pull_request`
    # trigger comment).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Intermittent TLS failures reaching api.github.com can kill this action
      # sub-second, before it validates anything — a spurious red that reads
      # like a bad title (intent-hq/monorepo#2098). Tolerate a first-attempt
      # failure and retry once; the retry is authoritative, so a genuinely
      # bad title still fails the job.
      - uses: amannn/action-semantic-pull-request@v6
        id: title_check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf
      - name: Wait before retrying title validation
        if: steps.title_check.outcome == 'failure'
        run: sleep 15
      - uses: amannn/action-semantic-pull-request@v6
        if: steps.title_check.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf

  # Conflict-marker guard: fails the PR if any changed file contains committed
  # git conflict markers (the #588 incident: release-plz pushed a branch with
  # '<' x7 / '>' x7 marker lines in CHANGELOG.md, Cargo.lock and Cargo.toml,
  # and no check caught it). Matches the exact line forms git emits — seven
  # '<' or '>' followed by a space and a label — and counts a bare
  # seven-'=' line only when the same file also has both of the other two,
  # so Markdown setext headings / code snippets don't false-positive.
  conflict-markers:
    needs: [route]
    runs-on: ${{ fromJSON(needs.route.outputs.runners || '{}')['depot-ubuntu-24.04'] || fromJSON('["depot-ubuntu-24.04"]') }}
    # Same-repo PRs only (fork PRs get no CI — see the `pull_request`
    # trigger comment).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fetch PR base commit
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
      - name: Scan changed files for conflict markers
        run: |
          set -euo pipefail
          # NUL-delimited via a temp file: robust to quoted/non-ASCII pathnames,
          # and a failing `git diff` fails the step instead of being swallowed
          # by process substitution.
          git diff -z --name-only --diff-filter=ACMR ${{ github.event.pull_request.base.sha }} HEAD > "$RUNNER_TEMP/changed-files.z"
          mapfile -d '' -t files < "$RUNNER_TEMP/changed-files.z"
          fail=0
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            hits=$(grep -nIE '^(<{7}|>{7}) ' "$f" || true)
            [ -n "$hits" ] || continue
            if grep -qIE '^<{7} ' "$f" && grep -qIE '^>{7} ' "$f"; then
              eq=$(grep -nE '^={7}$' "$f" || true)
              [ -n "$eq" ] && hits="$hits"$'\n'"$eq"
            fi
            while IFS= read -r hit; do
              echo "::error file=$f,line=${hit%%:*}::committed git conflict marker"
              printf '%s:%s\n' "$f" "$hit"
            done < <(printf '%s\n' "$hits" | sort -t: -k1,1n)
            fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "Conflict markers detected in changed files — resolve them before merging."
            exit 1
          fi
          echo "No conflict markers in ${#files[@]} changed file(s)."

  # Monorepo consumer checks: runs intent-hq/intent's `make consumer-checks`
  # list (method catalog, event catalog, protocol→FE field parity, docs-check,
  # check-makefile-targets) with this PR head in place of packages/intentd, so
  # a change that would break a monorepo consumer check is red here before it
  # merges instead of turning monorepo `main` red or stalling the rolling
  # `auto/submodule-bump` PR after the fact (intent-hq/intent#4558, #5479,
  # #5489, #5497). Fix order when red: the checks compare this head against
  # monorepo `main` and every checker tolerates docs that lead the pin, so land
  # the monorepo docs PR first (the job summary names the file to update), then
  # re-run all jobs or push (re-running only failed jobs keeps the monorepo
  # commit `@main` resolved to on the first attempt); the later submodule bump
  # then lands green. Keep `@main`: a SHA pin also pins those docs, so a
  # docs-first fix needed a hand pin bump (#2476, #2481).
  # check-mcp-bindings is advisory here (its generated index must match the
  # pinned help text line for line, so the docs cannot lead an intentd change
  # to a binding's help line); it stays a hard error in the monorepo.
  # Runs on merge_group and same-repo pull_request (fork PRs get no CI — see
  # the `pull_request` trigger comment); skipped on push to main, where the
  # tree was already checked in the queue. PRs run static contracts; the
  # queued tree also runs the connected runtime proof.
  monorepo-consumer-checks:
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      actions: read
      contents: read
    secrets:
      CI_QUEUE_READ_TOKEN: ${{ secrets.CI_QUEUE_READ_TOKEN }}
      DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
      INTENT_SCCACHE_TOKEN: ${{ secrets.INTENT_SCCACHE_TOKEN }}
    uses: intent-hq/intent/.github/workflows/consumer-checks.yml@main
    with:
      component: intentd
      head-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  # Packaging assets guard: asserts the systemd user unit keeps the exact
  # semantics the daemon's `service install` used to generate (Type=simple,
  # serve/stop, Restart=on-failure, WantedBy=default.target), and that
  # scripts/build-deb.sh produces a well-formed .deb (stub binary here; the
  # real release tarballs are repacked by .github/workflows/release-sitter.yml).
  # Both the self-hosted Linux fleet and Depot fallback provide dpkg-deb / tar+xz.
  deb-packaging:
    needs: [route]
    runs-on: ${{ fromJSON(needs.route.outputs.runners || '{}')['depot-ubuntu-24.04'] || fromJSON('["depot-ubuntu-24.04"]') }}
    # Runs after queueing and on main pushes.
    if: github.event_name == 'merge_group' || github.event_name == 'push'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Assert systemd user unit content
        run: |
          unit=packaging/deb/intentd.service
          grep -qx 'Description=Intent backend daemon (intentd)' "$unit"
          grep -qx 'Type=simple' "$unit"
          grep -qx 'ExecStart=/usr/bin/intentd serve' "$unit"
          grep -qx 'ExecStop=/usr/bin/intentd stop' "$unit"
          grep -qx 'Restart=on-failure' "$unit"
          grep -qx 'WantedBy=default.target' "$unit"
      - name: Build and inspect a stub .deb
        run: |
          dir=intentd-x86_64-unknown-linux-musl
          mkdir -p "stub/$dir"
          printf '#!/bin/sh\necho stub\n' > "stub/$dir/intentd"
          chmod +x "stub/$dir/intentd"
          tar -C stub -cJf "$dir.tar.xz" "$dir"
          ./scripts/build-deb.sh "$dir.tar.xz" 0.0.0 amd64
          dpkg-deb --info intentd_0.0.0_amd64.deb
          dpkg-deb --contents intentd_0.0.0_amd64.deb
          test "$(dpkg-deb --field intentd_0.0.0_amd64.deb Package)" = intentd
          test "$(dpkg-deb --field intentd_0.0.0_amd64.deb Architecture)" = amd64
          dpkg-deb --contents intentd_0.0.0_amd64.deb | grep ' \./usr/bin/intentd$' >/dev/null
          dpkg-deb --contents intentd_0.0.0_amd64.deb | grep ' \./usr/lib/systemd/user/intentd\.service$' >/dev/null

  # Release-script regression tests: runs the stubbed-gh harnesses for
  # scripts/aggregate-channel-notes.sh (an idempotent re-promotion must
  # rebuild the aggregate from the notes-base marker, and a legacy body
  # without a marker is left untouched — never collapsed to one section)
  # and scripts/notify-fixed-issues.sh (a mention-only reference or an open
  # issue never earns a release comment; a closed issue with a delivered
  # linked fix PR does), scripts/ci-lld-retry.sh (intent-hq/intent#5256:
  # the rust-lld vanished-object signature earns exactly one retry; a
  # genuine lint fails fast), plus the
  # stubbed-cargo harness for scripts/changed-tests.sh (the changed-tests
  # selection the monorepo's `make test-changed` delegates to, and its
  # --instrumented llvm-cov form; intent-hq/intentd#1947), and the stub-root
  # harness for the repo-root Makefile (every gate target forwards to the
  # monorepo root make with its command-line variables; a standalone clone or
  # an unrelated parent Makefile gets the exit-2 refusal). Seconds-long like
  # the other utility jobs, it uses the shared self-hosted-first route.
  release-scripts:
    needs: [route]
    runs-on: ${{ fromJSON(needs.route.outputs.runners || '{}')['depot-ubuntu-24.04'] || fromJSON('["depot-ubuntu-24.04"]') }}
    # Runs on same-repo PRs (so a change to these scripts is proven before
    # it queues), after queueing and on main pushes. Fork PRs skip it with
    # the route job.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push'
    # About 2 min on Depot; on a busy shared self-hosted slot it ran 5 min
    # next to a PR's check and coverage-changed (run 39178412485) with every
    # step passing, so the budget leaves self-hosted headroom.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test release metadata and auto-cut guards (offline)
        run: |
          python3 -S scripts/test-release-pr-fast-path.py
          python3 -S scripts/test-auto-cut-alpha.py
      - name: Test release quota failure guidance (offline)
        run: python3 -S scripts/test-release-plz-release.py
      - name: Test aggregate-channel-notes.sh
        run: ./scripts/test-aggregate-channel-notes.sh
      - name: Test notify-fixed-issues.sh
        run: ./scripts/test-notify-fixed-issues.sh
      - name: Test prerelease cleanup workflow contracts
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 -B scripts/test-prerelease-cleanup-workflow.py
          python3 -B scripts/test-release-rust-cache.py
          python3 -I -B scripts/test-optional-intel-release.py
          python3 -B scripts/test-setup-depot-sccache.py
          python3 -I -B scripts/test-coverage-storage.py
          python3 -B scripts/test-depot-runners.py
          python3 -B scripts/test-configure-runner-routing.py
          python3 -I -B scripts/test-native-review-artifact.py
      - name: Test optional Intel cargo-dist publication
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("dist-workspace.toml", "rb"))["dist"]["cargo-dist-version"])')
          # Job-private, unmanaged install: keeps cargo-dist out of a home
          # directory that a persistent runner may share between jobs.
          dir="$RUNNER_TEMP/cargo-dist"
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${version}/cargo-dist-installer.sh" \
            | CARGO_DIST_UNMANAGED_INSTALL="$dir" sh
          PATH="$dir:$PATH" python3 -I -B scripts/test-optional-intel-dist.py
      - name: Test local and CI caller policy
        run: |
          python3 -S scripts/test-test-policy.py
          python3 -I -B scripts/test-ci-test-policy.py
          python3 -I -B -S scripts/test-callback-build-scope.py
          python3 -I -B scripts/test-subprocess-env-policy.py
      - name: Test obsolete merge-run policy and workflow integration (offline)
        run: |
          python3 -I -B scripts/test-retire-obsolete-merge-runs.py
          python3 -I -B scripts/test-retire-obsolete-merge-runs-caller.py
          python3 -I -B scripts/test-retire-obsolete-merge-runs-workflow.py
      - name: Test native CI routing and gate results
        run: python3 -I -B scripts/test-ci-native-routing.py
      - name: Install release cache regression compiler
        shell: bash
        run: |
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - name: Configure Depot managed compiler cache
        shell: bash
        env:
          DEPOT_SCCACHE_TOKEN: ${{ secrets.DEPOT_TOKEN }}
          INTENT_SCCACHE_ENDPOINT: ${{ vars.INTENT_SCCACHE_ENDPOINT }}
          INTENT_SCCACHE_TOKEN: ${{ secrets.INTENT_SCCACHE_TOKEN }}
          INTENT_SCCACHE_MODE: ${{ vars.INTENT_SCCACHE_MODE }}
        run: python3 scripts/setup-depot-sccache.py
      - name: Test WebDAV compiler reuse and source invalidation
        run: python3 -B scripts/test-release-cache-smoke.py
      - name: Test publish-channel-manifest.sh
        run: ./scripts/test-publish-channel-manifest.sh
      - name: Test mirror-release-assets.sh
        run: ./scripts/test-mirror-release-assets.sh
      - name: Test ci-lld-retry.sh
        run: ./scripts/test-ci-lld-retry.sh
      - name: Test Windows cleanup policy
        run: python3 -I -B scripts/test-windows-ci-cleanup.py
      - name: Test macOS cleanup safety and Cargo lock ownership
        run: |
          python3 -I -B scripts/test-macos-ci-cleanup.py
          python3 -I -B scripts/test-macos-ci-workflows.py
      - name: Test changed-tests.sh
        run: python3 -S scripts/test-changed-tests-stdin.py
      - name: Test the Makefile gate forwarder
        run: ./scripts/test-makefile-forwarder.sh
      - name: Test the Codex ACP rolling pin PR automation
        run: |
          python3 -S scripts/test-auto-pin-codex-acp.py
          python3 -S scripts/test-provider-cli-metadata.py
      - name: Test the release-plz no-op baseline
        run: python3 -S scripts/test-release-plz-noop.py
      - uses: taiki-e/install-action@v2
        with:
          tool: release-plz@0.3.162
      - name: Test Cargo packaging and historical baseline compatibility
        run: python3 -S scripts/test-release-plz-packaging.py
      - name: Test new-package release baseline and retirement
        run: python3 -S scripts/test-release-plz-baseline.py
      - name: Test daemon and sitter changelog separation
        run: python3 -S scripts/test-release-plz-changelog.py

  # install.ps1's Windows-only paths (intent-hq/intent#3229): the `check`
  # job's install_ps1_owner suite runs the installer's ownership check under
  # pwsh on Linux, but the Scheduled Task registration and the startup wait
  # that polls the task's log need Windows — scripts/install.ps1.Tests.ps1
  # (Pester) executes those marked blocks of the shipped script with the Task
  # Scheduler cmdlets mocked. Runs under both Windows PowerShell 5.1 (what
  # `powershell -c "irm … | iex"` in the README uses) and pwsh 7.
  # Tests need no Rust toolchain; both runner paths must provide Pester 5 and
  # the ScheduledTasks module. Minutes-long, so no cache. Every test must run
  # here — the register block self-skips off Windows, so a skip on this job
  # means the module went missing, and the step fails on it.
  install-ps1:
    # Runs after queueing and on main pushes.
    if: github.event_name == 'merge_group' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    name: install-ps1 (${{ matrix.shell }})
    needs: [route]
    runs-on: ${{ fromJSON(needs.route.outputs.runners || '{}')['depot-windows-2025'] || fromJSON('["depot-windows-2025"]') }}
    timeout-minutes: 15
    # The matrix context is not available in a step-level `shell:` (the
    # workflow fails validation with "Unrecognized named-value: 'matrix'"),
    # but it is in the job-level run default.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command pwsh -ErrorAction SilentlyContinue) { exit 0 }
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $archive = Join-Path $env:RUNNER_TEMP 'powershell-7.6.7.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'powershell-7.6.7'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.7/PowerShell-7.6.7-win-x64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'd2f952ebdbf24386cb8923553aa58e41a846db35a6155ea04c58142a4b16dbb7') {
            throw 'PowerShell archive checksum mismatch'
          }
          Expand-Archive -Path $archive -DestinationPath $destination -Force
          & (Join-Path $destination 'pwsh.exe') -NoProfile -Command '$PSVersionTable.PSVersion'
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 7 failed to start' }
          $destination | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Pester (${{ matrix.shell }})
        run: |
          $ErrorActionPreference = 'Stop'
          $PSVersionTable.PSVersion
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.5' })) {
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            if (-not (Get-PackageProvider -ListAvailable | Where-Object { $_.Name -eq 'NuGet' -and $_.Version -ge [version]'2.8.5.201' })) {
              Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser
            }
            Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser -MinimumVersion 5.5
          }
          Import-Module Pester -MinimumVersion 5.0
          (Get-Module Pester).Version
          $config = New-PesterConfiguration
          $config.Run.Path = 'scripts/install.ps1.Tests.ps1'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -ne 0) { throw "install.ps1 Pester tests failed: $($result.FailedCount)" }
          if ($result.SkippedCount -ne 0) { throw "install.ps1 Pester tests skipped on Windows: $($result.SkippedCount) (is the ScheduledTasks module missing?)" }
          if ($result.PassedCount -eq 0) { throw 'install.ps1 Pester tests: nothing ran' }

  # Exercise the shipping Pi ACP package through real session/new, prompt and
  # session/load traffic. CMD quoting needs native Windows, not compilation or
  # Linux platform simulation. Both platforms also cover extension forwarding.
  # The shipping-pin matrix is strict and required by CI Gate.
  pi-session-paths:
    if: github.event_name == 'merge_group' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [depot-ubuntu-24.04, depot-windows-2025]
        node: [22, 24]
    needs: [route]
    runs-on: ${{ fromJSON(needs.route.outputs.runners || '{}')[matrix.os] || matrix.os }}
    timeout-minutes: 10
    env:
      PI_ACP_TEST_ENTRY: ${{ github.workspace }}/.pi-acp-test/node_modules/pi-acp/dist/index.js
      PI_CLI_TEST_ENTRY: ${{ github.workspace }}/.pi-runtime-test/node_modules/@earendil-works/pi-coding-agent/dist/cli.js
      PI_ACP_EVIDENCE_DIR: ${{ github.workspace }}/pi-path-evidence
      PI_DIAGNOSTICS_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.node }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Put Git Bash first on PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - name: Install the exact production adapter pin
        run: |
          pin=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const s = readFileSync("crates/intent-providers/src/config.rs", "utf8"); const m = s.match(/pub const PI_ACP_NPX_PACKAGE: &str = "(pi-acp@[^"]+)";/); if (!m) throw new Error("Missing production Pi adapter pin"); console.log(m[1]);')
          mkdir -p pi-path-evidence
          printf '%s\n' "$pin" > pi-path-evidence/package.txt
          npm install --prefix .pi-acp-test --no-save --ignore-scripts --no-audit --no-fund "$pin"
          cp .pi-acp-test/node_modules/.package-lock.json pi-path-evidence/package-lock.json
          node crates/intentd/tests/fixtures/pi-artifact-audit.mjs --record-package
      - name: Test the pinned adapter (strict)
        run: node crates/intentd/tests/fixtures/pi-fixture-runner.mjs test.tap crates/intentd/tests/fixtures/pi-session-paths.test.mjs
      - name: Test cleanup failure observability
        if: ${{ !cancelled() }}
        run: node crates/intentd/tests/fixtures/pi-fixture-runner.mjs cleanup-checks.tap crates/intentd/tests/fixtures/pi-session-cleanup.test.mjs crates/intentd/tests/fixtures/pi-windows-shutdown.test.mjs
      - name: Test bounded diagnostics and independent audit failure paths
        if: ${{ !cancelled() }}
        run: node crates/intentd/tests/fixtures/pi-fixture-runner.mjs diagnostic-checks.tap crates/intentd/tests/fixtures/pi-diagnostics.test.mjs crates/intentd/tests/fixtures/pi-artifact-audit.test.mjs
      - name: Prove original startup errors through the supported fixture launcher
        if: ${{ !cancelled() }}
        run: node crates/intentd/tests/fixtures/pi-fixture-runner.mjs startup.tap crates/intentd/tests/fixtures/pi-startup-diagnostics.test.mjs
      - name: Install the real minimum Pi CLI
        if: ${{ !cancelled() }}
        run: |
          minimum=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const s = readFileSync("crates/intent-providers/src/config.rs", "utf8"); const m = s.match(/pub const PI_CLI_MIN_VERSION: &str = "([^"]+)";/); if (!m) throw new Error("Missing Pi CLI minimum"); console.log(m[1]);')
          npm install --prefix .pi-runtime-test --no-save --ignore-scripts --no-audit --no-fund "@earendil-works/pi-coding-agent@$minimum" "@earendil-works/pi-agent-core@$minimum" "@earendil-works/pi-ai@$minimum" "@earendil-works/pi-tui@$minimum"
          cp .pi-runtime-test/node_modules/.package-lock.json pi-path-evidence/pi-package-lock.json
      - name: Test real Pi lifecycle and supported MCP extension delivery
        if: ${{ !cancelled() }}
        run: node crates/intentd/tests/fixtures/pi-fixture-runner.mjs runtime.tap crates/intentd/tests/fixtures/pi-runtime-compat.test.mjs
      - name: Independently audit diagnostics, replay, cleanup and unchanged package bytes
        if: ${{ !cancelled() }}
        run: node crates/intentd/tests/fixtures/pi-artifact-audit.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pi-session-pinned-${{ matrix.os }}-node${{ matrix.node }}
          path: pi-path-evidence
          if-no-files-found: error

  daemon-lifecycle:
    name: Daemon lifecycle (${{ matrix.platform }})
    needs: route
    if: github.event_name == 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ${{ fromJSON(needs.route.outputs.linux_labels || '["depot-ubuntu-24.04-16"]') }}
          - platform: macos
            os: ${{ fromJSON(needs.route.outputs.macos_labels || '["depot-macos-latest"]') }}
          - platform: windows
            os: ${{ fromJSON(needs.route.outputs.windows_labels || '["depot-windows-2022-16"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/checkout@v7
      # On the self-hosted Windows runner C:\WINDOWS\system32\bash.EXE (the
      # WSL stub) shadows Git Bash in PATH, and WSL bash can't execute the
      # runner's Windows-path step scripts. Prepend Git's bin dir so every
      # later `shell: bash` step resolves Git Bash instead.
      - name: Put Git Bash first on PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - name: Configure Depot managed compiler cache
        shell: bash
        env:
          DEPOT_SCCACHE_TOKEN: ${{ secrets.DEPOT_TOKEN }}
          INTENT_SCCACHE_ENDPOINT: ${{ vars.INTENT_SCCACHE_ENDPOINT }}
          INTENT_SCCACHE_TOKEN: ${{ secrets.INTENT_SCCACHE_TOKEN }}
          INTENT_SCCACHE_MODE: ${{ vars.INTENT_SCCACHE_MODE }}
        run: python3 scripts/setup-depot-sccache.py
      # These runners have one slot. Prefer the native Windows home path:
      # Cargo cannot use Git Bash's MSYS-style $HOME from native processes.
      - name: Point lifecycle target outside checkout (macOS and Windows)
        if: runner.os != 'Linux' && contains(matrix.os, 'self-hosted')
        shell: bash
        run: echo "CARGO_TARGET_DIR=${USERPROFILE:-$HOME}/ci-target/intentd/daemon-lifecycle-${{ matrix.platform }}" >> "$GITHUB_ENV"
      - name: Ensure macOS CI disk headroom
        if: runner.os == 'macOS' && contains(matrix.os, 'self-hosted')
        run: python3 -I -B scripts/macos-ci-cleanup.py --apply
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy
      - name: Native lifecycle lint and runtime proof
        shell: bash
        run: |
          cargo clippy --locked -p intentd-sitter -p intentd --all-targets -- -D warnings
          python3 -I -B scripts/test-daemon-lifecycle.py
  # Required context for each event: PRs certify only the lightweight tier.
  # Queue entries require all native/runtime/coverage proofs; push keeps its
  # release-build and packaging checks. Missing/failed results never pass.
  gate:
    name: CI Gate
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ fromJSON(needs.route.outputs.runners || '{}')['depot-ubuntu-24.04'] || fromJSON('["depot-ubuntu-24.04"]') }}
    needs: [route, pr-static, release-fast-path, cache-smoke, daemon-lifecycle, check, build, macos-services-runtime, coverage-e2e, coverage-all, coverage-changed, pr-title, conflict-markers, monorepo-consumer-checks, deb-packaging, release-scripts, install-ps1, pi-session-paths]
    steps:
      - name: Check results
        run: |
          require() {
            if [ "$2" != success ]; then echo "$1 must succeed ($2)"; exit 1; fi
          }
          optional() {
            case "$2" in success|skipped) ;; *) echo "$1 failed ($2)"; exit 1 ;; esac
          }
          case "${{ github.event_name }}" in
            pull_request)
              require route "${{ needs.route.result }}"
              require pr-static "${{ needs.pr-static.result }}"
              # release-fast-path itself is advisory: a failed classifier must
              # degrade to full CI, never block the PR. Release-metadata PRs
              # skip the two slow test jobs (see `check`); the skip is accepted
              # only when the classifier job succeeded and reported the fast
              # path. Any other PR must run them.
              slow=require
              if [ "${{ needs.release-fast-path.result }}" = success ] && [ "${{ needs.release-fast-path.outputs.fast_path }}" = true ]; then
                slow=optional
              fi
              optional cache-smoke "${{ needs.cache-smoke.result }}"
              optional daemon-lifecycle "${{ needs.daemon-lifecycle.result }}"
              "$slow" check "${{ needs.check.result }}"
              optional build "${{ needs.build.result }}"
              optional macos-services-runtime "${{ needs.macos-services-runtime.result }}"
              optional coverage-e2e "${{ needs.coverage-e2e.result }}"
              optional coverage-all "${{ needs.coverage-all.result }}"
              "$slow" coverage-changed "${{ needs.coverage-changed.result }}"
              require pr-title "${{ needs.pr-title.result }}"
              require conflict-markers "${{ needs.conflict-markers.result }}"
              require monorepo-consumer-checks "${{ needs.monorepo-consumer-checks.result }}"
              optional deb-packaging "${{ needs.deb-packaging.result }}"
              require release-scripts "${{ needs.release-scripts.result }}"
              optional install-ps1 "${{ needs.install-ps1.result }}"
              optional pi-session-paths "${{ needs.pi-session-paths.result }}"
              ;;
            merge_group)
              require route "${{ needs.route.result }}"
              optional pr-static "${{ needs.pr-static.result }}"
              require cache-smoke "${{ needs.cache-smoke.result }}"
              require daemon-lifecycle "${{ needs.daemon-lifecycle.result }}"
              require check "${{ needs.check.result }}"
              require build "${{ needs.build.result }}"
              require macos-services-runtime "${{ needs.macos-services-runtime.result }}"
              require coverage-e2e "${{ needs.coverage-e2e.result }}"
              require coverage-all "${{ needs.coverage-all.result }}"
              require coverage-changed "${{ needs.coverage-changed.result }}"
              optional pr-title "${{ needs.pr-title.result }}"
              optional conflict-markers "${{ needs.conflict-markers.result }}"
              require monorepo-consumer-checks "${{ needs.monorepo-consumer-checks.result }}"
              require deb-packaging "${{ needs.deb-packaging.result }}"
              require release-scripts "${{ needs.release-scripts.result }}"
              require install-ps1 "${{ needs.install-ps1.result }}"
              require pi-session-paths "${{ needs.pi-session-paths.result }}"
              ;;
            push)
              require route "${{ needs.route.result }}"
              optional pr-static "${{ needs.pr-static.result }}"
              optional cache-smoke "${{ needs.cache-smoke.result }}"
              optional daemon-lifecycle "${{ needs.daemon-lifecycle.result }}"
              optional check "${{ needs.check.result }}"
              require build "${{ needs.build.result }}"
              optional macos-services-runtime "${{ needs.macos-services-runtime.result }}"
              optional coverage-e2e "${{ needs.coverage-e2e.result }}"
              optional coverage-all "${{ needs.coverage-all.result }}"
              optional coverage-changed "${{ needs.coverage-changed.result }}"
              optional pr-title "${{ needs.pr-title.result }}"
              optional conflict-markers "${{ needs.conflict-markers.result }}"
              optional monorepo-consumer-checks "${{ needs.monorepo-consumer-checks.result }}"
              require deb-packaging "${{ needs.deb-packaging.result }}"
              require release-scripts "${{ needs.release-scripts.result }}"
              require install-ps1 "${{ needs.install-ps1.result }}"
              require pi-session-paths "${{ needs.pi-session-paths.result }}"
              ;;
            *) exit 1 ;;
          esac
