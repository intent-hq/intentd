name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

env:
  # Burst the Linux jobs to GitHub-hosted larger runners when more than
  # this many Linux jobs are queued/running ahead of this run (see the
  # route job). tinybox runs 8 concurrent runner slots, so the threshold
  # tolerates one queued/running job per slot before bursting. Note that
  # jobs still blocked on `needs` are invisible to the jobs API, so only
  # check/coverage jobs already released to tinybox (queued or running
  # there) count toward the depth. Bursted jobs don't carry the
  # self-hosted+Linux labels and stop counting toward the depth, so the
  # system naturally falls back to tinybox as it frees up.
  #
  # TEMPORARY(tinybox offline): forced to -1 so every run bursts to the
  # GitHub-hosted gh-linux-8x/16x runners (depth is always > -1) and nothing
  # queues on the offline tinybox. Restore the previous value (8) when
  # tinybox is back — see monorepo#1239/#1253 for context.
  LINUX_BURST_THRESHOLD: -1

# The heavy jobs share the tinybox's 8 self-hosted runner slots, so cancel
# superseded PR runs instead of letting them back up the queue (push to
# main and merge-queue runs are never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides where the heavy Linux jobs (check / coverage-e2e / coverage-all)
  # run: the local tinybox runner normally, or GitHub-hosted larger runners
  # when the tinybox queue is backed up. Runs on a GitHub-hosted runner so
  # the burst decision is independent of the tinybox queue: when the probe
  # ran on tinybox it queued behind the very backlog it measures (and
  # deadlocked entirely with tinybox offline). The probe fails open to
  # tinybox on API errors; if the job itself fails (runner outage, timeout),
  # the routed jobs are skipped and need a re-run — a deliberate trade-off.
  # The mac build is intentionally not routed — it stays pinned to m1mac.
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Reads the Actions queue; job-level so the other jobs don't inherit
      # it (the optional cross-repo CI_QUEUE_READ_TOKEN is likewise only
      # exposed to this job).
      actions: read
    outputs:
      linux_labels: ${{ steps.decide.outputs.linux_labels }}
      check_labels: ${{ steps.decide.outputs.check_labels }}
      linux_burst: ${{ steps.decide.outputs.linux_burst }}
    steps:
      - id: decide
        uses: actions/github-script@v7
        env:
          THRESHOLD: ${{ env.LINUX_BURST_THRESHOLD }}
        with:
          # tinybox serves several repos on its runner slots, so the probe
          # wants to size the queue across all of them — but the default
          # GITHUB_TOKEN is repo-scoped and can only see intentd. Set the
          # CI_QUEUE_READ_TOKEN secret (fine-grained PAT with actions:read
          # on the sibling repos) to enable cross-repo counting; without
          # it those repos are skipped and contribute 0.
          github-token: ${{ secrets.CI_QUEUE_READ_TOKEN || github.token }}
          script: |
            const tinybox = ["self-hosted", "Linux", "X64"];
            // The coverage jobs run the whole instrumented suite, so they
            // burst to the biggest GH-hosted Linux runner (16-core); check
            // (fmt + clippy + a couple of tests) doesn't come close to
            // saturating that, so it bursts to a cheaper 8-core runner
            // instead.
            const burst = ["gh-linux-16x"];
            const checkBurst = ["gh-linux-8x"];
            const threshold = parseInt(process.env.THRESHOLD || "8", 10);
            // Count self-hosted Linux jobs that are queued or running in
            // queued/in-progress runs: a running job occupies a tinybox
            // slot just as much as a queued one. GitHub-hosted jobs
            // — including this route job and bursted heavy jobs — don't
            // match the self-hosted+Linux label filter, so they never
            // inflate the depth.
            const owner = context.repo.owner;
            const repos = ["intentd", "cloudlands-fe", "monorepo"];
            let depth = 0;
            for (const repo of repos) {
              try {
                for (const status of ["queued", "in_progress"]) {
                  const runs = await github.rest.actions.listWorkflowRunsForRepo({ owner, repo, status, per_page: 20 });
                  for (const run of runs.data.workflow_runs.filter(r => r.id !== context.runId).slice(0, 10)) {
                    const jobs = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: run.id, per_page: 100 });
                    depth += jobs.data.jobs.filter(j => (j.status === "queued" || j.status === "in_progress") && j.labels.includes("self-hosted") && j.labels.includes("Linux")).length;
                  }
                }
              } catch (e) {
                core.info(`queue probe skipped ${repo}: ${e.message}`);
              }
            }
            const useBurst = depth > threshold;
            core.info(`linux queue depth=${depth} threshold=${threshold} burst=${useBurst}`);
            core.setOutput("linux_labels", JSON.stringify(useBurst ? burst : tinybox));
            core.setOutput("check_labels", JSON.stringify(useBurst ? checkBurst : tinybox));
            core.setOutput("linux_burst", String(useBurst));

  check:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.check_labels) }}
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      # No disk-space cleanup: with debug info disabled (CARGO_PROFILE_*_DEBUG=0)
      # this job's target dir stays small, and tinybox has ~380G free.
      - uses: actions/checkout@v7
      # openssl-sys needs the OpenSSL headers; ubuntu-latest images preinstall
      # libssl-dev but tinybox doesn't. Idempotent (skips once installed) and
      # relies on the runner user's passwordless sudo.
      - name: Install libssl-dev if missing
        run: |
          if ! pkg-config --exists openssl; then
            sudo -n apt-get update -qq
            sudo -n apt-get install -y -qq libssl-dev
          fi
      # Keep the target dir OUTSIDE the runner work dir: checkout's default
      # clean (git clean -ffdx) wipes ignored files — including target/ — at
      # the start of every job, and all jobs on this runner share one work
      # dir. A per-job CARGO_TARGET_DIR under $HOME survives both, which is
      # what makes builds warm across runs (and why swatinem/rust-cache was
      # dropped: GH cache save/restore would be pure overhead on top of it).
      # The path is also keyed on $RUNNER_NAME: the 8 tinybox runner slots
      # share one $HOME, and without the key concurrent jobs would serialize
      # on cargo's target-dir lock (and the coverage jobs would clobber each
      # other — see their comments). Trade-off: up to 8 per-slot copies of
      # each job's target dir; prune $HOME/ci-target if disk gets tight.
      - name: Point CARGO_TARGET_DIR outside the work dir
        if: needs.route.outputs.linux_burst != 'true'
        run: echo "CARGO_TARGET_DIR=$HOME/ci-target/intentd/$RUNNER_NAME/check" >> "$GITHUB_ENV"
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      # Ephemeral GitHub-hosted runners have no persistent target dir, so
      # use the GH cache there (pure overhead on tinybox, hence burst-gated).
      - name: Rust cache (burst runner only)
        if: needs.route.outputs.linux_burst == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gh-burst-check
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The full suite is not run here: coverage-all executes it (instrumented,
      # via cargo llvm-cov nextest) and is the test gate for PRs. Running it
      # plainly here as well would double the critical path. The exception is
      # the tests the coverage scripts skip: they are flaky under llvm-cov
      # instrumentation / heavy parallel load, so they run here instead —
      # non-instrumented and serially, the conditions under which they pass
      # reliably — to keep them covered on every PR.
      #
      # slow_host_exec_does_not_block_fast_workspace_list (STAB-42) is NOT run:
      # it currently fails deterministically even in an isolated, serial,
      # non-instrumented run (times out at uds_concurrent_dispatch.rs:63), so
      # it stays skipped everywhere until STAB-42 is fixed.
      - name: Coverage-skipped tests (STAB-40/43)
        run: |
          cargo test -p intent-core --lib capture_login_shell_path_with_fake_shell
          cargo test -p intentd --test wss_integration wss_note_save_asset_round_trip

  build:
    strategy:
      # Don't let one platform's failure cancel the other's required check.
      fail-fast: false
      matrix:
        include:
          # temporarily disabled — re-enable when needed
          # - target: x86_64-unknown-linux-gnu
          #   os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: [self-hosted, macOS, ARM64, m1mac]
          - target: x86_64-pc-windows-msvc
            os: [self-hosted, Windows, X64]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Keeps the cargo-check steps free of debuginfo/incremental artifacts
    # (cheaper compile, smaller shared cache). Safe job-wide: the release
    # build is unaffected — these vars only touch the dev/test profiles, and
    # release builds are non-incremental by default.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
      # On the self-hosted Windows runner C:\WINDOWS\system32\bash.EXE (the
      # WSL stub) shadows Git Bash in PATH, and WSL bash can't execute the
      # runner's Windows-path step scripts. Prepend Git's bin dir so every
      # later `shell: bash` step resolves Git Bash instead.
      - name: Put Git Bash first on PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      # Per-job persistent target dir outside the work dir (see the `check`
      # job's comment for the rationale; re-add swatinem/rust-cache, keyed
      # per target, if a GH-hosted matrix entry is re-enabled). The mac and
      # Windows runners are single-slot, so no $RUNNER_NAME key. On the Windows
      # runner this runs under Git Bash, where $HOME is an MSYS-style path
      # cargo (spawned from the default pwsh shell) can't use — $USERPROFILE
      # carries the native C:\Users\... form, so prefer it when set.
      - name: Point CARGO_TARGET_DIR outside the work dir
        shell: bash
        run: echo "CARGO_TARGET_DIR=${USERPROFILE:-$HOME}/ci-target/intentd/build-${{ matrix.target }}" >> "$GITHUB_ENV"
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}
      # On PRs a cheap `cargo check` proves per-target compilation; the full
      # `--release` build (the expensive part, esp. on Windows) only runs on
      # push to main and in the merge queue. The "Warm PR check cache" step
      # keeps the persistent target dir warm for PR checks after main builds.
      - name: Check (PR compilation proof)
        if: github.event_name == 'pull_request'
        run: cargo check --workspace --target ${{ matrix.target }}
      - name: Build (release)
        if: github.event_name != 'pull_request'
        run: cargo build --workspace --release --target ${{ matrix.target }}
      - name: Warm PR check cache
        if: github.event_name == 'push'
        run: cargo check --workspace --target ${{ matrix.target }}

  coverage-e2e:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.linux_labels) }}
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      # 16 on the 64-core tinybox: 32 was tuned for exclusive use of the box
      # (at 64 threads the latency-bound stress tests — e.g.
      # e2e_wss_pool_contention_stress's <2s read assert — blew their
      # wall-clock bounds under llvm-cov load on both nextest tries), but up
      # to 8 co-tenant jobs now share the box, so halve to 16 to keep those
      # tests inside their bounds under co-tenancy. This also matches the
      # 16-core gh-linux-16x burst runner, so the value no longer varies by
      # route.
      NEXTEST_TEST_THREADS: 16
    steps:
      - uses: actions/checkout@v7
      # See the `check` job's comment: tinybox lacks the OpenSSL headers.
      - name: Install libssl-dev if missing
        run: |
          if ! pkg-config --exists openssl; then
            sudo -n apt-get update -qq
            sudo -n apt-get install -y -qq libssl-dev
          fi
      # Per-job persistent target dir outside the work dir (see the `check`
      # job's comment for the rationale). cargo llvm-cov honors it, and the
      # scripts' `cargo llvm-cov clean --workspace` only cleans workspace
      # crates + profraw, so dependency artifacts stay warm across runs.
      # The $RUNNER_NAME key is a correctness requirement here, not just
      # lock avoidance: that same clean means two coverage jobs on different
      # slots sharing a dir would delete each other's artifacts mid-run.
      - name: Point CARGO_TARGET_DIR outside the work dir
        if: needs.route.outputs.linux_burst != 'true'
        run: echo "CARGO_TARGET_DIR=$HOME/ci-target/intentd/$RUNNER_NAME/coverage-e2e" >> "$GITHUB_ENV"
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: llvm-tools-preview
      # Ephemeral GitHub-hosted runners have no persistent target dir, so
      # use the GH cache there (pure overhead on tinybox, hence burst-gated).
      - name: Rust cache (burst runner only)
        if: needs.route.outputs.linux_burst == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gh-burst-coverage-e2e
      # Node is required (not preinstalled on tinybox, unlike ubuntu-latest):
      # the ACP e2e tests spawn the mock-acp-agent.mjs fixture and silently
      # self-skip without it, which silently drops coverage below the floor.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # install-action derives every path it touches from $HOME: the bin dir
      # (~/.install-action/bin here — tinybox's cargo lives at /usr/local/bin,
      # outside $CARGO_HOME/bin, so the action always takes its fallback) and,
      # crucially, its download scratch dir (~/.install-action/tmp), which is
      # shared even when the bin dir isn't — so keying CARGO_HOME per slot
      # would not help. The 8 tinybox slots share one $HOME, and concurrent
      # installs clobber each other's downloads (curl error 23; monorepo#1239).
      # Point the action at a per-slot HOME (keyed on $RUNNER_NAME like the
      # ci-target dirs) so every path it derives is slot-private; only the
      # install steps see the override, so rustup/CARGO_TARGET_DIR/registry
      # caches under the real $HOME are untouched, and the action still adds
      # its (now per-slot) bin dir to GITHUB_PATH for the later steps. Burst
      # runners are ephemeral single-job machines, so they keep the real HOME.
      - name: Key install-action dirs per runner slot
        run: |
          if [[ "${{ needs.route.outputs.linux_burst }}" == "true" ]]; then
            echo "INSTALL_ACTION_HOME=$HOME" >> "$GITHUB_ENV"
          else
            echo "INSTALL_ACTION_HOME=$HOME/ci-install-action/$RUNNER_NAME" >> "$GITHUB_ENV"
          fi
      - uses: taiki-e/install-action@cargo-llvm-cov
        env:
          HOME: ${{ env.INSTALL_ACTION_HOME }}
      - uses: taiki-e/install-action@nextest
        env:
          HOME: ${{ env.INSTALL_ACTION_HOME }}
      - name: Run e2e coverage
        run: |
          cd ${{ github.workspace }}
          GENERATE_LCOV=1 ./scripts/coverage-e2e.sh 40
      - name: Generate coverage summary
        if: always()
        run: |
          cd ${{ github.workspace }}
          echo "## E2E Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          (cargo llvm-cov report --summary-only 2>/dev/null || echo "Coverage data not available") >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
      # Non-fatal + short retention: the lcov artifact is a debugging aid
      # only, and an org artifact-quota outage must not fail the required
      # check when all tests passed (monorepo#1163).
      - name: Upload coverage artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-coverage-lcov
          path: lcov.info
          if-no-files-found: warn
          retention-days: 3

  coverage-all:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.linux_labels) }}
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      # 16 on the 64-core tinybox: 32 was tuned for exclusive use of the box
      # (at 64 threads the full workspace suite thrashed SQLite/WAL and
      # wall-clock-timeout tests hard enough that even the nextest retry
      # failed: concurrent_writes_no_sqlite_busy hit "database is locked" on
      # both tries, bridge/auto-commit timing tests timed out), but up to 8
      # co-tenant jobs now share the box, so halve to 16 to avoid the lock
      # storms under co-tenancy. This also matches the 16-core gh-linux-16x
      # burst runner, so the value no longer varies by route.
      NEXTEST_TEST_THREADS: 16
    steps:
      - uses: actions/checkout@v7
      # See the `check` job's comment: tinybox lacks the OpenSSL headers.
      - name: Install libssl-dev if missing
        run: |
          if ! pkg-config --exists openssl; then
            sudo -n apt-get update -qq
            sudo -n apt-get install -y -qq libssl-dev
          fi
      # Per-job persistent target dir outside the work dir (see the `check`
      # job's comment for the rationale). cargo llvm-cov honors it, and the
      # scripts' `cargo llvm-cov clean --workspace` only cleans workspace
      # crates + profraw, so dependency artifacts stay warm across runs.
      # The $RUNNER_NAME key is a correctness requirement here, not just
      # lock avoidance: that same clean means two coverage jobs on different
      # slots sharing a dir would delete each other's artifacts mid-run.
      - name: Point CARGO_TARGET_DIR outside the work dir
        if: needs.route.outputs.linux_burst != 'true'
        run: echo "CARGO_TARGET_DIR=$HOME/ci-target/intentd/$RUNNER_NAME/coverage-all" >> "$GITHUB_ENV"
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: llvm-tools-preview
      # Ephemeral GitHub-hosted runners have no persistent target dir, so
      # use the GH cache there (pure overhead on tinybox, hence burst-gated).
      - name: Rust cache (burst runner only)
        if: needs.route.outputs.linux_burst == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gh-burst-coverage-all
      # Node is required (not preinstalled on tinybox, unlike ubuntu-latest):
      # the ACP e2e tests spawn the mock-acp-agent.mjs fixture and silently
      # self-skip without it, which silently drops coverage below the floor.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Per-slot HOME for install-action — see the coverage-e2e job's comment
      # for the full rationale (shared ~/.install-action tmp/bin race across
      # the 8 tinybox slots; monorepo#1239).
      - name: Key install-action dirs per runner slot
        run: |
          if [[ "${{ needs.route.outputs.linux_burst }}" == "true" ]]; then
            echo "INSTALL_ACTION_HOME=$HOME" >> "$GITHUB_ENV"
          else
            echo "INSTALL_ACTION_HOME=$HOME/ci-install-action/$RUNNER_NAME" >> "$GITHUB_ENV"
          fi
      - uses: taiki-e/install-action@cargo-llvm-cov
        env:
          HOME: ${{ env.INSTALL_ACTION_HOME }}
      - uses: taiki-e/install-action@nextest
        env:
          HOME: ${{ env.INSTALL_ACTION_HOME }}
      - name: Run combined coverage
        run: |
          cd ${{ github.workspace }}
          GENERATE_LCOV=1 ./scripts/coverage-all.sh 80
      - name: Generate coverage summary
        if: always()
        run: |
          cd ${{ github.workspace }}
          echo "## Combined Coverage Report (all tests)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          (cargo llvm-cov report --summary-only 2>/dev/null || echo "Coverage data not available") >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
      # Non-fatal + short retention — same rationale as coverage-e2e's
      # upload step (monorepo#1163).
      - name: Upload coverage artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: combined-coverage-lcov
          path: lcov.info
          if-no-files-found: warn
          retention-days: 3

  pr-title:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf

  # Conflict-marker guard: fails the PR if any changed file contains committed
  # git conflict markers (the #588 incident: release-plz pushed a branch with
  # '<' x7 / '>' x7 marker lines in CHANGELOG.md, Cargo.lock and Cargo.toml,
  # and no check caught it). Matches the exact line forms git emits — seven
  # '<' or '>' followed by a space and a label — and counts a bare
  # seven-'=' line only when the same file also has both of the other two,
  # so Markdown setext headings / code snippets don't false-positive.
  conflict-markers:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fetch PR base commit
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
      - name: Scan changed files for conflict markers
        run: |
          set -euo pipefail
          # NUL-delimited via a temp file: robust to quoted/non-ASCII pathnames,
          # and a failing `git diff` fails the step instead of being swallowed
          # by process substitution.
          git diff -z --name-only --diff-filter=ACMR ${{ github.event.pull_request.base.sha }} HEAD > "$RUNNER_TEMP/changed-files.z"
          mapfile -d '' -t files < "$RUNNER_TEMP/changed-files.z"
          fail=0
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            hits=$(grep -nIE '^(<{7}|>{7}) ' "$f" || true)
            [ -n "$hits" ] || continue
            if grep -qIE '^<{7} ' "$f" && grep -qIE '^>{7} ' "$f"; then
              eq=$(grep -nE '^={7}$' "$f" || true)
              [ -n "$eq" ] && hits="$hits"$'\n'"$eq"
            fi
            while IFS= read -r hit; do
              echo "::error file=$f,line=${hit%%:*}::committed git conflict marker"
              printf '%s:%s\n' "$f" "$hit"
            done < <(printf '%s\n' "$hits" | sort -t: -k1,1n)
            fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "Conflict markers detected in changed files — resolve them before merging."
            exit 1
          fi
          echo "No conflict markers in ${#files[@]} changed file(s)."

  # Packaging assets guard: asserts the systemd user unit keeps the exact
  # semantics the daemon's `service install` used to generate (Type=simple,
  # serve/stop, Restart=on-failure, WantedBy=default.target), and that
  # scripts/build-deb.sh produces a well-formed .deb (stub binary here; the
  # real release tarballs are repacked by .github/workflows/release-sitter.yml).
  # Seconds-long like the other utility jobs, so it runs directly on
  # ubuntu-latest, which has the required dpkg-deb / tar+xz toolchain
  # preinstalled.
  deb-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Assert systemd user unit content
        run: |
          unit=packaging/deb/intentd.service
          grep -qx 'Description=Intent backend daemon (intentd)' "$unit"
          grep -qx 'Type=simple' "$unit"
          grep -qx 'ExecStart=/usr/bin/intentd serve --resume-all' "$unit"
          grep -qx 'ExecStop=/usr/bin/intentd stop' "$unit"
          grep -qx 'Restart=on-failure' "$unit"
          grep -qx 'WantedBy=default.target' "$unit"
      - name: Build and inspect a stub .deb
        run: |
          dir=intentd-x86_64-unknown-linux-musl
          mkdir -p "stub/$dir"
          printf '#!/bin/sh\necho stub\n' > "stub/$dir/intentd"
          chmod +x "stub/$dir/intentd"
          tar -C stub -cJf "$dir.tar.xz" "$dir"
          ./scripts/build-deb.sh "$dir.tar.xz" 0.0.0 amd64
          dpkg-deb --info intentd_0.0.0_amd64.deb
          dpkg-deb --contents intentd_0.0.0_amd64.deb
          test "$(dpkg-deb --field intentd_0.0.0_amd64.deb Package)" = intentd
          test "$(dpkg-deb --field intentd_0.0.0_amd64.deb Architecture)" = amd64
          dpkg-deb --contents intentd_0.0.0_amd64.deb | grep -q ' \./usr/bin/intentd$'
          dpkg-deb --contents intentd_0.0.0_amd64.deb | grep -q ' \./usr/lib/systemd/user/intentd\.service$'
