name: CI
on:
  # Push-to-main runs only the release build matrix (+ deb-packaging + gate).
  # The main ruleset routes every merge through the merge queue (see
  # `merge_group` below) and blocks direct pushes, so every main commit's
  # tree is identical to one a merge-queue (or, pre-queue, strict-up-to-date
  # PR) run just tested — the test jobs (route/check/coverage-e2e/
  # coverage-all) are push-skipped via their `if`s (CI audit, 2026-08).
  push:
    branches: [main]
  # Fork PRs get no CI: external PRs are not accepted (intent-hq/monorepo#417).
  # Every job reachable from pull_request carries a same-repo guard
  # (head.repo.full_name == github.repository) — directly or via the needs
  # chain — so fork PRs consume zero runner time and can never reach the
  # self-hosted tinybox; close-fork-prs.yml auto-closes them. Same-repo PRs
  # are completely unaffected.
  pull_request:
  # Merge-queue runs (intent-hq/monorepo#2893): the queue tests the actual
  # merged tree before it lands on main, so merge_group runs the same test
  # jobs as pull_request CI. Merge groups are created by the repo's own
  # ruleset from already-filed PRs, so they need no same-repo fork guard.
  # pr-title / conflict-markers are PR-metadata checks that stay
  # pull_request-only — the gate accepts their skip.
  merge_group:

permissions:
  contents: read
  pull-requests: read

env:
  # Burst the Linux jobs to GitHub-hosted larger runners when more than
  # this many Linux jobs are queued/running ahead of this run (see the
  # route job). tinybox runs 8 concurrent runner slots, so the threshold
  # tolerates one queued/running job per slot before bursting. Note that
  # jobs still blocked on `needs` are invisible to the jobs API, so only
  # check/coverage jobs already released to tinybox (queued or running
  # there) count toward the depth. Bursted jobs don't carry the
  # self-hosted+Linux labels and stop counting toward the depth, so the
  # system naturally falls back to tinybox as it frees up.
  LINUX_BURST_THRESHOLD: 8

# The heavy jobs share the tinybox's 8 self-hosted runner slots, so cancel
# superseded PR runs instead of letting them back up the queue (push-to-main
# runs are never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides where the heavy Linux jobs (check / coverage-e2e / coverage-all)
  # run: the local tinybox runner when it is confirmed healthy, or
  # GitHub-hosted larger runners otherwise. Runs on a GitHub-hosted runner so
  # the burst decision is independent of the tinybox queue: when the probe
  # ran on tinybox it queued behind the very backlog it measures (and
  # deadlocked entirely with tinybox offline). The probe FAILS OPEN TO BURST:
  # tinybox is only selected when the probe positively confirms an online
  # self-hosted Linux runner AND an acceptable queue depth — any API error,
  # missing permission, or an offline fleet routes to the burst runners, so
  # CI cannot queue-deadlock when the fleet is down. If the job itself fails
  # (timeout), the routed jobs are skipped and need a re-run — a deliberate
  # trade-off. The mac build is intentionally not routed — it runs on a
  # GitHub-hosted macOS runner (see the build job's matrix).
  route:
    # Skipped on push to main: its only consumers (check / coverage-e2e /
    # coverage-all) are push-skipped as redundant (see the `on: push`
    # comment) and the build matrix is intentionally not routed, so the
    # probe would spend API calls placing jobs that never run.
    # Also skipped on fork PRs (see the `pull_request` trigger comment):
    # route's skip cascades over the needs chain, skipping check /
    # coverage-e2e / coverage-all, so fork PRs can never reach tinybox.
    # Runs on merge_group (see the trigger comment) — merge groups come from
    # the repo's own ruleset, so no same-repo guard applies there.
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Reads the Actions queue; job-level so the other jobs don't inherit
      # it (the optional cross-repo CI_QUEUE_READ_TOKEN is likewise only
      # exposed to this job).
      actions: read
    outputs:
      linux_labels: ${{ steps.decide.outputs.linux_labels }}
      check_labels: ${{ steps.decide.outputs.check_labels }}
      linux_burst: ${{ steps.decide.outputs.linux_burst }}
    steps:
      - id: decide
        uses: actions/github-script@v9
        env:
          THRESHOLD: ${{ env.LINUX_BURST_THRESHOLD }}
        with:
          # tinybox serves several repos on its runner slots, so the probe
          # wants to size the queue across all of them — but the default
          # GITHUB_TOKEN is repo-scoped and can only see intentd. Set the
          # CI_QUEUE_READ_TOKEN secret (fine-grained PAT with actions:read
          # on the sibling repos) to enable cross-repo counting; without
          # it those repos are skipped and contribute 0. Routing to tinybox
          # additionally requires the token to list the tinybox fleet: the
          # runners are registered at the ORG level (shared across the
          # repos via a runner group), so the token needs the org-level
          # "Self-hosted runners" read permission for the org list to
          # succeed. The default GITHUB_TOKEN cannot carry that permission,
          # so without a suitably-scoped CI_QUEUE_READ_TOKEN the org list
          # errors and the probe falls back to this repo's own runner list
          # (fine-grained "Administration" repository permission, read) —
          # currently empty, so every run bursts (safe: burst is the
          # fail-open default; it just never uses tinybox).
          github-token: ${{ secrets.CI_QUEUE_READ_TOKEN || github.token }}
          script: |
            const tinybox = ["self-hosted", "Linux", "X64"];
            // The coverage jobs run the whole instrumented suite, so they
            // burst to the biggest GH-hosted Linux runner (16-core); check
            // (fmt + clippy + a couple of tests) doesn't come close to
            // saturating that, so it bursts to a cheaper 8-core runner
            // instead.
            const burst = ["gh-linux-16x"];
            const checkBurst = ["gh-linux-8x"];
            const threshold = parseInt(process.env.THRESHOLD || "8", 10);
            // FAIL OPEN TO BURST: tinybox is only selected when the probe
            // positively confirms (a) an online self-hosted Linux runner
            // visible to this repo (org-level list, or the repo-level
            // fallback) and (b) a queue depth within the threshold. Any
            // probe error — including a token that cannot list runners —
            // routes to burst, so CI cannot queue-deadlock when the fleet
            // is offline or unreadable.
            let useBurst = true;
            let reason = "fail-open default";
            try {
              // The tinybox fleet is registered at the ORG level (shared
              // across the repos via a runner group), so probe the org
              // runner list first. That call needs the org-level
              // "Self-hosted runners" read permission on the token (see the
              // github-token comment above); when it errors, fall back to
              // the repo-level list, which only sees repo-registered
              // runners (currently none — the degraded mode keeps
              // bursting). An empty list still routes to burst by design
              // (never deadlock on an invisible fleet).
              // NOTE: the org list is NOT scoped to the runner groups this
              // repo can access, so the probe assumes every online
              // self-hosted+Linux+X64 org runner is the tinybox fleet in a
              // group visible to this repo. Ops invariant: keep the fleet's
              // group visible to the CI repos, and never register
              // generically-labeled org runners outside it — a matching but
              // inaccessible runner would route jobs onto labels nothing
              // can serve. (Group-scoped listing via the runner-groups API
              // was considered and rejected: it needs extra calls per group
              // and fails on plans without runner-group support, which
              // would silently regress the probe to always-burst.)
              let runners;
              let runnerSource = "org";
              try {
                runners = await github.paginate(
                  github.rest.actions.listSelfHostedRunnersForOrg,
                  { org: context.repo.owner, per_page: 100 }
                );
              } catch (e) {
                core.info(`org runner list failed (${e.message}); falling back to repo-level list`);
                runnerSource = "repo";
                runners = await github.paginate(
                  github.rest.actions.listSelfHostedRunnersForRepo,
                  { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
                );
              }
              const online = runners.filter(r =>
                r.status === "online" &&
                tinybox.every(l => (r.labels || []).some(x => x.name === l))
              );
              if (online.length === 0) {
                reason = `no online self-hosted Linux runner (${runnerSource} list)`;
              } else {
                // Count self-hosted Linux jobs that are queued or running in
                // queued/in-progress runs: a running job occupies a tinybox
                // slot just as much as a queued one. GitHub-hosted jobs
                // — including this route job and bursted heavy jobs — don't
                // match the self-hosted+Linux label filter, so they never
                // inflate the depth. Sibling-repo probe failures are the
                // documented degraded mode (skip, contribute 0); a failure
                // on this repo's own probe means the depth is unknowable,
                // so it rethrows into the fail-open burst path.
                const owner = context.repo.owner;
                const repos = ["intentd", "cloudlands-fe", "monorepo"];
                let depth = 0;
                for (const repo of repos) {
                  try {
                    for (const status of ["queued", "in_progress"]) {
                      const runs = await github.rest.actions.listWorkflowRunsForRepo({ owner, repo, status, per_page: 20 });
                      for (const run of runs.data.workflow_runs.filter(r => r.id !== context.runId).slice(0, 10)) {
                        const jobs = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: run.id, per_page: 100 });
                        depth += jobs.data.jobs.filter(j => (j.status === "queued" || j.status === "in_progress") && j.labels.includes("self-hosted") && j.labels.includes("Linux")).length;
                      }
                    }
                  } catch (e) {
                    if (repo === context.repo.repo) throw e;
                    core.info(`queue probe skipped ${repo}: ${e.message}`);
                  }
                }
                useBurst = depth > threshold;
                reason = `queue depth=${depth} threshold=${threshold} online=${online.length} (${runnerSource} list)`;
              }
            } catch (e) {
              useBurst = true;
              reason = `probe failed (${e.message})`;
            }
            core.info(`linux routing: burst=${useBurst} (${reason})`);
            core.setOutput("linux_labels", JSON.stringify(useBurst ? burst : tinybox));
            core.setOutput("check_labels", JSON.stringify(useBurst ? checkBurst : tinybox));
            core.setOutput("linux_burst", String(useBurst));

  check:
    # Skipped on push to main — redundant re-test of a tree the PR CI already
    # checked (see the `on: push` comment). The expression carries no status
    # function, so the implicit success() still applies: a route failure —
    # or a route skip, as on fork PRs — skips this job on pull_request
    # exactly as before.
    if: github.event_name != 'push'
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.check_labels) }}
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
      # Fail-fast disk preflight (tinybox only; monorepo#1253): the 8 runner
      # slots share one /raid CI-scratch volume, and the per-slot persistent
      # target dirs (see "Point CARGO_TARGET_DIR outside the work dir" below)
      # can fill it — a full volume kills jobs mid-run with ENOSPC. If free
      # space is below the job's threshold, self-prune in two tiers: first
      # stale per-slot ci-target dirs (mtime older than 2 days, oldest
      # first), then — a heavy CI day fills /raid with dirs too fresh for
      # any age window (the 2026-08-20/08-21 exhaustions: 0 GiB free, every
      # dir <2 days old, so the stale pass freed nothing and could only
      # fail) — LRU-evict idle dirs regardless of age until this job's need
      # is met — the same rails as tinybox-prune.yml's LRU pass, ordered
      # like the emergency purge that recovered both incidents (intentd
      # run 32447747968): by the dir's own top-level mtime, not the
      # prune's recursive last-activity key. Rails in both tiers: never
      # anything outside /raid/ci-target (shared caches like ~/.cargo and
      # ~/.rustup are untouched), never a dir this job may use, and
      # recursive-mtime freshness/activity checks so a dir a live job is
      # writing to is not deleted.
      # Fails with an actionable message if space is still short.
      # Thresholds: 10 GiB here (small target dir with debuginfo off),
      # 30 GiB for the instrumented coverage jobs. Exact no-op on burst
      # runners (step skipped). tinybox-prune.yml does the routine
      # scheduled pruning; this is only the emergency backstop.
      - name: Disk-space preflight (tinybox only)
        if: needs.route.outputs.linux_burst != 'true'
        env:
          NEED_GIB: 10
          JOB_TARGET_SUBDIR: check
        run: |
          set -euo pipefail
          own_dir="/raid/ci-target/intentd/$RUNNER_NAME/$JOB_TARGET_SUBDIR"
          free_gib() { df -Pk /raid | awk 'NR==2 { printf "%d", $4 / 1048576 }'; }
          echo "Free space on /raid: $(free_gib) GiB (need $NEED_GIB GiB)"
          [ "$(free_gib)" -ge "$NEED_GIB" ] && exit 0
          echo "Below threshold — pruning stale ci-target dirs (monorepo#1253)"
          while IFS= read -r entry; do
            dir="${entry#* }"
            case "$dir" in "/raid/ci-target/"?*) ;; *) continue ;; esac
            [ "$dir" = "$own_dir" ] && continue
            # Re-check recursively: only prune if nothing inside was touched
            # within 2 days (a running job keeps its target dir fresh).
            # -mmin gives a strict 48 h window (-mtime rounds to whole days);
            # `|| true` keeps a dir vanishing mid-check (find) or another
            # slot's preflight racing us to the same deletion (rm) from
            # failing the job.
            [ -n "$(find "$dir" -mmin -2880 -print -quit 2>/dev/null || true)" ] && continue
            echo "pruning: $dir"
            rm -rf -- "$dir" || true
            [ "$(free_gib)" -ge "$NEED_GIB" ] && break
          done < <(find /raid/ci-target -mindepth 3 -maxdepth 3 -type d -mmin +2880 -printf '%T@ %p\n' 2>/dev/null | sort -n)
          # Escalation tier: under heavy churn everything on the volume can
          # be <2 days old (the 2026-08-20/08-21 exhaustions), leaving the
          # stale pass nothing to prune — LRU-evict idle ci-target dirs
          # until this job's need is met. Ordering key: the dir's own
          # top-level mtime, matching the emergency purge — not
          # tinybox-prune.yml's recursive last-activity scan. Cargo rarely
          # touches the top level after creation, so this approximates
          # creation order and a recently-used-but-idle dir can be evicted
          # before a colder one; acceptable here, since every candidate is
          # an idle warm cache and the ordering stays cheap for a per-job
          # step. Concurrent preflights on other slots are safe: target
          # dirs are warm caches (eviction costs a rebuild, not
          # correctness), a live job's dir is shielded by the recursive
          # 15-minute activity check (a job actively writing keeps its
          # target dir fresh — though a >15 min quiet phase can look idle,
          # a bounded risk: one retryable job failure, no data loss), the
          # own-slot skip covers every dir this slot may use, and `|| true`
          # on rm tolerates another slot's preflight racing us to the same
          # candidate.
          if [ "$(free_gib)" -lt "$NEED_GIB" ]; then
            echo "Still below threshold — LRU-evicting idle ci-target dirs (monorepo#1253)"
            while IFS= read -r entry; do
              dir="${entry#* }"
              case "$dir" in "/raid/ci-target/"?*) ;; *) continue ;; esac
              case "$dir" in */"$RUNNER_NAME"/*) echo "skipping (own slot): $dir"; continue ;; esac
              [ -n "$(find "$dir" -mmin -15 -print -quit 2>/dev/null || true)" ] && { echo "skipping (active <15min): $dir"; continue; }
              echo "evicting: $dir"
              rm -rf -- "$dir" || true
              [ "$(free_gib)" -ge "$NEED_GIB" ] && break
            done < <(find /raid/ci-target -mindepth 3 -maxdepth 3 -type d -printf '%T@ %p\n' 2>/dev/null | sort -n)
          fi
          free="$(free_gib)"
          if [ "$free" -lt "$NEED_GIB" ]; then
            echo "::error::tinybox /raid has only ${free} GiB free (this job needs ${NEED_GIB} GiB) even after pruning stale dirs and LRU-evicting idle ones — manual cleanup needed, see intent-hq/monorepo#1253."
            exit 1
          fi
      # openssl-sys needs the OpenSSL headers; ubuntu-latest images preinstall
      # libssl-dev but tinybox doesn't. Idempotent (skips once installed) and
      # relies on the runner user's passwordless sudo. Co-tenant jobs on the
      # shared runner race for the apt locks (monorepo#1515):
      # DPkg::Lock::Timeout makes `install` wait for the dpkg locks, and the
      # retry loop covers `update`, whose lists lock has no wait option
      # (Debian bug #1069167).
      - name: Install libssl-dev if missing
        run: |
          if ! pkg-config --exists openssl; then
            for i in 1 2 3; do
              if sudo -n apt-get -o DPkg::Lock::Timeout=300 update -qq; then break; fi
              if [ "$i" -eq 3 ]; then exit 1; fi
              sleep $((i * 15))
            done
            sudo -n apt-get -o DPkg::Lock::Timeout=300 install -y -qq libssl-dev
          fi
      # Keep the target dir OUTSIDE the runner work dir: checkout's default
      # clean (git clean -ffdx) wipes ignored files — including target/ — at
      # the start of every job, and all jobs on this runner share one work
      # dir. A per-job CARGO_TARGET_DIR on /raid survives both, which is
      # what makes builds warm across runs (and why swatinem/rust-cache was
      # dropped: GH cache save/restore would be pure overhead on top of it).
      # The path is also keyed on $RUNNER_NAME: the 8 tinybox runner slots
      # share the box, and without the key concurrent jobs would serialize
      # on cargo's target-dir lock (and the coverage jobs would clobber each
      # other — see their comments). The dirs live on the 300G /raid volume,
      # off the (much smaller) root volume that holds $HOME — the root
      # volume reached box-level ENOSPC when they lived there (monorepo#1253).
      # Trade-off: up to 8 per-slot copies of each job's target dir;
      # tinybox-prune.yml prunes /raid/ci-target on a schedule and the
      # preflight above is the emergency backstop.
      - name: Point CARGO_TARGET_DIR outside the work dir
        if: needs.route.outputs.linux_burst != 'true'
        run: echo "CARGO_TARGET_DIR=/raid/ci-target/intentd/$RUNNER_NAME/check" >> "$GITHUB_ENV"
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      # Ephemeral GitHub-hosted runners have no persistent target dir, so
      # use the GH cache there (pure overhead on tinybox, hence burst-gated).
      - name: Rust cache (burst runner only)
        if: needs.route.outputs.linux_burst == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gh-burst-check
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Per-slot HOME for install-action — see the coverage-e2e job's comment
      # for the full rationale (shared ~/.install-action tmp/bin race across
      # the 8 tinybox slots; monorepo#1239).
      - name: Key install-action dirs per runner slot
        run: |
          if [[ "${{ needs.route.outputs.linux_burst }}" == "true" ]]; then
            echo "INSTALL_ACTION_HOME=$HOME" >> "$GITHUB_ENV"
          else
            echo "INSTALL_ACTION_HOME=$HOME/ci-install-action/$RUNNER_NAME" >> "$GITHUB_ENV"
          fi
      - uses: taiki-e/install-action@cargo-shear
        env:
          HOME: ${{ env.INSTALL_ACTION_HOME }}
      # Blocking unused-dependency gate: fails when any crate declares a
      # dependency its code never uses. --deny-warnings promotes warnings
      # (e.g. unused optional dependencies) to errors so they cannot land
      # either. True false positives (e.g. link-time only deps like intentd's
      # vendored openssl-sys) are suppressed via
      # [package.metadata.cargo-shear] ignored = [...] next to the dependency,
      # each with a comment explaining why.
      - name: Unused dependencies (cargo-shear)
        run: cargo shear --deny-warnings
      # The full suite is not run here: coverage-all executes it (instrumented,
      # via cargo llvm-cov nextest) and is the test gate for PRs. Running it
      # plainly here as well would double the critical path. The exception is
      # the tests the coverage scripts skip: they are flaky under llvm-cov
      # instrumentation / heavy parallel load, so they run here instead —
      # non-instrumented and serially, the conditions under which they pass
      # reliably — to keep them covered on every PR.
      #
      # slow_host_exec_does_not_block_fast_workspace_list (STAB-42) is NOT run:
      # it currently fails deterministically even in an isolated, serial,
      # non-instrumented run (times out at uds_concurrent_dispatch.rs:63), so
      # it stays skipped everywhere until STAB-42 is fixed.
      - name: Coverage-skipped tests (STAB-40/43)
        run: |
          cargo test -p intent-core --lib capture_login_shell_path_with_fake_shell
          cargo test -p intentd --test wss_integration wss_note_save_asset_round_trip
      # The install.ps1 guard tests (intentd-sitter's install_ps1_owner.rs)
      # execute the shipped PowerShell and self-skip when `pwsh` is absent —
      # which let the suite "pass" in ~0.014s without running a single block
      # (intent-hq/monorepo#4054). Provision pwsh 7.x here so the tests
      # actually execute. GitHub-hosted Ubuntu runners (the burst labels)
      # preinstall pwsh, so this is a no-op there; on tinybox the pinned
      # tarball is unpacked once into a per-slot dir (keyed on $RUNNER_NAME
      # like the other per-slot dirs, ~200 MiB, reused across runs — per-slot
      # so concurrent first-time installs on the 8 shared slots cannot
      # clobber each other's downloads, the monorepo#1239 failure mode).
      - name: Provision PowerShell (pwsh) if missing
        run: |
          set -euo pipefail
          if command -v pwsh >/dev/null 2>&1; then
            echo "pwsh already on PATH: $(command -v pwsh) ($(pwsh --version))"
            exit 0
          fi
          version=7.4.6
          sha256=6f6015203c47806c5cc444c19d8ed019695e610fbd948154264bf9ca8e157561
          dest="$HOME/ci-pwsh/${RUNNER_NAME:-local}/$version"
          if [ ! -x "$dest/pwsh" ]; then
            tmp=$(mktemp -d)
            curl -fsSL --retry 3 -o "$tmp/pwsh.tar.gz" \
              "https://github.com/PowerShell/PowerShell/releases/download/v${version}/powershell-${version}-linux-x64.tar.gz"
            echo "$sha256  $tmp/pwsh.tar.gz" | sha256sum -c -
            mkdir -p "$dest"
            tar -xzf "$tmp/pwsh.tar.gz" -C "$dest"
            chmod +x "$dest/pwsh"
            rm -rf "$tmp"
          fi
          echo "$dest" >> "$GITHUB_PATH"
          "$dest/pwsh" --version
      # INTENTD_CI_EXPECT_PWSH makes a missing pwsh FAIL these tests instead
      # of skipping (see install_ps1_owner.rs), so a broken provisioning step
      # above can never quietly turn this suite back into a no-op. The suite
      # runs here rather than relying on coverage-all, where a pwsh-less
      # runner would skip it silently.
      - name: Installer guard tests (install_ps1_owner)
        env:
          INTENTD_CI_EXPECT_PWSH: 1
        run: cargo test -p intentd-sitter --test install_ps1_owner

  # Release-PR fast path (intent-hq/monorepo#1374): release-plz PRs change
  # only version strings + changelog, so the compiled code is identical to
  # what main already tested and the heavy jobs (build matrix, coverage-all,
  # coverage-e2e) add no signal — their ~20 min wall time just makes the PR
  # lose the strict up-to-date race against main. This job diffs the PR
  # against its base and emits fast_path=true only when the diff has exactly
  # the release shape (files ⊆ {CHANGELOG.md, Cargo.lock, crates/*/Cargo.toml}
  # and every non-changelog change is a uniform old→new version-string flip;
  # see scripts/release-pr-fast-path.sh). The diff shape is the ONLY signal —
  # never branch name or author — so a PR can't spoof its way past the heavy
  # checks: any real code change breaks the shape. Fail-safe, not fail-open:
  # the heavy jobs skip only when the output is exactly 'true' (script error,
  # missing output, or job failure falls back to full CI), push runs are
  # never gated, and check / pr-title / conflict-markers /
  # deb-packaging still run on every PR. Job names are unchanged, so the
  # required-check ruleset needs no edits — but the gating mechanism differs
  # by job shape. The non-matrix coverage jobs skip at job level (a skipped
  # job still reports its required context). The build job CANNOT be skipped
  # at job level: a job-level skip prevents the matrix from expanding, so
  # GitHub reports a single skipped check named literally `matrix.name` and
  # the required per-entry contexts (`build (aarch64-apple-darwin, macos-14)`
  # etc.) are never reported, leaving release PRs blocked forever (intentd#868).
  # Instead the build job always runs and every step is gated on
  # fast_path != 'true', so on fast-path PRs each matrix entry completes as
  # an all-steps-skipped success under its required name.
  release-fast-path:
    runs-on: ubuntu-latest
    # Same-repo PRs only (fork PRs get no CI — see the `pull_request`
    # trigger comment).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    outputs:
      fast_path: ${{ steps.decide.outputs.fast_path }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch PR base commit
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
      - name: Evaluate diff shape
        id: decide
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Script contract: prints fast_path=true|false; non-zero exit means
          # no-match. Never fail this step — a broken checker must degrade to
          # full CI, not block the PR.
          out=$(./scripts/release-pr-fast-path.sh "$BASE_SHA" HEAD) || {
            echo "release-pr-fast-path.sh exited non-zero — falling back to full CI"
            out="fast_path=false"
          }
          printf '%s\n' "$out"
          line=$(printf '%s\n' "$out" | grep -E '^fast_path=(true|false)$' | tail -n1 || true)
          echo "${line:-fast_path=false}" >> "$GITHUB_OUTPUT"

  build:
    # Step-gated (NOT job-gated) when the diff is release-PR-shaped: every
    # step below carries `needs.release-fast-path.outputs.fast_path != 'true'`
    # so on fast-path PRs the matrix still expands and each entry reports its
    # required check context as an all-steps-skipped success (see the
    # release-fast-path comment for why a job-level skip breaks matrix
    # required checks). Steps run unless the output is exactly 'true': on
    # push the fast-path job is skipped and the output is empty, and a
    # fast-path failure leaves it empty too, so both fall back to running
    # the full job. `!cancelled()` keeps the job from being auto-skipped
    # when its `needs` dependency was skipped (push) — which is exactly why
    # the fork guard must be explicit here: on a fork PR release-fast-path
    # is skipped, and without the guard `!cancelled()` would still run this
    # job on the self-hosted macOS/Windows runners.
    needs: release-fast-path
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    strategy:
      # Don't let one platform's failure cancel the other's required check.
      fail-fast: false
      matrix:
        include:
          # temporarily disabled — re-enable when needed
          # - target: x86_64-unknown-linux-gnu
          #   os: ubuntu-latest
          # Self-hosted Apple Silicon runner (m1mac). The explicit name below
          # predates a temporary macos-14 stint and pins the required-check
          # context — do not rename it.
          - target: aarch64-apple-darwin
            os: [self-hosted, macOS, ARM64]
            name: build (aarch64-apple-darwin, macos-14)
          - target: x86_64-pc-windows-msvc
            os: [self-hosted, Windows, X64]
            name: build (x86_64-pc-windows-msvc, self-hosted, Windows, X64)
    # Explicit per-entry names (instead of the default matrix-value join) so
    # the required-check contexts in the main ruleset stay stable even when a
    # matrix entry's runner labels change.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Keeps the cargo-check steps free of debuginfo/incremental artifacts
    # (cheaper compile, smaller shared cache). Safe job-wide: the release
    # build is unaffected — these vars only touch the dev/test profiles, and
    # release builds are non-incremental by default.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
        if: needs.release-fast-path.outputs.fast_path != 'true'
      # On the self-hosted Windows runner C:\WINDOWS\system32\bash.EXE (the
      # WSL stub) shadows Git Bash in PATH, and WSL bash can't execute the
      # runner's Windows-path step scripts. Prepend Git's bin dir so every
      # later `shell: bash` step resolves Git Bash instead.
      - name: Put Git Bash first on PATH (Windows)
        if: needs.release-fast-path.outputs.fast_path != 'true' && runner.os == 'Windows'
        shell: cmd
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      # Per-job persistent target dir outside the work dir, self-hosted
      # runners only (see the `check` job's comment for the rationale). The
      # self-hosted runners are single-slot, so no $RUNNER_NAME key. On the
      # Windows runner this runs under Git Bash, where $HOME is an MSYS-style
      # path cargo (spawned from the default pwsh shell) can't use —
      # $USERPROFILE carries the native C:\Users\... form, so prefer it when
      # set.
      - name: Point CARGO_TARGET_DIR outside the work dir (self-hosted)
        if: needs.release-fast-path.outputs.fast_path != 'true' && contains(matrix.os, 'self-hosted')
        shell: bash
        run: echo "CARGO_TARGET_DIR=${USERPROFILE:-$HOME}/ci-target/intentd/build-${{ matrix.target }}" >> "$GITHUB_ENV"
      - name: Resolve pinned Rust channel
        if: needs.release-fast-path.outputs.fast_path != 'true'
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        if: needs.release-fast-path.outputs.fast_path != 'true'
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}
          # clippy is needed by the macOS lint step below; installing it
          # matrix-wide keeps this step unconditional (negligible on Windows).
          components: clippy
      # Ephemeral GitHub-hosted runners have no persistent target dir, so
      # use the GH cache there instead (mirrors the `check` job's
      # burst-runner caching; pure overhead on the self-hosted runners).
      - name: Rust cache (GitHub-hosted runner only)
        if: ${{ needs.release-fast-path.outputs.fast_path != 'true' && !contains(matrix.os, 'self-hosted') }}
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gh-build-${{ matrix.target }}
      # On PRs and merge-queue runs a cheap `cargo check` proves per-target
      # compilation; the full `--release` build (the expensive part, esp. on
      # Windows) only runs on push to main. The "Warm PR check cache" step
      # keeps the persistent target dir warm for PR checks after main builds.
      - name: Check (PR compilation proof)
        if: needs.release-fast-path.outputs.fast_path != 'true' && github.event_name != 'push'
        run: cargo check --workspace --target ${{ matrix.target }}
      # Clippy over macOS-gated code (intent-hq/monorepo#3285): the `check`
      # job lints on Linux, where `#[cfg(target_os = "macos")]` code is never
      # compiled, so warnings in macOS-only files land silently and break
      # `make check` on every macOS dev box. Linting here (PRs only, same
      # invocation as the check job) closes the gap. It runs on this runner
      # rather than as a Linux cross-target run because `cargo clippy
      # --target aarch64-apple-darwin` still executes the native build
      # scripts (libz-sys and friends try-compile C for the target even when
      # pkg-config resolves a system lib), which would require a full darwin
      # cross C toolchain on Linux; the native runner needs nothing extra and
      # shares this job's warm target dir.
      - name: Clippy (macOS-gated code)
        if: needs.release-fast-path.outputs.fast_path != 'true' && github.event_name == 'pull_request' && runner.os == 'macOS'
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Build (release)
        if: needs.release-fast-path.outputs.fast_path != 'true' && github.event_name == 'push'
        run: cargo build --workspace --release --target ${{ matrix.target }}
      - name: Warm PR check cache
        if: needs.release-fast-path.outputs.fast_path != 'true' && github.event_name == 'push'
        run: cargo check --workspace --target ${{ matrix.target }}

  coverage-e2e:
    # Skipped at job level when the diff is release-PR-shaped (safe for
    # non-matrix jobs — a skipped job still reports its required context;
    # see release-fast-path). Fail-safe: skips only when the output is
    # exactly 'true'. The route.result guard preserves the pre-existing
    # behavior that a route failure skips this job. Also skipped on push to
    # main — redundant re-test (see the `on: push` comment); the route.result
    # guard would skip it there anyway (route is push-skipped), the explicit
    # event guard just makes the intent visible.
    # The same-repo clause is belt-and-suspenders for the fork-PR policy
    # (see the `pull_request` trigger comment): the route.result guard
    # already skips this job on fork PRs (route is fork-skipped), but this
    # job can land on tinybox, so it carries the guard explicitly (merge
    # groups come from the repo's own ruleset, so the guard passes there
    # via the event check).
    needs: [route, release-fast-path]
    if: ${{ !cancelled() && github.event_name != 'push' && (github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository) && needs.route.result == 'success' && needs.release-fast-path.outputs.fast_path != 'true' }}
    runs-on: ${{ fromJSON(needs.route.outputs.linux_labels) }}
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      # 16 on the 64-core tinybox: 32 was tuned for exclusive use of the box
      # (at 64 threads the latency-bound stress tests — e.g.
      # e2e_wss_pool_contention_stress's <2s read assert — blew their
      # wall-clock bounds under llvm-cov load on both nextest tries), but up
      # to 8 co-tenant jobs now share the box, so halve to 16 to keep those
      # tests inside their bounds under co-tenancy. This also matches the
      # 16-core gh-linux-16x burst runner, so the value no longer varies by
      # route.
      NEXTEST_TEST_THREADS: 16
    steps:
      - uses: actions/checkout@v7
      # Fail-fast disk preflight — see the `check` job's comment for the full
      # rationale (monorepo#1253). 30 GiB here: the instrumented coverage
      # target dirs are multi-GiB and the run also writes profraw files.
      - name: Disk-space preflight (tinybox only)
        if: needs.route.outputs.linux_burst != 'true'
        env:
          NEED_GIB: 30
          JOB_TARGET_SUBDIR: coverage-e2e
        run: |
          set -euo pipefail
          own_dir="/raid/ci-target/intentd/$RUNNER_NAME/$JOB_TARGET_SUBDIR"
          free_gib() { df -Pk /raid | awk 'NR==2 { printf "%d", $4 / 1048576 }'; }
          echo "Free space on /raid: $(free_gib) GiB (need $NEED_GIB GiB)"
          [ "$(free_gib)" -ge "$NEED_GIB" ] && exit 0
          echo "Below threshold — pruning stale ci-target dirs (monorepo#1253)"
          while IFS= read -r entry; do
            dir="${entry#* }"
            case "$dir" in "/raid/ci-target/"?*) ;; *) continue ;; esac
            [ "$dir" = "$own_dir" ] && continue
            # Re-check recursively: only prune if nothing inside was touched
            # within 2 days (a running job keeps its target dir fresh).
            # -mmin gives a strict 48 h window (-mtime rounds to whole days);
            # `|| true` keeps a dir vanishing mid-check (find) or another
            # slot's preflight racing us to the same deletion (rm) from
            # failing the job.
            [ -n "$(find "$dir" -mmin -2880 -print -quit 2>/dev/null || true)" ] && continue
            echo "pruning: $dir"
            rm -rf -- "$dir" || true
            [ "$(free_gib)" -ge "$NEED_GIB" ] && break
          done < <(find /raid/ci-target -mindepth 3 -maxdepth 3 -type d -mmin +2880 -printf '%T@ %p\n' 2>/dev/null | sort -n)
          # Escalation tier: under heavy churn everything on the volume can
          # be <2 days old (the 2026-08-20/08-21 exhaustions), leaving the
          # stale pass nothing to prune — LRU-evict idle ci-target dirs
          # until this job's need is met. Ordering key: the dir's own
          # top-level mtime, matching the emergency purge — not
          # tinybox-prune.yml's recursive last-activity scan. Cargo rarely
          # touches the top level after creation, so this approximates
          # creation order and a recently-used-but-idle dir can be evicted
          # before a colder one; acceptable here, since every candidate is
          # an idle warm cache and the ordering stays cheap for a per-job
          # step. Concurrent preflights on other slots are safe: target
          # dirs are warm caches (eviction costs a rebuild, not
          # correctness), a live job's dir is shielded by the recursive
          # 15-minute activity check (a job actively writing keeps its
          # target dir fresh — though a >15 min quiet phase can look idle,
          # a bounded risk: one retryable job failure, no data loss), the
          # own-slot skip covers every dir this slot may use, and `|| true`
          # on rm tolerates another slot's preflight racing us to the same
          # candidate.
          if [ "$(free_gib)" -lt "$NEED_GIB" ]; then
            echo "Still below threshold — LRU-evicting idle ci-target dirs (monorepo#1253)"
            while IFS= read -r entry; do
              dir="${entry#* }"
              case "$dir" in "/raid/ci-target/"?*) ;; *) continue ;; esac
              case "$dir" in */"$RUNNER_NAME"/*) echo "skipping (own slot): $dir"; continue ;; esac
              [ -n "$(find "$dir" -mmin -15 -print -quit 2>/dev/null || true)" ] && { echo "skipping (active <15min): $dir"; continue; }
              echo "evicting: $dir"
              rm -rf -- "$dir" || true
              [ "$(free_gib)" -ge "$NEED_GIB" ] && break
            done < <(find /raid/ci-target -mindepth 3 -maxdepth 3 -type d -printf '%T@ %p\n' 2>/dev/null | sort -n)
          fi
          free="$(free_gib)"
          if [ "$free" -lt "$NEED_GIB" ]; then
            echo "::error::tinybox /raid has only ${free} GiB free (this job needs ${NEED_GIB} GiB) even after pruning stale dirs and LRU-evicting idle ones — manual cleanup needed, see intent-hq/monorepo#1253."
            exit 1
          fi
      # See the `check` job's comment: tinybox lacks the OpenSSL headers.
      - name: Install libssl-dev if missing
        run: |
          if ! pkg-config --exists openssl; then
            for i in 1 2 3; do
              if sudo -n apt-get -o DPkg::Lock::Timeout=300 update -qq; then break; fi
              if [ "$i" -eq 3 ]; then exit 1; fi
              sleep $((i * 15))
            done
            sudo -n apt-get -o DPkg::Lock::Timeout=300 install -y -qq libssl-dev
          fi
      # Per-job persistent target dir outside the work dir (see the `check`
      # job's comment for the rationale). cargo llvm-cov honors it, and the
      # scripts' `cargo llvm-cov clean --workspace` only cleans workspace
      # crates + profraw, so dependency artifacts stay warm across runs.
      # The $RUNNER_NAME key is a correctness requirement here, not just
      # lock avoidance: that same clean means two coverage jobs on different
      # slots sharing a dir would delete each other's artifacts mid-run.
      - name: Point CARGO_TARGET_DIR outside the work dir
        if: needs.route.outputs.linux_burst != 'true'
        run: echo "CARGO_TARGET_DIR=/raid/ci-target/intentd/$RUNNER_NAME/coverage-e2e" >> "$GITHUB_ENV"
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: llvm-tools-preview
      # Ephemeral GitHub-hosted runners have no persistent target dir, so
      # use the GH cache there (pure overhead on tinybox, hence burst-gated).
      - name: Rust cache (burst runner only)
        if: needs.route.outputs.linux_burst == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gh-burst-coverage-e2e
      # Node is required (not preinstalled on tinybox, unlike ubuntu-latest):
      # the ACP e2e tests spawn the mock-acp-agent.mjs fixture and silently
      # self-skip without it, which silently drops coverage below the floor.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # install-action derives every path it touches from $HOME: the bin dir
      # (~/.install-action/bin here — tinybox's cargo lives at /usr/local/bin,
      # outside $CARGO_HOME/bin, so the action always takes its fallback) and,
      # crucially, its download scratch dir (~/.install-action/tmp), which is
      # shared even when the bin dir isn't — so keying CARGO_HOME per slot
      # would not help. The 8 tinybox slots share one $HOME, and concurrent
      # installs clobber each other's downloads (curl error 23; monorepo#1239).
      # Point the action at a per-slot HOME (keyed on $RUNNER_NAME like the
      # ci-target dirs) so every path it derives is slot-private; only the
      # install steps see the override, so rustup/CARGO_TARGET_DIR/registry
      # caches under the real $HOME are untouched, and the action still adds
      # its (now per-slot) bin dir to GITHUB_PATH for the later steps. Burst
      # runners are ephemeral single-job machines, so they keep the real HOME.
      - name: Key install-action dirs per runner slot
        run: |
          if [[ "${{ needs.route.outputs.linux_burst }}" == "true" ]]; then
            echo "INSTALL_ACTION_HOME=$HOME" >> "$GITHUB_ENV"
          else
            echo "INSTALL_ACTION_HOME=$HOME/ci-install-action/$RUNNER_NAME" >> "$GITHUB_ENV"
          fi
      - uses: taiki-e/install-action@cargo-llvm-cov
        env:
          HOME: ${{ env.INSTALL_ACTION_HOME }}
      - uses: taiki-e/install-action@nextest
        env:
          HOME: ${{ env.INSTALL_ACTION_HOME }}
      - name: Run e2e coverage
        run: |
          cd ${{ github.workspace }}
          GENERATE_LCOV=1 ./scripts/coverage-e2e.sh 40
      - name: Generate coverage summary
        if: always()
        run: |
          cd ${{ github.workspace }}
          echo "## E2E Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          (cargo llvm-cov report --summary-only 2>/dev/null || echo "Coverage data not available") >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
      # Non-fatal + short retention: the lcov artifact is a debugging aid
      # only, and an org artifact-quota outage must not fail the required
      # check when all tests passed (monorepo#1163).
      - name: Upload coverage artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-coverage-lcov
          path: lcov.info
          if-no-files-found: warn
          retention-days: 3

