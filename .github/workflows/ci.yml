name: CI
on:
  # Push-to-main runs only the release build matrix (+ route, which places
  # its Windows entry, + deb-packaging + gate). The main ruleset routes
  # every merge through the merge queue (see `merge_group` below) and
  # blocks direct pushes, so every main commit's tree is identical to one a
  # merge-queue (or, pre-queue, strict-up-to-date PR) run just tested — the
  # test jobs (check/coverage-e2e/coverage-all) are push-skipped via their
  # `if`s (CI audit, 2026-08).
  push:
    branches: [main]
  # Fork PRs get no CI: external PRs are not accepted (intent-hq/monorepo#417).
  # Every job reachable from pull_request carries a same-repo guard
  # (head.repo.full_name == github.repository) — directly or via the needs
  # chain — so fork PRs consume zero runner time and can never reach the
  # self-hosted tinybox; close-fork-prs.yml auto-closes them. Same-repo PRs
  # are completely unaffected.
  pull_request:
  # Merge-queue runs (intent-hq/monorepo#2893): the queue tests the actual
  # merged tree before it lands on main. CI is tiered by event: pull_request
  # runs the fast feedback jobs (check / build / pr-title / conflict-markers /
  # monorepo-consumer-checks / deb-packaging / release-scripts) plus
  # coverage-changed, which runs only
  # the PR's own changed tests under llvm-cov (pull_request-ONLY; see its
  # comment); merge_group additionally runs the full instrumented coverage
  # jobs (coverage-e2e / coverage-all), which are merge_group-ONLY — they no
  # longer run on pull_request, so a PR's ~20 min coverage wall time is paid
  # once, on the merged tree, instead of on every push to the PR. The gate is
  # event-aware about this (see the gate comment): it requires the coverage
  # jobs outright on merge_group and accepts their skip on pull_request /
  # push, and the reverse for coverage-changed. The build job's target-gated
  # clippy step runs on both pull_request and merge_group (see its comment),
  # so the queue lints the merged tree's macOS / Windows-only code too.
  # Merge groups are created by the repo's own ruleset from already-filed
  # PRs, so they need no same-repo fork guard. pr-title / conflict-markers
  # are PR-metadata checks that stay pull_request-only — the gate accepts
  # their skip.
  merge_group:

permissions:
  contents: read
  pull-requests: read

env:
  # Burst the Linux jobs to GitHub-hosted larger runners when more than
  # this many Linux jobs are queued/running ahead of this run (see the
  # route job). tinybox runs 8 concurrent runner slots, so the threshold
  # tolerates one queued/running job per slot before bursting. Note that
  # jobs still blocked on `needs` are invisible to the jobs API, so only
  # check/coverage jobs already released to tinybox (queued or running
  # there) count toward the depth. Bursted jobs don't carry the
  # self-hosted+Linux labels and stop counting toward the depth, so the
  # system naturally falls back to tinybox as it frees up.
  LINUX_BURST_THRESHOLD: 8

# The heavy jobs share the tinybox's 8 self-hosted runner slots, so cancel
# superseded PR runs instead of letting them back up the queue (push-to-main
# runs are never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides where the heavy Linux jobs (check / coverage-e2e / coverage-all /
  # coverage-changed) run: the local tinybox runner when it is confirmed healthy, or
  # GitHub-hosted larger runners otherwise. Runs on a GitHub-hosted runner so
  # the burst decision is independent of the tinybox queue: when the probe
  # ran on tinybox it queued behind the very backlog it measures (and
  # deadlocked entirely with tinybox offline). The probe FAILS OPEN TO BURST:
  # tinybox is only selected when the probe positively confirms an online
  # self-hosted Linux runner AND an acceptable queue depth — any API error,
  # missing permission, or an offline fleet routes to the burst runners, so
  # CI cannot queue-deadlock when the fleet is down. If the job itself fails
  # (timeout), the routed Linux jobs are skipped and need a re-run — a
  # deliberate trade-off. The same probe also places the build job's Windows
  # matrix entry (intent-hq/intent#5518): the self-hosted 5090pc runner when
  # it is confirmed online, the org-hosted gh-windows-16x runner otherwise —
  # same fail-open rule, no queue-depth check (5090pc is single-slot). The
  # mac build is intentionally not routed — it runs on the self-hosted m1mac
  # (see the build job's matrix).
  route:
    # Runs on every event that runs the build job (push / merge_group /
    # same-repo pull_request) because the build job's Windows entry consumes
    # its decision (intent-hq/intent#5518). On push its Linux consumers
    # (check / coverage-e2e / coverage-all / coverage-changed) are
    # push-skipped by their own `if`s (see the `on: push` comment), so only
    # the Windows decision is used there.
    # Skipped on fork PRs (see the `pull_request` trigger comment): route's
    # skip cascades over the needs chain, skipping check / coverage-e2e /
    # coverage-all / coverage-changed, so fork PRs can never reach tinybox.
    # Runs on merge_group (see the trigger comment) — merge groups come from
    # the repo's own ruleset, so no same-repo guard applies there.
    if: github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Reads the Actions queue; job-level so the other jobs don't inherit
      # it (the optional cross-repo CI_QUEUE_READ_TOKEN is likewise only
      # exposed to this job).
      actions: read
    outputs:
      linux_labels: ${{ steps.decide.outputs.linux_labels }}
      check_labels: ${{ steps.decide.outputs.check_labels }}
      linux_burst: ${{ steps.decide.outputs.linux_burst }}
      windows_labels: ${{ steps.decide.outputs.windows_labels }}
      windows_burst: ${{ steps.decide.outputs.windows_burst }}
    steps:
      - id: decide
        uses: actions/github-script@v9
        env:
          THRESHOLD: ${{ env.LINUX_BURST_THRESHOLD }}
        with:
          # tinybox serves several repos on its runner slots, so the probe
          # wants to size the queue across all of them — but the default
          # GITHUB_TOKEN is repo-scoped and can only see intentd. Set the
          # CI_QUEUE_READ_TOKEN secret (fine-grained PAT with actions:read
          # on the sibling repos) to enable cross-repo counting; without
          # it those repos are skipped and contribute 0. Routing to tinybox
          # additionally requires the token to list the tinybox fleet: the
          # runners are registered at the ORG level (shared across the
          # repos via a runner group), so the token needs the org-level
          # "Self-hosted runners" read permission for the org list to
          # succeed. The default GITHUB_TOKEN cannot carry that permission,
          # so without a suitably-scoped CI_QUEUE_READ_TOKEN the org list
          # errors and the probe falls back to this repo's own runner list
          # (fine-grained "Administration" repository permission, read) —
          # currently empty, so every run bursts (safe: burst is the
          # fail-open default; it just never uses tinybox).
          github-token: ${{ secrets.CI_QUEUE_READ_TOKEN || github.token }}
          script: |
            const tinybox = ["self-hosted", "Linux", "X64"];
            // The coverage jobs run the whole instrumented suite, so they
            // burst to the biggest GH-hosted Linux runner (16-core); check
            // (fmt + clippy + a couple of tests) doesn't come close to
            // saturating that, so it bursts to a cheaper 8-core runner
            // instead.
            const burst = ["gh-linux-16x"];
            const checkBurst = ["gh-linux-8x"];
            // The Windows build entry: the self-hosted 5090pc runner, or
            // the org-hosted 16-core Windows runner (the one
            // release-sitter.yml builds on) — a cold `cargo check` + clippy
            // of the whole workspace is slow on the 4-core windows-latest
            // image.
            const windowsSelfHosted = ["self-hosted", "Windows", "X64"];
            const windowsBurst = ["gh-windows-16x"];
            const threshold = parseInt(process.env.THRESHOLD || "8", 10);
            // FAIL OPEN TO BURST: tinybox is only selected when the probe
            // positively confirms (a) an online self-hosted Linux runner
            // visible to this repo (org-level list, or the repo-level
            // fallback) and (b) a queue depth within the threshold. Any
            // probe error — including a token that cannot list runners —
            // routes to burst, so CI cannot queue-deadlock when the fleet
            // is offline or unreadable. The Windows decision below shares
            // the runner list and rule (a); it has no queue-depth rule.
            //
            // The self-hosted runners are registered at the ORG level
            // (shared across the repos via a runner group), so probe the
            // org runner list first. That call needs the org-level
            // "Self-hosted runners" read permission on the token (see the
            // github-token comment above); when it errors, fall back to
            // the repo-level list, which only sees repo-registered
            // runners (currently none — the degraded mode keeps
            // bursting). An empty list still routes to burst by design
            // (never deadlock on an invisible fleet).
            // NOTE: the org list is NOT scoped to the runner groups this
            // repo can access, so the probe assumes every online
            // self-hosted+Linux+X64 org runner is the tinybox fleet in a
            // group visible to this repo (and likewise every online
            // self-hosted+Windows+X64 runner is 5090pc). Ops invariant:
            // keep the fleet's group visible to the CI repos, and never
            // register generically-labeled org runners outside it — a
            // matching but inaccessible runner would route jobs onto
            // labels nothing can serve. (Group-scoped listing via the
            // runner-groups API was considered and rejected: it needs
            // extra calls per group and fails on plans without
            // runner-group support, which would silently regress the
            // probe to always-burst.)
            let runners = null;
            let runnerSource = "org";
            let runnerListError = null;
            try {
              try {
                runners = await github.paginate(
                  github.rest.actions.listSelfHostedRunnersForOrg,
                  { org: context.repo.owner, per_page: 100 }
                );
              } catch (e) {
                core.info(`org runner list failed (${e.message}); falling back to repo-level list`);
                runnerSource = "repo";
                runners = await github.paginate(
                  github.rest.actions.listSelfHostedRunnersForRepo,
                  { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
                );
              }
            } catch (e) {
              runnerListError = e;
            }
            const onlineWith = (labels) => (runners || []).filter(r =>
              r.status === "online" &&
              labels.every(l => (r.labels || []).some(x => x.name === l))
            );
            let useBurst = true;
            let reason = "fail-open default";
            try {
              if (runnerListError) throw runnerListError;
              const online = onlineWith(tinybox);
              if (online.length === 0) {
                reason = `no online self-hosted Linux runner (${runnerSource} list)`;
              } else {
                // Count self-hosted Linux jobs that are queued or running in
                // queued/in-progress runs: a running job occupies a tinybox
                // slot just as much as a queued one. GitHub-hosted jobs
                // — including this route job and bursted heavy jobs — don't
                // match the self-hosted+Linux label filter, so they never
                // inflate the depth. Sibling-repo probe failures are the
                // documented degraded mode (skip, contribute 0); a failure
                // on this repo's own probe means the depth is unknowable,
                // so it rethrows into the fail-open burst path.
                const owner = context.repo.owner;
                const repos = ["intentd", "cloudlands-fe", "monorepo"];
                let depth = 0;
                for (const repo of repos) {
                  try {
                    for (const status of ["queued", "in_progress"]) {
                      const runs = await github.rest.actions.listWorkflowRunsForRepo({ owner, repo, status, per_page: 20 });
                      for (const run of runs.data.workflow_runs.filter(r => r.id !== context.runId).slice(0, 10)) {
                        const jobs = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: run.id, per_page: 100 });
                        depth += jobs.data.jobs.filter(j => (j.status === "queued" || j.status === "in_progress") && j.labels.includes("self-hosted") && j.labels.includes("Linux")).length;
                      }
                    }
                  } catch (e) {
                    if (repo === context.repo.repo) throw e;
                    core.info(`queue probe skipped ${repo}: ${e.message}`);
                  }
                }
                useBurst = depth > threshold;
                reason = `queue depth=${depth} threshold=${threshold} online=${online.length} (${runnerSource} list)`;
              }
            } catch (e) {
              useBurst = true;
              reason = `probe failed (${e.message})`;
            }
            core.info(`linux routing: burst=${useBurst} (${reason})`);
            core.setOutput("linux_labels", JSON.stringify(useBurst ? burst : tinybox));
            core.setOutput("check_labels", JSON.stringify(useBurst ? checkBurst : tinybox));
            core.setOutput("linux_burst", String(useBurst));
            // Windows (intent-hq/intent#5518): 5090pc is a single-slot
            // runner whose only CI consumer is the build job's Windows
            // entry, so an online runner is selected outright — no queue
            // depth to weigh. Offline, invisible, or unreadable → burst.
            let windowsUseBurst = true;
            let windowsReason = "fail-open default";
            try {
              if (runnerListError) throw runnerListError;
              const online = onlineWith(windowsSelfHosted);
              if (online.length === 0) {
                windowsReason = `no online self-hosted Windows runner (${runnerSource} list)`;
              } else {
                windowsUseBurst = false;
                windowsReason = `online=${online.length} (${runnerSource} list)`;
              }
            } catch (e) {
              windowsUseBurst = true;
              windowsReason = `probe failed (${e.message})`;
            }
            core.info(`windows routing: burst=${windowsUseBurst} (${windowsReason})`);
            core.setOutput("windows_labels", JSON.stringify(windowsUseBurst ? windowsBurst : windowsSelfHosted));
            core.setOutput("windows_burst", String(windowsUseBurst));

  check:
    # Skipped on push to main — redundant re-test of a tree the PR CI already
    # checked (see the `on: push` comment). The expression carries no status
    # function, so the implicit success() still applies: a route failure —
    # or a route skip, as on fork PRs — skips this job on pull_request
    # exactly as before.
    if: github.event_name != 'push'
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.check_labels) }}
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
      # Fail-fast disk preflight (tinybox only; monorepo#1253): the 8 runner
      # slots share one /raid CI-scratch volume, and the per-slot persistent
      # target dirs (see "Point CARGO_TARGET_DIR outside the work dir" below)
      # can fill it — a full volume kills jobs mid-run with ENOSPC. If free
      # space is below the job's threshold, self-prune in two tiers: first
      # stale per-slot ci-target dirs (mtime older than 2 days, oldest
      # first), then — a heavy CI day fills /raid with dirs too fresh for
      # any age window (the 2026-08-20/08-21 exhaustions: 0 GiB free, every
      # dir <2 days old, so the stale pass freed nothing and could only
      # fail) — LRU-evict idle dirs regardless of age until this job's need
      # is met — the same rails as tinybox-prune.yml's LRU pass, ordered
      # like the emergency purge that recovered both incidents (intentd
      # run 32447747968): by the dir's own top-level mtime, not the
      # prune's recursive last-activity key. Rails in both tiers (selection
      # lives in scripts/ci-target-slot.sh purge-candidates, shared with
      # its tests): never anything outside /raid/ci-target (shared caches
      # like ~/.cargo and ~/.rustup are untouched), never a dir this job
      # may use, never a dir carrying a fresh `.in-use` marker (written by
      # every tinybox job's CARGO_TARGET_DIR step and released at job end —
      # intent-hq/intent#5256; a quiet compile phase can no longer make a
      # live dir look idle), and recursive-mtime freshness/activity checks
      # so an unmarked dir a live job is writing to is not deleted either.
      # Fails with an actionable message if space is still short.
      # Thresholds: 10 GiB here (small target dir with debuginfo off),
      # 30 GiB for the instrumented coverage jobs. Exact no-op on burst
      # runners (step skipped). tinybox-prune.yml does the routine
      # scheduled pruning; this is only the emergency backstop.
      - name: Disk-space preflight (tinybox only)
        if: needs.route.outputs.linux_burst != 'true'
        env:
          NEED_GIB: 10
          JOB_TARGET_SUBDIR: check
        run: |
          set -euo pipefail
          own_dir="/raid/ci-target/intentd/$RUNNER_NAME/$JOB_TARGET_SUBDIR"
          free_gib() { df -Pk /raid | awk 'NR==2 { printf "%d", $4 / 1048576 }'; }
          echo "Free space on /raid: $(free_gib) GiB (need $NEED_GIB GiB)"
          [ "$(free_gib)" -ge "$NEED_GIB" ] && exit 0
          # Candidate selection for both tiers lives in
          # scripts/ci-target-slot.sh purge-candidates (path allowlist,
          # own-dir / own-slot skip, `.in-use` marker, recursive activity
          # check; oldest top-level mtime first — intent-hq/intent#5256);
          # this loop only deletes until the need is met. The producer runs
          # ahead of this loop, so a candidate it buffered may have been
          # marked by a job that started while earlier dirs were being
          # deleted: is-purgeable repeats the marker + activity check
          # immediately before each rm. `|| true` on rm tolerates another
          # slot's preflight racing us to the same candidate, and the
          # process substitution keeps a producer cut short by `break` from
          # failing the step.
          evict_until_free() {
            local verb="$1" quiet_min="$2" dir
            shift 2
            while IFS= read -r dir; do
              ./scripts/ci-target-slot.sh is-purgeable "$dir" --quiet-min "$quiet_min" || continue
              echo "$verb: $dir"
              rm -rf -- "$dir" || true
              # `if`, not `[ ] && break`: a function returns its loop's last
              # status, and a final unmet check would abort the step here.
              if [ "$(free_gib)" -ge "$NEED_GIB" ]; then break; fi
            done < <(./scripts/ci-target-slot.sh purge-candidates /raid/ci-target --quiet-min "$quiet_min" "$@")
          }
          # Stale tier: nothing inside touched within 2 days (-mmin gives a
          # strict 48 h window; -mtime rounds to whole days).
          echo "Below threshold — pruning stale ci-target dirs (monorepo#1253)"
          evict_until_free pruning 2880 --skip-dir "$own_dir"
          # Escalation tier: under heavy churn everything on the volume can
          # be <2 days old (the 2026-08-20/08-21 exhaustions), leaving the
          # stale pass nothing to prune — LRU-evict idle ci-target dirs
          # until this job's need is met. Ordering key: the dir's own
          # top-level mtime, matching the emergency purge — not
          # tinybox-prune.yml's recursive last-activity scan. Cargo rarely
          # touches the top level after creation, so this approximates
          # creation order and a recently-used-but-idle dir can be evicted
          # before a colder one; acceptable here, since every candidate is
          # an idle warm cache and the ordering stays cheap for a per-job
          # step. Concurrent preflights on other slots are safe: target
          # dirs are warm caches (eviction costs a rebuild, not
          # correctness), a live job's dir is shielded by its `.in-use`
          # marker and, failing that, the recursive 15-minute activity
          # check, and the own-slot skip covers every dir this slot may use.
          if [ "$(free_gib)" -lt "$NEED_GIB" ]; then
            echo "Still below threshold — LRU-evicting idle ci-target dirs (monorepo#1253)"
            evict_until_free evicting 15 --skip-slot "$RUNNER_NAME"
          fi
          free="$(free_gib)"
          if [ "$free" -lt "$NEED_GIB" ]; then
            echo "::error::tinybox /raid has only ${free} GiB free (this job needs ${NEED_GIB} GiB) even after pruning stale dirs and LRU-evicting idle ones — manual cleanup needed, see intent-hq/monorepo#1253."
            exit 1
          fi
      # openssl-sys needs the OpenSSL headers; ubuntu-latest images preinstall
      # libssl-dev but tinybox doesn't. Idempotent (skips once installed) and
      # relies on the runner user's passwordless sudo. Co-tenant jobs on the
      # shared runner race for the apt locks (monorepo#1515):
      # DPkg::Lock::Timeout makes `install` wait for the dpkg locks, and the
      # retry loop covers `update`, whose lists lock has no wait option
      # (Debian bug #1069167).
      - name: Install libssl-dev if missing
        run: |
          if ! pkg-config --exists openssl; then
            for i in 1 2 3; do
              if sudo -n apt-get -o DPkg::Lock::Timeout=300 update -qq; then break; fi
              if [ "$i" -eq 3 ]; then exit 1; fi
              sleep $((i * 15))
            done
            sudo -n apt-get -o DPkg::Lock::Timeout=300 install -y -qq libssl-dev
          fi
      # Keep the target dir OUTSIDE the runner work dir: checkout's default
      # clean (git clean -ffdx) wipes ignored files — including target/ — at
      # the start of every job, and all jobs on this runner share one work
      # dir. A per-job CARGO_TARGET_DIR on /raid survives both, which is
      # what makes builds warm across runs (and why swatinem/rust-cache was
      # dropped: GH cache save/restore would be pure overhead on top of it).
      # The path is also keyed on $RUNNER_NAME: the 8 tinybox runner slots
      # share the box, and without the key concurrent jobs would serialize
      # on cargo's target-dir lock (and the coverage jobs would clobber each
      # other — see their comments). The dirs live on the 300G /raid volume,
      # off the (much smaller) root volume that holds $HOME — the root
      # volume reached box-level ENOSPC when they lived there (monorepo#1253).
      # Trade-off: up to 8 per-slot copies of each job's target dir;
      # tinybox-prune.yml prunes /raid/ci-target on a schedule and the
      # preflight above is the emergency backstop.
      # Also marks the dir in use (scripts/ci-target-slot.sh mark;
      # intent-hq/intent#5256): every cleaner — the preflight above on other
      # slots, tinybox-prune.yml — skips a dir with a fresh `.in-use`
      # marker, so a quiet compile phase can no longer make a live dir look
      # idle. Released by the job's last step.
      - name: Point CARGO_TARGET_DIR outside the work dir
        if: needs.route.outputs.linux_burst != 'true'
        run: |
          target_dir="/raid/ci-target/intentd/$RUNNER_NAME/check"
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
          ./scripts/ci-target-slot.sh mark "$target_dir"
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-11 (PR 185, --force-non-host)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      # Ephemeral GitHub-hosted runners have no persistent target dir, so
      # use the GH cache there (pure overhead on tinybox, hence burst-gated).
      - name: Rust cache (burst runner only)
        if: needs.route.outputs.linux_burst == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gh-burst-check
      - name: Format check
        run: cargo fmt --check
      # Wrapped in scripts/ci-lld-retry.sh (intent-hq/intent#5256): on the
      # tinybox slots rust-lld has failed to open objects rustc had just
      # written under this job's own target dir (merge-queue run
      # 35200715354 — red in 6 s, queue entry ejected). The wrapper retries
      # exactly once, only on the `rust-lld: error: cannot open ... No such
      # file or directory` signature, after printing host diagnostics
      # (listing of the vanished object's dir, live cargo/rustc processes);
      # every other failure — a genuine lint above all — propagates
      # unchanged, so it never hides a real red.
      - name: Clippy
        run: ./scripts/ci-lld-retry.sh cargo clippy --workspace --all-targets -- -D warnings
      # Source lints: every `crates/*/tests/*_lint.rs` integration test is a
      # source-scanning lint and is selected by the `--test` glob, so a new
      # lint needs no wiring here. Each lint's rationale lives in its module
      # doc; `source_lint_discovery_lint` fails when a `*_lint.rs` file exists
      # that cargo does not expose as a matching test target. The lints run
      # here, next to Clippy, so every PR gets the verdict from the lint job
      # rather than buried in the test matrix.
      - name: Source lints
        env:
          INTENTD_ASSERT_BOUND_CALLER: "1"
        run: cargo test --workspace --test '*_lint'
      # Per-slot HOME for install-action — see the coverage-e2e job's comment
      # for the full rationale (shared ~/.install-action tmp/bin race across
      # the 8 tinybox slots; monorepo#1239).
      - name: Key install-action dirs per runner slot
        run: |
          if [[ "${{ needs.route.outputs.linux_burst }}" == "true" ]]; then
            echo "INSTALL_ACTION_HOME=$HOME" >> "$GITHUB_ENV"
          else
            echo "INSTALL_ACTION_HOME=$HOME/ci-install-action/$RUNNER_NAME" >> "$GITHUB_ENV"
          fi
      - uses: taiki-e/install-action@cargo-shear
        env:
          HOME: ${{ env.INSTALL_ACTION_HOME }}
      # Blocking unused-dependency gate: fails when any crate declares a
      # dependency its code never uses. --deny-warnings promotes warnings
      # (e.g. unused optional dependencies) to errors so they cannot land
      # either. True false positives (e.g. link-time only deps like intentd's
      # vendored openssl-sys) are suppressed via
      # [package.metadata.cargo-shear] ignored = [...] next to the dependency,
      # each with a comment explaining why.
      - name: Unused dependencies (cargo-shear)
        run: cargo shear --deny-warnings
      # The full suite is not run here: coverage-all executes it (instrumented,
      # via cargo llvm-cov nextest) and is the test gate in the merge queue
      # (the coverage jobs are merge_group-only — see the trigger comment).
      # Running it plainly here as well would double the critical path. The
      # exception is the tests the coverage scripts skip: they are flaky under
      # llvm-cov instrumentation / heavy parallel load, so they run here
      # instead — non-instrumented and serially, the conditions under which
      # they pass reliably — to keep them covered on every PR.
      #
      # slow_host_exec_does_not_block_fast_workspace_list (STAB-42) is NOT run:
      # it currently fails deterministically even in an isolated, serial,
      # non-instrumented run (times out at uds_concurrent_dispatch.rs:63), so
      # it stays skipped everywhere until STAB-42 is fixed.
      - name: Coverage-skipped tests (STAB-40/43)
        # Armed bound-caller seam, as on the coverage jobs' run steps (see
        # coverage-e2e) and on this job's other `cargo test` steps (Source
        # lints, Installer guard tests), so no test process runs unarmed.
        env:
          INTENTD_ASSERT_BOUND_CALLER: "1"
        run: |
          cargo test -p intent-core --lib capture_login_shell_path_with_fake_shell
          cargo test -p intentd --test wss_integration wss_note_save_asset_round_trip
      # The install.ps1 guard tests (intentd-sitter's install_ps1_owner.rs)
      # execute the shipped PowerShell and self-skip when `pwsh` is absent —
      # which let the suite "pass" in ~0.014s without running a single block
      # (intent-hq/monorepo#4054). Provision pwsh 7.x here so the tests
      # actually execute. GitHub-hosted Ubuntu runners (the burst labels)
      # preinstall pwsh, so this is a no-op there; on tinybox the pinned
      # tarball is unpacked once into a per-slot dir (keyed on $RUNNER_NAME
      # like the other per-slot dirs, ~180 MiB, reused across runs — per-slot
      # so concurrent first-time installs on the 8 shared slots cannot
      # clobber each other's downloads, the monorepo#1239 failure mode).
      # The cache probe runs the binary, so an executable-but-broken cache
      # self-heals by reinstalling, and the whole slot dir is wiped before a
      # (re)install so a version bump never strands old $version dirs.
      #
      # `pwsh --version` proves only that the binary runs; it never brings up
      # a runspace. On 2026-09-18 every check run on tinybox went red with 14
      # opaque driver failures (intent-hq/intent#5367, run 35346259015)
      # because pwsh died with `Stack overflow.` during startup: the
      # multicore-JIT profile it replays on every start
      # (~/.cache/powershell/StartupProfileData-NonInteractive, rewritten
      # non-atomically at every exit) had been corrupted, and the tinybox
      # slots share one $HOME, so every slot read the same broken file. Two
      # guards below: this step and the guard-test step point XDG_CACHE_HOME
      # at a job-private dir under $RUNNER_TEMP (harmless on burst runners),
      # so CI's own pwsh never reads or writes the shared home cache — the
      # test harness additionally gives each spawned pwsh its own cache dir;
      # and a runspace-initialising probe fails this step with host
      # diagnostics when pwsh cannot start, so a recurrence reads as an
      # environment failure here rather than as 14 test failures below.
      - name: Provision PowerShell (pwsh) if missing
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
        run: |
          set -euo pipefail
          mkdir -p "$XDG_CACHE_HOME"
          if command -v pwsh >/dev/null 2>&1; then
            pwsh_bin=$(command -v pwsh)
            echo "pwsh already on PATH: $pwsh_bin ($("$pwsh_bin" --version))"
          else
            version=7.4.6
            sha256=6f6015203c47806c5cc444c19d8ed019695e610fbd948154264bf9ca8e157561
            slotdir="$HOME/ci-pwsh/${RUNNER_NAME:-local}"
            dest="$slotdir/$version"
            if ! "$dest/pwsh" --version >/dev/null 2>&1; then
              rm -rf "$slotdir"
              tmp=$(mktemp -d)
              curl -fsSL --retry 3 -o "$tmp/pwsh.tar.gz" \
                "https://github.com/PowerShell/PowerShell/releases/download/v${version}/powershell-${version}-linux-x64.tar.gz"
              echo "$sha256  $tmp/pwsh.tar.gz" | sha256sum -c -
              mkdir -p "$dest"
              tar -xzf "$tmp/pwsh.tar.gz" -C "$dest"
              chmod +x "$dest/pwsh"
              rm -rf "$tmp"
            fi
            echo "$dest" >> "$GITHUB_PATH"
            pwsh_bin="$dest/pwsh"
            "$pwsh_bin" --version
          fi
          echo "XDG_CACHE_HOME=$XDG_CACHE_HOME"
          probe_rc=0
          probe_out=$("$pwsh_bin" -NoProfile -NonInteractive -Command 'Write-Output pwsh-ok' 2>&1) || probe_rc=$?
          if [[ $probe_rc -ne 0 || "$probe_out" != *pwsh-ok* ]]; then
            echo "pwsh startup probe failed (rc=$probe_rc):"
            echo "$probe_out"
            echo "--- host diagnostics ---"
            echo "ulimit -s: $(ulimit -s)"
            free -m | head -2
            for cache in "$XDG_CACHE_HOME/powershell" "$HOME/.cache/powershell"; do
              echo "$cache:"
              ls -l --time-style=full-iso "$cache" 2>&1 || true
            done
            echo "::error::pwsh cannot initialise a runspace on ${RUNNER_NAME:-this runner} (intent-hq/intent#5367). Likely a corrupt PowerShell startup profile — on 2026-09-18 it was the shared \$HOME/.cache/powershell/StartupProfileData-NonInteractive; see the diagnostics above and the issue for the fix."
            exit 1
          fi
          echo "pwsh startup probe: $probe_out"
      # INTENTD_CI_EXPECT_PWSH makes a missing pwsh FAIL these tests instead
      # of skipping (see install_ps1_owner.rs), so a broken provisioning step
      # above can never quietly turn this suite back into a no-op. The suite
      # runs here rather than relying on coverage-all, where a pwsh-less
      # runner would skip it silently. XDG_CACHE_HOME matches the provisioning
      # step's job-private cache (intent-hq/intent#5367, see above); the
      # harness narrows it further to a per-run dir for each pwsh it spawns.
      - name: Installer guard tests (install_ps1_owner)
        env:
          INTENTD_CI_EXPECT_PWSH: 1
          INTENTD_ASSERT_BOUND_CALLER: "1"
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
        run: |
          echo "pwsh: $(command -v pwsh) ($(pwsh --version)); XDG_CACHE_HOME=$XDG_CACHE_HOME; ulimit -s: $(ulimit -s)"
          cargo test -p intentd-sitter --test install_ps1_owner
      # Release the `.in-use` marker the CARGO_TARGET_DIR step wrote
      # (intent-hq/intent#5256). `always()` so a failed or cancelled job
      # does not leave a live marker behind; a runner that dies mid-job
      # leaves one that expires on its own after 4 h (see
      # scripts/ci-target-slot.sh). Skipped on burst runners, where
      # CARGO_TARGET_DIR is never set.
      - name: Release per-slot target dir
        if: ${{ always() && env.CARGO_TARGET_DIR != '' }}
        run: ./scripts/ci-target-slot.sh unmark "$CARGO_TARGET_DIR"

  # Release-PR fast path (intent-hq/monorepo#1374): release-plz PRs change
  # only version strings + changelog, so the compiled code is identical to
  # what main already tested and the heavy jobs (build matrix, and — before
  # they became merge_group-only, see the trigger comment — coverage-all /
  # coverage-e2e) add no signal — their ~20 min wall time just makes the PR
  # lose the strict up-to-date race against main. This job diffs the PR
  # against its base and emits fast_path=true only when the diff has exactly
  # the release shape (files ⊆ {CHANGELOG.md, Cargo.lock, crates/*/Cargo.toml}
  # and every non-changelog change is a uniform old→new version-string flip;
  # see scripts/release-pr-fast-path.sh). The diff shape is the ONLY signal —
  # never branch name or author — so a PR can't spoof its way past the heavy
  # checks: any real code change breaks the shape. Fail-safe, not fail-open:
  # the heavy jobs skip only when the output is exactly 'true' (script error,
  # missing output, or job failure falls back to full CI), push runs are
  # never gated, and check / pr-title / conflict-markers /
  # deb-packaging still run on every PR. Job names are unchanged, so the
  # required-check ruleset needs no edits — but the gating mechanism differs
  # by job shape. The coverage jobs are no longer consumers of this output:
  # they are merge_group-only (job-level skipped on every pull_request run,
  # fast path or not — a skipped job still reports its required context).
  # The build job CANNOT be skipped at job level: a job-level skip prevents
  # the matrix from expanding, so GitHub reports a single skipped check named
  # literally `matrix.name` and the required per-entry contexts
  # (`build (aarch64-apple-darwin, macos-14)` etc.) are never reported,
  # leaving release PRs blocked forever (intentd#868).
  # Instead the build job always runs and every step is gated on
  # fast_path != 'true', so on fast-path PRs each matrix entry completes as
  # an all-steps-skipped success under its required name.
  release-fast-path:
    runs-on: ubuntu-latest
    # Same-repo PRs only (fork PRs get no CI — see the `pull_request`
    # trigger comment).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    outputs:
      fast_path: ${{ steps.decide.outputs.fast_path }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch PR base commit
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
      - name: Evaluate diff shape
        id: decide
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Script contract: prints fast_path=true|false; non-zero exit means
          # no-match. Never fail this step — a broken checker must degrade to
          # full CI, not block the PR.
          out=$(./scripts/release-pr-fast-path.sh "$BASE_SHA" HEAD) || {
            echo "release-pr-fast-path.sh exited non-zero — falling back to full CI"
            out="fast_path=false"
          }
          printf '%s\n' "$out"
          line=$(printf '%s\n' "$out" | grep -E '^fast_path=(true|false)$' | tail -n1 || true)
          echo "${line:-fast_path=false}" >> "$GITHUB_OUTPUT"

  build:
    # Step-gated (NOT job-gated) when the diff is release-PR-shaped: every
    # step below carries `needs.release-fast-path.outputs.fast_path != 'true'`
    # so on fast-path PRs the matrix still expands and each entry reports its
    # required check context as an all-steps-skipped success (see the
    # release-fast-path comment for why a job-level skip breaks matrix
    # required checks). Steps run unless the output is exactly 'true': on
    # push and merge_group the fast-path job is skipped and the output is
    # empty, and a fast-path failure leaves it empty too, so all fall back
    # to running the full job. `!cancelled()` keeps the job from being
    # auto-skipped when a `needs` dependency was skipped (release-fast-path
    # on push / merge_group) or failed (route) — which is exactly why
    # the fork guard must be explicit here: on a fork PR both dependencies
    # are skipped, and without the guard `!cancelled()` would still run this
    # job on the self-hosted macOS/Windows runners.
    # `route` places the Windows entry (intent-hq/intent#5518; see the
    # matrix) and runs on every event this job runs on. route runs on
    # ubuntu-latest, so this dependency can never queue behind the
    # self-hosted runners it decides about.
    needs: [release-fast-path, route]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    strategy:
      # Don't let one platform's failure cancel the other's required check.
      fail-fast: false
      matrix:
        include:
          # temporarily disabled — re-enable when needed
          # - target: x86_64-unknown-linux-gnu
          #   os: ubuntu-latest
          # Self-hosted Apple Silicon runner (m1mac). The explicit name below
          # predates a temporary macos-14 stint and pins the required-check
          # context — do not rename it.
          - target: aarch64-apple-darwin
            os: [self-hosted, macOS, ARM64]
            name: build (aarch64-apple-darwin, macos-14)
          # Routed by the route job (intent-hq/intent#5518): the self-hosted
          # 5090pc runner when the probe confirms it online, the org-hosted
          # gh-windows-16x runner otherwise (fail-open to burst, like the
          # Linux jobs — an offline 5090pc used to leave this required check
          # QUEUED forever and block every merge: intent-hq/intent#1382,
          # #1583). The self-hosted labels are selected ONLY when route
          # positively emitted them: an empty output — route failed, timed
          # out, or was skipped (`!cancelled()` still runs this job) — falls
          # back to the burst label, never to a runner nothing confirmed
          # online. (The fallback also keeps `fromJSON('')` from failing the
          # matrix expansion and dropping the required contexts.) The name
          # below pins the required-check context — do not rename it.
          - target: x86_64-pc-windows-msvc
            os: ${{ fromJSON(needs.route.outputs.windows_labels || '["gh-windows-16x"]') }}
            name: build (x86_64-pc-windows-msvc, self-hosted, Windows, X64)
    # Explicit per-entry names (instead of the default matrix-value join) so
    # the required-check contexts in the main ruleset stay stable even when a
    # matrix entry's runner labels change (or are routed at run time).
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Keeps the cargo-check steps free of debuginfo/incremental artifacts
    # (cheaper compile, smaller shared cache). Safe job-wide: the release
    # build is unaffected — these vars only touch the dev/test profiles, and
    # release builds are non-incremental by default.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
        if: needs.release-fast-path.outputs.fast_path != 'true'
      # On the self-hosted Windows runner C:\WINDOWS\system32\bash.EXE (the
      # WSL stub) shadows Git Bash in PATH, and WSL bash can't execute the
      # runner's Windows-path step scripts. Prepend Git's bin dir so every
      # later `shell: bash` step resolves Git Bash instead.
      - name: Put Git Bash first on PATH (Windows)
        if: needs.release-fast-path.outputs.fast_path != 'true' && runner.os == 'Windows'
        shell: cmd
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      # Per-job persistent target dir outside the work dir, self-hosted
      # runners only (see the `check` job's comment for the rationale). The
      # self-hosted runners are single-slot, so no $RUNNER_NAME key. On the
      # Windows runner this runs under Git Bash, where $HOME is an MSYS-style
      # path cargo (spawned from the default pwsh shell) can't use —
      # $USERPROFILE carries the native C:\Users\... form, so prefer it when
      # set.
      - name: Point CARGO_TARGET_DIR outside the work dir (self-hosted)
        if: needs.release-fast-path.outputs.fast_path != 'true' && contains(matrix.os, 'self-hosted')
        shell: bash
        run: echo "CARGO_TARGET_DIR=${USERPROFILE:-$HOME}/ci-target/intentd/build-${{ matrix.target }}" >> "$GITHUB_ENV"
      - name: Resolve pinned Rust channel
        if: needs.release-fast-path.outputs.fast_path != 'true'
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-11 (PR 185, --force-non-host)
        if: needs.release-fast-path.outputs.fast_path != 'true'
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}
          # clippy is needed by the target-gated lint step below, which runs
          # on both the macOS and the Windows matrix entries.
          components: clippy
      # Ephemeral GitHub-hosted runners have no persistent target dir, so
      # use the GH cache there instead (mirrors the `check` job's
      # burst-runner caching; pure overhead on the self-hosted runners).
      - name: Rust cache (GitHub-hosted runner only)
        if: ${{ needs.release-fast-path.outputs.fast_path != 'true' && !contains(matrix.os, 'self-hosted') }}
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gh-build-${{ matrix.target }}
      # On PRs and merge-queue runs a cheap `cargo check` proves per-target
      # compilation; the full `--release` build (the expensive part, esp. on
      # Windows) only runs on push to main. The "Warm PR check cache" step
      # keeps the persistent target dir warm for PR checks after main builds.
      - name: Check (PR compilation proof)
        if: needs.release-fast-path.outputs.fast_path != 'true' && github.event_name != 'push'
        run: cargo check --workspace --target ${{ matrix.target }}
      # Clippy over target-gated code (intent-hq/monorepo#3285 for macOS,
      # intent-hq/intentd#1813 for Windows): the `check` job lints on Linux,
      # where `#[cfg(target_os = "macos")]` / `#[cfg(windows)]` /
      # `#[cfg(not(unix))]` code is never compiled, so warnings in
      # target-only code (including outer `#[allow]`s that only expand there
      # and trip `clippy::allow_attributes`) land silently and break
      # `make check` on every macOS or Windows dev box. Linting here (same
      # invocation as the check job) closes the gap. It runs on PRs and on
      # merge-queue runs, not on push: the queue tests the actual merged
      # tree, and a PR-only step let intent-hq/intentd#1825 (green on its
      # own PR run) land a Windows-only E0433 via the queue — main's push
      # run skipped the step, so ~8 open PRs failed the required gate until
      # intent-hq/intentd#1835 fixed it. Main's push run builds a tree the
      # queue already linted, so it stays skipped there. It runs on the
      # native runners rather than as Linux cross-target runs because
      # `cargo clippy --target <triple>` still executes the native build
      # scripts (libz-sys and friends try-compile C for the target even when
      # pkg-config resolves a system lib), which would require a full
      # darwin / MSVC cross C toolchain on Linux; the native runners need
      # nothing extra and share this job's warm target dir. release-fast-path
      # is pull_request-only, so its output is empty on merge_group and the
      # `!= 'true'` guard lets the step run there (same as the check step).
      - name: Clippy (target-gated code)
        if: needs.release-fast-path.outputs.fast_path != 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && (runner.os == 'macOS' || runner.os == 'Windows')
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Build (release)
        if: needs.release-fast-path.outputs.fast_path != 'true' && github.event_name == 'push'
        run: cargo build --workspace --release --target ${{ matrix.target }}
      - name: Warm PR check cache
        if: needs.release-fast-path.outputs.fast_path != 'true' && github.event_name == 'push'
        run: cargo check --workspace --target ${{ matrix.target }}

  coverage-e2e:
    # merge_group-ONLY (see the `merge_group` trigger comment): the
    # instrumented suite runs once, against the queue's merged tree, and is
    # job-level skipped on every pull_request and push run — a skipped job
    # still reports its required context, and the gate is event-aware about
    # the skip (required outright on merge_group, accepted elsewhere). The
    # event check makes the intent visible; the route.result guard preserves
    # the pre-existing behavior that a route failure skips this job (and
    # would skip it on fork PRs anyway, where route itself is skipped).
    # Nothing here may reference github.event.pull_request — that
    # context does not exist on merge_group. release-fast-path is no longer a
    # dependency: it is pull_request-only, so its output is empty on
    # merge_group and must not be required; the fast-path skip it used to
    # provide is subsumed by the pull_request skip. Merge groups come from
    # the repo's own ruleset, so no same-repo fork guard applies.
    needs: route
    if: ${{ !cancelled() && github.event_name == 'merge_group' && needs.route.result == 'success' }}
    runs-on: ${{ fromJSON(needs.route.outputs.linux_labels) }}
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      # 16 on the 64-core tinybox: 32 was tuned for exclusive use of the box
      # (at 64 threads the latency-bound stress tests — e.g.
      # e2e_wss_pool_contention_stress's <2s read assert — blew their
      # wall-clock bounds under llvm-cov load on both nextest tries), but up
      # to 8 co-tenant jobs now share the box, so halve to 16 to keep those
      # tests inside their bounds under co-tenancy. This also matches the
      # 16-core gh-linux-16x burst runner, so the value no longer varies by
      # route.
      NEXTEST_TEST_THREADS: 16
    steps:
      - uses: actions/checkout@v7
      # Fail-fast disk preflight — see the `check` job's comment for the full
      # rationale (monorepo#1253). 30 GiB here: the instrumented coverage
      # target dirs are multi-GiB and the run also writes profraw files.
      - name: Disk-space preflight (tinybox only)
        if: needs.route.outputs.linux_burst != 'true'
        env:
          NEED_GIB: 30
          JOB_TARGET_SUBDIR: coverage-e2e
        run: |
          set -euo pipefail
          own_dir="/raid/ci-target/intentd/$RUNNER_NAME/$JOB_TARGET_SUBDIR"
          free_gib() { df -Pk /raid | awk 'NR==2 { printf "%d", $4 / 1048576 }'; }
          echo "Free space on /raid: $(free_gib) GiB (need $NEED_GIB GiB)"
          [ "$(free_gib)" -ge "$NEED_GIB" ] && exit 0
          # Same two tiers as the `check` job's preflight (see its comment):
          # selection in scripts/ci-target-slot.sh purge-candidates, a live
          # is-purgeable recheck before each rm, this loop only deletes
          # until the need is met.
          evict_until_free() {
            local verb="$1" quiet_min="$2" dir
            shift 2
            while IFS= read -r dir; do
              ./scripts/ci-target-slot.sh is-purgeable "$dir" --quiet-min "$quiet_min" || continue
              echo "$verb: $dir"
              rm -rf -- "$dir" || true
              if [ "$(free_gib)" -ge "$NEED_GIB" ]; then break; fi
            done < <(./scripts/ci-target-slot.sh purge-candidates /raid/ci-target --quiet-min "$quiet_min" "$@")
          }
          echo "Below threshold — pruning stale ci-target dirs (monorepo#1253)"
          evict_until_free pruning 2880 --skip-dir "$own_dir"
          if [ "$(free_gib)" -lt "$NEED_GIB" ]; then
            echo "Still below threshold — LRU-evicting idle ci-target dirs (monorepo#1253)"
            evict_until_free evicting 15 --skip-slot "$RUNNER_NAME"
          fi
          free="$(free_gib)"
          if [ "$free" -lt "$NEED_GIB" ]; then
            echo "::error::tinybox /raid has only ${free} GiB free (this job needs ${NEED_GIB} GiB) even after pruning stale dirs and LRU-evicting idle ones — manual cleanup needed, see intent-hq/monorepo#1253."
            exit 1
          fi
      # See the `check` job's comment: tinybox lacks the OpenSSL headers.
      - name: Install libssl-dev if missing
        run: |
          if ! pkg-config --exists openssl; then
            for i in 1 2 3; do
              if sudo -n apt-get -o DPkg::Lock::Timeout=300 update -qq; then break; fi
              if [ "$i" -eq 3 ]; then exit 1; fi
              sleep $((i * 15))
            done
            sudo -n apt-get -o DPkg::Lock::Timeout=300 install -y -qq libssl-dev
          fi
      # Per-job persistent target dir outside the work dir (see the `check`
      # job's comment for the rationale). cargo llvm-cov honors it, and the
      # scripts' `cargo llvm-cov clean --workspace` only cleans workspace
      # crates + profraw, so dependency artifacts stay warm across runs.
      # The $RUNNER_NAME key is a correctness requirement here, not just
      # lock avoidance: that same clean means two coverage jobs on different
      # slots sharing a dir would delete each other's artifacts mid-run.
      # Also marks the dir in use — see the `check` job's CARGO_TARGET_DIR
      # step (intent-hq/intent#5256); released by the job's last step.
      - name: Point CARGO_TARGET_DIR outside the work dir
        if: needs.route.outputs.linux_burst != 'true'
        run: |
          target_dir="/raid/ci-target/intentd/$RUNNER_NAME/coverage-e2e"
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
          ./scripts/ci-target-slot.sh mark "$target_dir"
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-11 (PR 185, --force-non-host)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: llvm-tools-preview
      # Ephemeral GitHub-hosted runners have no persistent target dir, so
      # use the GH cache there (pure overhead on tinybox, hence burst-gated).
      - name: Rust cache (burst runner only)
        if: needs.route.outputs.linux_burst == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gh-burst-coverage-e2e
      # Node is required (not preinstalled on tinybox, unlike ubuntu-latest):
      # the ACP e2e tests spawn the mock-acp-agent.mjs fixture and silently
      # self-skip without it, which silently drops coverage below the floor.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # install-action derives every path it touches from $HOME: the bin dir
      # (~/.install-action/bin here — tinybox's cargo lives at /usr/local/bin,
      # outside $CARGO_HOME/bin, so the action always takes its fallback) and,
      # crucially, its download scratch dir (~/.install-action/tmp), which is
      # shared even when the bin dir isn't — so keying CARGO_HOME per slot
      # would not help. The 8 tinybox slots share one $HOME, and concurrent
      # installs clobber each other's downloads (curl error 23; monorepo#1239).
      # Point the action at a per-slot HOME (keyed on $RUNNER_NAME like the
      # ci-target dirs) so every path it derives is slot-private; only the
      # install steps see the override, so rustup/CARGO_TARGET_DIR/registry
      # caches under the real $HOME are untouched, and the action still adds
      # its (now per-slot) bin dir to GITHUB_PATH for the later steps. Burst
      # runners are ephemeral single-job machines, so they keep the real HOME.
      - name: Key install-action dirs per runner slot
        run: |
          if [[ "${{ needs.route.outputs.linux_burst }}" == "true" ]]; then
            echo "INSTALL_ACTION_HOME=$HOME" >> "$GITHUB_ENV"
          else
            echo "INSTALL_ACTION_HOME=$HOME/ci-install-action/$RUNNER_NAME" >> "$GITHUB_ENV"
          fi
      - uses: taiki-e/install-action@cargo-llvm-cov
        env:
          HOME: ${{ env.INSTALL_ACTION_HOME }}
      - uses: taiki-e/install-action@nextest
        env:
          HOME: ${{ env.INSTALL_ACTION_HOME }}
      - name: Run e2e coverage
        # Arm the bound-caller seam for the test processes themselves, not
        # only the daemons they spawn: a direct-call test that evaluates a
        # capability gate without a bound `Caller` aborts (nextest runs each
        # test in its own process, so only that test goes red) instead of
        # degrading into the `Forbidden` fallback and passing on a stale
        # subject — #2009's auto-commit tests did exactly that under #1877's
        # gate (runs 106012504874 / 106012511900; fixed by 638cc64bb). See
        # `intent_services::capability::ASSERT_BOUND_CALLER_ENV`.
        env:
          INTENTD_ASSERT_BOUND_CALLER: "1"
        run: |
          cd ${{ github.workspace }}
          GENERATE_LCOV=1 ./scripts/coverage-e2e.sh 40
      - name: Generate coverage summary
        if: always()
        run: |
          cd ${{ github.workspace }}
          echo "## E2E Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          # The script tees its summary to coverage-summary.txt; re-running
          # the report (~30s) is only a fallback for a run that died before
          # reporting (intent-hq/monorepo#4260).
          if [[ -s coverage-summary.txt ]]; then
            cat coverage-summary.txt >> $GITHUB_STEP_SUMMARY
          else
            (cargo llvm-cov report --summary-only 2>/dev/null || echo "Coverage data not available") >> $GITHUB_STEP_SUMMARY
          fi
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
      # Non-fatal + short retention: the lcov artifact is a debugging aid
      # only, and an org artifact-quota outage must not fail the required
      # check when all tests passed (monorepo#1163).
      - name: Upload coverage artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-coverage-lcov
          path: lcov.info
          if-no-files-found: warn
          retention-days: 3
      # Release the `.in-use` marker — see the `check` job's last step
      # (intent-hq/intent#5256).
      - name: Release per-slot target dir
        if: ${{ always() && env.CARGO_TARGET_DIR != '' }}
        run: ./scripts/ci-target-slot.sh unmark "$CARGO_TARGET_DIR"

  coverage-all:
    # merge_group-ONLY — same gating and rationale as coverage-e2e (see its
    # comment and the `merge_group` trigger comment): job-level skipped on
    # every pull_request and push run, required outright by the gate on
    # merge_group. No github.event.pull_request reference (absent on
    # merge_group) and no release-fast-path dependency (pull_request-only,
    # empty output on merge_group).
    needs: route
    if: ${{ !cancelled() && github.event_name == 'merge_group' && needs.route.result == 'success' }}
    runs-on: ${{ fromJSON(needs.route.outputs.linux_labels) }}
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      # 16 on the 64-core tinybox: 32 was tuned for exclusive use of the box
      # (at 64 threads the full workspace suite thrashed SQLite/WAL and
      # wall-clock-timeout tests hard enough that even the nextest retry
      # failed: concurrent_writes_no_sqlite_busy hit "database is locked" on
      # both tries, bridge/auto-commit timing tests timed out), but up to 8
      # co-tenant jobs now share the box, so halve to 16 to avoid the lock
      # storms under co-tenancy. This also matches the 16-core gh-linux-16x
      # burst runner, so the value no longer varies by route.
      NEXTEST_TEST_THREADS: 16
    steps:
      - uses: actions/checkout@v7
      # Fail-fast disk preflight — see the `check` job's comment for the full
      # rationale (monorepo#1253). 30 GiB here: the instrumented coverage
      # target dirs are multi-GiB and the run also writes profraw files.
      - name: Disk-space preflight (tinybox only)
        if: needs.route.outputs.linux_burst != 'true'
        env:
          NEED_GIB: 30
          JOB_TARGET_SUBDIR: coverage-all
        run: |
          set -euo pipefail
          own_dir="/raid/ci-target/intentd/$RUNNER_NAME/$JOB_TARGET_SUBDIR"
          free_gib() { df -Pk /raid | awk 'NR==2 { printf "%d", $4 / 1048576 }'; }
          echo "Free space on /raid: $(free_gib) GiB (need $NEED_GIB GiB)"
          [ "$(free_gib)" -ge "$NEED_GIB" ] && exit 0
          # Same two tiers as the `check` job's preflight (see its comment):
          # selection in scripts/ci-target-slot.sh purge-candidates, a live
          # is-purgeable recheck before each rm, this loop only deletes
          # until the need is met.
          evict_until_free() {
            local verb="$1" quiet_min="$2" dir
            shift 2
            while IFS= read -r dir; do
              ./scripts/ci-target-slot.sh is-purgeable "$dir" --quiet-min "$quiet_min" || continue
              echo "$verb: $dir"
              rm -rf -- "$dir" || true
              if [ "$(free_gib)" -ge "$NEED_GIB" ]; then break; fi
            done < <(./scripts/ci-target-slot.sh purge-candidates /raid/ci-target --quiet-min "$quiet_min" "$@")
          }
          echo "Below threshold — pruning stale ci-target dirs (monorepo#1253)"
          evict_until_free pruning 2880 --skip-dir "$own_dir"
          if [ "$(free_gib)" -lt "$NEED_GIB" ]; then
            echo "Still below threshold — LRU-evicting idle ci-target dirs (monorepo#1253)"
            evict_until_free evicting 15 --skip-slot "$RUNNER_NAME"
          fi
          free="$(free_gib)"
          if [ "$free" -lt "$NEED_GIB" ]; then
            echo "::error::tinybox /raid has only ${free} GiB free (this job needs ${NEED_GIB} GiB) even after pruning stale dirs and LRU-evicting idle ones — manual cleanup needed, see intent-hq/monorepo#1253."
            exit 1
          fi
      # See the `check` job's comment: tinybox lacks the OpenSSL headers.
      - name: Install libssl-dev if missing
        run: |
          if ! pkg-config --exists openssl; then
            for i in 1 2 3; do
              if sudo -n apt-get -o DPkg::Lock::Timeout=300 update -qq; then break; fi
              if [ "$i" -eq 3 ]; then exit 1; fi
              sleep $((i * 15))
            done
            sudo -n apt-get -o DPkg::Lock::Timeout=300 install -y -qq libssl-dev
          fi
      # Raise the per-user inotify instance ceiling. The instrumented full
      # suite starts many real notify watchers in parallel (file, .git
      # metadata, skills, specialists) and up to 8 co-tenant runner slots
      # share the same user on the tinybox, so the kernel default of 128
      # instances can exhaust mid-run — watcher starts in unrelated tests
      # then fail with EMFILE "Too many open files" (intentd PR #882).
      # Relies on the runner user's passwordless sudo, like the step above.
      - name: Raise inotify instance limit
        run: sudo -n sysctl -q -w fs.inotify.max_user_instances=4096
      # Per-job persistent target dir outside the work dir (see the `check`
      # job's comment for the rationale). cargo llvm-cov honors it, and the
      # scripts' `cargo llvm-cov clean --workspace` only cleans workspace
      # crates + profraw, so dependency artifacts stay warm across runs.
      # The $RUNNER_NAME key is a correctness requirement here, not just
      # lock avoidance: that same clean means two coverage jobs on different
      # slots sharing a dir would delete each other's artifacts mid-run.
      # Also marks the dir in use — see the `check` job's CARGO_TARGET_DIR
      # step (intent-hq/intent#5256); released by the job's last step.
      - name: Point CARGO_TARGET_DIR outside the work dir
        if: needs.route.outputs.linux_burst != 'true'
        run: |
          target_dir="/raid/ci-target/intentd/$RUNNER_NAME/coverage-all"
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
          ./scripts/ci-target-slot.sh mark "$target_dir"
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-11 (PR 185, --force-non-host)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: llvm-tools-preview
      # Ephemeral GitHub-hosted runners have no persistent target dir, so
      # use the GH cache there (pure overhead on tinybox, hence burst-gated).
      - name: Rust cache (burst runner only)
        if: needs.route.outputs.linux_burst == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gh-burst-coverage-all
      # Node is required (not preinstalled on tinybox, unlike ubuntu-latest):
      # the ACP e2e tests spawn the mock-acp-agent.mjs fixture and silently
      # self-skip without it, which silently drops coverage below the floor.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Per-slot HOME for install-action — see the coverage-e2e job's comment
      # for the full rationale (shared ~/.install-action tmp/bin race across
      # the 8 tinybox slots; monorepo#1239).
      - name: Key install-action dirs per runner slot
        run: |
          if [[ "${{ needs.route.outputs.linux_burst }}" == "true" ]]; then
            echo "INSTALL_ACTION_HOME=$HOME" >> "$GITHUB_ENV"
          else
            echo "INSTALL_ACTION_HOME=$HOME/ci-install-action/$RUNNER_NAME" >> "$GITHUB_ENV"
          fi
      - uses: taiki-e/install-action@cargo-llvm-cov
        env:
          HOME: ${{ env.INSTALL_ACTION_HOME }}
      - uses: taiki-e/install-action@nextest
        env:
          HOME: ${{ env.INSTALL_ACTION_HOME }}
      - name: Run combined coverage
        # Armed bound-caller seam — see coverage-e2e's run step.
        env:
          INTENTD_ASSERT_BOUND_CALLER: "1"
        run: |
          cd ${{ github.workspace }}
          GENERATE_LCOV=1 ./scripts/coverage-all.sh 80
      - name: Generate coverage summary
        if: always()
        run: |
          cd ${{ github.workspace }}
          echo "## Combined Coverage Report (all tests)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          # Same reuse-or-fallback as coverage-e2e's summary step.
          if [[ -s coverage-summary.txt ]]; then
            cat coverage-summary.txt >> $GITHUB_STEP_SUMMARY
          else
            (cargo llvm-cov report --summary-only 2>/dev/null || echo "Coverage data not available") >> $GITHUB_STEP_SUMMARY
          fi
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
      # Non-fatal + short retention — same rationale as coverage-e2e's
      # upload step (monorepo#1163).
      - name: Upload coverage artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: combined-coverage-lcov
          path: lcov.info
          if-no-files-found: warn
          retention-days: 3
      # Release the `.in-use` marker — see the `check` job's last step
      # (intent-hq/intent#5256).
      - name: Release per-slot target dir
        if: ${{ always() && env.CARGO_TARGET_DIR != '' }}
        run: ./scripts/ci-target-slot.sh unmark "$CARGO_TARGET_DIR"

  # pull_request-ONLY counterpart of coverage-e2e / coverage-all
  # (intent-hq/intentd#1947): a test that was 20/20 green on its PR failed only
  # under the merge queue's llvm-cov instrumentation and ejected the PR, so
  # every same-repo PR now runs the nextest selection derived from its own
  # changed paths (scripts/changed-tests.sh --instrumented — the same env,
  # flags and auggie_context_e2e exclusion as scripts/coverage-e2e.sh) under
  # instrumentation before it can be enqueued. The full instrumented suite
  # stays merge_group-only (intent-hq/intent#4260). Two phases: a cheap
  # bash+git dry run FIRST computes the selection, and every heavy step
  # (disk preflight, libssl, toolchain, caches, cargo-llvm-cov / nextest
  # install, the run itself) is gated on it having found something, so a PR
  # without crates/ changes finishes in seconds. Gated like check on
  # pull_request: required outright by the gate there (a skip after a route
  # failure fails the gate), accepted as skipped on merge_group / push where
  # it is job-level skipped by design. github.event.pull_request is only
  # read inside the job (absent on merge_group, where the job never runs).
  coverage-changed:
    needs: route
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.route.result == 'success' }}
    runs-on: ${{ fromJSON(needs.route.outputs.linux_labels) }}
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      # Same value and rationale as coverage-e2e (co-tenancy on tinybox,
      # matches the 16-core burst runner).
      NEXTEST_TEST_THREADS: 16
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # Depth 2 keeps both parents of the PR merge commit — HEAD^1 is the
      # base-branch tip GitHub merged against, HEAD^2 the PR head — so the
      # selection's base is HEAD^1 itself. The base is resolved from that
      # merge commit, never from pull_request.base.sha: the payload's base.sha
      # is not guaranteed to be the first parent of the merge commit the job
      # checks out (github.sha), and when the two differ the depth-1 fetch of
      # base.sha is a disconnected object `git merge-base` cannot connect to
      # HEAD (intent-hq/intent#5414). Should the checkout ever be the branch head
      # itself (no merge commit), the base branch and the PR head are fetched
      # unshallowed so origin/<base> connects to HEAD. Both changed-tests.sh
      # runs below read the same resolved BASE_SHA.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Resolve PR base from the merge commit
        run: |
          set -euo pipefail
          if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            base=$(git rev-parse 'HEAD^1')
            echo "base: HEAD^1 (merge-commit parent) = $base"
          else
            git fetch --no-tags --unshallow origin \
              "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" \
              "+refs/pull/$PR_NUMBER/head:refs/remotes/pull/$PR_NUMBER/head"
            base=$(git rev-parse "refs/remotes/origin/$BASE_REF")
            echo "base: origin/$BASE_REF (HEAD is not a merge commit) = $base"
          fi
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
      - name: Select changed tests (dry run)
        id: select
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/coverage-changed-plan.txt"
          status=0
          ./scripts/changed-tests.sh --instrumented --dry-run --base "$BASE_SHA" | tee "$plan" || status=$?
          if [ "$status" -eq 4 ]; then
            echo "::error title=coverage-changed: base unresolvable::changed-tests.sh could not connect BASE $BASE_SHA to HEAD $(git rev-parse HEAD) — a checkout/fetch problem in this job, not a test failure (intent-hq/intent#5414)"
          fi
          [ "$status" -eq 0 ] || exit "$status"
          if grep -q 'cargo llvm-cov' "$plan"; then
            echo "has_selection=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_selection=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "## coverage-changed selection"
            echo ""
            echo "\`\`\`"
            cat "$plan"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
      # Fail-fast disk preflight — see the `check` job's comment for the full
      # rationale (monorepo#1253). 30 GiB like coverage-e2e: this job shares
      # coverage-e2e's per-slot target dir (see "Point CARGO_TARGET_DIR
      # outside the work dir" below), so the own-dir skip must name it.
      - name: Disk-space preflight (tinybox only)
        if: steps.select.outputs.has_selection == 'true' && needs.route.outputs.linux_burst != 'true'
        env:
          NEED_GIB: 30
          JOB_TARGET_SUBDIR: coverage-e2e
        run: |
          set -euo pipefail
          own_dir="/raid/ci-target/intentd/$RUNNER_NAME/$JOB_TARGET_SUBDIR"
          free_gib() { df -Pk /raid | awk 'NR==2 { printf "%d", $4 / 1048576 }'; }
          echo "Free space on /raid: $(free_gib) GiB (need $NEED_GIB GiB)"
          [ "$(free_gib)" -ge "$NEED_GIB" ] && exit 0
          # Same two tiers as the `check` job's preflight (see its comment):
          # selection in scripts/ci-target-slot.sh purge-candidates, a live
          # is-purgeable recheck before each rm, this loop only deletes
          # until the need is met.
          evict_until_free() {
            local verb="$1" quiet_min="$2" dir
            shift 2
            while IFS= read -r dir; do
              ./scripts/ci-target-slot.sh is-purgeable "$dir" --quiet-min "$quiet_min" || continue
              echo "$verb: $dir"
              rm -rf -- "$dir" || true
              if [ "$(free_gib)" -ge "$NEED_GIB" ]; then break; fi
            done < <(./scripts/ci-target-slot.sh purge-candidates /raid/ci-target --quiet-min "$quiet_min" "$@")
          }
          echo "Below threshold — pruning stale ci-target dirs (monorepo#1253)"
          evict_until_free pruning 2880 --skip-dir "$own_dir"
          if [ "$(free_gib)" -lt "$NEED_GIB" ]; then
            echo "Still below threshold — LRU-evicting idle ci-target dirs (monorepo#1253)"
            evict_until_free evicting 15 --skip-slot "$RUNNER_NAME"
          fi
          free="$(free_gib)"
          if [ "$free" -lt "$NEED_GIB" ]; then
            echo "::error::tinybox /raid has only ${free} GiB free (this job needs ${NEED_GIB} GiB) even after pruning stale dirs and LRU-evicting idle ones — manual cleanup needed, see intent-hq/monorepo#1253."
            exit 1
          fi
      # See the `check` job's comment: tinybox lacks the OpenSSL headers.
      - name: Install libssl-dev if missing
        if: steps.select.outputs.has_selection == 'true'
        run: |
          if ! pkg-config --exists openssl; then
            for i in 1 2 3; do
              if sudo -n apt-get -o DPkg::Lock::Timeout=300 update -qq; then break; fi
              if [ "$i" -eq 3 ]; then exit 1; fi
              sleep $((i * 15))
            done
            sudo -n apt-get -o DPkg::Lock::Timeout=300 install -y -qq libssl-dev
          fi
      # Deliberately SHARES coverage-e2e's per-slot target dir instead of
      # keying its own: a runner slot executes one job at a time, so the two
      # never overlap on the same dir, both build the same instrumented
      # profile, and sharing keeps the multi-GiB instrumented dependency
      # cache warm across PR runs and queue runs alike (a separate dir would
      # rebuild it from scratch on every slot). This job never runs `cargo
      # llvm-cov clean`, so it cannot delete coverage-e2e's artifacts.
      # Also marks the dir in use — see the `check` job's CARGO_TARGET_DIR
      # step (intent-hq/intent#5256); released by the job's last step.
      - name: Point CARGO_TARGET_DIR outside the work dir
        if: steps.select.outputs.has_selection == 'true' && needs.route.outputs.linux_burst != 'true'
        run: |
          target_dir="/raid/ci-target/intentd/$RUNNER_NAME/coverage-e2e"
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
          ./scripts/ci-target-slot.sh mark "$target_dir"
      - name: Resolve pinned Rust channel
        id: toolchain
        if: steps.select.outputs.has_selection == 'true'
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-11 (PR 185, --force-non-host)
        if: steps.select.outputs.has_selection == 'true'
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: llvm-tools-preview
      # Ephemeral GitHub-hosted runners have no persistent target dir, so
      # use the GH cache there (pure overhead on tinybox, hence burst-gated).
      # Own key rather than coverage-e2e's: rust-cache never re-saves on an
      # exact hit, so a partial cache saved here would shadow the full
      # coverage-e2e cache until the lockfile changes.
      - name: Rust cache (burst runner only)
        if: steps.select.outputs.has_selection == 'true' && needs.route.outputs.linux_burst == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gh-burst-coverage-changed
      # Node is required (not preinstalled on tinybox): the ACP e2e tests
      # spawn the mock-acp-agent.mjs fixture and self-skip without it.
      - uses: actions/setup-node@v7
        if: steps.select.outputs.has_selection == 'true'
        with:
          node-version: 22
      # Per-slot install-action HOME — see coverage-e2e's comment
      # (monorepo#1239).
      - name: Key install-action dirs per runner slot
        if: steps.select.outputs.has_selection == 'true'
        run: |
          if [[ "${{ needs.route.outputs.linux_burst }}" == "true" ]]; then
            echo "INSTALL_ACTION_HOME=$HOME" >> "$GITHUB_ENV"
          else
            echo "INSTALL_ACTION_HOME=$HOME/ci-install-action/$RUNNER_NAME" >> "$GITHUB_ENV"
          fi
      - uses: taiki-e/install-action@cargo-llvm-cov
        if: steps.select.outputs.has_selection == 'true'
        env:
          HOME: ${{ env.INSTALL_ACTION_HOME }}
      - uses: taiki-e/install-action@nextest
        if: steps.select.outputs.has_selection == 'true'
        env:
          HOME: ${{ env.INSTALL_ACTION_HOME }}
      - name: Run changed tests under llvm-cov
        if: steps.select.outputs.has_selection == 'true'
        # Armed bound-caller seam — see coverage-e2e's run step. The plan
        # lines the script echoes name only the env it prepends itself
        # (INTENTD_TEST_TIMEOUT_MULTIPLIER); this variable reaches cargo
        # through the step environment.
        env:
          INTENTD_ASSERT_BOUND_CALLER: "1"
        run: ./scripts/changed-tests.sh --instrumented --base "$BASE_SHA"
      # Release the `.in-use` marker — see the `check` job's last step
      # (intent-hq/intent#5256). CARGO_TARGET_DIR is empty when the
      # selection was empty or on burst runners, so this is a no-op there.
      - name: Release per-slot target dir
        if: ${{ always() && env.CARGO_TARGET_DIR != '' }}
        run: ./scripts/ci-target-slot.sh unmark "$CARGO_TARGET_DIR"

  pr-title:
    runs-on: ubuntu-latest
    # Same-repo PRs only (fork PRs get no CI — see the `pull_request`
    # trigger comment).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Intermittent TLS failures reaching api.github.com can kill this action
      # sub-second, before it validates anything — a spurious red that reads
      # like a bad title (intent-hq/monorepo#2098). Tolerate a first-attempt
      # failure and retry once; the retry is authoritative, so a genuinely
      # bad title still fails the job.
      - uses: amannn/action-semantic-pull-request@v6
        id: title_check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf
      - name: Wait before retrying title validation
        if: steps.title_check.outcome == 'failure'
        run: sleep 15
      - uses: amannn/action-semantic-pull-request@v6
        if: steps.title_check.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf

  # Conflict-marker guard: fails the PR if any changed file contains committed
  # git conflict markers (the #588 incident: release-plz pushed a branch with
  # '<' x7 / '>' x7 marker lines in CHANGELOG.md, Cargo.lock and Cargo.toml,
  # and no check caught it). Matches the exact line forms git emits — seven
  # '<' or '>' followed by a space and a label — and counts a bare
  # seven-'=' line only when the same file also has both of the other two,
  # so Markdown setext headings / code snippets don't false-positive.
  conflict-markers:
    runs-on: ubuntu-latest
    # Same-repo PRs only (fork PRs get no CI — see the `pull_request`
    # trigger comment).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fetch PR base commit
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
      - name: Scan changed files for conflict markers
        run: |
          set -euo pipefail
          # NUL-delimited via a temp file: robust to quoted/non-ASCII pathnames,
          # and a failing `git diff` fails the step instead of being swallowed
          # by process substitution.
          git diff -z --name-only --diff-filter=ACMR ${{ github.event.pull_request.base.sha }} HEAD > "$RUNNER_TEMP/changed-files.z"
          mapfile -d '' -t files < "$RUNNER_TEMP/changed-files.z"
          fail=0
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            hits=$(grep -nIE '^(<{7}|>{7}) ' "$f" || true)
            [ -n "$hits" ] || continue
            if grep -qIE '^<{7} ' "$f" && grep -qIE '^>{7} ' "$f"; then
              eq=$(grep -nE '^={7}$' "$f" || true)
              [ -n "$eq" ] && hits="$hits"$'\n'"$eq"
            fi
            while IFS= read -r hit; do
              echo "::error file=$f,line=${hit%%:*}::committed git conflict marker"
              printf '%s:%s\n' "$f" "$hit"
            done < <(printf '%s\n' "$hits" | sort -t: -k1,1n)
            fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "Conflict markers detected in changed files — resolve them before merging."
            exit 1
          fi
          echo "No conflict markers in ${#files[@]} changed file(s)."

  # Monorepo consumer checks: runs intent-hq/intent's `make consumer-checks`
  # list (method catalog, event catalog, protocol→FE field parity, docs-check,
  # check-makefile-targets) with this PR head in place of packages/intentd, so
  # a change that would break a monorepo consumer check is red here before it
  # merges instead of turning monorepo `main` red or stalling the rolling
  # `auto/submodule-bump` PR after the fact (intent-hq/intent#4558, #5479,
  # #5489, #5497). Fix order when red: the checks compare this head against
  # monorepo `main` and every checker tolerates docs that lead the pin, so land
  # the monorepo docs PR first (the job summary names the file to update), then
  # re-run this job; the later submodule bump then lands green.
  # check-mcp-bindings is advisory here (its generated index must match the
  # pinned help text line for line, so the docs cannot lead an intentd change
  # to a binding's help line); it stays a hard error in the monorepo.
  # Runs on merge_group and same-repo pull_request (fork PRs get no CI — see
  # the `pull_request` trigger comment); skipped on push to main, where the
  # tree was already checked by its PR run. Seconds-long on ubuntu-latest.
  monorepo-consumer-checks:
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    uses: intent-hq/intent/.github/workflows/consumer-checks.yml@main
    with:
      component: intentd
      head-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  # Packaging assets guard: asserts the systemd user unit keeps the exact
  # semantics the daemon's `service install` used to generate (Type=simple,
  # serve/stop, Restart=on-failure, WantedBy=default.target), and that
  # scripts/build-deb.sh produces a well-formed .deb (stub binary here; the
  # real release tarballs are repacked by .github/workflows/release-sitter.yml).
  # Seconds-long like the other utility jobs, so it runs directly on
  # ubuntu-latest, which has the required dpkg-deb / tar+xz toolchain
  # preinstalled.
  deb-packaging:
    runs-on: ubuntu-latest
    # Runs on push and same-repo PRs; skipped on fork PRs (see the
    # `pull_request` trigger comment).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Assert systemd user unit content
        run: |
          unit=packaging/deb/intentd.service
          grep -qx 'Description=Intent backend daemon (intentd)' "$unit"
          grep -qx 'Type=simple' "$unit"
          grep -qx 'ExecStart=/usr/bin/intentd serve' "$unit"
          grep -qx 'ExecStop=/usr/bin/intentd stop' "$unit"
          grep -qx 'Restart=on-failure' "$unit"
          grep -qx 'WantedBy=default.target' "$unit"
      - name: Build and inspect a stub .deb
        run: |
          dir=intentd-x86_64-unknown-linux-musl
          mkdir -p "stub/$dir"
          printf '#!/bin/sh\necho stub\n' > "stub/$dir/intentd"
          chmod +x "stub/$dir/intentd"
          tar -C stub -cJf "$dir.tar.xz" "$dir"
          ./scripts/build-deb.sh "$dir.tar.xz" 0.0.0 amd64
          dpkg-deb --info intentd_0.0.0_amd64.deb
          dpkg-deb --contents intentd_0.0.0_amd64.deb
          test "$(dpkg-deb --field intentd_0.0.0_amd64.deb Package)" = intentd
          test "$(dpkg-deb --field intentd_0.0.0_amd64.deb Architecture)" = amd64
          dpkg-deb --contents intentd_0.0.0_amd64.deb | grep -q ' \./usr/bin/intentd$'
          dpkg-deb --contents intentd_0.0.0_amd64.deb | grep -q ' \./usr/lib/systemd/user/intentd\.service$'

  # Release-script regression tests: runs the stubbed-gh harnesses for
  # scripts/aggregate-channel-notes.sh (an idempotent re-promotion must
  # rebuild the aggregate from the notes-base marker, and a legacy body
  # without a marker is left untouched — never collapsed to one section)
  # and scripts/notify-fixed-issues.sh (a mention-only reference or an open
  # issue never earns a release comment; a closed issue with a delivered
  # linked fix PR does), the tinybox CI helpers
  # (intent-hq/intent#5256): scripts/ci-lld-retry.sh (the rust-lld
  # vanished-object signature earns exactly one retry; a genuine lint fails
  # fast) and scripts/ci-target-slot.sh (a dir with a fresh `.in-use` marker
  # is never a purge candidate; an unmarked idle one is), plus the
  # stubbed-cargo harness for scripts/changed-tests.sh (the changed-tests
  # selection the monorepo's `make test-changed` delegates to, and its
  # --instrumented llvm-cov form; intent-hq/intentd#1947). Seconds-long like
  # the other utility jobs, so it runs directly on ubuntu-latest.
  release-scripts:
    runs-on: ubuntu-latest
    # Runs on push and same-repo PRs; skipped on fork PRs (see the
    # `pull_request` trigger comment).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Test aggregate-channel-notes.sh
        run: ./scripts/test-aggregate-channel-notes.sh
      - name: Test notify-fixed-issues.sh
        run: ./scripts/test-notify-fixed-issues.sh
      - name: Test ci-lld-retry.sh
        run: ./scripts/test-ci-lld-retry.sh
      - name: Test ci-target-slot.sh
        run: ./scripts/test-ci-target-slot.sh
      - name: Test changed-tests.sh
        run: ./scripts/test-changed-tests.sh

  # install.ps1's Windows-only paths (intent-hq/intent#3229): the `check`
  # job's install_ps1_owner suite runs the installer's ownership check under
  # pwsh on Linux, but the Scheduled Task registration and the startup wait
  # that polls the task's log need Windows — scripts/install.ps1.Tests.ps1
  # (Pester) executes those marked blocks of the shipped script with the Task
  # Scheduler cmdlets mocked. Runs under both Windows PowerShell 5.1 (what
  # `powershell -c "irm … | iex"` in the README uses) and pwsh 7. A
  # GitHub-hosted runner rather than the self-hosted Windows build box: the
  # tests need no Rust toolchain, and the hosted image ships Pester 5 and the
  # ScheduledTasks module. Minutes-long, so no cache. Every test must run
  # here — the register block self-skips off Windows, so a skip on this job
  # means the module went missing, and the step fails on it.
  install-ps1:
    # Runs on push and same-repo PRs; skipped on fork PRs (see the
    # `pull_request` trigger comment).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    name: install-ps1 (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 15
    # The matrix context is not available in a step-level `shell:` (the
    # workflow fails validation with "Unrecognized named-value: 'matrix'"),
    # but it is in the job-level run default.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - name: Pester (${{ matrix.shell }})
        run: |
          $ErrorActionPreference = 'Stop'
          $PSVersionTable.PSVersion
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.0' })) {
            Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser -MinimumVersion 5.5
          }
          Import-Module Pester -MinimumVersion 5.0
          (Get-Module Pester).Version
          $config = New-PesterConfiguration
          $config.Run.Path = 'scripts/install.ps1.Tests.ps1'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -ne 0) { throw "install.ps1 Pester tests failed: $($result.FailedCount)" }
          if ($result.SkippedCount -ne 0) { throw "install.ps1 Pester tests skipped on Windows: $($result.SkippedCount) (is the ScheduledTasks module missing?)" }
          if ($result.PassedCount -eq 0) { throw 'install.ps1 Pester tests: nothing ran' }

  # Single required status check for branch protection: fans in check, build,
  # coverage-e2e, coverage-all, coverage-changed, pr-title, conflict-markers,
  # deb-packaging, release-scripts, and install-ps1 (ported from cloudlands-fe's "CI Gate"
  # pattern — see packages/cloudlands-fe/.github/workflows/intent-pr.yml).
  # build / deb-packaging / release-scripts / install-ps1 must succeed
  # outright: none carries an
  # event-gated `if`, so a skip there is itself a failure signal. check must
  # succeed outright
  # on pull_request runs (a skip there — e.g. after a route failure — fails
  # the gate, exactly as before); only on push to main, where it is
  # job-skipped as redundant (see the `on: push` comment), does the gate
  # accept skipped — the event-aware branch below keeps the PR semantics
  # unweakened. coverage-e2e / coverage-all are event-aware the other way
  # round: they are merge_group-only (see the `merge_group` trigger comment),
  # so on merge_group they must succeed outright — a skip there (e.g. after a
  # route failure) fails the gate, so the queue can never land a tree whose
  # coverage run did not happen — while on pull_request and push, where they
  # are job-level skipped by design, the gate accepts skipped. coverage-changed
  # is the mirror image: pull_request-only (see its comment), so on
  # pull_request it must succeed outright like check — a skip there (route
  # failure) fails the gate — while on merge_group and push, where it is
  # job-level skipped by design, the gate accepts skipped. pr-title /
  # conflict-markers accept success OR skipped since
  # both carry `if: github.event_name == 'pull_request'` and are legitimately
  # skipped on push and merge_group runs (PR-metadata checks, already
  # validated on the PR) — requiring strict success there would fail the
  # gate outside pull_request events. monorepo-consumer-checks follows the
  # check pattern: success on pull_request and merge_group, success or
  # skipped on push (see its comment). Net per event: pull_request requires
  # check / build / coverage-changed / monorepo-consumer-checks /
  # deb-packaging / release-scripts / install-ps1 / pr-title /
  # conflict-markers; merge_group requires check / build /
  # monorepo-consumer-checks / deb-packaging / release-scripts / install-ps1 /
  # coverage-e2e / coverage-all against the queue's merged tree; push
  # requires build / deb-packaging / release-scripts / install-ps1.
  gate:
    name: CI Gate
    # Seconds-long job: pinned to ubuntu-latest (see pr-title).
    runs-on: ubuntu-latest
    permissions: {}
    # The same-repo clause skips the gate on fork PRs along with every other
    # job (see the `pull_request` trigger comment): without it, always()
    # would run the gate against all-skipped needs and report a spurious
    # failure on PRs that get no CI by policy.
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [check, build, coverage-e2e, coverage-all, coverage-changed, pr-title, conflict-markers, monorepo-consumer-checks, deb-packaging, release-scripts, install-ps1]
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.deb-packaging.result }}" != "success" ] || \
             [ "${{ needs.release-scripts.result }}" != "success" ] || \
             [ "${{ needs.install-ps1.result }}" != "success" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          # Event-aware on purpose: check must succeed outright on
          # pull_request; only push runs (where it is job-skipped as
          # redundant) accept skipped.
          if [ "${{ github.event_name }}" = "push" ]; then
            case "${{ needs.check.result }}" in
              success|skipped) ;;
              *)
                echo "check did not succeed or skip"
                exit 1
                ;;
            esac
          elif [ "${{ needs.check.result }}" != "success" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          # Event-aware on purpose: monorepo-consumer-checks must succeed
          # outright on pull_request and merge_group; only push runs (where it
          # is job-skipped as already checked by the PR run) accept skipped.
          if [ "${{ github.event_name }}" = "push" ]; then
            case "${{ needs.monorepo-consumer-checks.result }}" in
              success|skipped) ;;
              *)
                echo "monorepo-consumer-checks did not succeed or skip"
                exit 1
                ;;
            esac
          elif [ "${{ needs.monorepo-consumer-checks.result }}" != "success" ]; then
            echo "monorepo-consumer-checks must succeed outright on pull_request / merge_group"
            exit 1
          fi
          # Event-aware on purpose: coverage-changed is pull_request-only, so
          # there it must succeed outright (a skip after a route failure must
          # not let an uninstrumented PR through); on merge_group and push it
          # is job-skipped by design and the gate accepts skipped.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ needs.coverage-changed.result }}" != "success" ]; then
              echo "coverage-changed must succeed outright on pull_request"
              exit 1
            fi
          else
            case "${{ needs.coverage-changed.result }}" in
              success|skipped) ;;
              *)
                echo "coverage-changed did not succeed or skip"
                exit 1
                ;;
            esac
          fi
          # Event-aware on purpose: coverage-e2e / coverage-all are
          # merge_group-only, so on merge_group they must succeed outright
          # (a skip must never let the queue land an untested tree); on
          # pull_request and push they are job-skipped by design and the
          # gate accepts skipped.
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            if [ "${{ needs.coverage-e2e.result }}" != "success" ] || \
               [ "${{ needs.coverage-all.result }}" != "success" ]; then
              echo "coverage-e2e / coverage-all must succeed outright on merge_group"
              exit 1
            fi
          else
            case "${{ needs.coverage-e2e.result }}" in
              success|skipped) ;;
              *)
                echo "coverage-e2e did not succeed or skip"
                exit 1
                ;;
            esac
            case "${{ needs.coverage-all.result }}" in
              success|skipped) ;;
              *)
                echo "coverage-all did not succeed or skip"
                exit 1
                ;;
            esac
          fi
          case "${{ needs.pr-title.result }}" in
            success|skipped) ;;
            *)
              echo "pr-title did not succeed or skip"
              exit 1
              ;;
          esac
          case "${{ needs.conflict-markers.result }}" in
            success|skipped) ;;
            *)
              echo "conflict-markers did not succeed or skip"
              exit 1
              ;;
          esac
