name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      # No disk-space cleanup: with debug info disabled (CARGO_PROFILE_*_DEBUG=0)
      # this job's target dir stays small; the stock ~16G headroom is plenty.
      - uses: actions/checkout@v5
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      # The full suite is not run here: coverage-all executes it (instrumented,
      # via cargo llvm-cov nextest) and is the test gate for PRs. Running it
      # plainly here as well would double the critical path. The exception is
      # the tests the coverage scripts skip: they are flaky under llvm-cov
      # instrumentation / heavy parallel load, so they run here instead —
      # non-instrumented and serially, the conditions under which they pass
      # reliably — to keep them covered on every PR.
      #
      # slow_host_exec_does_not_block_fast_workspace_list (STAB-42) is NOT run:
      # it currently fails deterministically even in an isolated, serial,
      # non-instrumented run (times out at uds_concurrent_dispatch.rs:63), so
      # it stays skipped everywhere until STAB-42 is fixed.
      - name: Coverage-skipped tests (STAB-40/43)
        run: |
          cargo test -p intent-core --lib capture_login_shell_path_with_fake_shell
          cargo test -p intentd --test wss_integration wss_note_save_asset_round_trip

  build:
    strategy:
      matrix:
        include:
          # temporarily disabled — re-enable when needed
          # - target: x86_64-unknown-linux-gnu
          #   os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # temporarily disabled — re-enable when needed
          # - target: x86_64-pc-windows-msvc
          #   os: windows-latest
    runs-on: ${{ matrix.os }}
    # Keeps the cargo-check steps free of debuginfo/incremental artifacts
    # (cheaper compile, smaller shared cache). Safe job-wide: the release
    # build is unaffected — these vars only touch the dev/test profiles, and
    # release builds are non-incremental by default.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # On PRs a cheap `cargo check` proves per-target compilation; the full
      # `--release` build (the expensive part, esp. on Windows) only runs on
      # push to main and in the merge queue. The cache key stays shared: only
      # main saves it (save-if above), and main also runs the check step below
      # so the cache PRs restore contains warm check artifacts alongside the
      # release ones.
      - name: Check (PR compilation proof)
        if: github.event_name == 'pull_request'
        run: cargo check --workspace --target ${{ matrix.target }}
      - name: Build (release)
        if: github.event_name != 'pull_request'
        run: cargo build --workspace --release --target ${{ matrix.target }}
      - name: Warm PR check cache
        if: github.event_name == 'push'
        run: cargo check --workspace --target ${{ matrix.target }}

  coverage-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      # Oversubscribe the 4-vCPU runner: the e2e tests spend most of their
      # time blocked on daemon startup/IO, not CPU (flake retries are handled
      # by .config/nextest.toml).
      NEXTEST_TEST_THREADS: 8
    steps:
      # Non-blocking cleanup: coverage runs accumulate profraw files, so keep
      # the extra ~19G of headroom, but reclaim it in the background instead of
      # stalling the job for ~60s (baseline: ~16G free, ~35G after cleanup).
      - name: Free disk space (background)
        run: |
          sudo -n true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup >/dev/null 2>&1 &
      - uses: actions/checkout@v5
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - uses: swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run e2e coverage
        run: |
          cd ${{ github.workspace }}
          GENERATE_LCOV=1 ./scripts/coverage-e2e.sh 40
      - name: Generate coverage summary
        if: always()
        run: |
          cd ${{ github.workspace }}
          echo "## E2E Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          (cargo llvm-cov report --summary-only 2>/dev/null || echo "Coverage data not available") >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-coverage-lcov
          path: lcov.info
          if-no-files-found: warn

  coverage-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      # Oversubscribe the 4-vCPU runner: much of the suite is blocked on
      # daemon startup/IO/timeouts, not CPU (flake retries are handled by
      # .config/nextest.toml).
      NEXTEST_TEST_THREADS: 8
    steps:
      # Non-blocking cleanup: coverage runs accumulate profraw files, so keep
      # the extra ~19G of headroom, but reclaim it in the background instead of
      # stalling the job for ~60s (baseline: ~16G free, ~35G after cleanup).
      - name: Free disk space (background)
        run: |
          sudo -n true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup >/dev/null 2>&1 &
      - uses: actions/checkout@v5
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - uses: swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run combined coverage
        run: |
          cd ${{ github.workspace }}
          GENERATE_LCOV=1 ./scripts/coverage-all.sh 79
      - name: Generate coverage summary
        if: always()
        run: |
          cd ${{ github.workspace }}
          echo "## Combined Coverage Report (all tests)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          (cargo llvm-cov report --summary-only 2>/dev/null || echo "Coverage data not available") >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: combined-coverage-lcov
          path: lcov.info
          if-no-files-found: warn

  pr-title:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf
