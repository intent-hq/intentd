# Manual (workflow_dispatch) mirroring of an existing release to the public
# intent-hq/intentd-releases repo — the backfill path for releases cut before
# automatic mirroring existed (publish-channel-manifest.yml / promote-stable.yml
# mirror new releases and promotions automatically).
#
# Mirrors the tag's platform archives + .sha256 sidecars via
# scripts/mirror-release-assets.sh (idempotent: re-runs re-upload with
# --clobber). Optionally also republishes the beta/stable channel manifests on
# intentd-releases, rebuilt with ASSET_REPO so their platform URLs point at the
# mirrored assets. A channel is only republished when its current manifest on
# this repo already references the given tag, so a backfill of an older tag can
# never move a channel manifest backwards.
#
# Unlike the release workflows, this is an explicit dispatch, so a missing
# INTENTD_RELEASES_TOKEN secret fails the run instead of soft-skipping.
name: Mirror release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to mirror (e.g. v0.2.12)'
        required: true
        type: string
      republish:
        description: 'Channel manifests to republish on intentd-releases (only if the channel currently points at this tag)'
        required: true
        type: choice
        default: none
        options:
          - none
          - beta
          - stable
          - both

permissions:
  contents: read

# Serialize with ourselves; manifest publishes to intentd-releases are also
# idempotent uploads guarded by the tag-match check below.
concurrency:
  group: intentd-mirror-release
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
      REPUBLISH: ${{ inputs.republish }}
      MIRROR_REPO: intent-hq/intentd-releases
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate tag format
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            # Deliberately not echoing the raw input: it is unvalidated and
            # could contain workflow-command sequences (log injection).
            echo "::error::Invalid tag input. Expected [v]X.Y.Z or [v]X.Y.Z-<prerelease>."
            exit 1
          fi
          echo "Tag $TAG is valid"
      - name: Check mirror token
        shell: bash
        env:
          INTENTD_RELEASES_TOKEN: ${{ secrets.INTENTD_RELEASES_TOKEN }}
        run: |
          if [[ -z "$INTENTD_RELEASES_TOKEN" ]]; then
            echo "::error::INTENTD_RELEASES_TOKEN secret is not configured; cannot mirror to $MIRROR_REPO"
            exit 1
          fi
      - name: Mirror release assets to intentd-releases
        shell: bash
        env:
          DEST_REPO: intent-hq/intentd-releases
          DEST_GH_TOKEN: ${{ secrets.INTENTD_RELEASES_TOKEN }}
        run: |
          ./scripts/mirror-release-assets.sh "$TAG"
      # For each requested channel: republish only when the channel's current
      # manifest on this repo already points at the mirrored tag, then rebuild
      # it with ASSET_REPO so the platform URLs target the mirrored assets.
      - name: Republish channel manifests on intentd-releases
        if: inputs.republish != 'none'
        shell: bash
        env:
          INTENTD_RELEASES_TOKEN: ${{ secrets.INTENTD_RELEASES_TOKEN }}
        run: |
          channels=()
          case "$REPUBLISH" in
            beta) channels=(beta) ;;
            stable) channels=(stable) ;;
            both) channels=(beta stable) ;;
            *) echo "::error::Unknown republish option"; exit 1 ;;
          esac
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          for channel in "${channels[@]}"; do
            gh release download "channel-$channel" --repo "$GITHUB_REPOSITORY" \
              --pattern "$channel.json" --dir "$tmpdir" --clobber
            current_tag=$(jq -r '.tag // empty' "$tmpdir/$channel.json")
            if [[ "$current_tag" != "$TAG" ]]; then
              echo "::error::Current $channel.json on $GITHUB_REPOSITORY points at '$current_tag', not the mirrored tag; refusing to republish $channel"
              exit 1
            fi
            mkdir -p mirror
            ASSET_REPO="$MIRROR_REPO" \
              ./scripts/make-channel-manifest.sh "$TAG" "$channel" "mirror/$channel.json"
            GH_TOKEN="$INTENTD_RELEASES_TOKEN" \
              ./scripts/publish-channel-manifest.sh "$channel" "mirror/$channel.json" "$MIRROR_REPO"
          done
      - name: Post summary
        shell: bash
        run: |
          {
            echo "## Release mirror"
            echo ""
            echo "**Mirrored tag:** $TAG"
            echo ""
            echo "**Manifests republished:** $REPUBLISH"
            echo ""
            echo "- [Mirrored release](https://github.com/$MIRROR_REPO/releases/tag/$TAG)"
          } >> "$GITHUB_STEP_SUMMARY"
