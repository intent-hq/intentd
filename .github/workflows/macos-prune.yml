# Only disposable Cargo debug profiles below m1mac's intentd CI target are eligible.
# The script fails closed on live/unknown ownership and stops at disk headroom.
name: macOS CI disk cleanup
on:
  schedule:
    - cron: "15 11,23 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: Delete inactive CI artifacts (otherwise dry run)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: macos-ci-disk-maintenance
  cancel-in-progress: false
jobs:
  prune:
    runs-on: [self-hosted, macOS, ARM64, m1mac]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Report eligible profiles
        run: python3 -I -B scripts/macos-ci-cleanup.py
      - name: Reclaim disk headroom
        if: github.event_name == 'schedule' || inputs.apply
        run: python3 -I -B scripts/macos-ci-cleanup.py --apply
