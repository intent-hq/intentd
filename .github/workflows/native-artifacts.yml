name: Native artifacts
on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runner_labels:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    # This broader lock spans overlapping exact variant sets, runner images and
    # caller workflow names. No caller holds this group while awaiting us.
    concurrency:
      group: native-producer-v2-${{ github.repository_id }}-${{ github.sha }}-${{ inputs.platform }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Put Git Bash first on PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - name: Select native proof demand
        id: native-scope
        shell: bash
        env:
          NATIVE_EVENT: ${{ github.event_name }}
          NATIVE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$NATIVE_EVENT" == pull_request ]]; then
            git fetch --no-tags --depth=1 origin "$NATIVE_BASE" || echo "Native scope will conservatively validate all proofs if base is unavailable"
            python3 -I -B scripts/ci-native-artifacts.py scope --event "$NATIVE_EVENT" --base "$NATIVE_BASE"
          else
            python3 -I -B scripts/ci-native-artifacts.py scope --event "$NATIVE_EVENT"
          fi
      - name: Provision native dependency inspection (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v readelf >/dev/null || ! pkg-config --exists openssl zlib; then
            sudo apt-get update
            sudo apt-get install -y binutils pkg-config libssl-dev zlib1g-dev
          fi
      - name: Provision MSVC and Windows SDK inspection
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # Persistent per-job outputs survive checkout's git clean. Linux uses
      # /raid and a runner-slot key, with the same prune/marker rails as check.
      - name: Disk-space preflight (tinybox only)
        if: runner.os == 'Linux' && contains(fromJSON(inputs.runner_labels), 'self-hosted')
        env:
          NEED_GIB: 15
          JOB_TARGET_SUBDIR: daemon-lifecycle
        run: |
          set -euo pipefail
          own_dir="/raid/ci-target/intentd/$RUNNER_NAME/$JOB_TARGET_SUBDIR"
          free_gib() { df -Pk /raid | awk 'NR==2 { printf "%d", $4 / 1048576 }'; }
          echo "Free space on /raid: $(free_gib) GiB (need $NEED_GIB GiB)"
          [ "$(free_gib)" -ge "$NEED_GIB" ] && exit 0
          # Same two tiers as the `check` job's preflight (see its comment):
          # selection in scripts/ci-target-slot.sh purge-candidates, a live
          # is-purgeable recheck before each rm, this loop only deletes
          # until the need is met.
          evict_until_free() {
            local verb="$1" quiet_min="$2" dir
            shift 2
            while IFS= read -r dir; do
              ./scripts/ci-target-slot.sh is-purgeable "$dir" --quiet-min "$quiet_min" || continue
              echo "$verb: $dir"
              rm -rf -- "$dir" || true
              if [ "$(free_gib)" -ge "$NEED_GIB" ]; then break; fi
            done < <(./scripts/ci-target-slot.sh purge-candidates /raid/ci-target --quiet-min "$quiet_min" "$@")
          }
          echo "Below threshold — pruning stale ci-target dirs (monorepo#1253)"
          evict_until_free pruning 2880 --skip-dir "$own_dir"
          if [ "$(free_gib)" -lt "$NEED_GIB" ]; then
            echo "Still below threshold — LRU-evicting idle ci-target dirs (monorepo#1253)"
            evict_until_free evicting 15 --skip-slot "$RUNNER_NAME"
          fi
          free="$(free_gib)"
          if [ "$free" -lt "$NEED_GIB" ]; then
            echo "::error::tinybox /raid has only ${free} GiB free (this job needs ${NEED_GIB} GiB) even after pruning stale dirs and LRU-evicting idle ones — manual cleanup needed, see intent-hq/monorepo#1253."
            exit 1
          fi
      - name: Point lifecycle target outside checkout (Linux)
        if: runner.os == 'Linux' && contains(fromJSON(inputs.runner_labels), 'self-hosted')
        shell: bash
        run: |
          target_dir="/raid/ci-target/intentd/$RUNNER_NAME/daemon-lifecycle"
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
          ./scripts/ci-target-slot.sh mark "$target_dir"
      # These runners have one slot. Prefer the native Windows home path:
      # Cargo cannot use Git Bash's MSYS-style $HOME from native processes.
      - name: Point lifecycle target outside checkout (macOS and Windows)
        if: runner.os != 'Linux' && contains(fromJSON(inputs.runner_labels), 'self-hosted')
        shell: bash
        run: echo "CARGO_TARGET_DIR=${USERPROFILE:-$HOME}/ci-target/intentd/daemon-lifecycle-${{ inputs.platform }}" >> "$GITHUB_ENV"
      - name: Ensure macOS CI disk headroom
        if: runner.os == 'macOS' && contains(fromJSON(inputs.runner_labels), 'self-hosted')
        run: python3 -I -B scripts/macos-ci-cleanup.py --apply
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy
      - name: Set hosted native target outside checkout
        if: ${{ !contains(fromJSON(inputs.runner_labels), 'self-hosted') }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          target = Path(os.environ['RUNNER_TEMP']) / 'native-target'
          # rust-cache joins this path to the workspace even when it is absolute.
          relative = os.path.relpath(target, Path.cwd())
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f'CARGO_TARGET_DIR={target}\nNATIVE_CACHE_TARGET={relative}\n')
          PYTHON
      - name: Install pinned native archive runner
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143
      - name: Rust cache (GitHub-hosted runner only)
        if: ${{ !contains(fromJSON(inputs.runner_labels), 'self-hosted') }}
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: daemon-lifecycle-${{ inputs.platform }}
          workspaces: . -> ${{ env.NATIVE_CACHE_TARGET }}
      - name: Produce native archives in one shared target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_PLATFORM: ${{ inputs.platform }}
          NATIVE_SCOPE: ${{ steps.native-scope.outputs.event }}
        run: python3 -I -B scripts/ci-native-artifacts.py produce --platform "$NATIVE_PLATFORM" --event "$NATIVE_SCOPE" --reuse --archives-only
      # Upload before runtime; successful variants survive later failures.
      - name: Publish native variants
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-v2-${{ inputs.platform }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-artifacts/requests.json
            ${{ runner.temp }}/native-artifacts/publication.json
            ${{ runner.temp }}/native-artifacts/reuse.json
            ${{ runner.temp }}/native-artifacts/compiler-tripwire.exe
            ${{ runner.temp }}/native-artifacts/published/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Production check and Clippy in shared target
        shell: bash
        env:
          NATIVE_PLATFORM: ${{ inputs.platform }}
          NATIVE_SCOPE: ${{ steps.native-scope.outputs.event }}
        run: python3 -I -B scripts/ci-native-artifacts.py lint --platform "$NATIVE_PLATFORM" --event "$NATIVE_SCOPE"
      - name: Restore native executables with compiler tripwires
        shell: bash
        run: python3 -I -B scripts/ci-native-artifacts.py prepare
      - name: Native lifecycle runtime proof
        shell: bash
        env:
          INTENTD_ASSERT_BOUND_CALLER: "1"
        run: python3 -I -B scripts/test-daemon-lifecycle.py --archives "$RUNNER_TEMP/native-artifacts"
      # Exercise the deterministic deadline oracle and real TLS controls on
      # macOS; listen backlog saturation cannot guarantee a pending connect.
      - name: Tunnel deadline and TLS controls (macOS runtime)
        if: steps.native-scope.outputs.event == 'merge_group' && runner.os == 'macOS'
        timeout-minutes: 20
        shell: bash
        env:
          INTENTD_ASSERT_BOUND_CALLER: "1"
        run: |
          python3 -I -B -S - <<'PYTHON'
          import json, os, signal, subprocess
          from pathlib import Path

          import importlib.util
          spec = importlib.util.spec_from_file_location('native', Path('scripts/ci-native-artifacts.py'))
          native = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(native)
          root = Path(os.environ['RUNNER_TEMP']) / 'native-artifacts'
          prepared = json.loads((root / 'prepared.json').read_text())
          groups = [
              (["-p", "intent-transport", "--lib"], [
                  "tunnel::tests::connect_pending_deadline_emits_terminal_open_err",
                  "tunnel::tests::connect_reset_preserves_error_before_deadline",
                  "tunnel::tests::connect_success_before_deadline_relays",
              ]),
              (["-p", "intentd", "--test", "e2e_wss_tunnel"], [
                  "tunnel_open_echo_eof_close_lifecycle",
                  "tunnel_open_err_for_closed_port_keeps_connection_alive",
                  "tunnel_close_tears_down_and_frees_stream_id",
                  "tunnel_connections_counted_in_health_and_stopped",
                  "tunnel_unauthenticated_upgrade_rejected",
              ]),
          ]

          def bounded(command, package_dir, env):
              print("+ " + repr(command), flush=True)
              child = subprocess.Popen(command, stdout=subprocess.PIPE,
                                       stderr=subprocess.STDOUT, text=True, start_new_session=True,
                                       cwd=package_dir, env=env)
              try:
                  output, _ = child.communicate(timeout=30)
                  print(output, end="", flush=True)
                  assert child.returncode == 0, (command, child.returncode)
                  return output
              except subprocess.TimeoutExpired:
                  os.killpg(child.pid, signal.SIGKILL)
                  output, _ = child.communicate()
                  print(output, end="", flush=True)
                  raise

          for package, tests in groups:
              variant = 'transport' if package[1] == 'intent-transport' else 'daemon'
              binary_id = 'intent-transport' if variant == 'transport' else 'intentd::e2e_wss_tunnel'
              item = prepared[variant]
              runtime = item['runtime']['tests'][binary_id]
              binary = native.archives.safe_join(item['target'], runtime['path'])
              assert binary.is_file() and os.access(binary, os.X_OK), binary
              package_dir = native.archives.safe_join(item['source'], runtime['cwd'])
              print('Using archived native test executable: ' + str(binary), flush=True)
              env = native.archives.runtime_env(item, native.consumer_environment(root))
              env['CARGO_MANIFEST_DIR'] = str(package_dir)
              for test in tests:
                  command = [str(binary), test, "--exact"]
                  listed = bounded(command + ["--list"], package_dir, env)
                  assert test + ": test" in listed.splitlines(), listed
                  assert "1 test, 0 benchmarks" in listed.splitlines(), listed
                  output = bounded(command + ["--nocapture", "--test-threads=1"], package_dir, env)
                  assert "running 1 test" in output.splitlines(), output
                  assert "test result: ok. 1 passed; 0 failed; 0 ignored;" in output, output
          PYTHON
      - name: Headless workspace setup (Windows runtime)
        if: steps.native-scope.outputs.event == 'merge_group' && runner.os == 'Windows'
        timeout-minutes: 20
        shell: bash
        env:
          INTENTD_ASSERT_BOUND_CALLER: "1"
          INTENTD_SETUP_EVIDENCE_DIR: ${{ runner.temp }}/setup-headless-evidence
        run: python3 -I -B scripts/ci-native-artifacts.py libtest --variant daemon --binary intentd::e2e_wss_setup_headless -- --nocapture
      - uses: actions/upload-artifact@v7
        if: always() && steps.native-scope.outputs.event == 'merge_group' && runner.os == 'Windows'
        with:
          name: setup-headless-windows
          path: ${{ runner.temp }}/setup-headless-evidence
          if-no-files-found: error
      # Execute the Windows Job Object fixtures on the native runner. They use
      # this test executable as the child, so no Node/npm/account setup is needed.
      - name: Codex diagnostic process ownership (Windows runtime)
        if: steps.native-scope.outputs.event == 'merge_group' && runner.os == 'Windows'
        shell: bash
        env:
          INTENTD_ASSERT_BOUND_CALLER: "1"
        run: |
          set -euo pipefail
          filter='codex_diagnostics::process::platform::tests::'
          listed=$(python3 -I -B scripts/ci-native-artifacts.py libtest --variant services --binary intent-services -- "$filter" --list)
          printf '%s\n' "$listed"
          if ! grep -F "${filter}shared_guard_removes_home_only_after_descendants_stop: test" <<< "$listed" > /dev/null; then
            echo '::error::Windows diagnostic ownership regression was not selected.'
            exit 1
          fi
          python3 -I -B scripts/ci-native-artifacts.py libtest --variant services --binary intent-services -- "$filter" --nocapture
      # macOS supports read-only metadata and rejects process probes before
      # auth/npm setup. Require both a service rejection case and a real doctor
      # case in discovery so a cfg/filter change cannot silently run zero tests.
      - name: Codex focused diagnostics (macOS runtime)
        if: steps.native-scope.outputs.event == 'merge_group' && runner.os == 'macOS'
        shell: bash
        env:
          INTENTD_ASSERT_BOUND_CALLER: "1"
        run: |
          set -euo pipefail
          filter='codex_diagnostics::'
          listed=$(python3 -I -B scripts/ci-native-artifacts.py libtest --variant services --binary intent-services -- "$filter" --list)
          printf '%s\n' "$listed"
          if ! grep -F 'macos_rejects_process_start_before_retaining_home_or_dependency: test' <<< "$listed" > /dev/null; then
            echo '::error::macOS diagnostic rejection regression was not selected.'
            exit 1
          fi
          python3 -I -B scripts/ci-native-artifacts.py libtest --variant services --binary intent-services -- "$filter" --nocapture
          listed=$(python3 -I -B scripts/ci-native-artifacts.py libtest --variant daemon --binary intentd::e2e_doctor_codex -- --list)
          printf '%s\n' "$listed"
          if ! grep -F 'macos_catalog_rejection_precedes_npm_authentication_and_probe_state: test' <<< "$listed" > /dev/null; then
            echo '::error::macOS doctor command regression was not selected.'
            exit 1
          fi
          python3 -I -B scripts/ci-native-artifacts.py libtest --variant daemon --binary intentd::e2e_doctor_codex -- --nocapture
      # These retained workspace fixtures used to skip on Linux before reaching
      # their unbound caller. Require native CoW operations and original oracles.
      - name: Retained workspace CoW fixtures (macOS runtime)
        if: steps.native-scope.outputs.event == 'merge_group' && runner.os == 'macOS'
        timeout-minutes: 20
        shell: bash
        env:
          INTENTD_ASSERT_BOUND_CALLER: "1"
          INTENTD_TEST_REQUIRE_COW: "1"
        run: |
          set -euo pipefail
          # Keep fixtures armed; the capability probe removes the guard only
          # in its exact child. Retain scratch cleanup assertions for every case.
          unset INTENTD_TEST_KEEP_TMP
          tests=(
            tests::worktree_provisioning::create_provisions_cow_checkout_when_isolation_enabled
            tests::worktree_provisioning::duplicate_provisions_cow_checkout_when_isolation_enabled
            tests::worktree_provisioning::create_cleans_up_empty_ws_dir_when_cow_provisioning_fails
            tests::worktree_provisioning::duplicate_cleans_up_empty_ws_dir_when_cow_provisioning_fails
            tests::clone_orchestration::progress_id_cow_create_streams_cow_copy_milestone
            capability::tests::unbound_caller_is_forbidden_on_every_gate
          )
          archive_test=(python3 -I -B scripts/ci-native-artifacts.py libtest --variant services --binary intent-services --)
          status=0
          for test in "${tests[@]}"; do
            listed=$("${archive_test[@]}" "$test" --exact --list)
            printf '%s\n' "$listed"
            grep -Fx "$test: test" <<< "$listed" > /dev/null
            grep -Fx '1 test, 0 benchmarks' <<< "$listed" > /dev/null
            log="$RUNNER_TEMP/cow-${test##*::}.log"
            scratch=$(mktemp -d "$RUNNER_TEMP/cow-${test##*::}.XXXXXX")
            if ! TMPDIR="$scratch" "${archive_test[@]}" "$test" --exact --nocapture --test-threads=1 2>&1 | tee "$log"; then
              status=1
            fi
            if rmdir "$scratch"; then
              echo "CoW fixture scratch cleaned: $test"
            else
              echo "::error::Fixture scratch remains at $scratch"
              status=1
            fi
            if [[ "$test" == tests::* ]]; then
              grep -Fx 'CoW fixture clone and independent contents verified' "$log" > /dev/null || status=1
              grep -Fx 'CoW fixture proof scratch cleaned' "$log" > /dev/null || status=1
              grep -Fx "CoW fixture assertions passed: ${test##*::}" "$log" > /dev/null || status=1
            fi
          done
          exit "$status"
      - name: Verify compile-free native consumers
        shell: bash
        run: python3 -I -B scripts/ci-native-artifacts.py receipt
      - name: Upload native consumer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-consumer-${{ inputs.platform }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-artifacts/consumer-receipt.json
            ${{ runner.temp }}/native-artifacts/compiler-calls.log
          if-no-files-found: error
      - name: Release lifecycle target dir
        if: ${{ always() && runner.os == 'Linux' && contains(fromJSON(inputs.runner_labels), 'self-hosted') && env.CARGO_TARGET_DIR != '' }}
        shell: bash
        run: ./scripts/ci-target-slot.sh unmark "$CARGO_TARGET_DIR"

