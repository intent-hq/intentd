# RELEASE_PLZ_TOKEN already has contents + pull-requests write access (see
# release-plz.yml). Its pushes/PRs trigger normal CI; GITHUB_TOKEN would not.
# The rolling PR is reviewed and merged by humans, never by this workflow.
name: Auto-pin Codex ACP

permissions: {}

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report the proposed update without pushing or changing a PR'
        type: boolean
        default: false

concurrency:
  group: auto-pin-codex-acp
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Manual runs must use trusted main too; never execute a branch's script
    # with the publication token. The checkout resolves main afresh.
    if: github.repository == 'intent-hq/intentd' && github.ref == 'refs/heads/main'
    steps:
      - name: Check for RELEASE_PLZ_TOKEN
        id: token
        env:
          RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -n "$RELEASE_PLZ_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::RELEASE_PLZ_TOKEN is not set; skipping Codex ACP pin publication."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main with the CI-triggering token
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Propose the stable Codex ACP pin
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          python3 -S scripts/auto-pin-codex-acp.py "${args[@]}"
