# Manual promotion of an existing vX.Y.Z release to the stable channel.
#
# Every tagged release automatically updates beta.json on `channel-beta`
# (publish-channel-manifest.yml, run as a dist post-announce hook). Stable is
# promotion-only: run this workflow with the version of an existing release to
# rebuild stable.json from that release's assets and upload it to the fixed
# `channel-stable` release. Consumers (e.g. cloudlands-fe pin-bump automation,
# installer scripts) discover the latest stable release from that manifest.
#
# When the INTENTD_RELEASES_TOKEN secret is configured, the promoted release's
# platform archives + .sha256 sidecars are also mirrored to the public
# intent-hq/intentd-releases repo (idempotent, so promoting a release cut
# before mirroring existed backfills it), together with a stable.json whose
# platform URLs point at the mirrored assets. The stable.json published on
# this repo is unchanged (sitter fallback path + future open-source path).
#
# Tagged releases are published as GitHub Pre-releases (v-release.yml), so a
# promotable release only has to exist and not be a draft. Promotion clears the
# prerelease flag and marks vX.Y.Z as Latest on this repo and — when the mirror
# token is configured — on intent-hq/intentd-releases, so the Latest badge
# tracks the most recently promoted version (a rollback re-promotion moves it
# back). Both steps are idempotent, so re-promoting the same version just
# re-applies the flags.
#
# As a best-effort extra, promotion also rewrites the `channel-stable` release
# body with aggregated release notes covering every version since the previous
# stable (aggregate-stable-notes.sh). Notes steps are fail-soft: they never
# block the promotion or change manifest publishing.
#
# When the MONOREPO_ISSUES_TOKEN secret is configured, monorepo issues
# referenced by commits/PRs in (previous stable, promoted] also get a
# fail-soft "intentd vX.Y.Z promoted to stable" comment
# (scripts/notify-fixed-issues.sh).
name: Promote stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to promote to stable (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  # The notifier script reads squash-merged PR bodies on this repo via
  # `gh pr view` with the default GITHUB_TOKEN (job-level GH_TOKEN).
  pull-requests: read

# Never cancel a promotion in progress
concurrency:
  group: intentd-stable-promotion
  cancel-in-progress: false

jobs:
  promote-to-stable:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate version format
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            # Deliberately not echoing the raw input: it is unvalidated and could
            # contain workflow-command sequences (log injection).
            echo "::error::Invalid version input. Expected X.Y.Z (e.g. 0.1.0); prerelease/build suffixes are not allowed."
            exit 1
          fi
          echo "Version $VERSION is valid"
      # Pre-release is the expected state of a beta release, so it is not a
      # rejection reason here — the promotion clears it below. Drafts are still
      # rejected: they have no published assets to promote.
      - name: Verify release exists and is not a draft
        shell: bash
        run: |
          if ! is_draft=$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq '.isDraft'); then
            echo "::error::Release v${VERSION} does not exist on $GITHUB_REPOSITORY"
            exit 1
          fi
          if [[ "$is_draft" != "false" ]]; then
            echo "::error::Release v${VERSION} is a draft; only published releases can be promoted"
            exit 1
          fi
          echo "Release v${VERSION} exists and is not a draft"
      # Read the outgoing stable.json before it is rebuilt so the aggregated
      # notes can span (previous stable, promoted]. Fail-soft: a missing
      # asset/release (first promotion) or any error just leaves the previous
      # version empty.
      - name: Read previous stable version
        id: prev-stable
        continue-on-error: true
        shell: bash
        run: |
          prev=""
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          if gh release download channel-stable --repo "$GITHUB_REPOSITORY" \
            --pattern stable.json --dir "$tmpdir"; then
            prev=$(jq -r '.version // empty' "$tmpdir/stable.json" || true)
          else
            echo "No existing stable.json on channel-stable (first promotion?)"
          fi
          if [[ ! "$prev" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            prev=""
          fi
          echo "version=$prev" >> "$GITHUB_OUTPUT"
          echo "Previous stable version: ${prev:-<none>}"
      - name: Build stable manifest
        shell: bash
        run: |
          ./scripts/make-channel-manifest.sh "v${VERSION}" stable stable.json
      - name: Publish manifest to channel-stable
        shell: bash
        run: |
          ./scripts/publish-channel-manifest.sh stable stable.json
      # Betas are published as Pre-releases (v-release.yml); promotion clears
      # the flag and moves the Latest badge onto the promoted version. Uses the
      # job's GH_TOKEN (contents:write on this repo). Fail-soft and idempotent:
      # the manifest is already published, and a re-promotion just re-applies
      # the same flags.
      - name: Mark release as stable and Latest
        id: mark-latest
        continue-on-error: true
        shell: bash
        run: |
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}" --jq '.id')
          # make_latest is a string enum ("true"/"false"/"legacy"), hence -f not -F.
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F prerelease=false -f make_latest=true >/dev/null
          echo "Release v${VERSION} marked as non-prerelease and Latest on $GITHUB_REPOSITORY"
      - name: Warn if Latest marking failed
        if: steps.mark-latest.outcome != 'success'
        shell: bash
        run: |
          echo "::warning::Failed to mark v${VERSION} as non-prerelease/Latest on $GITHUB_REPOSITORY; the stable manifest is published and unaffected. Re-run the promotion for this version to retry the marking."
      # Fail-soft: aggregated notes are a nice-to-have; a failure here must
      # never fail the promotion (the manifest is already published).
      - name: Aggregate stable release notes
        id: notes
        continue-on-error: true
        shell: bash
        env:
          PREV_STABLE: ${{ steps.prev-stable.outputs.version }}
        run: |
          ./scripts/aggregate-stable-notes.sh "$VERSION" "$PREV_STABLE"
      - name: Post summary
        shell: bash
        env:
          PREV_STABLE: ${{ steps.prev-stable.outputs.version }}
          NOTES_OUTCOME: ${{ steps.notes.outcome }}
          MARK_LATEST_OUTCOME: ${{ steps.mark-latest.outcome }}
        run: |
          {
            echo "## Stable promotion"
            echo ""
            echo "**Promoted version:** v$VERSION"
            echo ""
            echo "**Previous stable:** ${PREV_STABLE:-unknown (first promotion?)}"
            echo ""
            if [[ "$MARK_LATEST_OUTCOME" == "success" ]]; then
              echo "**Latest badge:** v$VERSION marked as non-prerelease and Latest"
            else
              echo "**Latest badge:** skipped (non-blocking failure; manifest unaffected)"
            fi
            echo ""
            if [[ "$NOTES_OUTCOME" == "success" ]]; then
              echo "**Aggregated notes:** updated on channel-stable"
            else
              echo "**Aggregated notes:** skipped (non-blocking failure; manifest unaffected)"
            fi
            echo ""
            echo "- [channel-stable release (aggregated notes)](https://github.com/$GITHUB_REPOSITORY/releases/tag/channel-stable)"
            echo "- [stable.json](https://github.com/$GITHUB_REPOSITORY/releases/download/channel-stable/stable.json)"
          } >> "$GITHUB_STEP_SUMMARY"
      # --- Issue notifier: comment on fixed monorepo issues ---
      # Fail-soft: skipped with a warning when the MONOREPO_ISSUES_TOKEN
      # secret is not configured, and continue-on-error so a notification
      # failure never blocks manifest publishing (already done above) or the
      # mirror steps below.
      - name: Check issues token
        id: notify-token
        shell: bash
        env:
          MONOREPO_ISSUES_TOKEN: ${{ secrets.MONOREPO_ISSUES_TOKEN }}
        run: |
          if [[ -n "$MONOREPO_ISSUES_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MONOREPO_ISSUES_TOKEN secret is not configured; skipping fixed-issue notifications"
          fi
      - name: Notify fixed monorepo issues (stable)
        if: steps.notify-token.outputs.enabled == 'true'
        continue-on-error: true
        shell: bash
        env:
          PREV_STABLE: ${{ steps.prev-stable.outputs.version }}
          ISSUES_GH_TOKEN: ${{ secrets.MONOREPO_ISSUES_TOKEN }}
        run: |
          # First promotion (or unreadable stable.json): there is no sane
          # range to scan, so skip rather than guess.
          if [[ -z "$PREV_STABLE" ]]; then
            echo "::warning::Previous stable version unknown (first promotion?); skipping fixed-issue notifications"
            exit 0
          fi
          # The checkout is shallow; the notifier needs full history and tags
          # to scan the (previous stable, promoted] commit range. The checkout
          # does not persist credentials, so authenticate the fetch with the
          # job's GH_TOKEN via a one-shot credential helper — the token is
          # read from the environment at runtime and never appears in argv or
          # gets persisted (intent-hq/monorepo#1279). --force lets the fetch
          # update tags left stale by earlier runs on this non-ephemeral
          # runner — without it a rejected tag update ("would clobber
          # existing tag") makes the fetch exit 1 with no output at all
          # under --quiet; log loudly if it still fails
          # (intent-hq/monorepo#1921).
          auth_helper='!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f'
          git -c credential.helper= -c credential.helper="$auth_helper" \
            fetch --quiet --force --tags --unshallow 2>/dev/null \
            || git -c credential.helper= -c credential.helper="$auth_helper" \
              fetch --quiet --force --tags \
            || {
              echo "::error::git fetch --tags failed (exit $?); cannot resolve range v${PREV_STABLE}..v${VERSION} - issue notifications skipped"
              exit 1
            }
          for tag in "v${PREV_STABLE}" "v${VERSION}"; do
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::warning::Tag $tag not found in checkout; skipping fixed-issue notifications"
              exit 0
            fi
          done
          ./scripts/notify-fixed-issues.sh intentd "$VERSION" stable "v${PREV_STABLE}" "v${VERSION}"
      # --- Public mirror: intent-hq/intentd-releases ---
      # Runs last so a mirror failure (bad/expired token, network error) still
      # fails the workflow loudly, but can no longer skip the fail-soft notes
      # steps or the summary above — the primary promotion is fully done by
      # this point. Skipped with a warning when the INTENTD_RELEASES_TOKEN
      # secret is not configured, so a missing secret never blocks promotion.
      - name: Check mirror token
        id: mirror
        shell: bash
        env:
          INTENTD_RELEASES_TOKEN: ${{ secrets.INTENTD_RELEASES_TOKEN }}
        run: |
          if [[ -n "$INTENTD_RELEASES_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::INTENTD_RELEASES_TOKEN secret is not configured; skipping mirror to intent-hq/intentd-releases"
          fi
      # Idempotent: creates the mirrored release if missing and re-uploads the
      # assets with --clobber, so promoting a pre-mirror release still works.
      # Notes are copied from the source release body (download URLs rewritten
      # to the mirror) and re-synced if the mirrored release already exists.
      - name: Mirror release assets to intentd-releases
        if: steps.mirror.outputs.enabled == 'true'
        shell: bash
        env:
          DEST_REPO: intent-hq/intentd-releases
          DEST_GH_TOKEN: ${{ secrets.INTENTD_RELEASES_TOKEN }}
        run: |
          ./scripts/mirror-release-assets.sh "v${VERSION}"
      # Same release, but the platform URLs point at the mirrored assets.
      - name: Build mirror stable manifest
        if: steps.mirror.outputs.enabled == 'true'
        shell: bash
        env:
          ASSET_REPO: intent-hq/intentd-releases
        run: |
          mkdir -p mirror
          ./scripts/make-channel-manifest.sh "v${VERSION}" stable mirror/stable.json
      - name: Publish manifest to intentd-releases channel-stable
        if: steps.mirror.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.INTENTD_RELEASES_TOKEN }}
        run: |
          ./scripts/publish-channel-manifest.sh stable mirror/stable.json intent-hq/intentd-releases
      # Mirror counterpart of "Mark release as stable and Latest": the mirrored
      # release inherits the source's prerelease state at create time, so the
      # promotion has to clear it there too. Idempotent; fails loudly like the
      # other mirror steps.
      - name: Mark mirrored release as stable and Latest
        if: steps.mirror.outputs.enabled == 'true'
        shell: bash
        env:
          MIRROR_REPO: intent-hq/intentd-releases
          GH_TOKEN: ${{ secrets.INTENTD_RELEASES_TOKEN }}
        run: |
          release_id=$(gh api "repos/${MIRROR_REPO}/releases/tags/v${VERSION}" --jq '.id')
          # make_latest is a string enum ("true"/"false"/"legacy"), hence -f not -F.
          gh api -X PATCH "repos/${MIRROR_REPO}/releases/${release_id}" \
            -F prerelease=false -f make_latest=true >/dev/null
          echo "Release v${VERSION} marked as non-prerelease and Latest on $MIRROR_REPO"
