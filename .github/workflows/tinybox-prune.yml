# Scheduled prune of stale CI artifacts on tinybox's shared CI-scratch
# volumes (monorepo#1253).
#
# The 8 tinybox runner slots share the box, and ci.yml keeps per-slot
# persistent CARGO_TARGET_DIRs under /raid/ci-target on the 3.6T /raid
# volume ("prune ci-target if disk gets tight" — this workflow is that
# pruning, made automatic). Up to 8 multi-GiB copies per job flavor
# accumulate, plus smaller per-slot tool dirs on $HOME, and the root volume
# reached box-level ENOSPC when the target dirs lived there (killed jobs
# mid-run). Deletion is strictly path-allowlisted and runs in two tiers:
# age-based passes (mtime, oldest first), then a size-based LRU pass —
# a heavy CI day can fill /raid with dirs too fresh for any age window
# (monorepo#2959: prune run 32347260356 freed nothing at 28 GiB free),
# so when /raid free is still below min_free_target (default 100 GiB;
# workflow_dispatch input) after the age passes, per-slot target dirs
# are evicted regardless of age, least-recent-activity first, until the
# target is reached or candidates run out:
#   /raid/ci-target/*/*/*  per-slot cargo target dirs — stale > 7 days,
#                          tightened to > 2 days while /raid free is below
#                          min_free_target, then LRU-evicted while still
#                          below it
#   ~/ci-target/*/*/*      legacy pre-/raid target dirs on the root volume —
#                          stale > 7 days (the home_days dispatch input
#                          overrides the window), tightened to > 1 day while
#                          the root volume's free space is < 50 GiB; as
#                          these age out, CI itself frees the root volume
#   ~/ci-install-action/*  per-slot install-action HOMEs — stale > 7 days
#   ~/setup-pnpm-*         per-slot pnpm dests — stale > 7 days
#   ~/.install-action      legacy shared install-action dir — stale > 7 days
# Shared caches (~/.cargo registry, ~/.rustup toolchains) are never touched.
# In the age-based passes an entry is only deleted when nothing inside it
# was modified within the window (recursive mtime check), so a running
# job's target dir is never deleted; the LRU pass keeps that guarantee
# with its own rails — it skips this runner's own slot and any dir with
# activity within the last 15 minutes (a running job modifies its target
# dir continuously), and orders candidates by last activity inside the dir
# so warm slots are evicted last. Target dirs are warm caches only, so an
# LRU eviction costs a rebuild, not correctness. Every deletion (or
# dry-run candidate) is echoed. ci.yml's fail-fast preflight is the
# emergency backstop between these scheduled runs — since the
# 2026-08-20/08-21 exhaustions (monorepo#1253: /raid hit 0 GiB free with
# every dir too fresh for the preflight's stale-only pass, which could
# then only fail the job) it carries the same LRU eviction rails as an
# escalation tier — ordered by top-level dir mtime like the emergency
# purge, not this workflow's recursive last-activity key — targeting just
# the job's own need, so jobs self-heal a wedged disk instead of failing.
# The run log doubles as a disk report
# (df + per-entry size/age table). No sudo anywhere.
name: Tinybox prune

on:
  schedule:
    # Twice daily: 11:30 UTC ≈ 03:30/04:30 Pacific is a quiet hour for the
    # box; 23:30 UTC is not, but the prune is safe during activity
    # (concurrency-guarded, own-slot skip, recursive freshness/activity
    # checks), and one run per day cannot hold the comfort target — the
    # 2026-08-20/08-21 exhaustions (monorepo#1253) re-consumed the full
    # 100 GiB within ~17 h of a prune (~395 CI runs), so the second run
    # halves the window in which per-job preflights must LRU-evict on
    # their own.
    - cron: "30 11 * * *"
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what would be deleted without deleting anything
        type: boolean
        default: false
      home_days:
        description: >-
          $HOME/ci-target prune window in days (>= 1). Empty = automatic
          (7 days). Either way the window tightens to 1 day while the root
          volume is low on space.
        type: string
        default: ""
      min_free_target:
        description: >-
          /raid free-space target in GiB (>= 1). Empty = automatic
          (100). While /raid free is below it, the /raid window tightens
          to 2 days; if still below after all age passes, per-slot target
          dirs are LRU-evicted regardless of age until it is reached.
        type: string
        default: ""

permissions:
  contents: read

# Two prune runs must never overlap (the second would race the first's
# deletions and mtime checks); never cancel a prune mid-deletion either.
concurrency:
  group: tinybox-prune
  cancel-in-progress: false

jobs:
  prune:
    # Repo-variable gate: set TINYBOX_ONLINE to 'false' while the box is down
    # so the daily run skips instead of queueing-and-expiring on the offline
    # runner; clear it (or set anything else) when tinybox returns. Unset
    # counts as online.
    if: vars.TINYBOX_ONLINE != 'false'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Disk report (before)
        run: |
          set -euo pipefail
          df -h /raid "$HOME"
          echo
          echo "ci-target entries (size / age-days / path):"
          now=$(date +%s)
          # This report is informational: `|| true` keeps a missing
          # ci-target root or a dir vanishing mid-report (concurrent
          # cleanup) from failing the workflow under pipefail before
          # pruning runs.
          { find /raid/ci-target "$HOME/ci-target" -mindepth 3 -maxdepth 3 -type d -printf '%T@ %p\n' 2>/dev/null || true; } | sort -n | while IFS= read -r entry; do
            ts="${entry%% *}"; dir="${entry#* }"
            printf '%8s %4sd %s\n' "$(du -sh "$dir" 2>/dev/null | cut -f1 || true)" "$(( (now - ${ts%.*}) / 86400 ))" "$dir"
          done
          echo
          echo "tool dirs:"
          du -sh "$HOME/ci-install-action" "$HOME"/setup-pnpm-* "$HOME/.install-action" 2>/dev/null || true
      - name: Prune stale CI dirs
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
          HOME_DAYS: ${{ inputs.home_days }}
          MIN_FREE_TARGET: ${{ inputs.min_free_target }}
        run: |
          set -euo pipefail
          free_gib() { df -Pk "$1" | awk 'NR==2 { printf "%d", $4 / 1048576 }'; }
          remove() {
            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry-run] would delete: $1"
            else
              echo "deleting: $1"
              rm -rf -- "$1"
            fi
          }
          # Fresh = anything inside modified within $2 days. A running job
          # keeps its target dir fresh, so fresh entries are never deleted.
          # -mmin gives a strict N*24h window (-mtime rounds to whole days);
          # `|| true` keeps a dir vanishing mid-check from failing the run.
          is_fresh() { [ -n "$(find "$1" -mmin -"$(( $2 * 1440 ))" -print -quit 2>/dev/null || true)" ]; }
          # Active = anything inside modified within the last 15 minutes —
          # the LRU pass's running-job guard (a running job modifies its
          # target dir continuously, so an active slot is never evicted).
          is_active() { [ -n "$(find "$1" -mmin -15 -print -quit 2>/dev/null || true)" ]; }
          # Stale per-slot target dirs at exactly <root>/<repo>/<slot>/<job>,
          # oldest first; the case guard re-asserts the allowlist. $2 is the
          # ci-target root: /raid/ci-target (primary) or $HOME/ci-target
          # (legacy pre-/raid dirs on the root volume — sweeping them with
          # the same windows lets CI itself free the root volume as they
          # age out, retiring #1253's manual-cleanup item).
          prune_targets() {
            local days="$1" root="$2"
            while IFS= read -r entry; do
              dir="${entry#* }"
              case "$dir" in "$root/"?*) ;; *) continue ;; esac
              is_fresh "$dir" "$days" && continue
              remove "$dir"
            done < <(find "$root" -mindepth 3 -maxdepth 3 -type d -mmin +"$(( days * 1440 ))" -printf '%T@ %p\n' 2>/dev/null | sort -n)
          }
          # Size-based LRU eviction (monorepo#2959): a heavy CI day can fill
          # /raid with per-slot dirs younger than any age window, which the
          # age-based passes cannot touch (prune run 32347260356 freed
          # nothing at 28 GiB free). Target dirs are warm caches only —
          # evicting a fresh one costs a rebuild, not correctness — so while
          # /raid free is below the target, evict candidates in LRU order
          # (least recent activity first; activity = newest mtime inside the
          # dir, so warm slots go last) until the target is reached or
          # candidates run out. Rails on top of the shared path allowlist:
          # never this runner's own slot, and never a dir active within the
          # last 15 minutes (is_active, re-checked live at eviction time).
          # Under dry_run nothing is freed, so the pass echoes every
          # candidate it would evict.
          lru_candidates() {
            { find "$1" -mindepth 3 -maxdepth 3 -type d 2>/dev/null || true; } | while IFS= read -r dir; do
              ts=$({ find "$dir" -printf '%T@\n' 2>/dev/null || true; } | awk '$1>m{m=$1} END{if(m!="")print m}')
              [ -n "$ts" ] || continue
              printf '%s %s\n' "$ts" "$dir"
            done | sort -n
          }
          lru_evict() {
            local target="$1" root=/raid/ci-target
            while IFS= read -r entry; do
              if [ "$(free_gib /raid)" -ge "$target" ]; then
                echo "/raid free reached ${target} GiB — LRU eviction done"
                return 0
              fi
              dir="${entry#* }"
              case "$dir" in "$root/"?*) ;; *) continue ;; esac
              if [ -n "${RUNNER_NAME:-}" ]; then
                case "$dir" in "$root"/*/"$RUNNER_NAME"/*) echo "skipping own slot: $dir"; continue ;; esac
              fi
              if is_active "$dir"; then
                echo "skipping active (modified < 15 min ago): $dir"
                continue
              fi
              remove "$dir"
            done < <(lru_candidates "$root")
            if [ "$(free_gib /raid)" -ge "$target" ]; then
              echo "/raid free reached ${target} GiB — LRU eviction done"
            else
              echo "LRU candidates exhausted: /raid free $(free_gib /raid) GiB (target ${target} GiB, dry_run=$DRY_RUN)"
            fi
          }
          # $HOME/ci-target window: 7 days by default, overridden by the
          # home_days dispatch input. Reject anything but an integer >= 1 —
          # a 0-day window would defeat the freshness check and delete
          # running jobs' dirs. 10# forces base-10 so leading-zero values
          # like 08/09 don't parse as invalid octal literals downstream.
          home_days=7
          if [ -n "$HOME_DAYS" ]; then
            case "$HOME_DAYS" in *[!0-9]*) echo "invalid home_days: $HOME_DAYS" >&2; exit 1 ;; esac
            home_days=$(( 10#$HOME_DAYS ))
            [ "$home_days" -ge 1 ] || { echo "invalid home_days: $HOME_DAYS" >&2; exit 1; }
          fi
          # /raid free-space target: 100 GiB by default, overridden by the
          # min_free_target dispatch input (same integer >= 1 validation as
          # home_days). While /raid free is below it the age window tightens
          # to 2 days; if still below after all age passes, LRU eviction
          # engages. Scheduled runs get the default, so the daily cron
          # self-heals a disk wedged by fresh dirs.
          min_free_target=100
          if [ -n "$MIN_FREE_TARGET" ]; then
            case "$MIN_FREE_TARGET" in *[!0-9]*) echo "invalid min_free_target: $MIN_FREE_TARGET" >&2; exit 1 ;; esac
            min_free_target=$(( 10#$MIN_FREE_TARGET ))
            [ "$min_free_target" -ge 1 ] || { echo "invalid min_free_target: $MIN_FREE_TARGET" >&2; exit 1; }
          fi
          echo "free before: /raid $(free_gib /raid) GiB, root volume $(free_gib "$HOME") GiB (home window: ${home_days}d, /raid target: ${min_free_target} GiB)"
          prune_targets 7 /raid/ci-target
          prune_targets "$home_days" "$HOME/ci-target"
          # Comfort target: with less than the free-space target on /raid the
          # next day's coverage jobs could still crowd the volume, so tighten
          # to 2 days.
          if [ "$(free_gib /raid)" -lt "$min_free_target" ]; then
            echo "/raid free < ${min_free_target} GiB after 7-day pass — tightening to 2 days"
            prune_targets 2 /raid/ci-target
          fi
          # Still below the target after every age-based pass: the space is
          # held by dirs too fresh for any age window (monorepo#2959) — fall
          # back to size-based LRU eviction.
          if [ "$(free_gib /raid)" -lt "$min_free_target" ]; then
            echo "/raid free < ${min_free_target} GiB after age-based passes — size-based LRU eviction"
            lru_evict "$min_free_target"
          fi
          # Root volume: all 8 slots share $HOME on it, and box-level ENOSPC
          # kills jobs mid-run, so tighten hard — while free space is
          # < 50 GiB, sweep $HOME/ci-target with a 1-day window regardless
          # of whether home_days was set explicitly (the recursive
          # freshness check still protects running jobs' dirs).
          if [ "$home_days" -gt 1 ] && [ "$(free_gib "$HOME")" -lt 50 ]; then
            echo "root volume free < 50 GiB — tightening \$HOME/ci-target to 1 day"
            prune_targets 1 "$HOME/ci-target"
          fi
          # Small per-slot / legacy tool dirs (recreated on demand by their
          # actions): 7-day window, same recursive freshness rule.
          for d in "$HOME/ci-install-action"/* "$HOME"/setup-pnpm-* "$HOME/.install-action"; do
            [ -e "$d" ] || continue
            is_fresh "$d" 7 && continue
            remove "$d"
          done
          echo "free after: /raid $(free_gib /raid) GiB, root volume $(free_gib "$HOME") GiB (dry_run=$DRY_RUN)"
      - name: Disk report (after)
        run: df -h /raid "$HOME"
