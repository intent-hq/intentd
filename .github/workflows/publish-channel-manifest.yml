# Post-announce hook for the dist Release pipeline (see dist-workspace.toml
# `post-announce-jobs`). After a tagged release is published (any tag the dist
# pipeline accepts, including prerelease-suffixed ones), this builds a channel
# manifest from the release's artifacts and uploads it as beta.json on
# the fixed `channel-beta` release. Every release lands on the beta channel;
# stable is a manual promotion of an existing release via the "Promote stable"
# workflow (promote-stable.yml), which updates stable.json on `channel-stable`.
#
# The manifests give consumers (e.g. cloudlands-fe pin-bump automation,
# installer scripts) a stable URL to discover the latest release per channel.
# Schema is documented in scripts/make-channel-manifest.sh and the README.
name: Publish channel manifest

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-channel-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Serialize beta.json updates so two tags pushed close together cannot
    # interleave and leave the manifest pointing at the older release.
    concurrency:
      group: intentd-beta-manifest-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Determine tag
        id: meta
        shell: bash
        run: |
          tag=$(jq -r '.announcement_tag // empty' <<<"$PLAN")
          if [[ -z "$tag" ]]; then
            echo "error: no announcement_tag in plan" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build channel manifest
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          ./scripts/make-channel-manifest.sh "$TAG" beta beta.json
      - name: Publish manifest to channel release
        shell: bash
        run: |
          ./scripts/publish-channel-manifest.sh beta beta.json
