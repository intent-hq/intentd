# Post-announce hook for the dist Release pipeline (see dist-workspace.toml
# `post-announce-jobs`). After a tagged release is published (any tag the dist
# pipeline accepts, including prerelease-suffixed ones), this builds a channel
# manifest from the release's artifacts and uploads it as alpha.json on
# the fixed `channel-alpha` release. Every release lands on the alpha channel;
# beta and stable are manual promotions of an existing release via the
# "Promote beta" (promote-beta.yml) and "Promote stable" (promote-stable.yml)
# workflows, which update beta.json on `channel-beta` and stable.json on
# `channel-stable` — beta.json is no longer auto-published on every tag.
#
# The manifests give consumers (e.g. cloudlands-fe pin-bump automation,
# installer scripts) a stable URL to discover the latest release per channel.
# Schema is documented in scripts/make-channel-manifest.sh and the README.
#
# When the INTENTD_RELEASES_TOKEN secret is configured, the release's platform
# archives + .sha256 sidecars are also mirrored to the public
# intent-hq/intentd-releases repo, together with an alpha.json whose platform
# URLs point at the mirrored assets. The alpha.json published on this repo is
# unchanged (sitter fallback path + future open-source path).
#
# When the MONOREPO_ISSUES_TOKEN secret is configured, monorepo issues
# referenced by commits/PRs in (previous tag, released tag] also get a
# fail-soft "Fixed in intentd vX.Y.Z (alpha)" comment
# (scripts/notify-fixed-issues.sh).
#
# When the FE_DISPATCH_TOKEN secret is configured, a repository_dispatch of
# type `intentd-alpha-published` (client_payload.version = the released
# version, no leading v) is sent to intent-hq/cloudlands-fe after the alpha
# manifest is published (source + mirror), so its auto-pin-intentd workflow
# can bump the sidecar pin immediately. Fail-soft: a missing secret or a
# failed dispatch logs a warning and never fails the job.
name: Publish channel manifest

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-channel-manifest:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    permissions:
      contents: write
      # The notifier script reads squash-merged PR bodies on this repo via
      # `gh pr view` with the default GITHUB_TOKEN (job-level GH_TOKEN).
      pull-requests: read
    # Serialize alpha.json updates so two tags pushed close together cannot
    # interleave and leave the manifest pointing at the older release.
    concurrency:
      group: intentd-alpha-manifest-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Determine tag
        id: meta
        shell: bash
        run: |
          tag=$(jq -r '.announcement_tag // empty' <<<"$PLAN")
          if [[ -z "$tag" ]]; then
            echo "error: no announcement_tag in plan" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build channel manifest
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          ./scripts/make-channel-manifest.sh "$TAG" alpha alpha.json
      - name: Publish manifest to channel release
        shell: bash
        run: |
          ./scripts/publish-channel-manifest.sh alpha alpha.json
      # --- Issue notifier: comment on fixed monorepo issues ---
      # Fail-soft: skipped with a warning when the MONOREPO_ISSUES_TOKEN
      # secret is not configured, and continue-on-error so a notification
      # failure never blocks the release.
      - name: Check issues token
        id: notify-token
        shell: bash
        env:
          MONOREPO_ISSUES_TOKEN: ${{ secrets.MONOREPO_ISSUES_TOKEN }}
        run: |
          if [[ -n "$MONOREPO_ISSUES_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MONOREPO_ISSUES_TOKEN secret is not configured; skipping fixed-issue notifications"
          fi
      - name: Notify fixed monorepo issues (alpha)
        if: steps.notify-token.outputs.enabled == 'true'
        continue-on-error: true
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          ISSUES_GH_TOKEN: ${{ secrets.MONOREPO_ISSUES_TOKEN }}
        run: |
          # Validate before echoing: the tag came from the dist plan
          # (log-injection posture as elsewhere in this repo).
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::warning::Announced tag is not a plain semver tag; skipping fixed-issue notifications"
            exit 0
          fi
          # The dist checkout is shallow; the notifier needs full history and
          # tags to compute the previous tag and scan the commit range. The
          # checkout does not persist credentials, so authenticate the fetch
          # with the job's GH_TOKEN via a one-shot credential helper — the
          # token is read from the environment at runtime and never appears
          # in argv or gets persisted (intent-hq/monorepo#1279). --force lets
          # the fetch update tags left stale by earlier runs on this
          # non-ephemeral runner — without it a rejected tag update ("would
          # clobber existing tag") makes the fetch exit 1 with no output at
          # all under --quiet, so the fallback fetch drops --quiet to keep
          # git's own diagnostics visible; log loudly if it still fails
          # (intent-hq/monorepo#1921).
          auth_helper='!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f'
          git -c credential.helper= -c credential.helper="$auth_helper" \
            fetch --quiet --force --tags --unshallow 2>/dev/null \
            || git -c credential.helper= -c credential.helper="$auth_helper" \
              fetch --force --tags \
            || {
              echo "::error::git fetch --tags failed (exit $?); cannot resolve the notifier tag range - issue notifications skipped"
              exit 1
            }
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::warning::Tag $TAG not found in checkout; skipping fixed-issue notifications"
            exit 0
          fi
          # Previous semver tag before the announced one (version order).
          prev=$(git tag --list \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            | sort -V \
            | awk -v tag="$TAG" '$0 == tag { exit } { prev = $0 } END { print prev }')
          if [[ -z "$prev" ]]; then
            echo "::warning::No semver tag before $TAG (first release?); skipping fixed-issue notifications"
            exit 0
          fi
          ./scripts/notify-fixed-issues.sh intentd "${TAG#v}" alpha "$prev" "$TAG"
      # --- Public mirror: intent-hq/intentd-releases ---
      # Skipped with a warning when the INTENTD_RELEASES_TOKEN secret is not
      # configured, so a missing secret never blocks the release itself.
      - name: Check mirror token
        id: mirror
        shell: bash
        env:
          INTENTD_RELEASES_TOKEN: ${{ secrets.INTENTD_RELEASES_TOKEN }}
        run: |
          if [[ -n "$INTENTD_RELEASES_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::INTENTD_RELEASES_TOKEN secret is not configured; skipping mirror to intent-hq/intentd-releases"
          fi
      # Notes are copied from the source release body (download URLs rewritten
      # to the mirror) and re-synced if the mirrored release already exists.
      - name: Mirror release assets to intentd-releases
        if: steps.mirror.outputs.enabled == 'true'
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          DEST_REPO: intent-hq/intentd-releases
          DEST_GH_TOKEN: ${{ secrets.INTENTD_RELEASES_TOKEN }}
        run: |
          ./scripts/mirror-release-assets.sh "$TAG"
      # Same release, but the platform URLs point at the mirrored assets.
      - name: Build mirror channel manifest
        if: steps.mirror.outputs.enabled == 'true'
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          ASSET_REPO: intent-hq/intentd-releases
        run: |
          mkdir -p mirror
          ./scripts/make-channel-manifest.sh "$TAG" alpha mirror/alpha.json
      - name: Publish manifest to intentd-releases channel release
        if: steps.mirror.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.INTENTD_RELEASES_TOKEN }}
        run: |
          ./scripts/publish-channel-manifest.sh alpha mirror/alpha.json intent-hq/intentd-releases
      # --- FE notification: alpha published ---
      # Fail-soft by design (mirrors notify-monorepo.yml): a missing
      # FE_DISPATCH_TOKEN secret or a failed dispatch logs a warning and
      # never fails the job — the FE's cron backstop picks up the bump.
      - name: Notify cloudlands-fe of alpha publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FE_DISPATCH_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::FE_DISPATCH_TOKEN secret is not set; skipping cloudlands-fe notification"
            exit 0
          fi
          if ! gh api repos/intent-hq/cloudlands-fe/dispatches \
            -f event_type=intentd-alpha-published \
            -f "client_payload[version]=${TAG#v}"; then
            echo "::warning::repository_dispatch to intent-hq/cloudlands-fe failed; its cron run will pick up the bump"
          fi
