name: Guard fixture file context controls only
on:
  push:
    branches: [diagnostic/pi-fixture-context-controls-v1-once]
permissions:
  contents: read
concurrency:
  group: pi-fixture-context-controls-v1-once
  cancel-in-progress: false
jobs:
  fixture-context-controls-only:
    if: github.event.created == true && github.run_attempt == 1 && github.event.deleted == false
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate exact controls branch scope
        shell: pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        timeout-minutes: 1
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD) -ne '${{ github.sha }}'){throw 'head_mismatch'}
          if((git rev-parse HEAD^) -ne '08a8582cae52aeddb6977d69909924588f5d11ef'){throw 'parent_mismatch'}
          foreach($path in (git diff-tree --no-commit-id --name-only -r HEAD)){
            if($path -ne '.gitattributes' -and $path -ne '.github/workflows/pi-fixture-context-controls-v1.yml' -and -not $path.StartsWith('diagnostics/pi-fixture-context-controls-v1/')){throw 'scope_mismatch'}
          }
          if(git status --porcelain){throw 'dirty_source'}
      - name: Validate named fixture context and both complete guard suites
        shell: pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        timeout-minutes: 1
        run: |
          & diagnostics/pi-fixture-context-controls-v1/run-controls.ps1 -EvidenceRoot (Join-Path '${{ runner.temp }}' 'fixture-context-controls-v1-${{ github.run_id }}-${{ github.run_attempt }}')
      - name: Upload fixed-schema controls outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fixture-context-controls-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fixture-context-controls-v1-${{ github.run_id }}-${{ github.run_attempt }}/result.json
          if-no-files-found: error
          retention-days: 7
