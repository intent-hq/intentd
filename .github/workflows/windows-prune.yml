name: Windows CI disk cleanup
on:
  schedule:
    - cron: "45 11,23 * * *"
  pull_request:
    paths:
      - .github/workflows/windows-prune.yml
      - .github/workflows/macos-prune.yml
      - scripts/windows-ci-cleanup.py
      - scripts/test-windows-ci-cleanup.py
  workflow_dispatch:
    inputs:
      apply:
        description: Delete inactive CI artifacts (otherwise dry run)
        type: boolean
        default: false
      verify_build:
        description: Compile intentd after an apply to verify runner recovery
        type: boolean
        default: false
  workflow_call:
    inputs:
      apply:
        type: boolean
        default: false
      verify_build:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-ci-disk-maintenance-${{ github.event_name == 'pull_request' && github.ref || '5090pc' }}
  cancel-in-progress: false
jobs:
  safety-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: depot-windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Test native Windows locks and deletion boundaries
        shell: pwsh
        run: python -I -B scripts/test-windows-ci-cleanup.py --require-windows
  prune:
    if: github.event_name != 'pull_request'
    needs: safety-tests
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Report eligible profiles
        shell: powershell
        run: python -I -B scripts/windows-ci-cleanup.py
      - name: Reclaim disk headroom
        if: github.event_name == 'schedule' || inputs.apply
        shell: powershell
        run: python -I -B scripts/windows-ci-cleanup.py --apply
      - name: Put Git Bash first on PATH
        if: inputs.apply && inputs.verify_build
        shell: cmd
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - name: Configure Depot managed compiler cache
        if: inputs.apply && inputs.verify_build
        shell: powershell
        env:
          DEPOT_SCCACHE_TOKEN: ${{ secrets.DEPOT_TOKEN }}
        run: python -I -B scripts/setup-depot-sccache.py
      - name: Resolve pinned Rust channel
        if: inputs.apply && inputs.verify_build
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "CARGO_TARGET_DIR=$USERPROFILE/ci-target/intentd/build-x86_64-pc-windows-msvc" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-11
        if: inputs.apply && inputs.verify_build
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: x86_64-pc-windows-msvc
      - name: Verify self-hosted Windows build
        if: inputs.apply && inputs.verify_build
        shell: powershell
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
        run: cargo build --locked -p intentd --bin intentd --target x86_64-pc-windows-msvc
