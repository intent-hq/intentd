name: Depot managed cache smoke
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      DEPOT_TOKEN:
        required: false
      INTENT_SCCACHE_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  populate:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust
        run: |
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - name: Configure Depot managed compiler cache
        shell: bash
        env:
          DEPOT_SCCACHE_TOKEN: ${{ secrets.DEPOT_TOKEN }}
          INTENT_SCCACHE_ENDPOINT: ${{ vars.INTENT_SCCACHE_ENDPOINT }}
          INTENT_SCCACHE_TOKEN: ${{ secrets.INTENT_SCCACHE_TOKEN }}
          INTENT_SCCACHE_MODE: ${{ vars.INTENT_SCCACHE_MODE }}
        run: python3 scripts/setup-depot-sccache.py
      - run: python3 -I -B scripts/test-release-cache-smoke.py --managed --phase populate
  verify:
    needs: populate
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust
        run: |
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - name: Configure Depot managed compiler cache
        shell: bash
        env:
          DEPOT_SCCACHE_TOKEN: ${{ secrets.DEPOT_TOKEN }}
          INTENT_SCCACHE_ENDPOINT: ${{ vars.INTENT_SCCACHE_ENDPOINT }}
          INTENT_SCCACHE_TOKEN: ${{ secrets.INTENT_SCCACHE_TOKEN }}
          INTENT_SCCACHE_MODE: ${{ vars.INTENT_SCCACHE_MODE }}
        run: python3 scripts/setup-depot-sccache.py
      - run: python3 -I -B scripts/test-release-cache-smoke.py --managed --phase verify
