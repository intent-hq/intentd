name: Depot managed cache smoke
on:
  pull_request:
    paths:
      - 'scripts/setup-depot-sccache.py'
      - '.github/workflows/depot-cache-smoke.yml'
      - 'scripts/test-release-cache-smoke.py'
      - 'scripts/test-depot-runners.py'
      - 'rust-toolchain.toml'
  workflow_dispatch:
    inputs:
      self_hosted_windows:
        description: Prove managed cache reuse on 5090pc
        type: boolean
        default: false
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  populate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.self_hosted_windows && '["self-hosted","Windows","X64"]' || '["depot-ubuntu-24.04"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Put Git Bash first on PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - name: Require 5090pc and its Depot token
        if: github.event_name == 'workflow_dispatch' && inputs.self_hosted_windows
        env:
          DEPOT_SCCACHE_TOKEN: ${{ secrets.DEPOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          if os.environ.get('RUNNER_NAME') != '5090pc':
              raise SystemExit('This proof must run on 5090pc')
          if not os.environ.get('DEPOT_SCCACHE_TOKEN'):
              raise SystemExit('DEPOT_TOKEN is required for the self-hosted proof')
          PY
      - name: Install pinned Rust
        run: |
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - name: Configure Depot managed compiler cache
        shell: bash
        env:
          DEPOT_SCCACHE_TOKEN: ${{ secrets.DEPOT_TOKEN }}
        run: python3 scripts/setup-depot-sccache.py
      - run: python3 -I -B scripts/test-release-cache-smoke.py --managed --phase populate
  verify:
    needs: populate
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.self_hosted_windows && '["self-hosted","Windows","X64"]' || '["depot-ubuntu-24.04"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Put Git Bash first on PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - name: Require 5090pc and its Depot token
        if: github.event_name == 'workflow_dispatch' && inputs.self_hosted_windows
        env:
          DEPOT_SCCACHE_TOKEN: ${{ secrets.DEPOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          if os.environ.get('RUNNER_NAME') != '5090pc':
              raise SystemExit('This proof must run on 5090pc')
          if not os.environ.get('DEPOT_SCCACHE_TOKEN'):
              raise SystemExit('DEPOT_TOKEN is required for the self-hosted proof')
          PY
      - name: Install pinned Rust
        run: |
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - name: Configure Depot managed compiler cache
        shell: bash
        env:
          DEPOT_SCCACHE_TOKEN: ${{ secrets.DEPOT_TOKEN }}
        run: python3 scripts/setup-depot-sccache.py
      - run: python3 -I -B scripts/test-release-cache-smoke.py --managed --phase verify
