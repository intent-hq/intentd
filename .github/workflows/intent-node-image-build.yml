# Reusable body of intent-node-image.yml (the github context is the caller's).
# Split out so release and PR runs can use different concurrency: GitHub
# rejects `queue: max` together with `cancel-in-progress: true`. No
# permissions block: the job keeps the caller's grant (packages: write only for
# release and manual runs), which a nested block could only narrow.
name: Intent node image build

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
      latest:
        required: false
        type: boolean

# Layer cache: every build reads the previous image's inline build cache
# (--cache-from) and pushes its own (--cache-to type=inline), so a release
# reuses the base, apt, gh and CLI layers byte for byte and only adds intentd.
# A PR proves it: it builds the release before the newest one into a local
# registry, builds the newest one with that as its only cache, and fails when
# the new layers are over LAYER_BUDGET_MB.
env:
  LAYER_BUDGET_MB: 120
  LOCAL_IMAGE: localhost:5000/intent-node

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      # An empty image skips the service: only PR runs need the local registry.
      registry:
        image: ${{ github.event_name == 'pull_request' && 'registry:2' || '' }}
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Find the newest intentd release
        id: latest
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The mirror also carries sitter-v* releases; take the two newest daemon tags.
          tags=$(gh release list --repo intent-hq/intentd-releases --limit 50 --json tagName \
            --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0:2][].tagName')
          echo "tag=$(sed -n 1p <<<"$tags")" >> "$GITHUB_OUTPUT"
          echo "previous=$(sed -n 2p <<<"$tags")" >> "$GITHUB_OUTPUT"

      - name: Write the Dockerfile
        id: plan
        working-directory: packaging/e2b
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LATEST: ${{ inputs.latest }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LATEST_RELEASE_TAG: ${{ steps.latest.outputs.tag }}
          PREVIOUS_RELEASE_TAG: ${{ steps.latest.outputs.previous }}
        run: node image.mjs

      # The docker-container driver keeps imported cache layers as the same
      # compressed blobs, so a push reuses them instead of uploading new ones.
      # Host networking lets it reach the PR's local registry.
      - uses: docker/setup-buildx-action@v4
        if: steps.plan.outputs.skip == 'false'
        with:
          driver-opts: network=host

      - name: Build the previous release as the cache
        if: steps.plan.outputs.skip == 'false' && steps.plan.outputs.baseline != ''
        working-directory: packaging/e2b
        run: |
          docker buildx build --platform linux/amd64 --pull --file Dockerfile.baseline \
            --cache-to type=inline \
            --output "type=image,name=$LOCAL_IMAGE:baseline,push=true,registry.insecure=true" .

      - name: Build the image
        if: steps.plan.outputs.skip == 'false'
        working-directory: packaging/e2b
        env:
          TAGS: ${{ steps.plan.outputs.tags }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          args=()
          for tag in $TAGS; do args+=(--tag "$tag"); done
          if [ -n "$PR_NUMBER" ]; then
            # Only the baseline as cache, like a release with the previous image.
            args+=(--cache-from "type=registry,ref=$LOCAL_IMAGE:baseline,registry.insecure=true")
            args+=(--output "type=image,name=$LOCAL_IMAGE:pr-$PR_NUMBER,push=true,registry.insecure=true")
          else
            args+=(--cache-from "type=registry,ref=ghcr.io/intent-hq/intent-node:latest")
          fi
          docker buildx build --platform linux/amd64 --pull --cache-to type=inline --load "${args[@]}" .

      - name: Smoke-test the image
        if: steps.plan.outputs.skip == 'false'
        working-directory: packaging/e2b
        env:
          REF: ${{ steps.plan.outputs.ref }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: node smoke-image.mjs "$REF" "$VERSION"

      - name: Measure the layers a release adds
        if: steps.plan.outputs.skip == 'false' && steps.plan.outputs.baseline != ''
        working-directory: packaging/e2b
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node layers.mjs "$LOCAL_IMAGE:baseline" "$LOCAL_IMAGE:pr-$PR_NUMBER" --budget-mb "$LAYER_BUDGET_MB"

      - name: Push the image
        if: steps.plan.outputs.push == 'true'
        working-directory: packaging/e2b
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          TAGS: ${{ steps.plan.outputs.tags }}
          REF: ${{ steps.plan.outputs.ref }}
        run: |
          log=$(mktemp)
          refuse() {
            echo "::warning::GHCR refused the intent-node image push; skipping it. Link the ghcr.io/intent-hq/intent-node package to intent-hq/intentd with write access (package settings, Manage Actions access). $(tail -1 "$log")"
            exit 0
          }
          if ! printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin >"$log" 2>&1; then
            grep -qiE 'denied|unauthorized|403' "$log" && refuse
            cat "$log"; exit 1
          fi
          previous=$(node layers.mjs --digest ghcr.io/intent-hq/intent-node:latest) || previous=
          # Rebuilds from the local build cache: the same layers that were smoke-tested.
          args=()
          for tag in $TAGS; do args+=(--tag "$tag"); done
          if ! docker buildx build --platform linux/amd64 --cache-to type=inline --push "${args[@]}" . >"$log" 2>&1; then
            grep -qiE 'denied|unauthorized|403' "$log" && refuse
            cat "$log"; exit 1
          fi
          echo "### intent-node image (built, smoke-tested, pushed)" >> "$GITHUB_STEP_SUMMARY"
          for tag in $TAGS; do
            echo "Pushed $tag"
            echo "- \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ -n "$previous" ]; then
            node layers.mjs "$previous" "$REF" || echo "::warning::Could not compare the layers with the previous latest image."
          fi
