name: m1mac smoke test
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply tested CI profile cleanup after dry-run
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: macos-ci-disk-maintenance
  cancel-in-progress: false
jobs:
  smoke:
    name: Recover CI disk (m1mac)
    runs-on: [self-hosted, macOS, ARM64, m1mac]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Test safety including actual Cargo lock behavior
        run: python3 -I -B scripts/test-macos-ci-cleanup.py
      - name: Dry-run eligible build profiles
        run: python3 -I -B scripts/macos-ci-cleanup.py
      - name: Recover disk
        if: inputs.apply
        run: python3 -I -B scripts/macos-ci-cleanup.py --apply
