name: Native reuse proof
on:
  merge_group:
permissions:
  contents: read
  actions: read
# A second workflow, with the same actual queue merge SHA, exercises the real
# v3 index/variant storage and lock boundary. Each caller reruns its Linux lint and runtime proofs.
concurrency:
  group: native-proof-caller-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
  queue: max
jobs:
  route:
    uses: ./.github/workflows/runner-route.yml
    secrets:
      CI_QUEUE_READ_TOKEN: ${{ secrets.CI_QUEUE_READ_TOKEN }}
  reuse:
    needs: route
    uses: ./.github/workflows/native-artifacts.yml
    secrets:
      DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
    with:
      platform: linux
      runner_labels: ${{ toJSON(fromJSON(needs.route.outputs.runners)['depot-ubuntu-24.04-16']) }}
