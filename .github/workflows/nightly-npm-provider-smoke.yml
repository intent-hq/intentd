name: Nightly npm Provider Smoke

# Runs every pinned npm provider package (OpenCode, Auggie, Grok, Droid and
# Intent's bundled Claude Code / Codex CLIs) the way Intent launches it, from
# an empty npm cache, on npm latest and on the oldest npm Intent accepts
# (NPX_MIN_NPM_VERSION): scripts/npm-provider-smoke.sh. npm 12 skipping
# install scripts broke npm-run providers for alpha users (intentd#3827) and
# only a user report caught it. Each failed launch is an error annotation
# naming the package and the npm version.
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-npm-provider-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner-route:
    uses: ./.github/workflows/runner-route.yml
    with:
      slot_jobs: >-
        [{"key":"npm-provider-smoke","label":"gh-linux-8x","rust":true,"minutes":40}]
    permissions:
      contents: read
      actions: read
    secrets:
      CI_QUEUE_READ_TOKEN: ${{ secrets.CI_QUEUE_READ_TOKEN }}

  smoke:
    name: npm provider smoke
    needs: [runner-route]
    # A failed route still runs the smoke test on its burst label.
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.runner-route.outputs.slots || '{}')['npm-provider-smoke'] || fromJSON('["warp-ubuntu-2404-x64-8x"]') }}
    # A cold intent-services test build, then two npm versions each
    # downloading every package (about 2 min per version on a fast link).
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      # crates.io resilience, matching nightly-payload-sweep.yml
      # (scripts/test-ci-cargo-network.py).
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure the self-hosted compiler cache
        shell: bash
        env:
          INTENT_SCCACHE_ENDPOINT: ${{ vars.INTENT_SCCACHE_ENDPOINT }}
          INTENT_SCCACHE_TOKEN: ${{ secrets.INTENT_SCCACHE_TOKEN }}
          INTENT_SCCACHE_MODE: ${{ vars.INTENT_SCCACHE_MODE }}
        run: python3 scripts/setup-sccache.py
      - name: Install libssl-dev if missing
        run: |
          if ! pkg-config --exists openssl; then
            for i in 1 2 3; do
              if sudo -n apt-get -o DPkg::Lock::Timeout=300 update -qq; then break; fi
              if [ "$i" -eq 3 ]; then exit 1; fi
              sleep $((i * 15))
            done
            sudo -n apt-get -o DPkg::Lock::Timeout=300 install -y -qq libssl-dev
          fi
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16 (PR 187 env-passed inputs, PR 186 install retry)
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Fetch locked crates
        run: python3 -I -B scripts/fetch-locked-crates.py
      # npm 12 requires Node ^22.22.2 || ^24.15.0 || >=26.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build the smoke test
        id: build
        run: cargo test --locked -p intent-services --lib --no-run
      # Package output reaches the log: stop-commands keeps it from issuing
      # workflow commands.
      - name: Smoke on npm latest
        id: latest
        shell: bash
        run: |
          token=$(python3 -c 'import secrets; print(secrets.token_hex(16))')
          echo "::stop-commands::$token"
          status=0
          scripts/npm-provider-smoke.sh latest "$RUNNER_TEMP/npm-provider-smoke" || status=$?
          echo "::$token::"
          exit "$status"
      - name: Smoke on the oldest supported npm
        id: oldest
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          token=$(python3 -c 'import secrets; print(secrets.token_hex(16))')
          echo "::stop-commands::$token"
          status=0
          scripts/npm-provider-smoke.sh oldest "$RUNNER_TEMP/npm-provider-smoke" || status=$?
          echo "::$token::"
          exit "$status"
      # One annotation per failed launch; a failed step that reported no
      # launch (npm install, a test precondition) gets one of its own.
      - name: Report launch results
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          LATEST_OUTCOME: ${{ steps.latest.outcome }}
          OLDEST_OUTCOME: ${{ steps.oldest.outcome }}
        run: |
          for spec in latest oldest; do
            log="$RUNNER_TEMP/npm-provider-smoke/npm-$spec.log"
            if [ "$spec" = latest ]; then outcome=$LATEST_OUTCOME; else outcome=$OLDEST_OUTCOME; fi
            touch "$log"
            {
              echo "### npm $spec: $(head -n 1 "$log")"
              echo '```'
              grep -E '^(ok   |FAIL )' "$log" || echo 'No launch results: see the smoke step log.'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if grep -q '^FAIL ' "$log"; then
              grep '^FAIL ' "$log" | while IFS= read -r line; do
                line=${line//%/%25}
                echo "::error title=npm provider smoke::${line#FAIL }"
              done
            elif [ "$outcome" = failure ]; then
              echo "::error title=npm provider smoke::npm $spec failed before reporting a launch: see its smoke step log"
            fi
          done
      - name: Upload smoke logs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-npm-provider-smoke
          path: ${{ runner.temp }}/npm-provider-smoke/
          if-no-files-found: error
          retention-days: 14
