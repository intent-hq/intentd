# Notifies intent-hq/intent on push to main so its auto-bump-submodules
# workflow can advance the submodule pin immediately (the cron run backstops
# any missed dispatch). Fail-soft by design: never fails the run.
name: Notify monorepo

on:
  push:
    branches: [main]

permissions: {}

jobs:
  runner-route:
    uses: ./.github/workflows/runner-route.yml
    permissions:
      contents: read
      actions: read
    secrets:
      CI_QUEUE_READ_TOKEN: ${{ secrets.CI_QUEUE_READ_TOKEN }}

  notify:
    needs: [runner-route]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.runners || '{}')['depot-ubuntu-24.04'] || fromJSON('["depot-ubuntu-24.04"]') }}
    steps:
      - name: Send repository_dispatch to intent-hq/intent
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::MONOREPO_DISPATCH_TOKEN secret is not set; skipping monorepo notification"
            exit 0
          fi
          if ! gh api repos/intent-hq/intent/dispatches \
            -f event_type=submodule-update \
            -f "client_payload[repo]=$REPO" \
            -f "client_payload[sha]=$SHA"; then
            echo "::warning::repository_dispatch to intent-hq/intent failed; the cron run will pick up the bump"
          fi
