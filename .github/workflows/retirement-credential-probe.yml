name: Retirement credential probe
# Read-only access probe: only the immutable independently reviewed helper
# meets the existing read credential. No candidate scripts are imported.
# GITHUB_TOKEN lacked bypass visibility in run 38558693794; the existing read
# credential proved that visibility in run 38558881748. This checks every read
# endpoint without claiming unknown activity is eligible for cancellation.
on:
  pull_request:
    paths:
      - '.github/workflows/retire-obsolete-merge-runs.yml'
      - '.github/workflows/retirement-credential-probe.yml'
      - 'scripts/*retire-obsolete-merge-runs*.py'
permissions: {}

jobs:
  # The default token has now demonstrated missing bypass metadata. Investigate
  # the EXISTING documented read credential, without changing secrets/scopes.
  # Only the independently reviewed policy commit meets this credential; no
  # candidate checkout, imported caller, cancellation path or API mutation.
  existing-read-credential:
    if: github.repository == 'intent-hq/intentd' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 62a2a110b7e217151280736acb7fd19a1daf3c71
          persist-credentials: false
      - name: Probe existing read credential with reviewed policy
        id: probe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CI_QUEUE_READ_TOKEN }}
        run: |
          python3 -I -B - <<'PY' | tee existing-read-credential-report.json
          import importlib.util
          import json
          import os
          import sys
          spec = importlib.util.spec_from_file_location('policy', 'scripts/retire-obsolete-merge-runs.py')
          policy = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(policy)
          observed = []
          class ReadOnly:
              def request(self, method, path, body=None):
                  policy.require(method == 'GET' or (method == 'POST' and path == '/graphql'
                      and isinstance(body, dict) and body.get('query') == policy.QUEUE_QUERY),
                      'read-only probe rejected request')
                  response = policy.GhApi().request(method, path, body)
                  observed.append({'method': method, 'path': path, 'status': response.status,
                                   'graphql_errors': bool(response.data.get('errors')) if path == '/graphql' and isinstance(response.data, dict) else False,
                                   'page_cursor': body['variables'].get('cursor') if path == '/graphql' else None})
                  return response
          def drain_activity(client, ctx):
              # Access diagnostics must finish every page despite null heads.
              # This is never used to authorize cancellation; runtime activity()
              # retains its stricter fail-closed eligibility checks unchanged.
              refs = client.rows(client.root + '/git/matching-refs/heads/gh-readonly-queue/')
              policy.require(len(refs) <= 1000, 'queue ref bound exceeded')
              names = set()
              for ref in refs:
                  name, obj = ref['ref'], ref['object']
                  policy.require(isinstance(name, str) and name.startswith('refs/heads/gh-readonly-queue/main/'), 'unknown queue ref target')
                  policy.require(name not in names and obj['type'] == 'commit' and policy.sha(obj['sha']), 'invalid/duplicate queue ref')
                  names.add(name)
              cursor, cursors, node_ids, unknown = None, set(), set(), []
              owner, name = client.repository.split('/')
              for page_number in range(1, client.max_pages + 1):
                  response = client.request('POST', '/graphql', {'query': policy.QUEUE_QUERY,
                      'variables': {'owner': owner, 'name': name, 'cursor': cursor}})
                  policy.require(response.status == 200 and not response.data.get('errors'), 'GraphQL activity unavailable/partial')
                  repo = response.data['data']['repository']
                  policy.require(policy.integer(repo['databaseId'], 1) and repo['databaseId'] == ctx['id']
                      and repo['nameWithOwner'] == client.repository, 'foreign queue response')
                  entries = repo['mergeQueue']['entries']
                  policy.require(isinstance(entries['nodes'], list) and len(entries['nodes']) <= 100, 'invalid queue nodes')
                  for node in entries['nodes']:
                      policy.require(isinstance(node['id'], str) and node['id'] not in node_ids, 'invalid/duplicate queue entry')
                      node_ids.add(node['id'])
                      policy.require(node['state'] in policy.QUEUE_STATES and node['pullRequest']['baseRefName'] == 'main', 'unknown queue state/target')
                      if node['headCommit'] is None:
                          unknown.append(node['id'])
                      else:
                          policy.require(policy.sha(node['headCommit']['oid']), 'invalid queue head')
                  page = entries['pageInfo']
                  policy.require(type(page['hasNextPage']) is bool, 'invalid queue pagination')
                  if not page['hasNextPage']:
                      return {'ok': True, 'access_authorized': True, 'refs_and_queue_complete': True,
                              'ref_count': len(refs), 'queue_entries': len(node_ids), 'queue_pages': page_number,
                              'null_head_entries': unknown, 'eligibility': 'unknown' if unknown else 'not_assessed'}
                  cursor = page['endCursor']
                  policy.require(isinstance(cursor, str) and cursor and cursor not in cursors, 'lost/repeated queue cursor')
                  cursors.add(cursor)
              raise policy.SafetyError('incomplete queue pagination')
          results = {}
          for name in ('protection', 'activity', 'reads'):
              try:
                  policy.require(bool(os.environ.get('GH_TOKEN')), 'existing read credential unavailable')
                  client = policy.Client(ReadOnly(), 'intent-hq/intentd', 10, 100)
                  ctx = policy.context(client)
                  if name == 'protection':
                      proof = policy.protection(client, ctx)
                      results[name] = {'ok': True, 'rule_ids': proof['rule_ids'], 'bypass_verified': True}
                  elif name == 'activity':
                      results[name] = drain_activity(client, ctx)
                  else:
                      base = policy.main_tip(client)
                      policy.compare(client, base, base)
                      runs = policy.discover(client, ctx)
                      # Known local incident run is a read-only fallback when
                      # discovery is empty; still validate exact full identity.
                      sampled = runs[0]['id'] if runs else 38388564446
                      run = client.get(client.root + '/actions/runs/' + str(sampled))
                      identity = policy.run_identity(run, ctx)
                      policy.require(identity['id'] == sampled, 'exact run ID mismatch')
                      results[name] = {'ok': True, 'sampled_run_id': sampled,
                                       'exact_run_read_exercised': True}
              except (ValueError, KeyError, TypeError, AttributeError) as error:
                  results[name] = {'ok': False, 'error': str(error)}
          success = (results['protection']['ok'] and results['reads']['ok']
                     and results['activity'].get('access_authorized') is True)
          print(json.dumps({'checks': results, 'requests': observed, 'access_proven': success}, indent=2, sort_keys=True))
          sys.exit(0 if success else 2)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: existing-read-credential-report
          path: existing-read-credential-report.json
          retention-days: 14
