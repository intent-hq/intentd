name: Retirement credential probe
# Read-only access probe: only the immutable independently reviewed helper
# meets the existing read credential. No candidate scripts are imported.
# GITHUB_TOKEN lacked bypass visibility in run 38558693794; the existing read
# credential proved that visibility in run 38558881748. This checks every read
# endpoint without claiming unknown activity is eligible for cancellation.
on:
  pull_request:
    paths:
      - '.github/workflows/retire-obsolete-merge-runs.yml'
      - '.github/workflows/retirement-credential-probe.yml'
      - 'scripts/*retire-obsolete-merge-runs*.py'
permissions: {}

jobs:
  # The default token has now demonstrated missing bypass metadata. Investigate
  # the EXISTING documented read credential, without changing secrets/scopes.
  # Only the independently reviewed policy commit meets this credential; no
  # candidate checkout, imported caller, cancellation path or API mutation.
  existing-read-credential:
    if: github.repository == 'intent-hq/intentd' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 62a2a110b7e217151280736acb7fd19a1daf3c71
          persist-credentials: false
      - name: Probe existing read credential with reviewed policy
        id: probe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CI_QUEUE_READ_TOKEN }}
        run: |
          python3 -I -B - <<'PY' | tee existing-read-credential-report.json
          import importlib.util
          import json
          import os
          import sys
          spec = importlib.util.spec_from_file_location('policy', 'scripts/retire-obsolete-merge-runs.py')
          policy = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(policy)
          observed = []
          class ReadOnly:
              def request(self, method, path, body=None):
                  policy.require(method == 'GET' or (method == 'POST' and path == '/graphql'
                      and isinstance(body, dict) and body.get('query') == policy.QUEUE_QUERY),
                      'read-only probe rejected request')
                  response = policy.GhApi().request(method, path, body)
                  observed.append({'method': method, 'path': path, 'status': response.status,
                                   'graphql_errors': bool(response.data.get('errors')) if path == '/graphql' and isinstance(response.data, dict) else False})
                  return response
          results = {}
          for name in ('protection', 'activity', 'reads'):
              try:
                  policy.require(bool(os.environ.get('GH_TOKEN')), 'existing read credential unavailable')
                  client = policy.Client(ReadOnly(), 'intent-hq/intentd', 10, 100)
                  ctx = policy.context(client)
                  if name == 'protection':
                      proof = policy.protection(client, ctx)
                      results[name] = {'ok': True, 'rule_ids': proof['rule_ids'], 'bypass_verified': True}
                  elif name == 'activity':
                      policy.activity(client, ctx, None)
                      results[name] = {'ok': True, 'refs_and_queue_complete': True, 'access_authorized': True}
                  else:
                      base = policy.main_tip(client)
                      policy.compare(client, base, base)
                      runs = policy.discover(client, ctx)
                      sampled = None
                      if runs:
                          sampled = runs[0]['id']
                          run = client.get(client.root + '/actions/runs/' + str(sampled))
                          policy.run_identity(run, ctx)
                      results[name] = {'ok': True, 'sampled_run_id': sampled,
                                       'exact_run_read_exercised': sampled is not None}
              except (ValueError, KeyError, TypeError, AttributeError) as error:
                  results[name] = {'ok': False, 'error': str(error)}
                  # A null/invalid head is unknown POLICY state, not an access
                  # denial. Do not change the production policy's fail-closed rule.
                  if name == 'activity' and str(error) == 'unknown candidate activity':
                      results[name]['access_authorized'] = any(
                          r['path'] == '/graphql' and r['status'] == 200 and not r['graphql_errors']
                          for r in observed)
          success = (results['protection']['ok'] and results['reads']['ok']
                     and results['activity'].get('access_authorized') is True)
          print(json.dumps({'checks': results, 'requests': observed, 'access_proven': success}, indent=2, sort_keys=True))
          sys.exit(0 if success else 2)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: existing-read-credential-report
          path: existing-read-credential-report.json
          retention-days: 14
