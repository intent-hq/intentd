name: Retirement credential probe
# Candidate code receives only a read-only GITHUB_TOKEN, never secrets or the
# cleanup job's actions:write. These are the cleanup credential's read scopes.
# After merge, cleanup repeats both proofs with its actual job token before any
# mutation. A local gh token, or an empty run list, is not permission evidence.
on:
  pull_request:
    paths:
      - '.github/workflows/retire-obsolete-merge-runs.yml'
      - '.github/workflows/retirement-credential-probe.yml'
      - 'scripts/*retire-obsolete-merge-runs*.py'
permissions: {}

jobs:
  probe:
    if: github.repository == 'intent-hq/intentd' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Probe protection and activity with workflow credential
        id: probe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -B scripts/retire-obsolete-merge-runs-caller.py \
            --repository intent-hq/intentd --probe-only | tee retirement-credential-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: retirement-credential-report
          path: retirement-credential-report.json
          retention-days: 14
