# Stale PR housekeeping: idle non-draft pull requests are labelled `stale`
# after 14 days without activity and closed 7 days later if nobody responds.
# Issues are disabled on this repository (they live in intent-hq/intent), so
# the issue side is switched off entirely (`days-before-issue-*: -1`).
#
# Policy (intent-hq/intent workspace "Auto-close stale issues and PRs"):
#   - in scope:   non-draft PRs (drafts are exempt)
#   - exempt:     PRs labelled `dependencies`, `github_actions` (dependabot)
#                 or `release` (release-plz Release PRs — see release-plz.toml
#                 `pr_labels`)
#   - mark stale: 14 idle days   -> `stale` label + comment
#   - close:      +7 idle days   -> closed, branch is NOT deleted
#   - a comment or push removes `stale` and resets the clock. Applying an
#     exemption label to an already-stale PR does NOT clear `stale` (the
#     action checks exemptions before it processes updates), so comment or
#     push as well.
#
# Permissions: `actions: write` is needed because actions/stale persists its
# pagination cursor in the Actions cache and must be able to delete/reset that
# cache entry; without it a run that hits `operations-per-run` can leave a
# stale cursor and later runs will not reliably cover every PR.
#
# Live/dry-run gate: scheduled runs are LIVE — the cron labels, comments on
# and closes PRs per the policy above. A manual `workflow_dispatch` defaults
# to `debug-only` (logs the decisions it WOULD take and touches nothing);
# pass `dry_run=false` for a live manual pass. To pause closure, set
# `debug-only: true` (or revert this file).
name: Stale PRs

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log decisions only; do not label, comment on, or close anything"
        type: boolean
        default: true

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # SHA-pinned (not tag-pinned): the action holds a write token, and a tag
      # can be moved to malicious code — a full commit SHA cannot.
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          debug-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          operations-per-run: 200

          # Issues are disabled on this repo.
          days-before-issue-stale: -1
          days-before-issue-close: -1

          # Pull requests.
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-label: stale
          exempt-draft-pr: true
          exempt-pr-labels: dependencies,github_actions,release
          remove-stale-when-updated: true
          delete-branch: false
          stale-pr-message: >-
            This pull request has had no activity for 14 days and has been
            marked `stale`. It will be closed in 7 days unless there is
            further activity. To keep it open, leave a comment or push a
            commit — either removes the `stale` label and resets the clock.
            Applying an exempting label (`dependencies`, `github_actions`,
            `release`) or converting to a draft prevents future stale
            marking but does not by itself clear `stale`, so comment or
            push as well.
          close-pr-message: >-
            Closing this pull request because it has been `stale` for 7 days
            with no further activity. The branch has not been deleted. A
            push or comment on a closed PR does not reopen it — to resume,
            reopen the PR first, then push or comment (or open a new PR from
            the same branch).
