name: Windows setup regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-route:
    uses: ./.github/workflows/runner-route.yml
    permissions:
      contents: read
      actions: read
    secrets:
      CI_QUEUE_READ_TOKEN: ${{ secrets.CI_QUEUE_READ_TOKEN }}

  headless-setup:
    if: github.event_name == 'workflow_dispatch'
    needs: [runner-route]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.runners || '{}')['depot-windows-2022-16'] || fromJSON('["depot-windows-2022-16"]') }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      INTENTD_ASSERT_BOUND_CALLER: "1"
      INTENTD_SETUP_EVIDENCE_DIR: ${{ github.workspace }}/setup-headless-evidence
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Put Git Bash first on PATH
        shell: cmd
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - name: Resolve pinned Rust channel
        id: toolchain
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: x86_64-pc-windows-msvc
      - name: Configure Depot managed compiler cache
        shell: bash
        env:
          DEPOT_SCCACHE_TOKEN: ${{ secrets.DEPOT_TOKEN }}
        run: python3 scripts/setup-depot-sccache.py
      - name: Test cursor parser
        run: |
          mkdir -p setup-headless-evidence
          cargo test --locked -p intent-pty --lib --target x86_64-pc-windows-msvc conpty_startup::tests -- --nocapture 2>&1 | tee setup-headless-evidence/parser.log
      - name: Test setup without terminal input
        run: |
          cargo test --locked -p intentd --test e2e_wss_setup_headless --target x86_64-pc-windows-msvc setup_finishes_without_terminal_client_input -- --exact --nocapture 2>&1 | tee setup-headless-evidence/runtime.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: setup-headless-pr-windows
          path: setup-headless-evidence
          if-no-files-found: error
