# Scheduled auto-merge of the release-plz Release PR — "auto-cut beta".
#
# Merging the Release PR is what cuts a beta: the squash-merge push to main
# triggers release-plz.yml, which pushes the vX.Y.Z tag, and the tag triggers
# the cargo-dist release build + beta manifest publish. That merge used to be
# a manual click; this workflow performs it on a schedule whenever the
# Release PR is already green, so betas ship hands-free. Stable promotion
# stays manual (promote-stable.yml) — this workflow only affects beta.
#
# Guardrails:
# - The `hold-release` label on the Release PR pauses auto-merge (skip with
#   a notice) until the label is removed.
# - Merge happens ONLY when GitHub already reports the PR clean: not a
#   draft, mergeable, required check "CI Gate" green on the current head,
#   and no unresolved review threads. Anything else logs and exits 0 — the
#   next scheduled run retries. Never force-merges.
# - The PR branch is never updated from here: release-plz owns the Release
#   PR branch content and refreshes it on every push to main, which is how
#   the ruleset's strict up-to-date requirement gets satisfied. A branch
#   that is behind main is just skipped until release-plz catches it up.
#
# Token split: all read-only queries (PR discovery, labels, mergeability,
# CI Gate via statusCheckRollup, review threads) authenticate with the
# implicit GITHUB_TOKEN under least-privilege job permissions — fine-grained
# PATs cannot read statusCheckRollup without Checks/Commit-statuses read
# access. The merge itself authenticates with the RELEASE_PLZ_TOKEN PAT,
# NOT the implicit GITHUB_TOKEN: pushes made with GITHUB_TOKEN do not
# trigger other workflows, and the merge push to main must trigger
# release-plz.yml's release job to push the tag. Fail-soft when the secret
# is absent (same convention as INTENTD_RELEASES_TOKEN /
# MONOREPO_ISSUES_TOKEN).

name: Auto-cut beta

permissions: {}

on:
  schedule:
    # Hourly at :00; each run is a seconds-long API check that either
    # squash-merges a green Release PR or exits quietly.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log what would be merged without merging"
        required: false
        default: false
        type: boolean

# Serialize runs so a scheduled run and a manual dispatch can never race a
# merge of the same Release PR. `cancel-in-progress: false` because a run
# that has already decided to merge must not be cancelled mid-merge.
concurrency:
  group: auto-cut-beta
  cancel-in-progress: false

jobs:
  # Read-only queries authenticate with the implicit GITHUB_TOKEN, so the
  # job grants it exactly the read scopes those queries need (top-level
  # permissions stay `{}`); the RELEASE_PLZ_TOKEN PAT is used only for the
  # final merge.
  auto-merge-release-pr:
    name: Auto-merge green Release PR
    # Seconds-long API-only job: pinned to ubuntu-latest (same rationale as
    # ci.yml's pr-title/gate jobs — a tinybox slot would be wasted on it).
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'intent-hq' }}
    timeout-minutes: 5
    permissions:
      pull-requests: read
      checks: read
      statuses: read
      # gh pr view --json statusCheckRollup reads the rollup off the PR's
      # last commit object (contents) and resolves each check run's
      # workflowRun (actions).
      contents: read
      actions: read
    steps:
      - name: Check release token
        id: token
        shell: bash
        env:
          RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [[ -n "$RELEASE_PLZ_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASE_PLZ_TOKEN secret is not configured; skipping Release PR auto-merge"
          fi
      - name: Merge the Release PR when green
        if: steps.token.outputs.enabled == 'true'
        shell: bash
        env:
          # Reads use the implicit token (job permissions above); the PAT is
          # applied per-command, only where it is required.
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          # Boolean input; on schedule events the inputs context is empty and
          # this renders "false".
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          set -euo pipefail

          # Identify the open release-plz Release PR: head branch
          # `release-plz-*` and a release title in either pr_name form this
          # repo has produced (see release-plz.yml's concurrency comment).
          # Branch name and title alone are attacker-controlled (a fork PR
          # can use both), so the candidate is also required to come from a
          # branch in THIS repository (no fork heads), and its author is
          # verified below against the release-plz PAT identity.
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,title,headRefName,isDraft,labels,isCrossRepository,author \
            --jq '[.[] | select((.isCrossRepository == false)
                  and (.headRefName | startswith("release-plz-"))
                  and ((.title | startswith("chore: release v"))
                    or (.title | startswith("chore(intentd): release v"))))]')
          count=$(jq 'length' <<<"$prs")
          if [[ "$count" -eq 0 ]]; then
            echo "No open release-plz Release PR — no changes, no release."
            exit 0
          fi
          if [[ "$count" -gt 1 ]]; then
            # Should never happen (release-plz maintains a single Release
            # PR); refuse to guess rather than merge the wrong one.
            echo "::warning::Found $count open PRs that look like the Release PR ($(jq -r '[.[].number | tostring] | join(", #")' <<<"$prs" | sed 's/^/#/')); refusing to guess"
            exit 0
          fi
          number=$(jq -r '.[0].number' <<<"$prs")
          title=$(jq -r '.[0].title' <<<"$prs")
          echo "Release PR: #$number ($title)"

          # Bind the candidate to the release-plz identity: the Release PR
          # is opened with the same RELEASE_PLZ_TOKEN PAT the merge below
          # authenticates with, so its author must be the token's own login.
          # This viewer lookup must run with the PAT (it resolves the PAT's
          # identity, not the workflow's). Together with the same-repo check
          # above, this pins the merge target to the repository-managed
          # release-plz PR — a PR that merely imitates the branch-name/title
          # shape never qualifies.
          viewer=$(GH_TOKEN="$RELEASE_PLZ_TOKEN" gh api graphql \
            -f query='query { viewer { login } }' \
            --jq '.data.viewer.login')
          author=$(jq -r '.[0].author.login' <<<"$prs")
          if [[ -z "$viewer" || "$author" != "$viewer" ]]; then
            echo "::warning::Release PR #$number author ($author) is not the release-plz PAT identity ($viewer); refusing to auto-merge"
            exit 0
          fi

          # Pause guardrail: a human puts `hold-release` on the Release PR to
          # stop auto-cutting (e.g. to batch more changes or hold a bad
          # commit out of a beta); remove the label to resume.
          if jq -e '.[0].labels | any(.name == "hold-release")' <<<"$prs" >/dev/null; then
            echo "::notice::Release PR #$number carries the hold-release label; auto-merge paused until it is removed"
            exit 0
          fi

          detail=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,mergeable,mergeStateStatus,statusCheckRollup)

          if [[ $(jq -r '.isDraft' <<<"$detail") != "false" ]]; then
            echo "Release PR #$number is a draft; skipping."
            exit 0
          fi

          # Strict up-to-date is enforced by the ruleset, and release-plz
          # owns the branch content — never update the branch from here;
          # release-plz refreshes the PR on the next push to main.
          merge_state=$(jq -r '.mergeStateStatus' <<<"$detail")
          if [[ "$merge_state" == "BEHIND" ]]; then
            echo "Release PR #$number is behind main; leaving it for release-plz to refresh."
            exit 0
          fi

          mergeable=$(jq -r '.mergeable' <<<"$detail")
          if [[ "$mergeable" != "MERGEABLE" ]]; then
            echo "Release PR #$number is not mergeable (mergeable=$mergeable, mergeStateStatus=$merge_state); skipping."
            exit 0
          fi

          # Required check "CI Gate" must be green on the current head
          # (statusCheckRollup reflects the head commit). "missing" covers
          # a head whose checks have not started yet.
          gate=$(jq -r '[.statusCheckRollup[]? | select(.name == "CI Gate")]
            | if length == 0 then "missing"
              elif all(.conclusion == "SUCCESS") then "success"
              else (map(.conclusion // .status // "PENDING") | join(","))
              end' <<<"$detail")
          if [[ "$gate" != "success" ]]; then
            echo "CI Gate is not green on the current head (state: $gate); skipping."
            exit 0
          fi

          # --paginate walks every reviewThreads page (an unresolved thread
          # past the first page must still block the merge); --jq emits one
          # per-page count, summed by awk.
          unresolved=$(gh api graphql --paginate \
            -f query='query($owner: String!, $repo: String!, $pr: Int!, $endCursor: String) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $pr) {
                  reviewThreads(first: 100, after: $endCursor) {
                    nodes { isResolved }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }
            }' \
            -f owner="${GITHUB_REPOSITORY%/*}" \
            -f repo="${GITHUB_REPOSITORY#*/}" \
            -F pr="$number" \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved | not)] | length' \
            | awk '{ sum += $1 } END { print sum + 0 }')
          if [[ "$unresolved" -ne 0 ]]; then
            echo "Release PR #$number has $unresolved unresolved review thread(s); skipping."
            exit 0
          fi

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "DRY RUN: would squash-merge Release PR #$number ($title)."
            exit 0
          fi

          # Squash-merge with the PAT so the push to main triggers
          # release-plz.yml (tag push → cargo-dist build → beta manifest).
          # The squash commit title defaults to the single release commit's
          # message, which release-plz writes in the same conventional form
          # as the PR title. A failure here is not fatal: the PR state may
          # have changed under us, and the next scheduled run retries.
          if GH_TOKEN="$RELEASE_PLZ_TOKEN" gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --squash; then
            echo "Squash-merged Release PR #$number ($title); release-plz.yml now cuts the tag and the beta publishes automatically."
          else
            echo "::warning::gh pr merge failed for Release PR #$number (state changed under us?); the next scheduled run retries"
          fi
