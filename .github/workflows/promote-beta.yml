# Manual promotion of an existing vX.Y.Z release to the beta channel.
#
# Every tagged release automatically updates alpha.json on `channel-alpha`
# (publish-channel-manifest.yml, run as a dist post-announce hook). Beta is
# promotion-only: run this workflow with the version of an existing release to
# rebuild beta.json from that release's assets and upload it to the fixed
# `channel-beta` release. Consumers (e.g. cloudlands-fe pin-bump automation,
# installer scripts) discover the latest beta release from that manifest.
#
# When the INTENTD_RELEASES_TOKEN secret is configured, the promoted release's
# platform archives + .sha256 sidecars are also mirrored to the public
# intent-hq/intentd-releases repo (idempotent, so promoting a release cut
# before mirroring existed backfills it), together with a beta.json whose
# platform URLs point at the mirrored assets. The beta.json published on
# this repo is unchanged (sitter fallback path + future open-source path).
#
# Tagged releases are published as GitHub Pre-releases (v-release.yml), so a
# promotable release only has to exist and not be a draft. Unlike stable
# promotion (promote-stable.yml), beta promotion does NOT touch the
# prerelease/Latest flags — clearing the Pre-release flag and moving the
# Latest badge remain stable-promotion semantics.
#
# When the MONOREPO_ISSUES_TOKEN secret is configured, monorepo issues
# referenced by commits/PRs in (previous beta, promoted] also get a
# fail-soft "intentd vX.Y.Z promoted to beta" comment
# (scripts/notify-fixed-issues.sh).
name: Promote beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to promote to beta (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  # The notifier script reads squash-merged PR bodies on this repo via
  # `gh pr view` with the default GITHUB_TOKEN (job-level GH_TOKEN).
  pull-requests: read

# Never cancel a promotion in progress
concurrency:
  group: intentd-beta-promotion
  cancel-in-progress: false

jobs:
  promote-to-beta:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate version format
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            # Deliberately not echoing the raw input: it is unvalidated and could
            # contain workflow-command sequences (log injection).
            echo "::error::Invalid version input. Expected X.Y.Z (e.g. 0.1.0); prerelease/build suffixes are not allowed."
            exit 1
          fi
          echo "Version $VERSION is valid"
      # Pre-release is the expected state of an alpha release and stays set —
      # beta promotion never touches the flag. Drafts are still rejected: they
      # have no published assets to promote.
      - name: Verify release exists and is not a draft
        shell: bash
        run: |
          if ! is_draft=$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq '.isDraft'); then
            echo "::error::Release v${VERSION} does not exist on $GITHUB_REPOSITORY"
            exit 1
          fi
          if [[ "$is_draft" != "false" ]]; then
            echo "::error::Release v${VERSION} is a draft; only published releases can be promoted"
            exit 1
          fi
          echo "Release v${VERSION} exists and is not a draft"
      # Read the outgoing beta.json before it is rebuilt so the notifier can
      # scan (previous beta, promoted]. Fail-soft: a missing asset/release
      # (first promotion) or any error just leaves the previous version empty.
      - name: Read previous beta version
        id: prev-beta
        continue-on-error: true
        shell: bash
        run: |
          prev=""
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          if gh release download channel-beta --repo "$GITHUB_REPOSITORY" \
            --pattern beta.json --dir "$tmpdir"; then
            prev=$(jq -r '.version // empty' "$tmpdir/beta.json" || true)
          else
            echo "No existing beta.json on channel-beta (first promotion?)"
          fi
          if [[ ! "$prev" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            prev=""
          fi
          echo "version=$prev" >> "$GITHUB_OUTPUT"
          echo "Previous beta version: ${prev:-<none>}"
      - name: Build beta manifest
        shell: bash
        run: |
          ./scripts/make-channel-manifest.sh "v${VERSION}" beta beta.json
      - name: Publish manifest to channel-beta
        shell: bash
        run: |
          ./scripts/publish-channel-manifest.sh beta beta.json
      - name: Post summary
        shell: bash
        env:
          PREV_BETA: ${{ steps.prev-beta.outputs.version }}
        run: |
          {
            echo "## Beta promotion"
            echo ""
            echo "**Promoted version:** v$VERSION"
            echo ""
            echo "**Previous beta:** ${PREV_BETA:-unknown (first promotion?)}"
            echo ""
            echo "- [channel-beta release](https://github.com/$GITHUB_REPOSITORY/releases/tag/channel-beta)"
            echo "- [beta.json](https://github.com/$GITHUB_REPOSITORY/releases/download/channel-beta/beta.json)"
          } >> "$GITHUB_STEP_SUMMARY"
      # --- Issue notifier: comment on fixed monorepo issues ---
      # Fail-soft: skipped with a warning when the MONOREPO_ISSUES_TOKEN
      # secret is not configured, and continue-on-error so a notification
      # failure never blocks manifest publishing (already done above) or the
      # mirror steps below.
      - name: Check issues token
        id: notify-token
        shell: bash
        env:
          MONOREPO_ISSUES_TOKEN: ${{ secrets.MONOREPO_ISSUES_TOKEN }}
        run: |
          if [[ -n "$MONOREPO_ISSUES_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MONOREPO_ISSUES_TOKEN secret is not configured; skipping fixed-issue notifications"
          fi
      - name: Notify fixed monorepo issues (beta)
        if: steps.notify-token.outputs.enabled == 'true'
        continue-on-error: true
        shell: bash
        env:
          PREV_BETA: ${{ steps.prev-beta.outputs.version }}
          ISSUES_GH_TOKEN: ${{ secrets.MONOREPO_ISSUES_TOKEN }}
        run: |
          # First promotion (or unreadable beta.json): there is no sane
          # range to scan, so skip rather than guess.
          if [[ -z "$PREV_BETA" ]]; then
            echo "::warning::Previous beta version unknown (first promotion?); skipping fixed-issue notifications"
            exit 0
          fi
          # The checkout is shallow; the notifier needs full history and tags
          # to scan the (previous beta, promoted] commit range. The checkout
          # does not persist credentials, so authenticate the fetch with the
          # job's GH_TOKEN via a one-shot credential helper — the token is
          # read from the environment at runtime and never appears in argv or
          # gets persisted (intent-hq/monorepo#1279). --force lets the fetch
          # update tags left stale by earlier runs on this non-ephemeral
          # runner — without it a rejected tag update ("would clobber
          # existing tag") makes the fetch exit 1 with no output at all
          # under --quiet, so the fallback fetch drops --quiet to keep git's
          # own diagnostics visible; log loudly if it still fails
          # (intent-hq/monorepo#1921).
          auth_helper='!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f'
          git -c credential.helper= -c credential.helper="$auth_helper" \
            fetch --quiet --force --tags --unshallow 2>/dev/null \
            || git -c credential.helper= -c credential.helper="$auth_helper" \
              fetch --force --tags \
            || {
              echo "::error::git fetch --tags failed (exit $?); cannot resolve range v${PREV_BETA}..v${VERSION} - issue notifications skipped"
              exit 1
            }
          for tag in "v${PREV_BETA}" "v${VERSION}"; do
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::warning::Tag $tag not found in checkout; skipping fixed-issue notifications"
              exit 0
            fi
          done
          ./scripts/notify-fixed-issues.sh intentd "$VERSION" beta "v${PREV_BETA}" "v${VERSION}"
      # --- Public mirror: intent-hq/intentd-releases ---
      # Runs last so a mirror failure (bad/expired token, network error) still
      # fails the workflow loudly, but can no longer skip the fail-soft notes
      # steps or the summary above — the primary promotion is fully done by
      # this point. Skipped with a warning when the INTENTD_RELEASES_TOKEN
      # secret is not configured, so a missing secret never blocks promotion.
      - name: Check mirror token
        id: mirror
        shell: bash
        env:
          INTENTD_RELEASES_TOKEN: ${{ secrets.INTENTD_RELEASES_TOKEN }}
        run: |
          if [[ -n "$INTENTD_RELEASES_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::INTENTD_RELEASES_TOKEN secret is not configured; skipping mirror to intent-hq/intentd-releases"
          fi
      # Idempotent: creates the mirrored release if missing and re-uploads the
      # assets with --clobber, so promoting a pre-mirror release still works.
      # Notes are copied from the source release body (download URLs rewritten
      # to the mirror) and re-synced if the mirrored release already exists.
      - name: Mirror release assets to intentd-releases
        if: steps.mirror.outputs.enabled == 'true'
        shell: bash
        env:
          DEST_REPO: intent-hq/intentd-releases
          DEST_GH_TOKEN: ${{ secrets.INTENTD_RELEASES_TOKEN }}
        run: |
          ./scripts/mirror-release-assets.sh "v${VERSION}"
      # Same release, but the platform URLs point at the mirrored assets.
      - name: Build mirror beta manifest
        if: steps.mirror.outputs.enabled == 'true'
        shell: bash
        env:
          ASSET_REPO: intent-hq/intentd-releases
        run: |
          mkdir -p mirror
          ./scripts/make-channel-manifest.sh "v${VERSION}" beta mirror/beta.json
      - name: Publish manifest to intentd-releases channel-beta
        if: steps.mirror.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.INTENTD_RELEASES_TOKEN }}
        run: |
          ./scripts/publish-channel-manifest.sh beta mirror/beta.json intent-hq/intentd-releases
