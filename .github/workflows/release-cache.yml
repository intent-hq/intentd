# Generated by scripts/configure-release-cache-producer.py; do not edit.
# Main-only, build-only: warm Depot managed sccache using the release build inputs.
# No cache archives, retention permissions, publication or notifications.
# Compare actual compiler hits and build duration before claiming a speedup.
name: Warm release Rust caches
'on':
  push:
    branches:
    - main
    paths:
    - Cargo.lock
    - '**/Cargo.toml'
    - rust-toolchain.toml
    - .cargo/config*
    - dist-workspace.toml
    - '**/build.rs'
    - '**/*.c'
    - '**/*.cc'
    - '**/*.cpp'
    - '**/*.h'
    - .github/dist-build-setup.yml
    - scripts/setup-depot-sccache.py
    - .github/workflows/release-cache.yml
    - .github/workflows/release-sitter.yml
    - scripts/*release*cache*.py
    - scripts/optional-intel-release.py
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: intentd-release-cache-producers
  cancel-in-progress: false
jobs:
  runner-route:
    uses: ./.github/workflows/runner-route.yml
    permissions:
      contents: read
      actions: read
    secrets:
      CI_QUEUE_READ_TOKEN: ${{ secrets.CI_QUEUE_READ_TOKEN }}

  plan:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [runner-route]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.runners || '{}')['depot-ubuntu-24.04'] || fromJSON('["depot-ubuntu-24.04"]') }}
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install dist
      shell: bash
      run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh
        | sh
    - id: plan
      name: Plan build-only matrix
      shell: bash
      run: |
        dist plan --output-format=json > cache-plan.json
        python3 scripts/optional-intel-release.py matrix cache-plan.json --event cache --ref refs/heads/main
        echo "matrix=$(jq -c '.ci.github.artifacts_matrix' cache-plan.json)" >> "$GITHUB_OUTPUT"
  daemon:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [plan, runner-route]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ fromJSON(needs.runner-route.outputs.runners || '{}')[matrix.runner] || matrix.runner }}
    timeout-minutes: 60
    steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Enable Windows long paths
      shell: bash
      run: git config --global core.longpaths true
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Put Git Bash first on PATH (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
    - name: Make apt-get non-interactive and lock-tolerant (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo 'APT::Get::Assume-Yes "true";' | sudo tee /etc/apt/apt.conf.d/90assumeyes >/dev/null
        echo 'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/90lock-timeout >/dev/null
        echo "DEBIAN_FRONTEND=noninteractive" >> "$GITHUB_ENV"
    - name: Install retrying apt-get shim (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo tee /usr/local/bin/apt-get >/dev/null <<'EOF'
        #!/bin/sh
        # Installed by intent-hq/intentd CI (dist-build-setup.yml, monorepo#1515).
        # Retries /usr/bin/apt-get on apt/dpkg lock contention: DPkg::Lock::Timeout
        # does not cover the lists lock taken by `apt-get update` (Debian #1069167).
        attempt=1
        while :; do
          err=$(mktemp)
          /usr/bin/apt-get "$@" 2>"$err"
          rc=$?
          cat "$err" >&2
          if [ "$rc" -eq 0 ] || [ "$attempt" -ge 3 ] || ! grep -qE 'Could not get lock|Unable to lock|Unable to acquire' "$err"; then
            rm -f "$err"
            exit "$rc"
          fi
          rm -f "$err"
          echo "apt-get lock contention (attempt $attempt/3); retrying in $((attempt * 15))s..." >&2
          sleep $((attempt * 15))
          attempt=$((attempt + 1))
        done
        EOF
        sudo chmod 0755 /usr/local/bin/apt-get
    - name: Provision Rust toolchain and matrix targets
      shell: bash
      run: "if ! command -v rustup >/dev/null 2>&1; then\n  if [ ! -x \"$HOME/.cargo/bin/rustup\" ]; then\n    curl\
        \ --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --default-toolchain none -y\n  fi\n  echo\
        \ \"$HOME/.cargo/bin\" >> \"$GITHUB_PATH\"\n  export PATH=\"$HOME/.cargo/bin:$PATH\"\nfi\nchannel=$(sed\
        \ -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*\"([^\"]+)\".*/\\1/p' rust-toolchain.toml | head -n1)\n\
        rustup toolchain install \"$channel\" --profile minimal --no-self-update\nrustup target add --toolchain\
        \ \"$channel\" ${{ join(matrix.targets, ' ') }}\n# Pin the rustup proxies to the toolchain provisioned above\
        \ for all\n# later steps. Without this, the first `cargo` invocation inside\n# `dist build` re-enters rustup's\
        \ rust-toolchain.toml sync to add the\n# declared rustfmt/clippy components, which on the GitHub-hosted\n\
        # depot-ubuntu-24.04-16 images collides with the preinstalled Rust (\"failed to\n# install component: 'rustfmt-preview-...',\
        \ detected conflict:\n# 'bin/cargo-fmt'\"), rolls back, and leaves the shim reporting cargo\n# as missing\
        \ (v0.2.16 Release run 30706345522, aarch64-musl leg).\n# The components aren't needed for release builds.\n\
        echo \"RUSTUP_TOOLCHAIN=$channel\" >> \"$GITHUB_ENV\"\n# dist's musl packages_install does a user-site `pip3\
        \ install\n# cargo-zigbuild` on the Linux runner, which lands in ~/.local/bin \u2014\n# not on the runner\
        \ service's PATH.\nmkdir -p \"$HOME/.local/bin\"\necho \"$HOME/.local/bin\" >> \"$GITHUB_PATH\"\n"
    - name: Stage tailcat sidecar binary
      shell: bash
      run: |
        set -euo pipefail
        TAILCAT_VERSION=0.4.0
        TAILCAT_SHA256_LINUX_AMD64=8b819c43dfdf806b5663e23535aba557bb106075b0b5839df289af9bba70bec2
        TAILCAT_SHA256_LINUX_ARM64=3b77322350f64d229d5b2119b159b863b4bcffa0a62a0294682423a19956dc76
        TAILCAT_SHA256_WINDOWS_AMD64=c238a4e8d3b460423a67e5ad400888b73ffa0b28e15173fd32c9acb699a3a89e
        base="https://github.com/tailscale/tailcat/releases/download/v${TAILCAT_VERSION}"
        dest=packaging/libexec
        tmp=$(mktemp -d)
        fetch_prebuilt() { # $1=asset $2=sha256 $3=binary-name-in-archive
          curl -fsSL --retry 3 -o "$tmp/$1" "$base/$1"
          # Git Bash on the hosted depot-windows-2022 runner ships coreutils'
          # sha256sum but not the perl shasum; Linux runners have both.
          if command -v sha256sum >/dev/null 2>&1; then
            echo "$2  $tmp/$1" | sha256sum -c -
          else
            echo "$2  $tmp/$1" | shasum -a 256 -c -
          fi
          case "$1" in
            *.zip)
              # unzip is absent from Git Bash and the depot-windows-2022 image;
              # the image ships 7-Zip (7z on PATH) instead.
              if command -v unzip >/dev/null 2>&1; then
                unzip -q "$tmp/$1" -d "$tmp/x"
              else
                7z x -y -o"$tmp/x" "$tmp/$1" >/dev/null
              fi ;;
            *) mkdir -p "$tmp/x" && tar -xzf "$tmp/$1" -C "$tmp/x" ;;
          esac
          mv "$tmp/x/$3" "$dest/$3"
        }
        build_from_source() { # $1=GOARCH
          if ! command -v go >/dev/null 2>&1; then brew install go; fi
          git clone --depth 1 --branch "v${TAILCAT_VERSION}" \
            https://github.com/tailscale/tailcat "$tmp/src"
          tags=$(tr -d '[:space:]' < "$tmp/src/build-tags.txt")
          (cd "$tmp/src" && CGO_ENABLED=0 GOARCH="$1" go build \
            -tags="$tags" \
            -ldflags="-s -w -X main.version=v${TAILCAT_VERSION}" \
            -o tailcat ./cmd/tailcat)
          mv "$tmp/src/tailcat" "$dest/tailcat"
        }
        case "${{ join(matrix.targets, ' ') }}" in
          x86_64-unknown-linux-musl)
            fetch_prebuilt "tailcat_${TAILCAT_VERSION}_linux_amd64.tar.gz" \
              "$TAILCAT_SHA256_LINUX_AMD64" tailcat ;;
          aarch64-unknown-linux-musl)
            fetch_prebuilt "tailcat_${TAILCAT_VERSION}_linux_arm64.tar.gz" \
              "$TAILCAT_SHA256_LINUX_ARM64" tailcat ;;
          x86_64-pc-windows-msvc)
            fetch_prebuilt "tailcat_${TAILCAT_VERSION}_windows_amd64.zip" \
              "$TAILCAT_SHA256_WINDOWS_AMD64" tailcat.exe ;;
          aarch64-apple-darwin)  build_from_source arm64 ;;
          x86_64-apple-darwin)   build_from_source amd64 ;;
          *) echo "no tailcat mapping for target '${{ join(matrix.targets, ' ') }}'" >&2; exit 1 ;;
        esac
        ls -l "$dest"
    - name: Install dist (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: ${{ matrix.install_dist.run }}
    - name: Install dist (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: ${{ matrix.install_dist.run }}
    - name: Install native build dependencies
      shell: bash
      run: ${{ matrix.packages_install }}
    - name: Configure Depot managed compiler cache
      shell: bash
      env:
        DEPOT_SCCACHE_TOKEN: ${{ secrets.DEPOT_TOKEN }}
      run: python3 scripts/setup-depot-sccache.py
    - name: Build cache inputs
      shell: bash
      run: |
        start=$SECONDS
        dist build --output-format=json ${{ matrix.dist_args }} > cache-build-manifest.json
        echo "Build duration: $((SECONDS - start)) seconds" >> "$GITHUB_STEP_SUMMARY"
    - name: Report compiler cache statistics
      shell: bash
      run: sccache --show-stats >> "$GITHUB_STEP_SUMMARY"
  sitter:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: aarch64-apple-darwin
          os: depot-macos-latest
        - target: x86_64-unknown-linux-musl
          os: depot-ubuntu-24.04-16
          zigbuild: true
        - target: aarch64-unknown-linux-musl
          os: depot-ubuntu-24.04-16
          zigbuild: true
        - target: x86_64-pc-windows-msvc
          os: depot-windows-2022-16
    needs: [runner-route]
    runs-on: ${{ fromJSON(needs.runner-route.outputs.runners || '{}')[matrix.os] || matrix.os }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
    steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Provision Rust toolchain and target
      shell: bash
      run: |
        channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
        rustup toolchain install "$channel" --profile minimal --no-self-update
        rustup target add --toolchain "$channel" "$TARGET"
        echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
    - name: Install cargo-zigbuild
      if: ${{ matrix.zigbuild }}
      shell: bash
      run: |
        pip3 install cargo-zigbuild
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Configure Depot managed compiler cache
      shell: bash
      env:
        DEPOT_SCCACHE_TOKEN: ${{ secrets.DEPOT_TOKEN }}
      run: python3 scripts/setup-depot-sccache.py
    - name: Build (cargo)
      if: ${{ !matrix.zigbuild }}
      shell: bash
      run: |
        start=$SECONDS
        cargo build --release -p intentd-sitter --target "$TARGET"
        echo "Build duration: $((SECONDS - start)) seconds" >> "$GITHUB_STEP_SUMMARY"
    - name: Build (cargo-zigbuild)
      if: ${{ matrix.zigbuild }}
      shell: bash
      run: |
        start=$SECONDS
        cargo zigbuild --release -p intentd-sitter --target "$TARGET"
        echo "Build duration: $((SECONDS - start)) seconds" >> "$GITHUB_STEP_SUMMARY"
    - name: Report compiler cache statistics
      shell: bash
      run: sccache --show-stats >> "$GITHUB_STEP_SUMMARY"
