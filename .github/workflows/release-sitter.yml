# Release pipeline for the intentd sitter (crates/intentd-sitter).
#
# Hand-written, NOT cargo-dist generated: the sitter is `dist = false` so the
# daemon's dist pipeline (release.yml) never picks it up. Triggered by pushing
# a `sitter-vX.Y.Z` tag, it:
#
# * builds `intentd-sitter` in release mode for the same 5 targets as the
#   daemon (musl targets cross-built with cargo-zigbuild, mirroring dist)
# * renames the binary to `intentd` (`intentd.exe` on Windows) and packages it
#   as `intentd-<triple>.tar.xz` (unix, nested `intentd-<triple>/` dir like
#   dist tarballs) / `intentd-<triple>.zip` (Windows, flat like dist zips),
#   plus `.sha256` sidecars — same naming as daemon archives so install
#   instructions stay uniform
# * smoke-tests each packaged binary with `--sitter-version`
# * publishes a GitHub Release on the tag (never marked "latest", so daemon
#   releases keep `releases/latest` semantics) and refreshes the fixed
#   `sitter-latest` release so stable install URLs exist (including the
#   scripts/install.sh + scripts/install.ps1 one-line installer scripts)
#
# Packaging jobs hang off `publish` (the fan-in):
#
# * `deb` repacks the linux musl archives into intentd_<version>_{amd64,arm64}
#   .deb packages (scripts/build-deb.sh) and uploads them to the tag release,
#   refreshing constant-named copies on sitter-latest for stable URLs
# * `mirror` copies the tag release's assets and the refreshed sitter-latest
#   assets to identically-tagged releases on the public
#   intent-hq/intentd-releases repo (scripts/mirror-release-assets.sh), so the
#   installer URLs work without access to this private repo; skipped with a
#   warning when the INTENTD_RELEASES_TOKEN secret is absent
# * `publish-homebrew` renders packaging/homebrew/intentd.rb.template with the
#   real version + sha256s and pushes it to intent-hq/homebrew-tap (skipped on
#   prereleases, mirroring sitter-latest); runs after `mirror` because the
#   formula downloads from intentd-releases
name: Release sitter

permissions:
  contents: write

on:
  push:
    tags:
      - "sitter-v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  plan:
    runs-on: gh-linux-16x
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Parse and validate tag
        id: meta
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^sitter-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "error: '$TAG' is not a valid sitter release tag (expected sitter-vX.Y.Z[-prerelease])" >&2
            exit 1
          fi
          version=${TAG#sitter-v}
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - name: Check tag matches crate version
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          crate_version=$(sed -nE 's/^version = "([^"]+)".*/\1/p' crates/intentd-sitter/Cargo.toml | head -n1)
          if [[ "$crate_version" != "$VERSION" ]]; then
            echo "error: tag version $VERSION != intentd-sitter crate version $crate_version" >&2
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS targets build on GitHub-hosted Apple Silicon runners (the
          # self-hosted m1mac went offline and releases queued forever
          # behind it); the x86_64 target is a cross build, smoke-tested
          # under Rosetta 2. Linux musl targets build on the org-hosted
          # gh-linux-16x runner (cross-built with cargo-zigbuild as before)
          # so the release path never queues behind — or deadlocks on — the
          # self-hosted tinybox fleet.
          # Windows uses the org-hosted gh-windows-16x runner (16-core/64GB,
          # Windows Server 2022 image) for faster release builds
          # (intent-hq/monorepo#1803).
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-musl
            os: gh-linux-16x
            zigbuild: true
          - target: aarch64-unknown-linux-musl
            os: gh-linux-16x
            zigbuild: true
          - target: x86_64-pc-windows-msvc
            os: gh-windows-16x
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}
      # No rust-cache step: nothing saves under a key this tag-push-only
      # workflow could restore (ci.yml's build job uses gh-build-<target>),
      # so a restore-only cache here was dead weight — and enabling saves
      # would pressure the repo's 10 GiB Actions cache budget (now
      # load-bearing for ci.yml's burst caches and release-plz's sccache
      # dir) for a blob likely LRU-evicted between infrequent sitter
      # releases anyway. Release builds are accepted as cold.
      # Mirror the dist pipeline's musl approach: cross-compile with
      # cargo-zigbuild (the PyPI package bundles the zig toolchain). The
      # user-site install can land in ~/.local/bin, which is not guaranteed
      # to be on PATH, so add it explicitly.
      - name: Install cargo-zigbuild
        if: ${{ matrix.zigbuild }}
        shell: bash
        run: |
          pip3 install cargo-zigbuild
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build (cargo)
        if: ${{ !matrix.zigbuild }}
        shell: bash
        run: cargo build --release -p intentd-sitter --target "$TARGET"
      - name: Build (cargo-zigbuild)
        if: ${{ matrix.zigbuild }}
        shell: bash
        run: cargo zigbuild --release -p intentd-sitter --target "$TARGET"
      - name: Package (unix tar.xz)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          mkdir -p "staging/intentd-$TARGET"
          cp "target/$TARGET/release/intentd-sitter" "staging/intentd-$TARGET/intentd"
          chmod +x "staging/intentd-$TARGET/intentd"
          tar -cJf "intentd-$TARGET.tar.xz" -C staging "intentd-$TARGET"
      # Compress-Archive keeps the zip flat like dist zips (no 7z dependency
      # needed).
      - name: Package (windows zip)
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item "target\$env:TARGET\release\intentd-sitter.exe" staging\intentd.exe
          Compress-Archive -Path staging\intentd.exe -DestinationPath "intentd-$env:TARGET.zip" -Force
      # GNU-style "HASH *NAME" output. macOS ships no GNU coreutils (its
      # sha256sum, where present, is a Darwin variant with different
      # flags/output), so use shasum there — `-b` emits the same
      # "HASH *NAME" format as `sha256sum --binary`.
      - name: Checksum sidecar
        shell: bash
        run: |
          for archive in intentd-"$TARGET".tar.xz intentd-"$TARGET".zip; do
            if [[ -f "$archive" ]]; then
              if [[ "$RUNNER_OS" == "macOS" ]]; then
                shasum -a 256 -b "$archive" > "$archive.sha256"
              else
                sha256sum --binary "$archive" > "$archive.sha256"
              fi
            fi
          done
      # Smoke: the packaged binary must run and exit 0. x86_64-apple-darwin
      # runs under Rosetta 2 on the arm64 macOS runner; aarch64 musl (statically
      # linked) runs under qemu-user on the x86_64 ubuntu runner.
      - name: Smoke test (unix)
        if: ${{ runner.os != 'Windows' && matrix.target != 'aarch64-unknown-linux-musl' }}
        shell: bash
        run: ./staging/intentd-"$TARGET"/intentd --sitter-version
      - name: Smoke test (aarch64 musl via qemu)
        if: ${{ matrix.target == 'aarch64-unknown-linux-musl' }}
        shell: bash
        run: |
          # apt lock hardening (monorepo#1515): DPkg::Lock::Timeout makes
          # `install` wait for the dpkg locks; the retry loop covers `update`,
          # whose lists lock has no wait option (Debian bug #1069167).
          for i in 1 2 3; do
            if sudo apt-get -o DPkg::Lock::Timeout=300 update -q; then break; fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            sleep $((i * 15))
          done
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y -q qemu-user-static
          qemu-aarch64-static "./staging/intentd-$TARGET/intentd" --sitter-version
      - name: Smoke test (windows)
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: ./staging/intentd.exe --sitter-version
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sitter-${{ matrix.target }}
          path: |
            intentd-${{ matrix.target }}.*
          if-no-files-found: error

  # Fan-in: the packaging jobs (publish-homebrew, deb) depend on this job
  # having published the release assets.
  publish:
    needs:
      - plan
      - build
    runs-on: gh-linux-16x
    timeout-minutes: 10
    # Serialize sitter-latest updates so two tags pushed close together cannot
    # interleave and leave the fixed release with mixed assets.
    concurrency:
      group: intentd-sitter-release-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: sitter-*
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release on the tag
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          prerelease_flag=()
          if [[ "$PRERELEASE" == "true" ]]; then
            prerelease_flag=(--prerelease)
          fi
          # --latest=false: daemon releases keep `releases/latest` semantics.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_COMMIT" \
              --latest=false \
              "${prerelease_flag[@]}" \
              --title "intentd sitter $VERSION" \
              --notes "Self-updating supervisor shim for intentd, installed as \`intentd\`. Archives contain the sitter binary renamed to \`intentd\` (\`intentd.exe\` on Windows)."
          fi
          gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
      # Fixed release so install instructions have a stable URL
      # (releases/download/sitter-latest/intentd-<triple>.tar.xz). Asset names
      # are constant, so --clobber replaces the full set. Prereleases are not
      # promoted here, mirroring channel-stable semantics.
      - name: Refresh sitter-latest release
        if: ${{ needs.plan.outputs.prerelease == 'false' }}
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if ! gh release view sitter-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if ! gh release create sitter-latest \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_COMMIT" \
              --latest=false \
              --title "intentd sitter (latest)" \
              --notes "Fixed release tracking the newest sitter version for stable install URLs. Do not consume the tag itself; download the intentd-<triple> archives."
            then
              # Tolerate only a lost create race; the release must exist now.
              if ! gh release view sitter-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                echo "error: failed to create release sitter-latest and it does not exist" >&2
                exit 1
              fi
            fi
          fi
          gh release upload sitter-latest artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          # One-line installer scripts, refreshed alongside the archives so
          # `curl … install.sh | sh` / `irm … install.ps1 | iex` URLs stay
          # stable and current.
          gh release upload sitter-latest scripts/install.sh scripts/install.ps1 \
            --repo "$GITHUB_REPOSITORY" --clobber
          # Re-stamp published_at so the fixed release reflects this refresh
          # (GitHub never updates it on asset uploads).
          ./scripts/refresh-release-published-at.sh sitter-latest "$GITHUB_REPOSITORY"

  # Mirror the sitter installer assets to the public intent-hq/intentd-releases
  # repo (same pattern as the daemon mirroring in publish-channel-manifest.yml
  # / promote-stable.yml). Fans in after `publish` and `deb` so both the
  # archives and the .debs exist on the source releases. Skipped with a
  # warning when the INTENTD_RELEASES_TOKEN secret is not configured, so a
  # missing secret never blocks the release itself.
  mirror:
    needs:
      - plan
      - publish
      - deb
    runs-on: gh-linux-16x
    timeout-minutes: 10
    outputs:
      enabled: ${{ steps.mirror.outputs.enabled }}
    # Serialize sitter-latest mirror refreshes so two tags pushed close
    # together cannot interleave on the public fixed release. This only
    # serializes mirror jobs against each other, not against another tag's
    # publish/deb jobs, so a mirror can read the source sitter-latest
    # mid-refresh — that converges: the later tag's mirror re-reads the
    # settled source state (the script reads the current source, not run
    # artifacts).
    concurrency:
      group: intentd-sitter-release-mirror
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
      MIRROR_REPO: intent-hq/intentd-releases
      # Sitter release assets: platform archives plus versioned and
      # constant-named .deb packages, each with a .sha256 sidecar, plus the
      # one-line installer scripts (sitter-latest only; no sidecars).
      SITTER_ASSET_REGEX: ^(intentd-[a-z0-9_]+-[a-z0-9-]+\.(tar\.xz|tar\.gz|zip)|intentd_([^_]+_)?(amd64|arm64)\.deb|install\.(sh|ps1))(\.sha256)?$
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check mirror token
        id: mirror
        shell: bash
        env:
          INTENTD_RELEASES_TOKEN: ${{ secrets.INTENTD_RELEASES_TOKEN }}
        run: |
          if [[ -n "$INTENTD_RELEASES_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::INTENTD_RELEASES_TOKEN secret is not configured; skipping mirror to intent-hq/intentd-releases"
          fi
      - name: Mirror versioned sitter release to intentd-releases
        if: steps.mirror.outputs.enabled == 'true'
        shell: bash
        env:
          DEST_REPO: ${{ env.MIRROR_REPO }}
          DEST_GH_TOKEN: ${{ secrets.INTENTD_RELEASES_TOKEN }}
          ASSET_REGEX: ${{ env.SITTER_ASSET_REGEX }}
          RELEASE_TITLE: intentd sitter ${{ needs.plan.outputs.version }}
          RELEASE_NOTES: "Mirror of the ${{ needs.plan.outputs.tag }} intentd sitter release: platform archives, Debian packages, and .sha256 sidecars. Archives contain the sitter binary renamed to `intentd` (`intentd.exe` on Windows)."
        run: |
          ./scripts/mirror-release-assets.sh "$TAG"
      # PRUNE_STALE: the source sitter-latest release is refreshed in place
      # with constant asset names, so the mirror must drop any assets that no
      # longer exist on the source instead of only clobber-uploading.
      - name: Mirror sitter-latest release to intentd-releases
        if: ${{ steps.mirror.outputs.enabled == 'true' && needs.plan.outputs.prerelease == 'false' }}
        shell: bash
        env:
          DEST_REPO: ${{ env.MIRROR_REPO }}
          DEST_GH_TOKEN: ${{ secrets.INTENTD_RELEASES_TOKEN }}
          ASSET_REGEX: ${{ env.SITTER_ASSET_REGEX }}
          RELEASE_TITLE: intentd sitter (latest)
          RELEASE_NOTES: "Fixed release tracking the newest sitter version for stable install URLs. Do not consume the tag itself; download the intentd-<triple> archives or the constant-named .deb packages."
          PRUNE_STALE: "true"
        run: |
          ./scripts/mirror-release-assets.sh sitter-latest
          # Re-stamp published_at on the mirrored fixed release too.
          GH_TOKEN="$DEST_GH_TOKEN" \
            ./scripts/refresh-release-published-at.sh sitter-latest "$DEST_REPO"

  # Render the hand-maintained formula template with the real version +
  # sha256s and push it to the tap as Formula/intentd.rb. Skipped on
  # prereleases, mirroring the sitter-latest handling. Authenticates with the
  # same HOMEBREW_TAP_TOKEN secret the dist daemon pipeline used. Runs after
  # `mirror` because the rendered formula downloads its archives from the
  # public intent-hq/intentd-releases mirror — and is skipped entirely when
  # the mirror was disabled (missing INTENTD_RELEASES_TOKEN), since pushing a
  # formula whose URLs point at assets that were never mirrored would break
  # `brew install` with 404s.
  publish-homebrew:
    needs:
      - plan
      - publish
      - mirror
    if: ${{ needs.plan.outputs.prerelease == 'false' && needs.mirror.outputs.enabled == 'true' }}
    runs-on: gh-linux-16x
    timeout-minutes: 10
    # Serialize tap pushes so two tags pushed close together cannot race the
    # non-fast-forward push.
    concurrency:
      group: intentd-sitter-release-homebrew
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: sitter-*
          path: artifacts
          merge-multiple: true
      - name: Render formula
        run: ./scripts/render-sitter-homebrew-formula.sh "$VERSION" artifacts intentd.rb
      - name: Style-check rendered formula (advisory)
        run: |
          export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          # Recent GitHub-hosted Ubuntu images may not ship Linuxbrew; this
          # check is advisory, so skip rather than fail when brew is absent.
          if ! command -v brew >/dev/null 2>&1; then
            echo "::warning::brew not installed on this runner; skipping advisory formula style check"
            exit 0
          fi
          # brew style only accepts formulas inside a tap; stage the rendered
          # file in a scratch tap (mirroring where it ships: Formula/ in the
          # real tap) so formula cops apply instead of bare Ruby-file cops.
          brew tap-new --no-git scratch/sitter
          cp intentd.rb "$(brew --repository scratch/sitter)/Formula/intentd.rb"
          brew style --formula scratch/sitter/intentd \
            || echo "::warning::brew style reported offenses on intentd.rb (non-blocking)"
      - uses: actions/checkout@v7
        with:
          repository: intent-hq/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: true
          path: tap
      - name: Commit and push formula
        run: |
          install -m 0644 intentd.rb tap/Formula/intentd.rb
          cd tap
          git config user.name "intent-hq bot"
          git config user.email "intent-hq@users.noreply.github.com"
          git add Formula/intentd.rb
          if git diff --cached --quiet; then
            echo "formula unchanged; nothing to push"
            exit 0
          fi
          git commit -m "intentd $VERSION"
          git push

  # Repack the linux musl archives into Debian packages and attach them to
  # the tag release; non-prereleases also refresh constant-named copies on
  # sitter-latest so install URLs stay stable (versioned names would
  # accumulate on the fixed release).
  deb:
    needs:
      - plan
      - publish
    runs-on: gh-linux-16x
    timeout-minutes: 10
    # Own group (not the publish one): asset names are disjoint from the
    # archives, so deb refreshes only need to serialize against themselves.
    concurrency:
      group: intentd-sitter-release-deb
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download linux artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: sitter-*-unknown-linux-musl
          path: artifacts
          merge-multiple: true
      - name: Build .debs
        run: |
          # Debian ordering: "-" starts a revision that sorts ABOVE the bare
          # upstream version (0.2.0-beta.1 > 0.2.0), while "~" sorts below
          # (0.2.0~beta.1 < 0.2.0), so map prerelease hyphens to "~" to keep
          # stable releases upgradeable over prerelease installs.
          deb_version=${VERSION//-/'~'}
          ./scripts/build-deb.sh artifacts/intentd-x86_64-unknown-linux-musl.tar.xz "$deb_version" amd64
          ./scripts/build-deb.sh artifacts/intentd-aarch64-unknown-linux-musl.tar.xz "$deb_version" arm64
          # .sha256 companions, same format as the other release assets
          # (sha256sum --binary: "HASH *NAME").
          for deb in intentd_*.deb; do
            sha256sum --binary "$deb" > "$deb.sha256"
          done
      - name: Verify package metadata and contents
        run: |
          for deb in intentd_*.deb; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
            test "$(dpkg-deb --field "$deb" Package)" = intentd
            dpkg-deb --contents "$deb" | grep -q ' \./usr/bin/intentd$'
            dpkg-deb --contents "$deb" | grep -q ' \./usr/lib/systemd/user/intentd\.service$'
          done
      - name: Upload .debs to the tag release
        run: |
          gh release upload "$TAG" intentd_*.deb intentd_*.deb.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
      - name: Refresh sitter-latest .debs
        if: ${{ needs.plan.outputs.prerelease == 'false' }}
        run: |
          # Constant asset names so --clobber replaces the previous version
          # instead of accumulating versioned files on the fixed release.
          for arch in amd64 arm64; do
            cp intentd_*_"$arch".deb "intentd_$arch.deb"
            sha256sum --binary "intentd_$arch.deb" > "intentd_$arch.deb.sha256"
          done
          gh release upload sitter-latest \
            intentd_amd64.deb intentd_amd64.deb.sha256 \
            intentd_arm64.deb intentd_arm64.deb.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
          # Re-stamp published_at so the fixed release reflects this refresh
          # (GitHub never updates it on asset uploads).
          ./scripts/refresh-release-published-at.sh sitter-latest "$GITHUB_REPOSITORY"
