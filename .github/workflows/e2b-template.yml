# Builds and smoke-tests the intent-node E2B templates (packaging/e2b), which
# the backend starts cloud sandboxes from. E2B fixes vCPU and RAM at build
# time, so there is one template per size, built in parallel matrix legs:
# intent-node-2x4 (2 vCPU / 4 GiB), intent-node-4x8 (4 vCPU / 8 GiB, the
# default) and intent-node-8x16 (8 vCPU / 16 GiB). E2B Hobby caps sandboxes at
# 8 GiB, so the publishing team (the one that owns E2B_API_KEY) must be on E2B
# Pro to build 8x16. The E2B_TEMPLATE_SIZES repository variable (for example
# "2x4,4x8") narrows what this repo publishes; a skipped size is then missing
# for every user. The steps live in e2b-template-build.yml.
#
# - After each successful Release run (the alpha publish, including the
#   intentd-releases mirror the template downloads from): build
#   intent-node-<size>:<version>, move its latest tag, make the template
#   public, then smoke-test the new tag.
# - By hand (workflow_dispatch): the same for any published version; `latest`
#   moves only when asked.
# - On pull requests that touch the template: build a private
#   intent-node-<size>:pr-<number> from the newest release and smoke-test it.
#
# Fail-soft: without the E2B_API_KEY secret (an E2B team API key) every job
# logs a warning and succeeds. The key is passed only through env and is
# redacted from script errors.
name: E2B template

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: intentd version to package (for example 0.11.139); its release must be published
        required: true
        type: string
      latest:
        description: Also move the latest tag of each intent-node-<size> template
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - packaging/e2b/**
      - .github/workflows/e2b-template.yml
      - .github/workflows/e2b-template-build.yml

permissions:
  contents: read

jobs:
  # One writer for release and manual builds, so `latest` moves in order;
  # `queue: max` keeps every pending release run instead of only the newest.
  release:
    if: github.event_name != 'pull_request'
    concurrency:
      group: e2b-template-release
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/e2b-template-build.yml
    with:
      version: ${{ inputs.version }}
      latest: ${{ inputs.latest || false }}
    secrets:
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}

  # A new push replaces the PR's pr-<n> tags, so it cancels the older run.
  # Fork PRs get no secrets; same-repo PRs do.
  pull-request:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: e2b-template-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/e2b-template-build.yml
    secrets:
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
