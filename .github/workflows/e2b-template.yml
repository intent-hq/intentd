# Builds and smoke-tests the intent-node E2B templates (packaging/e2b), which
# the backend starts cloud sandboxes from. E2B fixes vCPU and RAM at build
# time, so there is one template per size, built in parallel matrix legs:
# intent-node-2x4 (2 vCPU / 4 GiB), intent-node-4x8 (4 vCPU / 8 GiB, the
# default), intent-node-8x16 (8 vCPU / 16 GiB) and intent-node-16x32 (16 vCPU /
# 32 GiB). E2B Hobby caps sandboxes at 8 vCPU / 8 GiB and Pro goes higher only
# after E2B support raises the project's limits, so the publishing project (the one
# that owns E2B_API_KEY) needs those limits to build 8x16 and 16x32. A build E2B
# refuses over the project's limits is skipped with a warning, so that size has no
# tag for the version. The E2B_TEMPLATE_SIZES repository variable (for example
# "2x4,4x8") narrows what is built. The steps live in e2b-template-build.yml.
#
# - After each successful Release run (the alpha publish, including the
#   intentd-releases mirror the template downloads from): build
#   intent-node-<size>:<version>, move its latest tag, make the template
#   public, then smoke-test the new tag.
# - By hand (workflow_dispatch): the same for any published version; `latest`
#   moves only when asked. With manifest_only, nothing is built: only the
#   template manifest is written again (a backfill for an earlier release).
# - After release and manual builds: write the template manifest
#   (e2b-templates.json: project, version, built sizes) and attach it to the
#   intentd-releases release. Backends read it without a key to offer sizes;
#   E2B's own template lookup answers only for the caller's project, so a
#   user's key cannot check Intent's public templates. Needs the
#   INTENTD_RELEASES_TOKEN secret (fail-soft without it).
# - On pull requests that touch the template: build a private
#   intent-node-<size>:pr-<number> from the newest release and smoke-test it.
#
# Fail-soft: without the E2B_API_KEY secret (an API key for Intent's publishing E2B project) every job
# logs a warning and succeeds. The key is passed only through env and is
# redacted from script errors.
name: E2B template

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: intentd version to package (for example 0.11.139); its release must be published
        required: true
        type: string
      latest:
        description: Also move the latest tag of each intent-node-<size> template
        required: false
        default: false
        type: boolean
      manifest_only:
        description: Build nothing; only write and attach the template manifest of this version
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - packaging/e2b/**
      - .github/workflows/e2b-template.yml
      - .github/workflows/e2b-template-build.yml

permissions:
  contents: read

jobs:
  # One writer for release and manual builds, so `latest` moves in order;
  # `queue: max` keeps every pending release run instead of only the newest.
  release:
    if: github.event_name != 'pull_request'
    concurrency:
      group: e2b-template-release
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/e2b-template-build.yml
    with:
      version: ${{ inputs.version }}
      latest: ${{ inputs.latest || false }}
      manifest_only: ${{ inputs.manifest_only || false }}
    secrets:
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      INTENTD_RELEASES_TOKEN: ${{ secrets.INTENTD_RELEASES_TOKEN }}

  # A new push replaces the PR's pr-<n> tags, so it cancels the older run.
  # Fork PRs get no secrets; same-repo PRs do.
  pull-request:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: e2b-template-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/e2b-template-build.yml
    secrets:
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
