# Builds and smoke-tests the intent-node E2B templates (packaging/e2b), which
# the backend starts cloud sandboxes from. E2B fixes vCPU and RAM at build
# time, so there is one template per size, built in parallel matrix legs:
# intent-node-2x4 (2 vCPU / 4 GiB), intent-node-4x8 (4 vCPU / 8 GiB, the
# default) and intent-node-8x16 (8 vCPU / 16 GiB). E2B Hobby caps sandboxes at
# 8 GiB, so 8x16 needs E2B Pro; a Hobby team sets the E2B_TEMPLATE_SIZES
# repository variable (for example "2x4,4x8") to skip it.
#
# - After each successful Release run (the alpha publish, including the
#   intentd-releases mirror the template downloads from): build
#   intent-node-<size>:<version>, move its latest tag, make the template
#   public, then smoke-test the new tag.
# - By hand (workflow_dispatch): the same for any published version; `latest`
#   moves only when asked.
# - On pull requests that touch the template: build a private
#   intent-node-<size>:pr-<number> from the newest release and smoke-test it.
#
# Fail-soft: without the E2B_API_KEY secret (an E2B team API key) every job
# logs a warning and succeeds. The key is passed only through env and is
# redacted from script errors.
name: E2B template

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: intentd version to package (for example 0.11.139); its release must be published
        required: true
        type: string
      latest:
        description: Also move the latest tag of each intent-node-<size> template
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - packaging/e2b/**
      - .github/workflows/e2b-template.yml

permissions:
  contents: read

# One writer for release and manual builds, so `latest` moves in order;
# `queue: max` keeps every pending release run instead of only the newest.
concurrency:
  group: e2b-template-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: false
  queue: max

jobs:
  template:
    # Fork PRs get no secrets; same-repo PRs and release runs do.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        size: ['2x4', '4x8', '8x16']
    steps:
      # The key itself goes only to the build and smoke steps.
      - name: Check for the E2B_API_KEY secret
        id: key
        env:
          HAS_KEY: ${{ secrets.E2B_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != true ]; then
            echo "::warning::E2B_API_KEY secret is not set; skipping the intent-node-${{ matrix.size }} E2B template build"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: steps.key.outputs.present == 'true'
        with:
          node-version: '24'

      - name: Install the E2B SDK
        if: steps.key.outputs.present == 'true'
        working-directory: packaging/e2b
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Find the newest intentd release
        id: latest
        if: steps.key.outputs.present == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The mirror also carries sitter-v* releases; take the newest daemon tag.
          tag=$(gh release list --repo intent-hq/intentd-releases --limit 50 --json tagName \
            --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0].tagName')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build the template
        id: build
        if: steps.key.outputs.present == 'true'
        working-directory: packaging/e2b
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          SIZE: ${{ matrix.size }}
          ENABLED_SIZES: ${{ vars.E2B_TEMPLATE_SIZES }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LATEST: ${{ inputs.latest }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LATEST_RELEASE_TAG: ${{ steps.latest.outputs.tag }}
        run: node build.mjs

      - name: Smoke-test the template
        if: steps.key.outputs.present == 'true' && steps.build.outputs.skip == 'false'
        working-directory: packaging/e2b
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          REF: ${{ steps.build.outputs.ref }}
          SIZE: ${{ matrix.size }}
          VERSION: ${{ steps.build.outputs.version }}
          NAMES: ${{ steps.build.outputs.names }}
        run: |
          node smoke.mjs "$REF" "$VERSION" "$SIZE"
          echo "### intent-node-$SIZE template" >> "$GITHUB_STEP_SUMMARY"
          echo "Built and smoke-tested \`$REF\` (intentd $VERSION); names: \`$NAMES\`." >> "$GITHUB_STEP_SUMMARY"
