name: Temporary startup native full validation
# Remove before product PR after retaining receipts; no release or merge actions.
on:
  push:
    branches: [fix/indexing-startup-progress]
    paths:
      - .github/workflows/startup-native-diagnostic.yml
      - scripts/startup-native-*
      - scripts/test-startup-native-*
permissions:
  contents: read
concurrency:
  group: startup-native-full-validation
  cancel-in-progress: false
jobs:
  full:
    if: github.repository == 'intent-hq/intentd'
    runs-on: gh-linux-16x
    timeout-minutes: 210
    env:
      SOURCE_SHA: a227dd36558d42213eeb8ec52e168db8cf3aa684
      ROOT_SHA: 2e80473e121d1b79e7c244beac9303f2be1ada2e
      FE_SHA: 81c9d79034529e35487ad1f3afb391a5cb8a5fcb
      DIAGNOSTIC_SHA: ${{ github.sha }}
      CARGO_BUILD_JOBS: '1'
      NEXTEST_TEST_THREADS: '2'
      COMPACT: '1'
      CARGO_TERM_PROGRESS_WHEN: never
      NEXTEST_SHOW_PROGRESS: none
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
      - name: Require native Linux and disk headroom
        run: |
          mkdir -p evidence
          test "$(uname -sm)" = 'Linux x86_64'
          test "$(stat -c %d "$GITHUB_WORKSPACE")" = "$(stat -c %d "$RUNNER_TEMP")"
          test "$(stat -c %d "$GITHUB_WORKSPACE")" = "$(stat -c %d "$HOME")"
          test "$(stat -c %d "$GITHUB_WORKSPACE")" = "$(stat -c %d /tmp)"
          python3 diagnostic/scripts/startup-native-guard.py preflight "$GITHUB_WORKSPACE" | tee evidence/preflight.log
      - uses: actions/checkout@v7
        with:
          repository: intent-hq/intent
          ref: ${{ env.ROOT_SHA }}
          path: subject
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: subject/packages/intentd
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: intent-hq/cloudlands-fe
          ref: ${{ env.FE_SHA }}
          path: subject/packages/cloudlands-fe
          persist-credentials: false
      - uses: actions/setup-node@v7
        timeout-minutes: 5
        with:
          node-version: 24.21.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        timeout-minutes: 10
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Run bounded full package gates
        timeout-minutes: 185
        run: |
          python3 diagnostic/scripts/startup-native-guard.py run \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/evidence" 10800 \
            bash "$GITHUB_WORKSPACE/diagnostic/scripts/startup-native-run.sh"
      - name: Retain evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: startup-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
