name: Temporary fingerprint native diagnostic

# Remove after PR 2415 has retained native receipts. No release or merge actions.
on:
  push:
    branches: [fix/note-index-profile-invalidation]
    paths:
      - .github/workflows/fingerprint-native-diagnostic.yml
      - scripts/fingerprint-native-*
      - scripts/test-fingerprint-native-*

permissions:
  contents: read

concurrency:
  group: fingerprint-native-diagnostic-2415
  cancel-in-progress: false

jobs:
  focused:
    if: github.repository == 'intent-hq/intentd'
    runs-on: gh-linux-16x
    timeout-minutes: 150
    env:
      SOURCE_SHA: 27fa557022ca8fc9ad9a33d2afa074f7865ad074
      ROOT_SHA: db0d1514461563e2b25ac047c35d907c163d3753
      DIAGNOSTIC_SHA: ${{ github.sha }}
      CARGO_BUILD_JOBS: '2'
      NEXTEST_TEST_THREADS: '2'
      COMPACT: '1'
      CARGO_TERM_PROGRESS_WHEN: never
      NEXTEST_SHOW_PROGRESS: none
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
      - name: Require native Linux and disk headroom
        run: |
          mkdir -p evidence
          test "$(uname -sm)" = 'Linux x86_64'
          # The guard measures one filesystem; reject split cache/temp disks.
          test "$(stat -c %d "$GITHUB_WORKSPACE")" = "$(stat -c %d "$RUNNER_TEMP")"
          test "$(stat -c %d "$GITHUB_WORKSPACE")" = "$(stat -c %d "$HOME")"
          python3 diagnostic/scripts/fingerprint-native-guard.py preflight "$GITHUB_WORKSPACE" | tee evidence/preflight.log
      - uses: actions/checkout@v7
        with:
          repository: intent-hq/intent
          ref: ${{ env.ROOT_SHA }}
          path: subject
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: subject/packages/intentd
          persist-credentials: false
      - uses: actions/setup-node@v7
        timeout-minutes: 5
        with:
          node-version: 24.21.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        timeout-minutes: 10
        with:
          toolchain: 1.96.0
      - name: Run bounded exact-target triage
        timeout-minutes: 125
        run: |
          python3 diagnostic/scripts/fingerprint-native-guard.py run \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/evidence" 7200 \
            bash "$GITHUB_WORKSPACE/diagnostic/scripts/fingerprint-native-run.sh"
      - name: Retain evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: fingerprint-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
