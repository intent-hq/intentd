# Release-plz (https://release-plz.dev) in Release-PR mode:
#
# - `release-plz-pr` opens/updates a Release PR on every push to main, bumping
#   `crates/intentd/Cargo.toml` and CHANGELOG.md from conventional commits.
# - `release-plz-release` runs after the Release PR merges and pushes the
#   `vX.Y.Z` tag, which triggers the existing cargo-dist release.yml.
#
# Both jobs authenticate with the RELEASE_PLZ_TOKEN secret (a PAT with
# contents + pull-requests write access) instead of the default GITHUB_TOKEN:
# tags and PRs created with GITHUB_TOKEN do not trigger other workflows, and
# release.yml must fire on the tag push. Provisioning the secret is a manual
# step (repo Settings → Secrets and variables → Actions).

name: Release-plz

permissions: {}

on:
  push:
    branches: [main]

jobs:
  # Neither job uses the implicit GITHUB_TOKEN (all steps authenticate with
  # the RELEASE_PLZ_TOKEN PAT), so jobs inherit the top-level `permissions: {}`
  # and the implicit token stays powerless.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'intent-hq' }}
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Run release-plz release
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'intent-hq' }}
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Run release-plz release-pr
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
