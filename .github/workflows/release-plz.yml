# Release-plz (https://release-plz.dev) in Release-PR mode:
#
# - `release-plz-pr` opens/updates a Release PR on every push to main, bumping
#   `crates/intentd/Cargo.toml` and CHANGELOG.md from conventional commits.
# - `release-plz-release` runs after the Release PR merges and pushes the
#   `vX.Y.Z` tag, which triggers the existing cargo-dist release.yml.
#
# Both jobs authenticate with the RELEASE_PLZ_TOKEN secret (a PAT with
# contents + pull-requests write access) instead of the default GITHUB_TOKEN:
# tags and PRs created with GITHUB_TOKEN do not trigger other workflows, and
# release.yml must fire on the tag push. Provisioning the secret is a manual
# step (repo Settings → Secrets and variables → Actions).
#
# Both jobs run on GitHub-hosted gh-linux-16x runners: the release path must
# not depend on the self-hosted tinybox fleet being online (a fleet outage
# would silently stall every release). Ephemeral runners have no persistent
# target dir or sccache disk, so the pr job pairs Swatinem/rust-cache with an
# actions/cache-backed sccache dir instead. See intentd#749/#787/#805 and
# intent-hq/monorepo#1221 for the runner placement history.

name: Release-plz

permissions: {}

on:
  push:
    branches: [main]

# Coalesce superseded ordinary-push runs: only the newest queued run per ref
# matters — `release-plz release-pr` derives the Release PR from the current
# repo/tag state, so the newest run does all the work any superseded queued
# run would have done.
#
# Release-PR merge pushes get their own group and are never coalesced: with
# `release_always = false`, `release-plz release` only pushes the tag when
# the *latest* commit is a Release-PR merge, so if a queued merge-commit run
# were superseded by an ordinary push, the newer run would silently skip the
# tag. Merge commits are detected by the Release PR's squash title: both
# release-plz pr_name forms this repo has produced — `chore: release vX.Y.Z`
# (multi-package version_group cycles, v0.2.10+) and `chore(intentd):
# release vX.Y.Z` (single-package cycles, v0.2.2–v0.2.9). A false positive
# only costs coalescing; a false negative would reopen the dropped-tag bug.
# Two Release-PR merges can't coalesce with each other in practice: the
# next Release PR only exists after the previous merge's release-pr job has
# run.
#
# `cancel-in-progress: false` is load-bearing in both groups: a run that is
# mid-flight on a Release-PR merge commit must never be cancelled between
# computing the next version and pushing the tag.
concurrency:
  group: "release-plz-${{ github.ref }}-${{ (startsWith(github.event.head_commit.message, 'chore: release') || startsWith(github.event.head_commit.message, 'chore(intentd): release')) && 'release-merge' || 'push' }}"
  cancel-in-progress: false

jobs:
  # Neither job uses the implicit GITHUB_TOKEN (all steps authenticate with
  # the RELEASE_PLZ_TOKEN PAT), so jobs inherit the top-level `permissions: {}`
  # and the implicit token stays powerless.
  # On ordinary commits this job is a ~15s no-op, and on Release-PR merges it
  # only does git/tag work (releases are git-tag-only per release-plz.toml —
  # nothing is compiled or published).
  release-plz-release:
    name: Release-plz release
    runs-on: gh-linux-16x
    if: ${{ github.repository_owner == 'intent-hq' }}
    steps:
      # Pinned to v5: checkout v6+ stores the credential via an includeIf.gitdir
      # config scoped to the workspace, which release-plz's temp-dir copy of the
      # repo can't use, breaking `git fetch` on this private repo. Keep v5 until
      # release-plz/release-plz#2957 is fixed. See intent-hq/monorepo#1037.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Run release-plz release
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # This job runs `cargo package --workspace`, which compiles the whole
  # workspace — closer to ci.yml's coverage jobs (which burst to the same
  # 16-core runner) than to check's fmt+clippy.
  release-plz-pr:
    name: Release-plz PR
    runs-on: gh-linux-16x
    # Run after the release job: on a Release-PR merge commit the tag must be
    # pushed before release-pr computes the next version, or it races on tag
    # visibility and can open a spurious Release PR. On ordinary commits the
    # release job no-ops quickly, so the ordering costs nothing.
    needs: release-plz-release
    if: ${{ github.repository_owner == 'intent-hq' }}
    # The workflow-level groups split release-merge and ordinary pushes, so
    # two runs can be in flight at once. Serialize their release-pr jobs:
    # concurrent `release-plz release-pr` executions would race on updating
    # the release-plz-* branch and the Release PR. Coalescing a pending pr
    # job here is safe — the tag work happened in the run's release job, and
    # a newer pr job recomputes the Release PR from current state. Residual
    # cross-group race (accepted): an ordinary run's pr job can grab this
    # group during a merge run's ~15s release job and compute before the tag
    # is visible, briefly leaving a stale Release PR — it self-heals on the
    # next push to main.
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # Pinned to v5 for the same release-plz temp-dir auth reason as above
      # (release-plz/release-plz#2957, intent-hq/monorepo#1037).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # openssl-sys needs the OpenSSL headers (found via pkg-config); the
      # GitHub-hosted Ubuntu images ship both pkg-config and libssl-dev, so
      # this is normally a no-op — kept as an idempotent guard (ci.yml's
      # guard, extended to also cover a missing pkg-config; passwordless
      # sudo is standard on GitHub-hosted runners). The apt lock hardening
      # (monorepo#1515) is harmless here and kept for symmetry with ci.yml:
      # DPkg::Lock::Timeout makes `install` wait for the dpkg locks, and the
      # retry loop covers `update` (Debian bug #1069167).
      - name: Install pkg-config/libssl-dev if missing
        run: |
          if ! command -v pkg-config >/dev/null || ! pkg-config --exists openssl; then
            for i in 1 2 3; do
              if sudo -n apt-get -o DPkg::Lock::Timeout=300 update -qq; then break; fi
              if [ "$i" -eq 3 ]; then exit 1; fi
              sleep $((i * 15))
            done
            sudo -n apt-get -o DPkg::Lock::Timeout=300 install -y -qq pkg-config libssl-dev
          fi
      - name: Resolve pinned Rust channel
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # Ephemeral GitHub-hosted runners start cold, so persist the cargo
      # registry/git caches and the sccache dir (cache-directories) across
      # runs. Target-dir caching is deliberately off: release-plz's verify
      # builds re-extract each package and reset mtimes, invalidating
      # cargo's fingerprints, so a cached target dir is dead weight —
      # sccache (content-hash keyed) is what actually warms the rebuilds
      # (see the sccache comment below).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-plz-pr
          cache-targets: false
          cache-directories: |
            ${{ runner.temp }}/sccache
      # All git_only packages run `cargo package --workspace` in separate
      # temporary worktrees; a shared target dir means only the first one
      # compiles cold and the rest reuse the build cache. The path must
      # end in `.../target` so release-plz's packaged-dir fast path
      # (`is_cargo_packaged_dir`) recognizes `target/package/*` and lists
      # files from disk instead of re-running `cargo package --list`
      # (which fails for internal path-only dependencies).
      #
      # The workspace-relative default location would do, but release-plz's
      # temp worktrees need an ABSOLUTE path to share it, so pin it
      # explicitly. $GITHUB_WORKSPACE is a fixed path on GitHub-hosted
      # runners, which also keeps the sccache extraction paths below stable
      # across runs.
      - name: Set shared cargo target dir
        shell: bash
        run: echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"
      # The shared target dir above can't make the verify builds warm:
      # release-plz runs `cargo package` per git_only package, and cargo
      # verifies each one by re-extracting the packaged tarball and building
      # it. Extraction resets file mtimes, which invalidates cargo's
      # fingerprints, so every package rebuilds the workspace from scratch
      # (~2 min x 15 packages; release-plz/release-plz#2996 documents the
      # per-package verify mechanism). sccache keys on content hashes rather
      # than mtimes, so the recurring rustc invocations become cache hits —
      # but note the hit pattern: sccache (v0.17.0) also hashes rustc's cwd
      # into the cache key, and each verify build runs from its own
      # extracted dir ($CARGO_TARGET_DIR/package/<name>-<version>/), so the
      # 15 per-package builds do NOT hit each other within a run. Hits are
      # run-over-run: the fixed CARGO_TARGET_DIR keeps each package's
      # extraction path stable across pushes, so run N+1 hits run N's
      # entries, resetting whenever a release bumps versions (the version
      # is in the path). Run-over-run persistence on these ephemeral
      # runners comes from the rust-cache step below, which carries
      # SCCACHE_DIR alongside the cargo caches. Crates that invoke the
      # system linker (bins, dylibs, proc-macros) and build-script runs are
      # never cached, so expect partial hit rates.
      #
      # Idempotent install guard: install the pinned, checksum-verified musl
      # binary only if sccache is not already present (it is not
      # preinstalled on the GitHub-hosted images). ~/.local/bin is not
      # guaranteed to be on PATH, so also check the install destination
      # directly. The staged-copy + rename keeps the final install atomic.
      # Fail-soft: if download/checksum/extract fails, warn and continue
      # without sccache — the job still works, just uncached. (Explicit &&
      # chaining, not `set -e`, because -e is suppressed inside an if
      # condition.)
      - name: Install sccache if missing
        shell: bash
        run: |
          bin_dir="$HOME/.local/bin"
          if command -v sccache >/dev/null; then exit 0; fi
          if [ -x "$bin_dir/sccache" ]; then
            echo "$bin_dir" >> "$GITHUB_PATH"
            exit 0
          fi
          version=v0.17.0
          name="sccache-$version-x86_64-unknown-linux-musl"
          sha256=67c4a96dd237c1f518f6b36083f270f9976d516f1e57fce891755ea782e50006
          tmp=$(mktemp -d)
          staged="$bin_dir/.sccache-staged.$$"
          if curl -fsSL --retry 3 -o "$tmp/$name.tar.gz" \
               "https://github.com/mozilla/sccache/releases/download/$version/$name.tar.gz" \
             && echo "$sha256  $tmp/$name.tar.gz" | sha256sum -c --quiet - \
             && tar -xzf "$tmp/$name.tar.gz" -C "$tmp" \
             && chmod 0755 "$tmp/$name/sccache" \
             && mkdir -p "$bin_dir" \
             && cp "$tmp/$name/sccache" "$staged" \
             && mv -f "$staged" "$bin_dir/sccache"; then
            echo "$bin_dir" >> "$GITHUB_PATH"
          else
            echo "::warning::sccache install failed; continuing without compile caching"
          fi
          rm -rf "$tmp" "$staged"
      # Exported via $GITHUB_ENV instead of static job env so that when the
      # install guard fell through, RUSTC_WRAPPER is simply never set and
      # builds proceed unwrapped. CARGO_INCREMENTAL=0 because sccache does
      # not cache incremental compilation. SCCACHE_DIR must match the
      # rust-cache step's cache-directories entry above — that is what
      # persists the local disk cache across these ephemeral runners.
      # SCCACHE_CACHE_SIZE stays under the repo's 10 GiB Actions cache
      # budget (shared with the registry caches) while still holding the
      # 15 per-package cwd-variants of the workspace dep graph.
      - name: Enable sccache
        shell: bash
        run: |
          if command -v sccache >/dev/null; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_CACHE_SIZE=5G" >> "$GITHUB_ENV"
            echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          fi
      # The verify builds use the dev profile and nothing ever reads their
      # debug info, so drop it: less to compile, smaller artifacts to cache.
      # Independent of sccache — applies even when the install guard fell
      # back to uncached builds.
      - name: Drop debug info from verify builds
        shell: bash
        run: echo "CARGO_PROFILE_DEV_DEBUG=false" >> "$GITHUB_ENV"
      - name: Run release-plz release-pr
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # Surface cache hit rates in the log; `always()` keeps them visible
      # when release-pr fails. Skips cleanly when sccache was never
      # enabled, and never fails the job — this step is observability only
      # (bash runs with -e, and --show-stats can itself error). It also
      # stops the sccache server so the cache dir is settled before the
      # rust-cache post step saves it.
      - name: Show sccache stats
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "${RUSTC_WRAPPER:-}" ] && command -v sccache >/dev/null; then
            sccache --show-stats || echo "::warning::sccache stats unavailable"
            sccache --stop-server >/dev/null 2>&1 || true
          else
            echo "sccache not enabled; skipping stats"
          fi
