# release-plz configuration — https://release-plz.dev/docs/config
#
# Release-PR mode: on every push to main, release-plz opens/updates a Release PR
# that bumps `crates/intentd/Cargo.toml` and updates CHANGELOG.md based on
# conventional commits. Merging that PR makes release-plz push the `vX.Y.Z` tag,
# which triggers the existing cargo-dist release.yml unchanged.

[workspace]
# Only the packages opted in below are processed.
release = false
# Only Release-PR merges cut releases: without this, `release-plz release`
# would tag any main commit whose Cargo.toml version is ahead of the latest
# tag (e.g. a manual bump in a regular PR).
release_always = false
# Shared defaults for every opted-in package: no crates.io publishing —
# releases are git-tag-only: versions are determined from git tags matching
# git_tag_name, never from the cargo registry. NOTE: git_only is set
# per-package (not here) because a workspace-level git_only pulls every
# workspace member into git-only processing regardless of `release = false`
# — including crates deliberately not opted in below.
publish = false
# cargo-dist (v-release.yml) owns the GitHub Release; release-plz only tags.
git_release_enable = false
# The whole workspace releases as a single unit under one `vX.Y.Z` tag
# (monorepo#889): the library crates share intentd's tag for version
# detection but never create tags or changelogs themselves (only the
# intentd package below overrides git_tag_enable / changelog_update).
git_tag_name = "v{{ version }}"
git_tag_enable = false
changelog_update = false
# The lib crates are internal (never published), so there is no API baseline
# for cargo-semver-checks to compare against.
semver_check = false

[[package]]
name = "intentd"
release = true
git_only = true
git_tag_enable = true
changelog_update = true
# Keep the changelog at the repository root rather than crates/intentd/.
changelog_path = "./CHANGELOG.md"
# intentd's changelog covers the whole workspace: commits that only touch the
# library crates change the shipped binary, so they must show up here
# (monorepo#889 — e.g. intentd#592 touched only intent-git/intent-services
# and was missing from the v0.2.9 changelog). intentd-sitter is included too so
# sitter work is visible in release notes (monorepo#4093 — e.g. intentd#1619
# touched only intentd-sitter + scripts/ and was missing from the v0.9.2
# changelog). Residual gap: commits touching ONLY the repo-root
# scripts/install.{sh,ps1} are still invisible — see the caveat on the
# intentd-sitter [[package]] entry below.
changelog_include = [
    "intent-acp",
    "intent-context",
    "intent-core",
    "intent-git",
    "intent-js",
    "intent-linear",
    "intent-providers",
    "intent-pty",
    "intent-search",
    "intent-sentry",
    "intent-services",
    "intent-sourcecontrol",
    "intent-store",
    "intent-transport",
    "intentd-sitter",
]
version_group = "intentd"

# Library crates: processed (so lib-crate-only commits are diffed and flow
# into intentd's version bump and changelog via version_group and
# changelog_include above) but never tagged, released, or given their own
# changelog — the workspace-level defaults above take care of that.

[[package]]
name = "intent-acp"
release = true
git_only = true
version_group = "intentd"

[[package]]
name = "intent-context"
release = true
git_only = true
version_group = "intentd"

[[package]]
name = "intent-core"
release = true
git_only = true
version_group = "intentd"

[[package]]
name = "intent-git"
release = true
git_only = true
version_group = "intentd"

[[package]]
name = "intent-js"
release = true
git_only = true
version_group = "intentd"

[[package]]
name = "intent-linear"
release = true
git_only = true
version_group = "intentd"

[[package]]
name = "intent-providers"
release = true
git_only = true
version_group = "intentd"

[[package]]
name = "intent-pty"
release = true
git_only = true
version_group = "intentd"

[[package]]
name = "intent-search"
release = true
git_only = true
version_group = "intentd"

[[package]]
name = "intent-sentry"
release = true
git_only = true
version_group = "intentd"

[[package]]
name = "intent-services"
release = true
git_only = true
version_group = "intentd"

[[package]]
name = "intent-sourcecontrol"
release = true
git_only = true
version_group = "intentd"

[[package]]
name = "intent-store"
release = true
git_only = true
version_group = "intentd"

[[package]]
name = "intent-transport"
release = true
git_only = true
version_group = "intentd"

# intentd-sitter still ships through its own `sitter-v*` pipeline
# (release-sitter.yml) and keeps its independent 0.1.x version line, so —
# unlike the lib crates — it is deliberately NOT in the "intentd"
# version_group: release-plz bumps its version from its own conventional
# commits instead of pinning it to the daemon's version. It is opted in only
# so sitter commits are diffed against the last daemon `v*` tag (the shared
# workspace git_tag_name) and flow into intentd's changelog via
# changelog_include above (monorepo#4093). Like the lib crates it is never
# tagged, released, or given its own changelog by release-plz. Side effect:
# the Release PR now also advances crates/intentd-sitter/Cargo.toml when
# sitter files changed, so cutting a sitter release no longer needs a manual
# version bump — push the `sitter-v<Cargo.toml version>` tag.
#
# Caveat: only commits touching files under crates/intentd-sitter are
# detected. The installer scripts live at the repo-root scripts/ (outside the
# crate root), so a commit touching ONLY scripts/install.{sh,ps1} is still
# invisible here — cargo can't package files outside the crate root, and
# release-plz's history walk is bounded to the package path. In practice this
# hasn't occurred: the sitter guard tests (tests/install_*.rs) pin the
# scripts' contracts, so every installer change to date also touched crate
# files (including #1619/#1629). Moving the scripts into the crate would
# close the gap if a scripts-only commit ever becomes a real pattern.
[[package]]
name = "intentd-sitter"
release = true
git_only = true

# Changelog rendering aligned with the monorepo cliff.toml conventions
# (same groups and body layout; release-plz runs git-cliff under the hood).
[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
    { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 2 -->🔧 Refactor" },
    { message = "^style", group = "<!-- 5 -->🎨 Styling" },
    { message = "^test", group = "<!-- 6 -->🧪 Testing" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore|^ci", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
    { body = ".*security", group = "<!-- 8 -->🛡️ Security" },
]
protect_breaking_commits = false
sort_commits = "oldest"
