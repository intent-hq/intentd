[[field]]
name = "suspend_tracker"
class = "config"
note = "Host suspend-overlap query; host-local by nature."

[[field]]
name = "pr_monitor_queued_wakes"
class = "volatile"
note = "Each monitor's last changed wake still queued, so a newer one replaces it."

[[field]]
name = "pr_monitor_catch_up"
class = "volatile"
