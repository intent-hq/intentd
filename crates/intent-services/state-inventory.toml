[[field]]
name = "pr_discovery"
class = "cache"
note = "Repository-wide PR discovery single-flight with failure memory for a window."

[[field]]
name = "created_pr_retries"
class = "owner"
note = "Agent-created PRs being linked, so a second report joins the retry."

[[field]]
name = "issue_cache"
class = "cache"
note = "github.issues.get cache within prCache.maxAgeSeconds."

[[field]]
name = "pr_cache_max_age_seconds"
class = "test"
note = "Override for prCache.maxAgeSeconds; production reads settings."

[[field]]
name = "pr_read_park"
class = "test"
note = "On-demand PR read park."

[[field]]
name = "pr_monitor_poll_seconds"
class = "test"
note = "Override for prMonitor.pollSeconds."

[[field]]
name = "pr_monitor_hourly_request_budget"
class = "test"
note = "Override for prMonitor.hourlyRequestBudget."

[[field]]
name = "pr_monitor_quota_share_percent"
class = "test"
note = "Override for prMonitor.quotaSharePercent."

[[field]]
name = "pr_monitor_logged_interval"
class = "cache"
note = "Last logged cadence; logging only."

[[field]]
name = "pr_monitor_debounce_seconds"
class = "test"
note = "Override for prMonitor.debounceSeconds."

[[field]]
name = "pr_monitors_max_per_agent"
class = "test"
note = "Override for prMonitor.maxPerAgent."

[[field]]
name = "pr_monitor_registration"
class = "gate"
invariant = "Per-owner PR-monitor quota admission through persistence, including adoption, is serialized."
writer_lock = "partial"
note = "The count-then-insert spans a forge read and separate statements."

[[field]]
name = "review_monitor_authorities"
class = "volatile"
note = "Original qualified registration lifetimes; never rebuilt from stored ids."

[[field]]
name = "review_monitor_poll_lane"
class = "gate"
invariant = "GitLab review-monitor polls never overlap."
writer_lock = "no"
note = "Guards forge polling."

[[field]]
name = "legacy_pr_monitor_poll_lane"
class = "gate"
invariant = "The legacy PR-monitor sweep and an agent:idle nudge never poll the same monitors concurrently."
writer_lock = "no"
note = "Guards forge polling; becomes an owner claim with replicas."

[[field]]
name = "review_monitor_controls"
class = "owner"
note = "Control channel into the running monitor loop."

[[field]]
name = "review_monitor_deliveries"
class = "volatile"
note = "Current original deliveries; never reconstructed from persisted wake metadata."

[[field]]
name = "test_review_monitoring_recipient"
class = "test"
note = "Fixture receipt (cfg(test))."

[[field]]
name = "test_review_monitor_write_ready"
class = "test"
note = "Write-ready notify (cfg(test))."

[[field]]
name = "pr_monitor_fetch_timeout"
class = "config"
note = "Per-fetch bound in a sweep (tests shorten it)."

[[field]]
name = "pr_refresh_fetch_timeout"
class = "config"
note = "Per-workspace PR refresh bound (tests shorten it)."

[[field]]
name = "sweep_rate_limit"
class = "cache"
note = "Global forge rate-limit pause; re-learned on the first rate-limited call."

[[field]]
name = "pending_workspace_deletes"
class = "owner"
note = "Delete grace-window timers; never persisted, so a restart drops pending deletions."

[[field]]
name = "workspace_mutations"
class = "gate"
invariant = "Admitted creates and sends finish before an incremental workspace deletion stops sessions; later producers fail fast."
writer_lock = "no"
note = "Deletion yields the writer between steps, so the writer lock cannot hold it."

[[field]]
name = "startup_resume_candidates"
class = "volatile"
note = "Agents reserved for startup resume."

[[field]]
name = "interrupted_list_park"
class = "test"
note = "Interrupted list park (cfg(test))."

[[field]]
name = "interrupted_resume_park"
class = "test"
note = "Interrupted resume park (cfg(test))."

[[field]]
name = "workspace_delete_test_gate"
class = "test"
note = "Workspace delete gate (cfg(test))."

[[field]]
name = "pending_delete_test_gate"
class = "test"
note = "Pending delete gates (cfg(all(test, unix)))."

[[field]]
name = "pending_agent_deletes"
class = "owner"
note = "Agent delete grace-window timers; never persisted."

[[field]]
name = "execution_invalidation"
class = "owner"
note = "Notify that wakes the execution-context loop on safe-context invalidations."

[[field]]
name = "execution_readiness"
class = "cache"
note = "Bounded provider readiness verdicts; recomputed by the execution-context loop."

[[field]]
name = "attachment_uploads"
class = "volatile"
note = "Staged attachment upload sessions between begin and commit; chunks on another replica would miss the session. Staging dirs are local disk (gap F)."

[[field]]
name = "attachment_idempotency_inflight"
class = "gate"
invariant = "Same-key keyed attachment placements wait and replay instead of racing (intent-hq/intent#4691)."
writer_lock = "partial"
note = "The store primary key is the last line of defence; the wait-and-replay is process-local."

[[field]]
name = "idempotency_inflight"
class = "gate"
invariant = "Same-key first-use callers of with_idempotency serialize; one runs, the rest replay."
writer_lock = "partial"
note = "The stored result is durable; the in-flight wait is process-local."

[[field]]
name = "ports"
class = "config"
note = "Registered feature ports, frozen once shared."

[[field]]
name = "features"
class = "config"
note = "Feature state objects keyed by type (e.g. transfer sessions); the objects themselves are not inventoried here."

# ---------------------------------------------------------------------------
# intent_app::tenant startup restores, sweeps and loops
# `name` is the function tenant.rs calls; `kind` is restore | sweep | loop.
# ---------------------------------------------------------------------------

[[loop]]
name = "heal_event_subscriptions_on_startup"
kind = "restore"
class = "owner"
note = "Rehydrates persisted event subscriptions into this process; each replica would deliver them again."

[[loop]]
name = "hydrate_scripts"
kind = "restore"
class = "owner"
note = "Loads script definitions into the local registry."

[[loop]]
name = "reconcile_startup_completions"
kind = "restore"
class = "owner"
note = "Delivers completions that finished while no process served the tenant (TenantRuntime::reconcile_completions); a second process would deliver them again."

[[loop]]
name = "rehydrate_hooks"
kind = "restore"
class = "owner"
note = "Resumes hook timers in this process; needs per-hook claims."

[[loop]]
name = "rehydrate_pr_monitors"
kind = "restore"
class = "owner"
note = "Resumes PR monitors and marks catch-up; needs per-monitor claims."

[[loop]]
name = "refresh_primary_identity_at_startup"
kind = "restore"
class = "cache"
note = "One bounded GitHub identity refresh; harmless to repeat."

[[loop]]
name = "sweep_orphaned_worktree_trash"
kind = "sweep"
class = "owner"
note = "Removes local worktree trash dirs (gap F)."

[[loop]]
name = "sweep_stale_export_staging"
kind = "sweep"
class = "owner"
note = "Removes local export staging dirs, assuming every session died with the process."

[[loop]]
name = "sweep_agent_tmp_root"
kind = "loop"
class = "owner"
note = "Hourly sweep of local agent temp folders."

[[loop]]
name = "resume_exposed_machines"
kind = "sweep"
class = "owner"
note = "Redials machines that may run this backend's agents (gap E: one owner per machine)."

[[loop]]
name = "sweep_expired_attachment_idempotency_keys"
kind = "sweep"
class = "owner"
note = "Deletes expired idempotency bindings; idempotent, safe to run on any replica."

[[loop]]
name = "spawn_pr_refresh_loop"
kind = "loop"
class = "owner"
note = "Background PR refresh every 60 s tick; duplicate runs double forge load."

[[loop]]
name = "spawn_pr_monitor_loop"
kind = "loop"
class = "owner"
note = "Centralized PR-monitor sweep; needs per-monitor claims."

[[loop]]
name = "spawn_token_usage_scan_loop"
kind = "loop"
class = "owner"
note = "Token-usage rescan every 300 s; the 'generic work claims' task adopts claims here first."

[[loop]]
name = "spawn_completion_delivery_loop"
kind = "loop"
class = "owner"
note = "Bus subscriber waking parents on child completion; DB delivery claims exist for watches."

[[loop]]
name = "spawn_auto_commit_loop"
kind = "loop"
class = "owner"
note = "agent:idle subscriber committing task-linked changes; touches the home worktree."

[[loop]]
name = "spawn_push_publisher"
kind = "loop"
class = "owner"
note = "Push relay publisher; one per tenant."

[[loop]]
name = "spawn_idle_pr_refresh_loop"
kind = "loop"
class = "owner"
note = "agent:idle subscriber refreshing that workspace's PRs."

[[loop]]
name = "spawn_agent_locks_loop"
kind = "loop"
class = "owner"
note = "Recomputes and publishes changes:agent-locks snapshots from bus events."

[[loop]]
name = "spawn_tracked_changes_sweep_loop"
kind = "loop"
class = "owner"
note = "Deletes stale tracked-change rows after git checks."

[[loop]]
name = "spawn_script_output_sweep_loop"
kind = "loop"
class = "owner"
note = "Deletes old local script output logs (gap F)."

[[loop]]
name = "spawn_auto_retire_loop"
kind = "loop"
class = "owner"
note = "Hourly purge of long-archived workspaces."

[[loop]]
name = "spawn_auto_archive_loop"
kind = "loop"
class = "owner"
note = "Hourly archive of idle workspaces."

[[loop]]
name = "spawn_execution_context_loop"
kind = "loop"
class = "owner"
note = "Recomputes provider execution readiness (backend upkeep; runs in node mode too)."

[[loop]]
name = "spawn_tenant_retention_loop"
kind = "loop"
class = "owner"
note = "Event retention store sweep (TenantRuntime only)."

[[loop]]
name = "spawn_tenant_reap_loop"
kind = "loop"
class = "owner"
note = "Idempotency reaper store sweep (TenantRuntime only)."
