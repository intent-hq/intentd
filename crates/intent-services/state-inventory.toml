# Process-local state inventory of `intent_services::Services`.
#
# One `[[field]]` row per field of `pub struct Services` (crates/intent-services/src/lib.rs)
# and one `[[loop]]` row per startup restore, sweep and background loop that
# `intent_app::tenant` starts (crates/intent-app/src/tenant.rs). It records what each
# piece of state means for running more than one stateless orchestrator replica
# per tenant. Nothing here changes behavior.
#
# The guard test `crates/intent-services/tests/services_state_inventory_lint.rs`
# fails when a `Services` field or a tenant loop is missing from this file or
# listed here but gone from the code. Adding a field? Add its row here.
#
# Classes:
#   durable    - the database is the truth; memory holds nothing a replica lacks.
#   cache      - safe to lose or to differ per replica; `note` says how stale it gets.
#   gate       - an in-process lock or single-flight guarding an invariant. `invariant`
#                names it; `writer_lock` says whether the Postgres per-tenant writer
#                lock (`tenant_writer`) already covers it: `covered`, `partial` or `no`.
#   volatile   - live process-local state that is neither durable nor a cache: losing
#                it or splitting it across replicas changes behavior. Must move to the
#                database or behind an owner before replicas. (Added to the task's
#                class list: many registries fit none of the other six.)
#   owner      - owned background work, a long-lived runtime, or a link; needs one
#                owner per tenant/machine (a claim) when replicas exist.
#   connection - bound to one client or executor connection.
#   config     - fixed after start (wiring, overrides, handles to other services).
#   test       - test parks, probes and test-only overrides; `None`/absent in production.

# ---------------------------------------------------------------------------
# Services fields, in declaration order
# ---------------------------------------------------------------------------

