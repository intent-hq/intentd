[package]
name = "intent-services"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Shared business-logic surface invoked by every transport and the agent MCP server"

[dependencies]
intent-core = { path = "../intent-core", version = "0.1.0" }
intent-store = { path = "../intent-store", version = "0.1.0" }
intent-git = { path = "../intent-git", version = "0.1.0" }
intent-sourcecontrol = { path = "../intent-sourcecontrol", version = "0.1.0" }
intent-linear = { path = "../intent-linear", version = "0.1.0" }
intent-sentry = { path = "../intent-sentry", version = "0.1.0" }
intent-acp = { path = "../intent-acp", version = "0.1.0" }
intent-context = { path = "../intent-context", version = "0.1.0" }
intent-providers = { path = "../intent-providers", version = "0.1.0" }
intent-pty = { path = "../intent-pty", version = "0.1.0" }
intent-search = { path = "../intent-search", version = "0.1.0" }
base64 = { workspace = true }
git2 = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
notify = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
time = { workspace = true, features = ["formatting", "local-offset"] }
similar = { version = "3.1.1", default-features = false }
yrs = "0.27.2"
serde_yaml = "0.9"
async-recursion = "1.1"
once_cell = "1.20"
toml_edit = "0.25.5"
tempfile = "3"
reqwest.workspace = true
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
uuid = { workspace = true }
async-trait = "0.1"
git2.workspace = true
sqlx.workspace = true

[target."cfg(unix)".dependencies]
nix = { workspace = true, features = ["signal", "process"] }

[target."cfg(target_os = \"macos\")".dependencies]
libc = "0.2"
