[package]
name = "intent-services"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Shared business-logic surface invoked by every transport and the agent MCP server"

[dependencies]
intent-core = { path = "../intent-core" }
intent-store = { path = "../intent-store" }
intent-git = { path = "../intent-git" }
intent-sourcecontrol = { path = "../intent-sourcecontrol" }
intent-linear = { path = "../intent-linear" }
intent-sentry = { path = "../intent-sentry" }
intent-acp = { path = "../intent-acp" }
intent-context = { path = "../intent-context" }
intent-providers = { path = "../intent-providers" }
intent-pty = { path = "../intent-pty" }
intent-search = { path = "../intent-search" }
base64 = { workspace = true }
git2 = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
notify = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
time = { workspace = true, features = ["formatting"] }
similar = { version = "2.7.0", default-features = false }
yrs = "0.27.2"
serde_yaml = "0.9"
async-recursion = "1.1"
once_cell = "1.20"
toml_edit = "0.25.5"
tempfile = "3"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
uuid = { workspace = true }
async-trait = "0.1"
git2.workspace = true

[target."cfg(unix)".dependencies]
nix = { workspace = true, features = ["signal", "process"] }

[target."cfg(target_os = \"macos\")".dependencies]
libc = "0.2"
