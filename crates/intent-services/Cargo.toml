[package]
name = "intent-services"
version = "0.11.75"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Shared business-logic surface invoked by every transport and the agent MCP server"

[features]
# Explicit disposable repository sources for integration-test composition only.
repository-test-fixtures = []
# Test seams and fixtures (`test_support`, `#[cfg(any(test, feature =
# "test-hooks"))]` items) for the tests of feature crates. Enable it only from
# a dev-dependency: scripts/check-test-hooks-feature.sh fails CI when the
# production feature graph of intentd turns it on. `async-trait` lets
# test_support's stub forge implement `SourceControl` in that build.
test-hooks = ["dep:async-trait"]

[dependencies]
# Only for test-hooks (see [features]); a dev-dependency below as well.
async-trait = { version = "0.1", optional = true }
intent-core = { path = "../intent-core", version = "0.11.75" }
intent-store = { path = "../intent-store", version = "0.11.75" }
intent-git = { path = "../intent-git", version = "0.11.75" }
intent-sourcecontrol = { path = "../intent-sourcecontrol", version = "0.11.75" }
intent-linear = { path = "../intent-linear", version = "0.11.75" }
intent-sentry = { path = "../intent-sentry", version = "0.11.75" }
intent-voice = { path = "../intent-voice", version = "0.4.1" }
intent-acp = { path = "../intent-acp", version = "0.11.75" }
intent-js = { path = "../intent-js", version = "0.11.75" }
intent-context = { path = "../intent-context", version = "0.11.75" }
intent-providers = { path = "../intent-providers", version = "0.11.75" }
intent-pty = { path = "../intent-pty", version = "0.11.75" }
intent-search = { path = "../intent-search", version = "0.11.75" }
base64 = { workspace = true }
git2 = { workspace = true }
ignore = { workspace = true }
serde_json = { workspace = true }
regex = "1.12"
uuid = { workspace = true }
tokio = { workspace = true }
notify = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
time = { workspace = true, features = ["formatting", "local-offset"] }
similar = { version = "3.1.1", default-features = false }
serde_yaml = "0.9"
toml_edit = "0.25.5"
tempfile = "3"
reqwest.workspace = true
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
sha2 = "0.11"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
zeroize = "1.9"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
uuid = { workspace = true }
async-trait = "0.1"
git2.workspace = true
sqlx.workspace = true
ctor = "1.0.10"
intent-test-macros = { path = "../intent-test-macros" }
tracing-subscriber.workspace = true
intentd-test-support = { path = "../intentd-test-support" }
intent-providers = { path = "../intent-providers", version = "0.11.75", features = ["test-support"] }
intent-store = { path = "../intent-store", version = "0.11.75", features = ["test-support"] }
intent-acp = { path = "../intent-acp", version = "0.11.75", features = ["test-hooks"] }

[target."cfg(unix)".dependencies]
nix = { workspace = true, features = ["signal", "process", "fs"] }
pprof = "0.15"
libc = { workspace = true }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[lints]
workspace = true
