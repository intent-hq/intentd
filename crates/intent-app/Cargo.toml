[package]
name = "intent-app"
version = "0.11.93"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Composition root for intentd: registers the feature crates on the core services"

[dependencies]
intent-services = { path = "../intent-services", version = "0.11.93" }
intent-svc-runtime = { path = "../intent-svc-runtime", version = "0.11.93" }
intent-svc-transfer = { path = "../intent-svc-transfer", version = "0.11.93" }

[dev-dependencies]
base64 = { workspace = true }
intent-core = { path = "../intent-core", version = "0.11.93" }
# Disposable secret stores for the end-to-end tests (`Services::new_repository_fixture`).
intent-services = { path = "../intent-services", version = "0.11.93", features = ["repository-test-fixtures"] }
intent-store = { path = "../intent-store", version = "0.11.93" }
intent-transport = { path = "../intent-transport", version = "0.11.93" }
serde_json = { workspace = true }
sha2 = "0.11"
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[lints]
workspace = true
