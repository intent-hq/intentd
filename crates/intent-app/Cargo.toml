[package]
name = "intent-app"
version = "0.11.261"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Composition root for intentd: registers the feature crates on the core services"

[dependencies]
intent-services = { workspace = true }
intent-svc-remote = { workspace = true }
intent-svc-runtime = { workspace = true }
intent-svc-transfer = { workspace = true }

[dev-dependencies]
async-trait = "0.1"
base64 = { workspace = true }
intent-core = { workspace = true }
intent-linear = { workspace = true }
intent-sentry = { workspace = true }
# Disposable secret stores for the end-to-end tests (`Services::new_repository_fixture`);
# `test-hooks` adds the payload-budget sweep's (`tests/payload_budget/`)
# large-state fixture and stub forge.
intent-services = { workspace = true, features = ["repository-test-fixtures", "test-hooks"] }
intent-sourcecontrol = { workspace = true }
intent-store = { workspace = true }
intent-transport = { workspace = true }
intentd-test-support = { path = "../intentd-test-support" }
serde_json = { workspace = true }
sha2 = "0.11"
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
zip = { version = "9.4.2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
