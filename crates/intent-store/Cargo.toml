[package]
name = "intent-store"
version = "0.10.15"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "SQLite + file-tree persistence (repositories, migrations, locking)"

[dependencies]
intent-core = { path = "../intent-core", version = "0.10.15" }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
rand = "0.10.2"
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
base64 = { workspace = true }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
flate2 = "1.1.9"

hmac = "0.12"
sha2 = "0.10"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
html5gum = { version = "=0.8.4", default-features = false }
html5ever = "=0.29.1"

[dev-dependencies]
regex = "1"
tempfile = "3"
tokio = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
