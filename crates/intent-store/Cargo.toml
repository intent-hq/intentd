[package]
name = "intent-store"
version = "0.10.26"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "SQLite + file-tree persistence (repositories, migrations, locking)"

[package.metadata.cargo-shear]
# Compiled separately by tests/store_pool_api.rs to assert rejected pool APIs.
ignored-paths = ["tests/ui/store_pool_*.rs"]

[dependencies]
intent-core = { path = "../intent-core", version = "0.10.26" }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
rand = "0.10.2"
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
base64 = { workspace = true }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
flate2 = "1.1.9"
futures-util = "0.3"
async-stream = "0.3"

[target."cfg(unix)".dependencies]
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
trybuild = "1"
tempfile = "3"
tokio = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
