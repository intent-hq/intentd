[package]
name = "intent-store"
version = "0.11.87"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "SQLite + file-tree persistence (repositories, migrations, locking)"

[package.metadata.cargo-shear]
# Compiled separately by tests/store_pool_api.rs and tests/note_write_lock_api.rs
# to assert rejected pool and note-write-lock APIs.
ignored-paths = ["tests/ui/store_pool_*.rs", "tests/ui/note_write_lock_*.rs"]

[features]
# Note write-lock observation seams (`Store::note_content_lock_users` /
# `note_content_locks_idle`) for other crates' tests. Enable only from
# `[dev-dependencies]`: Cargo then turns it on for builds that also compile
# test targets (`cargo test`, `--all-targets`), never for release/packaging
# builds of the daemon.
test-support = []

[dependencies]
intent-core = { path = "../intent-core", version = "0.11.87" }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
rand = "0.10.2"
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
base64 = { workspace = true }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
flate2 = "1.1.9"
futures-util = "0.3"
async-stream = "0.3"
sha2 = "0.10"

[target."cfg(unix)".dependencies]
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
intentd-test-support = { path = "../intentd-test-support" }
# tests/store_open_fsync_stall.rs wraps the VFS of the SQLite sqlx links.
# Unpinned on purpose: both crates declare `links = "sqlite3"`, so Cargo
# resolves this to sqlx's copy and a sqlx upgrade needs no edit here.
libsqlite3-sys = "*"
trybuild = "1"
tempfile = "3"
tokio = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
