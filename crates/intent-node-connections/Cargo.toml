[package]
name = "intent-node-connections"
version = "0.11.302"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "The node-connection service for intentd: machine links, link ownership and fencing; below intent-services"

[features]
# Test-only seams (failing ack writes, connector tuning hooks) for
# intent-svc-remote's tests.
test-support = []

[dependencies]
intent-acp = { workspace = true }
intent-core = { workspace = true }
intent-git = { workspace = true }
intent-node-link = { workspace = true }
intent-pty = { workspace = true }
intent-store = { workspace = true }
base64 = { workspace = true }
git2 = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zeroize = "1.9"

[dev-dependencies]
intentd-test-support = { path = "../intentd-test-support" }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
