[package]
name = "intentd-microvm-helper"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
description = "Signed libkrun microVM launcher supervised by intentd (macOS aarch64; stub elsewhere)"

# Not shipped via the cargo-dist daemon pipeline yet: release packaging
# (bundled libkrun/libkrunfw dylibs + entitlement signing in CI) lands with
# the orchestrator integration. Dev flow: build + ad-hoc sign via
# scripts/sign-microvm-helper.sh.
[package.metadata.dist]
dist = false

[dependencies]
clap = { workspace = true }

[target."cfg(target_os = \"macos\")".dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
