[package]
name = "intent-transport"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "UDS/TCP/TLS listeners, JSON-RPC router, auth, heartbeat, lifecycle, mDNS (§16)"

[dependencies]
intent-core = { path = "../intent-core" }
intent-services = { path = "../intent-services" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
rcgen.workspace = true
sha2 = "0.10.9"
rustls-pemfile = "2.2.0"
x509-parser = "0.18.1"
if-addrs = "0.15.0"
time.workspace = true
getrandom = "0.2"
subtle = "2"
hex = "0.4"
whoami = "1"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
