[package]
name = "intent-nodes"
version = "0.11.261"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Node provider contracts, static host adapter, E2B sandbox client, Northflank, Agent37 and Vercel adapters"

[dependencies]
intent-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = "1"
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
sha2 = "0.11"
uuid = { workspace = true }
time = { workspace = true }

[features]
# The shared fake Agent37 API and its server, for the e2e suites. Never in a
# shipped build.
agent37-fake = []
# The shared fake Northflank API, for the e2e suites. Never in a shipped build.
northflank-fake = []
# The shared fake Vercel Sandbox API and its server, for the e2e suites.
# Never in a shipped build.
vercel-fake = []

[dev-dependencies]
intentd-test-support = { path = "../intentd-test-support" }
tokio.workspace = true
tempfile = "3"

[lints]
workspace = true
