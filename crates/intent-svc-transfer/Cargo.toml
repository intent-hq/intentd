[package]
name = "intent-svc-transfer"
version = "0.11.261"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Workspace transfer (plan, export, import) for intentd, built on intent-services"

[dependencies]
intent-services = { workspace = true }
intent-core = { workspace = true }
intent-store = { workspace = true }
intent-git = { workspace = true }
intent-sourcecontrol = { workspace = true }
intent-providers = { workspace = true }
base64 = { workspace = true }
git2 = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
tempfile = "3"
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zip = { version = "9.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
intent-services = { workspace = true, features = ["test-hooks"] }
intent-providers = { workspace = true, features = ["test-support"] }
# Tests seed and inspect SQLite through the test-only raw pools.
intent-store = { workspace = true, features = ["test-support"] }
intent-test-macros = { path = "../intent-test-macros" }
intentd-test-support = { path = "../intentd-test-support" }
sqlx.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
