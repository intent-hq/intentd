[package]
name = "intent-svc-transfer"
version = "0.11.62"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Workspace transfer (plan, export, import) for intentd, built on intent-services"

[dependencies]
intent-services = { path = "../intent-services", version = "0.11.62" }
intent-core = { path = "../intent-core", version = "0.11.62" }
intent-store = { path = "../intent-store", version = "0.11.62" }
intent-git = { path = "../intent-git", version = "0.11.62" }
intent-sourcecontrol = { path = "../intent-sourcecontrol", version = "0.11.62" }
intent-providers = { path = "../intent-providers", version = "0.11.62" }
base64 = { workspace = true }
git2 = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
tempfile = "3"
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
intent-services = { path = "../intent-services", version = "0.11.62", features = ["test-hooks"] }
intent-providers = { path = "../intent-providers", version = "0.11.62", features = ["test-support"] }
intent-test-macros = { path = "../intent-test-macros" }
intentd-test-support = { path = "../intentd-test-support" }
sqlx.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
