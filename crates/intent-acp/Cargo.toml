[package]
name = "intent-acp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "ACP client, session multiplexing, and agent→BE MCP server"

[dependencies]
intent-core = { path = "../intent-core" }
intent-providers = { path = "../intent-providers" }
# WSAPI-2: the workspace_api MCP tool runs agent-supplied JavaScript through
# the QuickJS engine in intent-js. Non-optional so the tool is always wired
# on the daemon MCP server (the intentd binary's own `js-engine` feature
# separately gates its `js-eval` CLI subcommand only).
intent-js = { path = "../intent-js" }
agent-client-protocol = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# Integration tests drive the client-served `terminal/*` handlers against the
# real unified PTY host. `intent-pty` depends only on `intent-core`, so this
# dev-only edge introduces no dependency cycle.
intent-pty = { path = "../intent-pty" }
