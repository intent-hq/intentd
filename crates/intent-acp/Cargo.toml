[package]
name = "intent-acp"
version = "0.7.29"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "ACP client, session multiplexing, and agent→BE MCP server"

[dependencies]
intent-core = { path = "../intent-core", version = "0.7.29" }
# Best-effort propose-time base-ref validation + repo-default-branch lookup
# for chief workspace-create proposals (monorepo#761). `intent-git` depends
# only on `intent-core`, so this edge introduces no dependency cycle.
intent-git = { path = "../intent-git", version = "0.7.29" }
intent-providers = { path = "../intent-providers", version = "0.7.29" }
# WSAPI-2: the workspace_api MCP tool runs agent-supplied JavaScript through
# the QuickJS engine in intent-js. Non-optional so the tool is always wired
# on the daemon MCP server (the intentd binary's own `js-engine` feature
# separately gates its `js-eval` CLI subcommand only).
intent-js = { path = "../intent-js", version = "0.7.29" }
agent-client-protocol = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
toon-format = { version = "0.5.0", default-features = false }

[target."cfg(unix)".dependencies]
nix = { workspace = true, features = ["signal", "process"] }

[dev-dependencies]
tokio = { workspace = true }
# Workspace-create proposal tests seed real temp repositories to exercise
# the propose-time base-ref validation against libgit2.
git2 = { workspace = true }
# Integration tests drive the client-served `terminal/*` handlers against the
# real unified PTY host. `intent-pty` depends only on `intent-core`, so this
# dev-only edge introduces no dependency cycle.
intent-pty = { path = "../intent-pty", version = "0.7.29" }
tempfile = "3"
# `ws.host.exec` binding tests drive the real exec semantics (spawn, timeout
# reap, cwd containment) through the `WorkspaceApi::host_exec` seam.
# `intent-services` depends on `intent-acp`, so this edge is a dev-dependency
# cycle Cargo permits; kept version-less so it is stripped on publish.
intent-services = { path = "../intent-services" }
ctor = "1.0.10"

[lints]
workspace = true
