[package]
name = "intent-js"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "JavaScript execution engine for agent-supplied code (QuickJS via rquickjs), with async host bindings and wall-clock timeouts"

[dependencies]
rquickjs = { version = "0.9", default-features = false, features = ["futures", "macro"] }
tokio = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
