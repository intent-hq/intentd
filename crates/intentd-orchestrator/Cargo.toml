[package]
name = "intentd-orchestrator"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "The multi-tenant Postgres orchestrator: one process serving several tenants, each under its own lease and self-fence; never shipped"
# Not released or packaged: no release-plz entry, no cargo-dist artifact.
publish = false

[package.metadata.dist]
dist = false

# The binary needs `--features postgres`. Off by default, so workspace builds
# (`make check`, `make test`) never unify intent-store's Postgres backend into
# the other crates; only the `store-postgres` CI job turns it on.
[[bin]]
name = "intentd-orchestrator"
path = "src/main.rs"
required-features = ["postgres"]

[features]
postgres = ["intent-store/postgres"]

[dependencies]
base64 = { workspace = true }
intent-app = { workspace = true }
intent-core = { workspace = true }
intent-git = { workspace = true }
intent-services = { workspace = true }
intent-store = { workspace = true }
intent-transport = { workspace = true }
sha2 = "0.11"
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
zeroize = "1.9"

# `prctl(PR_SET_DUMPABLE, 0)`: keep same-uid processes out of /proc/<pid>/environ and mem.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
intent-services = { workspace = true, features = ["test-hooks"] }
rustls = { workspace = true }
rustls-pki-types = "1"
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true }
intent-store = { workspace = true, features = ["test-support"] }
intentd-test-support = { path = "../intentd-test-support" }
# The startup parity guard (tests/startup_parity.rs) scans intentd's main.rs.
regex = "1.12"
serde_json = { workspace = true }
# The Postgres tests lock a lease row to stop renewals. No feature of its
# own: `postgres` turns sqlx's Postgres driver on through intent-store.
sqlx = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
