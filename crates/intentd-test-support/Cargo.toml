[package]
name = "intentd-test-support"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Workspace-internal test support for the intentd e2e suites (process-group child guard, release-file barrier, bounded pause points); never published"
# A dev-dependency, or an optional dependency behind a crate's `test-hooks`
# feature (never in intentd's production graph). Not `publish = false`:
# release-plz packages the whole workspace to compute versions, and Cargo
# cannot package a crate whose normal dependency is unpublishable. It is
# still never published or tagged: release-plz publishes nothing
# (`publish = false` in release-plz.toml) and does not opt this crate in.

[dependencies]
# PausePoint: async waits and the tokio::test fixtures that use it.
tokio = { workspace = true }

[target."cfg(unix)".dependencies]
nix = { workspace = true }

[dev-dependencies]
# `start_paused`: proves a paused tokio clock does not expire a PausePoint wait.
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"

[lints]
workspace = true
