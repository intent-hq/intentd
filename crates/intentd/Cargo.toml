[package]
name = "intentd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Intent backend daemon — local-first JSON-RPC daemon for the Intent domain model"

[dependencies]
clap = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

intent-core = { path = "../intent-core" }
intent-store = { path = "../intent-store" }
intent-services = { path = "../intent-services" }
intent-acp = { path = "../intent-acp" }
intent-providers = { path = "../intent-providers" }
intent-sourcecontrol = { path = "../intent-sourcecontrol" }
intent-git = { path = "../intent-git" }
intent-context = { path = "../intent-context" }
intent-pty = { path = "../intent-pty" }
intent-search = { path = "../intent-search" }
intent-transport = { path = "../intent-transport" }

[dev-dependencies]
uuid = { workspace = true }
intent-services = { path = "../intent-services" }
intent-acp = { path = "../intent-acp" }
intent-providers = { path = "../intent-providers" }
intent-core = { path = "../intent-core" }
intent-store = { path = "../intent-store" }
tokio = { workspace = true }
serde_json = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
sha2 = "0.10"
