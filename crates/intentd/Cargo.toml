[package]
name = "intentd"
version = "0.7.32"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
description = "Intent backend daemon — local-first JSON-RPC daemon for the Intent domain model"

[dependencies]
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Legacy note frontmatter (`.workspace/notes/*.md`) parsing; already in the
# workspace dependency tree via intent-services.
serde_yaml = "0.9"
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
directories = { workspace = true }
sqlx = { workspace = true }

intent-core = { path = "../intent-core", version = "0.7.32" }
intent-store = { path = "../intent-store", version = "0.7.32" }
intent-services = { path = "../intent-services", version = "0.7.32" }
intent-acp = { path = "../intent-acp", version = "0.7.32" }
intent-providers = { path = "../intent-providers", version = "0.7.32" }
intent-git = { path = "../intent-git", version = "0.7.32" }
intent-context = { path = "../intent-context", version = "0.7.32" }
intent-transport = { path = "../intent-transport", version = "0.7.32" }
intent-js = { path = "../intent-js", version = "0.7.32", optional = true }
qrcode = "0.14.1"
image = { version = "0.25.6", default-features = false, features = ["png"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }

[features]
default = []
# WSAPI-1 spike: link the QuickJS-backed JS engine. Off by default so the
# baseline binary is unchanged; enable to measure size / build impact.
js-engine = ["dep:intent-js"]

[dev-dependencies]
uuid = { workspace = true }
intent-services = { path = "../intent-services", version = "0.7.32" }
intent-acp = { path = "../intent-acp", version = "0.7.32" }
intent-providers = { path = "../intent-providers", version = "0.7.32" }
intent-core = { path = "../intent-core", version = "0.7.32" }
intent-store = { path = "../intent-store", version = "0.7.32" }
# `uds_linear.rs` injects a stub `LinearEngine` so the `linear.*` e2e slice
# never touches the network (no `LINEAR_API_KEY`, no GraphQL call).
intent-linear = { path = "../intent-linear", version = "0.7.32" }
# `uds_sentry.rs` injects a stub `SentryEngine` so the `sentry.*` e2e slice
# never touches the network (no token, no REST call).
intent-sentry = { path = "../intent-sentry", version = "0.7.32" }
# `e2e_wss_voice_transcribe.rs` injects a stub `VoiceEngine` so the
# `voice.transcribe` e2e slice never touches the network (no key, no HTTP).
intent-voice = { path = "../intent-voice", version = "0.4.1" }
async-trait = "0.1"
tokio = { workspace = true }
serde_json = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
sha2 = "0.11"
# `e2e_wss_agent_lifecycle.rs::terminal_create_env_over_wss` decodes base64
# `terminal:data` chunks to prove the env overlay reached the child (§5.13).
base64 = { workspace = true }
# `e2e_wss_last_activity.rs` parses RFC3339 timestamps with chrono to compare instants
# (lexicographic comparison can be wrong with differing fractional-second precision).
chrono = "0.4"
ctor = "1.0.10"
tempfile = "3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
intent-sourcecontrol = { path = "../intent-sourcecontrol", version = "0.7.32" }

[target."cfg(unix)".dependencies]
nix = { workspace = true, features = ["signal", "process", "fs"] }
# No-echo terminal input for `intentd settings <sensitive>` prompts
# (termios); already in the workspace dependency tree via intent-core.
libc = "0.2"

# Static musl release targets have no system OpenSSL; macOS has no system OpenSSL
# headers/dylibs we can rely on either (Homebrew paths break on machines without it).
# Build OpenSSL from source and link it statically so the libgit2/libssh2 chain
# (git2 https+ssh) is self-contained. No-op for gnu/windows builds.
[target.'cfg(any(all(target_os = "linux", target_env = "musl"), target_os = "macos"))'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

[lints]
workspace = true

[package.metadata.cargo-shear]
# openssl-sys is a link-time dependency only: it vendors/statically links OpenSSL for
# the libgit2/libssh2 chain on musl and macOS and is never referenced from Rust code,
# so cargo-shear flags it as unused (true false positive).
ignored = ["openssl-sys"]
