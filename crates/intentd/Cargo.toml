[package]
name = "intentd"
version = "0.9.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Intent backend daemon — local-first JSON-RPC daemon for the Intent domain model"

[dependencies]
clap = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
directories = { workspace = true }
sqlx = { workspace = true }

intent-core = { path = "../intent-core" }
intent-store = { path = "../intent-store" }
intent-services = { path = "../intent-services" }
intent-acp = { path = "../intent-acp" }
intent-providers = { path = "../intent-providers" }
intent-sourcecontrol = { path = "../intent-sourcecontrol" }
intent-git = { path = "../intent-git" }
intent-context = { path = "../intent-context" }
intent-pty = { path = "../intent-pty" }
intent-search = { path = "../intent-search" }
intent-transport = { path = "../intent-transport" }
intent-js = { path = "../intent-js", optional = true }

[features]
default = []
# WSAPI-1 spike: link the QuickJS-backed JS engine. Off by default so the
# baseline binary is unchanged; enable to measure size / build impact.
js-engine = ["dep:intent-js"]

[dev-dependencies]
uuid = { workspace = true }
intent-services = { path = "../intent-services" }
intent-acp = { path = "../intent-acp" }
intent-providers = { path = "../intent-providers" }
intent-core = { path = "../intent-core" }
intent-store = { path = "../intent-store" }
# `uds_linear.rs` injects a stub `LinearEngine` so the `linear.*` e2e slice
# never touches the network (no `LINEAR_API_KEY`, no GraphQL call).
intent-linear = { path = "../intent-linear" }
# `uds_sentry.rs` injects a stub `SentryEngine` so the `sentry.*` e2e slice
# never touches the network (no token, no REST call).
intent-sentry = { path = "../intent-sentry" }
async-trait = "0.1"
tokio = { workspace = true }
serde_json = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
sha2 = "0.10"
# `e2e_wss_agent_lifecycle.rs::terminal_create_env_over_wss` decodes base64
# `terminal:data` chunks to prove the env overlay reached the child (§5.13).
base64 = { workspace = true }
# `e2e_wss_last_activity.rs` parses RFC3339 timestamps with chrono to compare instants
# (lexicographic comparison can be wrong with differing fractional-second precision).
chrono = "0.4"

[target."cfg(unix)".dependencies]
nix = { workspace = true, features = ["signal", "process", "fs"] }

# Static musl release targets have no system OpenSSL; build it from source so the
# libgit2/libssh2 chain (git2 https+ssh) links. No-op for gnu/mac/windows builds.
[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }
