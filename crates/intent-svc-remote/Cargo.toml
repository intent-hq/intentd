[package]
name = "intent-svc-remote"
version = "0.11.261"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Remote agent runtime for intentd: the backend connector to exposed machines and journal ingestion"

[dependencies]
intent-services = { workspace = true }
intent-core = { workspace = true }
intent-store = { workspace = true }
intent-transport = { workspace = true }
intent-acp = { workspace = true }
intent-git = { workspace = true }
intent-providers = { workspace = true }
intent-nodes = { workspace = true }
intent-pty = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
git2 = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
sha2 = "0.11"
zeroize = "1.9"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
intent-services = { workspace = true, features = ["test-hooks"] }
# Tests seed and inspect SQLite through the test-only raw pools.
intent-store = { workspace = true, features = ["test-support"] }
intentd-test-support = { path = "../intentd-test-support" }
socket2 = "0.6"
sqlx = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
