[package]
name = "intent-svc-remote"
version = "0.11.190"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Remote agent runtime for intentd: the backend connector to exposed machines and journal ingestion"

[dependencies]
intent-services = { path = "../intent-services", version = "0.11.190" }
intent-core = { path = "../intent-core", version = "0.11.190" }
intent-store = { path = "../intent-store", version = "0.11.190" }
intent-transport = { path = "../intent-transport", version = "0.11.190" }
intent-acp = { path = "../intent-acp", version = "0.11.190" }
intent-git = { path = "../intent-git", version = "0.11.190" }
intent-providers = { path = "../intent-providers", version = "0.11.190" }
intent-nodes = { path = "../intent-nodes", version = "0.11.190" }
serde = { workspace = true }
git2 = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
sha2 = "0.11"
zeroize = "1.9"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
intent-services = { path = "../intent-services", version = "0.11.190", features = ["test-hooks"] }
intentd-test-support = { path = "../intentd-test-support" }
socket2 = "0.6"
sqlx = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
