[package]
name = "intent-svc-remote"
version = "0.11.71"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Remote agent runtime for intentd: the head connector to a configured execution node and journal ingestion"

[dependencies]
intent-services = { path = "../intent-services", version = "0.11.71" }
intent-core = { path = "../intent-core", version = "0.11.71" }
intent-store = { path = "../intent-store", version = "0.11.71" }
intent-transport = { path = "../intent-transport", version = "0.11.71" }
intent-acp = { path = "../intent-acp", version = "0.11.71" }
intent-git = { path = "../intent-git", version = "0.11.71" }
git2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
intent-services = { path = "../intent-services", version = "0.11.71", features = ["test-hooks"] }
intentd-test-support = { path = "../intentd-test-support" }
sqlx = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
