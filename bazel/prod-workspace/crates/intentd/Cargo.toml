# @generated by scripts/bazel-gen.py: this crate's Cargo.toml without
# dev-dependencies or targets, so crate_universe resolves production features.
# Do not edit by hand.

[package]
name = "intentd"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
description = "Intent backend daemon — local-first JSON-RPC daemon for the Intent domain model"

[dependencies]
# Keep this requirement major-only ("0", not "0.1.N"). release-plz 0.3.162
# bumps a dependent package's patch version, outside its version_group,
# whenever a dependency release rewrites the requirement: an exact pin made
# each sitter-only release bump intentd alone and split it from its library
# crates (intent-hq/intentd#2461). Sitter patch and minor releases leave "0"
# unchanged, so they leave the intentd group alone. Neither crate is
# published, so the wide range only affects release planning; the path still
# selects the in-tree sitter. scripts/test-version-group.py enforces this.
intentd-sitter = { path = "../intentd-sitter" }
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
directories = { workspace = true }
sqlx = { workspace = true }

intent-sourcecontrol = { path = "../intent-sourcecontrol", optional = true }
intent-core = { path = "../intent-core" }
intent-store = { path = "../intent-store" }
intent-services = { path = "../intent-services" }
intent-acp = { path = "../intent-acp" }
intent-providers = { path = "../intent-providers" }
intent-git = { path = "../intent-git" }
intent-context = { path = "../intent-context" }
intent-transport = { path = "../intent-transport" }
intent-js = { path = "../intent-js", optional = true }
qrcode = "0.14.1"
image = { version = "0.25.6", default-features = false, features = ["png"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }

[features]
default = []
# WSAPI-1 spike: link the QuickJS-backed JS engine. Off by default so the
# baseline binary is unchanged; enable to measure size / build impact.
js-engine = ["dep:intent-js"]
# Explicit cold loopback descriptors for the real GitLab auth socket tests.
# Packaging and ordinary daemon builds must leave this feature disabled.
repository-test-fixtures = ["intent-services/repository-test-fixtures", "intent-transport/repository-test-fixtures", "dep:intent-sourcecontrol"]

[target."cfg(unix)".dependencies]
nix = { workspace = true, features = ["signal", "process", "fs"] }
# No-echo terminal input for `intentd settings <sensitive>` prompts
# (termios); already in the workspace dependency tree via intent-core.
libc = { workspace = true }

# Static musl release targets have no system OpenSSL; macOS has no system OpenSSL
# headers/dylibs we can rely on either (Homebrew paths break on machines without it).
# Build OpenSSL from source and link it statically so the libgit2/libssh2 chain
# (git2 https+ssh) is self-contained. No-op for gnu/windows builds.
[target.'cfg(any(all(target_os = "linux", target_env = "musl"), target_os = "macos"))'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

[lints]
workspace = true

[[bin]]
name = "intentd"
path = "src/main.rs"
