[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# No installers: user-facing installs (Homebrew, .deb, shell/powershell) are
# owned by the sitter release pipeline (release-sitter.yml); the daemon ships
# archives + checksums + channel manifests only.
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Only respond to v-prefixed tags (vX.Y.Z). Without this, the generated tag
# glob also matches sitter-vX.Y.Z tags, firing spurious daemon dist runs on
# sitter releases. Note: this renames the generated workflow to
# .github/workflows/v-release.yml.
tag-namespace = "v"
# Whether to install an updater program
install-updater = false
# Post-announce: publish/update the stable.json / beta.json channel manifests
post-announce-jobs = ["./publish-channel-manifest"]
# Injected into build-local-artifacts: provisions rustup/toolchain/targets on
# the self-hosted runners, which don't have the hosted images' preinstalled
# toolchains (see the file header for details).
github-build-setup = "dist-build-setup.yml"

# All release jobs run on the org's self-hosted runners (GH-hosted billing is
# unavailable): tinybox (Linux x64, Ubuntu 22.04), m1mac (macOS arm64), 5090pc
# (Windows x64). Runner values must be single labels here (the generated
# workflow interpolates them as strings), and each machine exposes its
# hostname as a label.
#
# `host` overrides tell dist the actual host triple where it differs from the
# runner-name heuristic, so it picks the right cross strategy:
# - m1mac is arm64, so x86_64-apple-darwin is a cross build (rustup target).
# - tinybox runs the musl builds as cross builds from the glibc host triple,
#   mirroring the previous ubuntu-22.04 setup (aarch64 musl via
#   cargo-zigbuild, x86_64 musl via musl-tools).
[dist.github-custom-runners]
global = "tinybox"

[dist.github-custom-runners.aarch64-apple-darwin]
runner = "m1mac"

[dist.github-custom-runners.x86_64-apple-darwin]
runner = "m1mac"
host = "aarch64-apple-darwin"

[dist.github-custom-runners.x86_64-unknown-linux-musl]
runner = "tinybox"
host = "x86_64-unknown-linux-gnu"

[dist.github-custom-runners.aarch64-unknown-linux-musl]
runner = "tinybox"
host = "x86_64-unknown-linux-gnu"

[dist.github-custom-runners.x86_64-pc-windows-msvc]
runner = "5090pc"
