[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# No installers: user-facing installs (Homebrew, .deb, shell/powershell) are
# owned by the sitter release pipeline (release-sitter.yml); the daemon ships
# archives + checksums + channel manifests only.
# Target platforms to build apps for (Rust target-triple syntax)
# Keep Intel isolated so a required target can never inherit optional failure.
merge-tasks = false
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Only respond to v-prefixed tags (vX.Y.Z). Without this, the generated tag
# glob also matches sitter-vX.Y.Z tags, firing spurious daemon dist runs on
# sitter releases. Note: this renames the generated workflow to
# .github/workflows/v-release.yml.
tag-namespace = "v"
# Self-referential on purpose (monorepo#1277): pointing github-releases-repo at
# this same repo makes dist generate a release-create step that (a) authenticates
# with the GH_RELEASES_TOKEN secret (a PAT) instead of the runner's GITHUB_TOKEN,
# and (b) passes --target from the manifest's external_repo_commit, which is
# absent here (no submodule path), so `gh` sends no target_commitish at all.
# Both changes sidestep the 403 that GITHUB_TOKEN hits when the tagged commit
# touches .github/workflows/* (cli/cli#9514); the tag always exists by the time
# this workflow runs (release-plz pushes it), so no target is needed.
# REQUIRES: a repo secret named GH_RELEASES_TOKEN (name is hardcoded by dist)
# holding a PAT with contents:write on intent-hq/intentd.
github-releases-repo = "intent-hq/intentd"
# Whether to install an updater program
install-updater = false
# Bundle the tailcat tunnel sidecar next to the daemon binary: the archive
# carries libexec/tailcat (staged per-target by the "Stage tailcat sidecar
# binary" step in dist-build-setup.yml) plus libexec/tailcat.LICENSE
# (committed; BSD-3-Clause text for the non-crate binary, which cargo-deny
# does not cover). The daemon resolves the sidecar at
# <exe-dir>/libexec/tailcat (see crates/intentd/src/tunnel.rs).
include = ["packaging/libexec"]
# Post-announce: publish/update the alpha.json channel manifest
post-announce-jobs = ["./publish-channel-manifest"]
# The reusable publish-channel-manifest.yml job requests
# {contents: write, pull-requests: read} (notifier reads squash-merged PR
# bodies, see #815); the caller job's permissions must cover everything the
# called reusable workflow requests or the run startup-fails. Overriding here
# replaces the inherited workflow-level permissions, so contents: write must
# be restated.
github-custom-job-permissions = { "publish-channel-manifest" = { contents = "write", pull-requests = "read", actions = "read" } }
# v-release.yml is hand-edited: `gh release create` always passes --prerelease
# so every tagged release lands as an alpha Pre-release (promote-stable.yml clears
# the flag and marks the promoted version Latest). dist has no config knob for
# that, and `dist plan` fails the PR check on any hand edit, so the CI freshness
# check is relaxed here. Re-apply the customization after any `dist init` /
# `dist generate`; it is marked LOCAL CUSTOMIZATION in v-release.yml.
# Also run python3 scripts/configure-runner-routing.py after generation.
# Release writer concurrency is also a local customization: after generation run
# `python3 scripts/configure-release-concurrency.py` to restore the shared lock.
# Then run `python3 scripts/configure-optional-intel-release.py` to restore
# release-only Intel planning, failure isolation, and validated publication targets.
# Then run `python3 scripts/configure-release-host-network.py` to restore the host
# job's retried crate fetch and offline `dist host` (intent-hq/intent#7639).
# scripts/test-prerelease-cleanup-workflow.py enforces the generated block and
# ensures the post-announce reusable workflow never reacquires the caller lock.
allow-dirty = ["ci"]
# Injected into build-local-artifacts: provisions the pinned
# rust-toolchain.toml channel and the matrix's cross targets, which no
# runner image guarantees (see the file header for details).
github-build-setup = "../dist-build-setup.yml"

# GitHub-hosted labels are fallback keys resolved by runner-route.yml. Pin host triples so cargo-dist's
# runner-name heuristic cannot change cross-compilation behavior. Both Apple
# targets build on ARM64; Linux musl keeps its existing x64 glibc build host.
[dist.github-custom-runners]
global = "ubuntu-24.04"

[dist.github-custom-runners.aarch64-apple-darwin]
runner = "macos-26-xlarge"
host = "aarch64-apple-darwin"

[dist.github-custom-runners.x86_64-apple-darwin]
runner = "macos-26-xlarge"
host = "aarch64-apple-darwin"

[dist.github-custom-runners.x86_64-unknown-linux-musl]
runner = "gh-linux-16x"
host = "x86_64-unknown-linux-gnu"

[dist.github-custom-runners.aarch64-unknown-linux-musl]
runner = "gh-linux-16x"
host = "x86_64-unknown-linux-gnu"

[dist.github-custom-runners.x86_64-pc-windows-msvc]
runner = "gh-windows-16x"
host = "x86_64-pc-windows-msvc"
