[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# No installers: user-facing installs (Homebrew, .deb, shell/powershell) are
# owned by the sitter release pipeline (release-sitter.yml); the daemon ships
# archives + checksums + channel manifests only.
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Only respond to v-prefixed tags (vX.Y.Z). Without this, the generated tag
# glob also matches sitter-vX.Y.Z tags, firing spurious daemon dist runs on
# sitter releases. Note: this renames the generated workflow to
# .github/workflows/v-release.yml.
tag-namespace = "v"
# Whether to install an updater program
install-updater = false
# Post-announce: publish/update the stable.json / beta.json channel manifests
post-announce-jobs = ["./publish-channel-manifest"]
# Injected into build-local-artifacts: provisions rustup/toolchain/targets on
# the self-hosted runners, which don't have the hosted images' preinstalled
# toolchains (see the file header for details).
github-build-setup = "../dist-build-setup.yml"

# Linux/macOS build jobs run on the org's self-hosted runners: tinybox
# (Linux x64, Ubuntu 22.04) and m1mac (macOS arm64). Runner values must be
# single labels here (the generated workflow interpolates them as strings),
# and each machine exposes its hostname as a label.
#
# The Windows build runs on a GitHub-hosted runner: the self-hosted 5090pc
# lacks PowerShell 7, so default-shell steps fall back to Windows PowerShell
# 5.1, whose `>` redirection writes UTF-16 — dist's generated
# `dist build ... > dist-manifest.json` step then produces a manifest dist
# can't read back ("stream did not contain valid UTF-8"). Move it back to
# 5090pc once pwsh 7 is installed there.
#
# The global jobs (plan / build-global-artifacts / host / announce) also
# run on tinybox: they sat on GitHub-hosted runners while tinybox had a
# single slot (`plan` runs on every PR and queueing it behind the heavy CI
# jobs was the intentd#805 rationale), but with 8 tinybox slots that
# queue-isolation concern is gone.
#
# `host` overrides tell dist the actual host triple where it differs from the
# runner-name heuristic, so it picks the right cross strategy:
# - m1mac is arm64, so x86_64-apple-darwin is a cross build (rustup target).
# - tinybox runs the musl builds as cross builds from the glibc host triple,
#   mirroring the previous ubuntu-22.04 setup (aarch64 musl via
#   cargo-zigbuild, x86_64 musl via musl-tools).
# TEMPORARY(tinybox offline): the Linux runners below (global +
# x86_64/aarch64 musl) are flipped from "tinybox" to GitHub-hosted while the
# tinybox host is down — see monorepo#1239/#1253 for context. Revert them to
# "tinybox" (and re-sync v-release.yml's global runs-on) when it is back.
# The `host` overrides are unchanged, so the musl cross strategies
# (cargo-zigbuild / musl-tools from the glibc host triple) are preserved.
[dist.github-custom-runners]
global = "ubuntu-latest"

[dist.github-custom-runners.aarch64-apple-darwin]
runner = "m1mac"

[dist.github-custom-runners.x86_64-apple-darwin]
runner = "m1mac"
host = "aarch64-apple-darwin"

[dist.github-custom-runners.x86_64-unknown-linux-musl]
runner = "gh-linux-16x"
host = "x86_64-unknown-linux-gnu"

[dist.github-custom-runners.aarch64-unknown-linux-musl]
runner = "gh-linux-16x"
host = "x86_64-unknown-linux-gnu"

[dist.github-custom-runners.x86_64-pc-windows-msvc]
runner = "windows-2022"
